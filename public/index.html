<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.json">
<title>Fassungstool – Haus Hirt</title>
<style>
/* ═══════════════ Design-Tokens ═══════════════ */
:root{
  /* Neutrale Flächen und Rahmen (warm) */
  --bg:#FBFAF7;
  --surface:#FFFFFF;
  --surface-2:#F6F4EE;
  --surface-3:#F3F1EB;
  --surface-4:#ECE9E1;
  --border:#E6E4DE;
  --border-strong:#D8D5CD;
  --border-heavy:#C6C2B8;

  /* Text */
  --fg:#1C1C1E;
  --fg-secondary:#5A5A60;
  --fg-muted:#6A6A70;
  --fg-subtle:#686870;          /* ≥4,5:1 auf allen hellen Flächen */

  /* Text auf dunklen Leisten */
  --fg-on-dark:#FFFFFF;
  --fg-on-dark-2:#B4B4BA;
  --fg-on-dark-3:#9A9AA0;
  --surface-on-dark:rgba(255,255,255,.10);
  --surface-on-dark-2:rgba(255,255,255,.06);
  --border-on-dark:rgba(255,255,255,.14);

  /* Akzent und Status */
  --accent:#9A7B44;
  --danger:#B4471F;
  --danger-bg:#FBEDE6;
  --danger-fg:#7A3A12;
  --danger-border:#E7C3B2;
  --danger-surface:#FDF9F6;
  --success:#3E7A3E;
  --success-bg:#EFF5EE;
  --success-fg:#2F5E2F;
  --success-on-dark:#8FBF8F;
  --info:#3A5266;
  --info-bg:#EDF2F6;
  --info-border:#D3E0EA;
  /* Zielorte im Holen-Schritt */
  --tag-bar-bg:#F3E7D9;  --tag-bar-fg:#7A5426;
  --tag-back-bg:#EDE7F0; --tag-back-fg:#5A4A6A;

  /* Abstände, 4px-Basis */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

  /* Radien */
  --radius-xs:2px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --track-caps:.08em;   /* ein Wert für alle Versalzeilen */

  /* Typografie */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --text-xs:11px; --text-sm:13px; --text-md:15px; --text-base:16px;
  --text-lg:19px; --text-display:32px;
  --leading-tight:1.25; --leading-normal:1.45;
  --weight-regular:400; --weight-medium:600; --weight-bold:700;

  /* Bedienelemente */
  --tap-min:44px; --control-h-sm:36px; --control-h:44px; --control-h-lg:52px;

  /* Fokus und Bewegung */
  --ring:#1C1C1E; --ring-width:2px; --ring-offset:2px;
  --dur-fast:120ms; --dur:180ms; --ease:cubic-bezier(.2,0,0,1);

  /* Schichten */
  --z-rail:35; --z-top:40; --z-overlay:80; --z-toast:90;
  --shadow-overlay:0 4px 16px rgba(0,0,0,.25);

  /* Layout */
  --foot:0px; --rail:44px; --maxw:760px; --topH:118px;

  /* Getränke: Trefferflächen skalieren mit der Viewport-Breite */
  --gd:clamp(26px,7vw,42px);      /* Punkt-Durchmesser */
  --gpt-s:clamp(26px,7.5vw,40px); /* Punkt in den Fächern */
  --gcell:clamp(40px,11vw,64px);  /* Zelle Lade 1 */
  --grack:clamp(30px,9vw,52px);   /* Gasteiner-Regal */
  --gnum-on-dot:rgba(255,255,255,.5)
}

/* ═══════════════ Basis ═══════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);
  font:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{font-weight:var(--weight-medium)}

/* Tastaturfokus — ein Selektor für alle interaktiven Elemente */
:where(button,input,select,textarea,a,[tabindex]):focus-visible{
  outline:var(--ring-width) solid var(--ring);
  outline-offset:var(--ring-offset);
  position:relative;z-index:1}
header :focus-visible,.foot :focus-visible{outline-color:var(--fg-on-dark)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══════════════ Button-System ═══════════════
   Basis über die bestehenden Klassennamen, damit die imperative
   DOM-Erzeugung im JS unangetastet bleibt. */
.finishbtn,.recheck,.fullbtn,.addbtn,.prueft,
.exprow .primary,.exprow .secondary,
.card2 .row button,.drwb button,.navrow .b{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  min-height:var(--control-h);padding:0 var(--space-4);
  font:var(--weight-medium) var(--text-md)/1.2 var(--font);
  border:1px solid transparent;border-radius:var(--radius-md);
  background:none;color:var(--fg);text-align:center;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),
             color var(--dur-fast) var(--ease)}

/* sekundär */
.recheck,.fullbtn,.addbtn,.prueft,.card2 .row button,
.drwb button,.exprow .secondary{
  background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
.recheck{color:var(--fg-muted)}
.qbadge{display:inline-block;margin-left:var(--space-2);color:var(--danger-fg);
  font-size:var(--text-xs);font-weight:var(--weight-medium)}
.qbadge:empty{display:none}
.rollchip{display:inline-block;margin-left:var(--space-2);padding:1px 8px;border-radius:var(--radius-pill);
  background:var(--surface-4);color:var(--fg-muted);font-size:var(--text-xs);font-weight:var(--weight-medium);
  letter-spacing:var(--track-caps);text-transform:uppercase}
.standkopf{display:flex;align-items:center;gap:var(--space-4);background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3)}
.standkopf .stz{flex:0 0 auto;text-align:center;padding-right:var(--space-4);
  border-right:1px solid var(--border-strong)}
.standkopf .stz b{display:block;font-size:28px;font-weight:var(--weight-bold);
  letter-spacing:-.02em;line-height:1}
.standkopf .stz span{display:block;font-size:var(--text-xs);text-transform:uppercase;
  letter-spacing:var(--track-caps);color:var(--fg-subtle);margin-top:2px}
.standkopf .stt b{display:block;font-size:var(--text-base)}
.standkopf .stt span{display:block;font-size:var(--text-sm);color:var(--fg-muted);margin-top:2px}
#standQ{margin-bottom:var(--space-3)}
.stfilter{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-2);
  margin-bottom:var(--space-3);-webkit-overflow-scrolling:touch}
.stchip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:var(--radius-pill);
  border:1px solid var(--border-heavy);background:var(--surface);font-size:var(--text-sm);
  color:var(--fg-secondary)}
.stchip.on{background:var(--fg);border-color:var(--fg);color:var(--fg-on-dark);
  font-weight:var(--weight-medium)}
.stgrid{display:grid;grid-template-columns:1fr;gap:var(--space-3)}
@media(min-width:700px){.stgrid{grid-template-columns:1fr 1fr}
  .stgrp{grid-column:1/-1}}
.stgrp{margin:var(--space-3) 0 0}
.stgrp b{display:block;font-size:var(--text-xs);font-weight:var(--weight-medium);
  letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--fg-secondary)}
.stgrp span{display:block;font-size:var(--text-xs);color:var(--fg-subtle);margin-top:1px}
.stkarte{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
  padding-left:calc(var(--space-4) + 4px);overflow:hidden}
.stkarte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fk)}
.stk1{display:flex;align-items:flex-start;gap:var(--space-3)}
.stnm{flex:1;min-width:0}
.stnm b{display:block;font-size:var(--text-base);font-weight:var(--weight-medium);line-height:1.25}
.stnm span{display:block;font-size:var(--text-base);color:var(--fg-secondary);line-height:1.25}
.stwert{flex:0 0 auto;font-size:30px;font-weight:var(--weight-bold);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stwert i{font-style:normal;font-size:var(--text-base);font-weight:var(--weight-medium);
  color:var(--fg-subtle)}
.stk2{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2)}
.stmeta{flex:1;min-width:0;font-size:var(--text-sm);color:var(--fg-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stnimm{flex:0 0 auto;height:32px;padding:0 12px;border-radius:var(--radius-pill);
  border:1px solid var(--border-heavy);background:var(--surface-2);
  font-size:var(--text-sm);color:var(--fg-secondary)}
.stnimm:active{background:var(--surface-4)}
.stbar{height:3px;border-radius:2px;background:var(--surface-4);margin-top:var(--space-3);overflow:hidden}
.stbar i{display:block;height:100%;background:var(--fk);opacity:.75}
.stkarte.knapp{background:var(--danger-surface);border-color:var(--danger-border)}
.stkarte.knapp .stwert{color:var(--danger-fg)}
.stkarte.leer{background:var(--danger-bg);border-color:var(--danger-border)}
.stkarte.leer .stwert i{color:var(--danger-fg)}
.stkarte.unbekannt{background:var(--surface-2)}
.addbtn{border-style:dashed;color:var(--fg-muted)}
.recheck:active,.fullbtn:active,.addbtn:active,.prueft:active,
.card2 .row button:active,.drwb button:active,.exprow .secondary:active{
  background:var(--surface-3)}

/* primär */
.finishbtn,.exprow .primary,.card2 .row .ok,.prueft.weiter,.drwb button.weiter{
  background:var(--fg);color:var(--fg-on-dark);border-color:var(--fg)}
.finishbtn:active,.exprow .primary:active,.card2 .row .ok:active,
.prueft.weiter:active,.drwb button.weiter:active{
  background:var(--fg-secondary);border-color:var(--fg-secondary)}

/* erledigt */
.fullbtn.done,.prueft.on,.prueft.weiter.on,.drwb button.weiter.ok{
  background:var(--success-bg);border-color:var(--success);color:var(--success-fg)}

/* Blockiert: bewusst KEIN disabled/aria-disabled — der Knopf bleibt für alle
   bedienbar und beantwortet beim Antippen, warum es noch nicht weitergeht.
   Der Grund steht zusätzlich als Kasten darüber. */
.finishbtn.blocked{
  background:var(--surface-4);color:var(--fg-secondary);border-color:var(--border-strong)}
.finishbtn.blocked:active{background:var(--border-strong)}

/* Blockbreite */
.finishbtn,.prueft,.fullbtn,.addbtn,.recheck{width:100%}
.prueft{flex-direction:column;gap:1px;padding-top:var(--space-2);
  padding-bottom:var(--space-2)}
.prueft .pl{font-size:var(--text-md);font-weight:var(--weight-medium)}
.prueft .ps{font-size:var(--text-xs);font-weight:var(--weight-regular);
  color:var(--fg-muted)}
.prueft.weiter .ps{color:var(--fg-on-dark-2)}
.prueft.on .ps{color:var(--success-fg)}
.finishbtn{min-height:var(--control-h-lg);font-size:var(--text-base);
  margin-top:var(--space-6)}
.recheck{margin-top:var(--space-3)}
.fullbtn{margin-top:var(--space-2)}
.addbtn{margin-top:var(--space-4)}

/* Textknöpfe */
.adminlink,.explesser button{
  background:none;border:0;color:var(--fg-muted);font-size:var(--text-sm);
  cursor:pointer;text-decoration:underline;min-height:var(--tap-min);
  padding:0 var(--space-4)}
.adminlink{display:block;margin:var(--space-7) auto 0}
.explesser button.del{color:var(--danger)}

/* ═══════════════ Eingabefelder ═══════════════
   16px verhindert das Auto-Zoomen von iOS Safari. */
#q,.fld input,.fld select,label.f input,.zf,.input{
  width:100%;min-height:var(--control-h);
  padding:var(--space-2) var(--space-3);
  font:var(--weight-regular) var(--text-base)/1.3 var(--font);
  border:1px solid var(--border-strong);border-radius:var(--radius-md);
  background:var(--surface);color:var(--fg)}
.zf,.zin,.input--pin{text-align:center;font-weight:var(--weight-bold);
  font-variant-numeric:tabular-nums}
.zf{width:48px;min-width:48px;padding:0}
/* text-indent gleicht den Sperrabstand hinter dem letzten Zeichen aus,
   sonst sitzt der Block sichtbar zu weit rechts. */
.input--pin{font-size:var(--text-lg);letter-spacing:.4em;text-indent:.4em;
  min-height:var(--control-h-lg)}

/* ═══════════════ Tabellenziffern ═══════════════ */
.cnt,.zval,.zsum,.zsumbig,.qty,.kpi b,.fh .big,.fi .v,.done-cta .big,
.kisteninfo b,.miss-n,.hd1 .cnt2,.stath i,.statb,.pos,
.gq,.gnum,.fachn,.rhd i,td.r,th.r{font-variant-numeric:tabular-nums}

/* ═══════════════ Menü ═══════════════ */
.menu{padding:var(--space-6) var(--space-4) var(--space-8);max-width:620px;margin:0 auto}
.menu h1{font-size:var(--text-lg);margin:0 0 var(--space-1);letter-spacing:-.01em}
.menu .sub{color:var(--fg-muted);font-size:var(--text-sm);margin:0 0 var(--space-6)}
.mgrp{font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--fg-subtle);
  margin:var(--space-6) 0 var(--space-3);display:flex;align-items:center;gap:var(--space-3)}
.mgrp:first-of-type{margin-top:var(--space-1)}
.mgrp::after{content:"";flex:1;height:1px;background:var(--border)}
.mi{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);margin-bottom:var(--space-3);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease),
             background var(--dur-fast) var(--ease)}
.mi:active{transform:scale(.99);background:var(--surface-3)}
.mi .ic{width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-lg);
  background:var(--surface-3);flex-shrink:0;display:grid;place-items:center;color:var(--fg)}
.mi .ic svg{width:20px;height:20px}
.mi .txt{flex:1;min-width:0}
.mi b{display:block;font-size:var(--text-base);margin-bottom:var(--space-1);
  font-weight:var(--weight-medium)}
.mi span{display:block;font-size:var(--text-sm);color:var(--fg-muted);
  line-height:var(--leading-normal)}
.mi .when{display:inline-flex;align-items:center;gap:var(--space-1);
  margin-top:var(--space-2);font-size:var(--text-xs);color:var(--danger);
  font-weight:var(--weight-medium)}
.mi.run{border-color:var(--danger-border);background:var(--danger-surface)}
.mi.run .ic{background:var(--danger-bg);color:var(--danger)}
.mi .go{color:var(--fg-subtle);font-size:var(--text-lg);flex-shrink:0}

/* ═══════════════ Kopf ═══════════════ */
.topwrap{position:sticky;top:0;z-index:var(--z-top)}
header{background:var(--fg);color:var(--fg-on-dark);
  padding:var(--space-3) var(--space-4) 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.hd h1{margin:0;font-size:var(--text-base);font-weight:var(--weight-medium)}
.hd .subh{font-size:var(--text-xs);color:var(--fg-on-dark-3);margin-top:2px}
.hdr-r{display:flex;gap:var(--space-2);align-items:center}
.home{background:var(--surface-on-dark);border:0;color:var(--fg-on-dark);
  min-height:var(--control-h-sm);padding:0 var(--space-3);border-radius:var(--radius-md);
  font-size:var(--text-sm);cursor:pointer;
  transition:background var(--dur-fast) var(--ease)}
#dSel{background:var(--surface-on-dark);border:0;color:var(--fg-on-dark);
  min-height:var(--control-h-sm);padding:0 var(--space-2);border-radius:var(--radius-md);
  font-size:var(--text-sm)}
.steps{display:flex;margin-top:var(--space-3);gap:2px;overflow-x:auto;
  scrollbar-width:none;padding-bottom:0}
.steps::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;background:var(--surface-on-dark-2);border:0;color:var(--fg-on-dark-3);
  min-height:var(--control-h-sm);padding:0 var(--space-3);font-size:var(--text-sm);
  cursor:pointer;border-radius:var(--radius-md) var(--radius-md) 0 0;
  font-weight:var(--weight-medium);white-space:nowrap;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.st[aria-selected="true"]{background:var(--bg);color:var(--fg)}
.st.done{color:var(--success-on-dark)}

/* ═══════════════ Anleitung ═══════════════ */
.howto{background:var(--surface-3);border-bottom:1px solid var(--border)}
.hwh{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:none;border:0;padding:var(--space-2) var(--space-4);cursor:pointer;
  font:inherit;color:inherit;min-height:var(--tap-min)}
.hwh b{flex:1;display:block;font-size:var(--text-sm);
  font-weight:var(--weight-regular);line-height:var(--leading-tight);color:var(--fg-muted)}
.howto.open .hwh b{font-size:var(--text-md);font-weight:var(--weight-medium);color:var(--fg)}
.ibadge{font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--fg-subtle);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:2px var(--space-1);flex-shrink:0;line-height:1.2}
.howto.open .ibadge{color:var(--fg);border-color:var(--fg)}
.hwh .car2{color:var(--fg-muted);font-size:var(--text-sm);
  transition:transform var(--dur) var(--ease);flex-shrink:0}
.howto.open .hwh .car2{transform:rotate(90deg)}
.hwb{display:none;padding:0 var(--space-4) var(--space-3)}
.howto.open .hwb{display:block}
.hwb p{margin:0;font-size:var(--text-sm);color:var(--fg-muted);line-height:var(--leading-normal)}
.hwb .tip{margin-top:var(--space-2);font-size:var(--text-sm);color:var(--accent)}

.tools{padding:var(--space-3) var(--space-4);position:static;background:var(--bg);
  border-bottom:1px solid var(--border)}
/* Zweite Ebene: was der Schritt verlangt, steht oben. Wie man es
   bedient, steht hier \u2013 gleich in jedem Modus, damit man es an
   einer Stelle sucht und nicht in jedem Schritttext neu liest. */
.bedien{background:var(--bg)}
.bedien .hwh b{color:var(--fg-subtle)}
.bedien .ibadge{border-style:dashed}
.bedien .hwb dl{margin:0;font-size:var(--text-sm);line-height:var(--leading-normal)}
.bedien .hwb dt{font-weight:var(--weight-medium);color:var(--fg);margin-top:var(--space-3)}
.bedien .hwb dt:first-child{margin-top:0}
.bedien .hwb dd{margin:0;color:var(--fg-muted)}

main{padding:0 var(--space-4) var(--space-8);position:relative}
main.hasrail{padding-right:calc(var(--rail) + var(--space-5))}

/* ═══════════════ Sprungleiste ═══════════════ */
.rail{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:var(--z-rail);
  display:flex;flex-direction:column;gap:2px}
.rail button{width:40px;min-height:var(--tap-min);padding:var(--space-2) 0;
  border-radius:var(--radius-md);border:1px solid var(--border);
  background:rgba(255,255,255,.92);color:var(--fg-muted);font-size:var(--text-xs);
  font-weight:var(--weight-medium);cursor:pointer;
  writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.03em;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.rail button:active{background:var(--fg);color:var(--fg-on-dark)}
.rail button.on{border-color:var(--fg);color:var(--fg)}

/* ═══════════════ Überschriften und Stationen ═══════════════ */
.lagerh{padding:var(--space-6) var(--space-4) var(--space-1);background:var(--bg)}
.lgt{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
  text-transform:uppercase;display:flex;align-items:center;gap:var(--space-2)}
.lgs{font-size:var(--text-sm);color:var(--fg-muted);margin-top:var(--space-1)}
.stat{display:flex;gap:var(--space-1);padding:var(--space-3) 0 var(--space-1)}
.statb{flex:1;min-width:34px;height:var(--tap-min);border-radius:var(--radius-md);
  border:1px solid var(--border-strong);background:var(--surface);font:inherit;
  font-size:var(--text-sm);font-weight:var(--weight-bold);color:var(--fg-subtle);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.statb.done{background:var(--success-bg);border-color:var(--success);color:var(--success-fg)}
.statb.on{background:var(--fg);border-color:var(--fg);color:var(--fg-on-dark)}
.stath{padding:var(--space-4) var(--space-4) var(--space-1);display:flex;
  align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.stath b{font-size:var(--text-base);font-weight:var(--weight-medium)}
.stath i{font-style:normal;font-size:var(--text-xs);color:var(--fg-subtle);white-space:nowrap}
.hd1sub2{padding:0 var(--space-4) var(--space-2);font-size:var(--text-sm);color:var(--fg-muted)}
.stats{padding:var(--space-1) var(--space-4) var(--space-3);font-size:var(--text-sm);
  color:var(--fg-muted)}
.stats .bar{display:block;height:3px;border-radius:var(--radius-xs);background:var(--border);
  margin-top:var(--space-2)}
.stats .bar i{display:block;height:100%;border-radius:var(--radius-xs);background:var(--fg)}
.reb8{display:inline-block;min-width:24px;padding:1px var(--space-1);
  border-radius:var(--radius-sm);background:var(--fg);color:var(--fg-on-dark);
  font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:.04em;vertical-align:2px}
.ach{color:var(--fg-muted);font-weight:var(--weight-medium)}
.gq.vorne{min-width:30px;text-align:right;font-size:var(--text-lg);
  font-weight:var(--weight-bold);flex-shrink:0;margin-right:2px}
.gq.vorne.aus{color:var(--fg-subtle)}
.pruefw{padding:var(--space-3) var(--space-4) var(--space-2)}
.hd1w{margin:var(--space-6) 0 0}
.hd1{font-size:var(--text-sm);font-weight:var(--weight-bold);padding:0 0 var(--space-2);
  border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;
  align-items:baseline;gap:var(--space-3);letter-spacing:.02em}
.hd1 .cnt2{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--fg-muted)}
.hd1 .cnt2.full{color:var(--success)}
.hd1sub{font-size:var(--text-xs);color:var(--fg-muted);margin:var(--space-1) 0 var(--space-2)}
.prog{height:4px;background:var(--border);border-radius:var(--radius-xs);overflow:hidden}
.prog i{display:block;height:100%;background:var(--fg);
  transition:width var(--dur) var(--ease)}
.prog i.full{background:var(--success)}
.reb{font-size:var(--text-xs);color:var(--fg-muted);margin:var(--space-4) 0 var(--space-1);
  font-weight:var(--weight-medium);letter-spacing:.02em}
.grpanchor{scroll-margin-top:calc(var(--topH) + var(--space-2))}

/* ═══════════════ Zeile ═══════════════ */
.w{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:var(--space-3) 2px;display:flex;align-items:center;gap:var(--space-3);cursor:pointer;
  transition:background var(--dur-fast) var(--ease)}
.w:active{background:var(--surface-3)}
.w .tx{flex:1;min-width:0}
.nm{display:block;font-size:var(--text-base);line-height:1.32}
.nm b{font-weight:var(--weight-medium)}
.mt{display:block;font-size:var(--text-sm);color:var(--fg-muted);margin-top:2px}
.w.miss{background:var(--danger-bg);border-radius:var(--radius-md);
  border-bottom-color:transparent;padding-left:var(--space-2);padding-right:var(--space-2);
  margin:0 -6px}
.w.miss .nm{color:var(--danger-fg)}
/* Nicht die ganze Zeile daempfen: --fg-muted bei 50 % ist unter jeder
   Lesbarkeitsschwelle. Nur der Text, und nur so weit, dass die Zeile
   zurueckliegt. Das Haekchen bleibt voll. */
.w.seen .nm,.w.seen .mt{opacity:.62}
.w.tick{opacity:.5}
.w.tick .nm{text-decoration:line-through}

/* Konsum-Zähler */
.knum{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.kminus,.kplus{width:40px;height:var(--tap-min);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-lg);
  color:var(--fg-muted);cursor:pointer;line-height:1;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.kminus:active,.kplus:active{background:var(--fg);color:var(--fg-on-dark)}
.kminus.hide{visibility:hidden}
.cnt{min-width:46px;height:var(--tap-min);border:2px solid var(--border-strong);
  border-radius:var(--radius-md);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-subtle);
  transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.cnt.on{border-color:var(--fg);color:var(--fg);background:var(--surface-3)}

/* Punkte und Häkchen */
.dots{display:flex;gap:var(--space-2);align-items:center;flex-shrink:0;
  padding:var(--space-3) 0;cursor:pointer}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg);background:var(--fg)}
.dot.off{background:var(--surface);border-color:var(--border-strong)}
.miss-n{font-size:var(--text-sm);font-weight:var(--weight-bold);color:var(--danger-fg);
  margin-left:var(--space-1);min-width:22px;text-align:right}
.chkbox{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.chk{width:var(--tap-min);height:var(--tap-min);border:2px solid var(--border-strong);
  border-radius:var(--radius-md);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-on-dark);background:var(--surface);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.chk.on{background:var(--success);border-color:var(--success)}
.chk.warn{background:var(--danger);border-color:var(--danger)}
.chk-lbl{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--fg-subtle);
  letter-spacing:.03em}
.chkbox .chk.on+.chk-lbl{color:var(--success)}
.pos{width:20px;font-size:var(--text-sm);color:var(--fg-subtle);
  font-weight:var(--weight-bold);flex-shrink:0;text-align:right}
.box2{width:var(--control-h-sm);height:var(--control-h-sm);border:2px solid var(--fg);
  border-radius:var(--radius-md);flex-shrink:0;display:grid;place-items:center;
  font-size:var(--text-base);font-weight:var(--weight-bold);color:var(--fg-on-dark);
  background:var(--surface)}
.box2.on{background:var(--fg)}
.qty{font-size:var(--text-lg);font-weight:var(--weight-bold);min-width:32px;
  text-align:right;flex-shrink:0}

/* ═══════════════ Zählfelder ═══════════════ */
.zw{padding:var(--space-3) 2px;border-bottom:1px solid var(--border)}
.zw.zebra{background:var(--surface-3)}
.zw.seen .nm{opacity:.55}
.ztop{margin-bottom:var(--space-2)}
.zsteppers{display:flex;gap:var(--space-3);align-items:flex-end}
.zstep{flex:1;text-align:center}
.zstep .zl{font-size:var(--text-xs);color:var(--fg-subtle);
  font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.zsteprow{display:flex;align-items:center;gap:var(--space-1);justify-content:center}
.zbtn{width:40px;height:var(--tap-min);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-lg);
  color:var(--fg-muted);cursor:pointer;line-height:1;flex-shrink:0;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.zbtn:active{background:var(--fg);color:var(--fg-on-dark)}
.zval{flex:1;min-width:34px;height:var(--tap-min);border:2px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-base);
  font-weight:var(--weight-bold);color:var(--fg-subtle);cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.zval.on{border-color:var(--fg);color:var(--fg);background:var(--surface-3)}
.zin{width:100%;padding:0}
.zsumbig{height:var(--tap-min);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-subtle);border:2px solid transparent;
  border-radius:var(--radius-md)}
.zsumbig.on{color:var(--success)}
.kisteninfo{display:flex;gap:var(--space-3);margin:var(--space-4) 0 var(--space-1)}
.kisteninfo div{flex:1;text-align:center;background:var(--surface-3);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-2);
  font-size:var(--text-xs);color:var(--fg-muted)}
.kisteninfo b{display:block;font-size:var(--text-lg);color:var(--fg);
  font-weight:var(--weight-bold)}
.ztags{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-top:var(--space-1)}
.ztag{font-size:var(--text-xs);font-weight:var(--weight-bold);padding:2px var(--space-2);
  border-radius:var(--radius-pill)}
.ztag.rest{background:var(--info-bg);color:var(--info)}
.ztag.bar{background:var(--tag-bar-bg);color:var(--tag-bar-fg)}
.ztag.back{background:var(--tag-back-bg);color:var(--tag-back-fg)}
.fchips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:var(--space-4) 0 var(--space-1)}
.fchip{min-height:var(--tap-min);padding:0 var(--space-4);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-pill);font-size:var(--text-md);
  font-weight:var(--weight-medium);color:var(--fg-muted);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.fchip.on{background:var(--fg);color:var(--fg-on-dark);border-color:var(--fg)}
.zrow{display:flex;gap:var(--space-2);align-items:center;flex-shrink:0}
.zl{font-size:var(--text-xs);color:var(--fg-subtle);font-weight:var(--weight-medium)}
.zsum{font-size:var(--text-base);font-weight:var(--weight-bold);min-width:30px;text-align:right}
.zsum.on{color:var(--success)}

.empty{padding:var(--space-8) 0;text-align:center;color:var(--fg-subtle)}
.pill{display:inline-block;font-size:var(--text-xs);font-weight:var(--weight-bold);
  padding:2px var(--space-2);border-radius:var(--radius-pill);background:var(--surface-3);
  color:var(--fg-muted);margin-left:var(--space-2)}
.pill.new{background:var(--success-bg);color:var(--success)}
.pill.chg{background:var(--danger-bg);color:var(--danger-fg)}

/* ═══════════════ Lieferung ═══════════════ */
.li{border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3);
  margin-top:var(--space-3);background:var(--surface)}
.li .top{display:flex;justify-content:space-between;gap:var(--space-3);align-items:flex-start}
.li .top b{font-size:var(--text-base)}
.li .top .x,.li .g .x{background:none;border:1px solid var(--border-strong);
  color:var(--fg-muted);width:40px;height:40px;border-radius:var(--radius-md);
  cursor:pointer;flex-shrink:0;font-size:var(--text-base);
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.li .top .x:active,.li .g .x:active{background:var(--surface-3)}
.li .g{display:flex;gap:var(--space-2);margin-top:var(--space-3);flex-wrap:wrap;
  align-items:flex-end}
.fld{flex:1;min-width:90px}
.fld span{display:block;font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.li .info{margin-top:var(--space-3);font-size:var(--text-sm);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
  background:var(--surface-3);color:var(--fg-muted)}
.li .info.chg{background:var(--danger-bg);color:var(--danger-fg)}
.li .info b{color:inherit}

/* ═══════════════ Abschluss ═══════════════ */
.done-cta{padding:var(--space-7) 0 var(--space-3);text-align:center}
.done-cta .big{font-size:var(--text-display);font-weight:var(--weight-bold);line-height:1}
.done-cta .lb{font-size:var(--text-sm);color:var(--fg-muted);margin-top:var(--space-2)}

/* ═══════════════ Protokoll ═══════════════ */
.doc{padding:var(--space-4) 0}
.dh{border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:var(--space-4);margin-bottom:var(--space-4);background:var(--surface)}
.dh .t{font-size:var(--text-base);font-weight:var(--weight-medium)}
.dh .m{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-5);
  margin-top:var(--space-2);font-size:var(--text-sm);color:var(--fg-muted)}
.dh .m b{color:var(--fg);font-weight:var(--weight-medium)}
.sec{margin-top:var(--space-6)}
.sec>h3{font-size:var(--text-sm);margin:0 0 var(--space-1);padding-bottom:var(--space-2);
  border-bottom:2px solid var(--fg);text-transform:uppercase;letter-spacing:var(--track-caps);
  font-weight:var(--weight-bold);display:flex;justify-content:space-between;
  align-items:center;min-height:var(--tap-min)}
.secarrow{transition:transform var(--dur) var(--ease);color:var(--fg-muted);
  font-weight:var(--weight-regular)}
.sec.collapsible.closed .secarrow{transform:none}
.sec.collapsible:not(.closed) .secarrow{transform:rotate(90deg)}
.sec.collapsible.closed table{display:none}
.sec.collapsible.closed{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:var(--text-md)}
th{text-align:left;font-size:var(--text-xs);color:var(--fg-muted);
  border-bottom:1px solid var(--fg);padding:var(--space-2);font-weight:var(--weight-bold)}
th.r,td.r{text-align:right}
td{padding:var(--space-2);border-bottom:1px solid var(--border);vertical-align:top}
td.grp{background:var(--surface-3);font-size:var(--text-xs);font-weight:var(--weight-bold);
  text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--fg-muted);padding:var(--space-2)}
tr.flag{background:var(--danger-bg)}
tr.tot td{border-top:2px solid var(--fg);border-bottom:0;font-weight:var(--weight-bold);
  background:var(--surface-3)}
.kpi{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.kpi div{flex:1;min-width:72px;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-3);background:var(--surface)}
.kpi span{display:block;font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium)}
.kpi b{font-size:var(--text-lg);font-weight:var(--weight-bold)}
.kpi div.w2{border-color:var(--danger-border);background:var(--danger-bg)}
.kpi div.w2 b{color:var(--danger)}
.box{border:1px solid var(--border);border-left:4px solid var(--danger);
  background:var(--danger-bg);border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:var(--space-3);margin-top:var(--space-4);font-size:var(--text-md)}
.box.good{border-left-color:var(--success);background:var(--success-bg)}

/* ═══════════════ Name-Auswahl ═══════════════ */
.namebox{margin-top:var(--space-2)}
.namebox .nl{font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);margin-bottom:var(--space-2)}
.namechips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-3)}
.namechip{min-height:var(--tap-min);padding:0 var(--space-4);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-pill);font-size:var(--text-md);
  font-weight:var(--weight-medium);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.namechip.on{background:var(--fg);color:var(--fg-on-dark);border-color:var(--fg)}
label.f{display:block;margin-top:var(--space-3)}
label.f span{font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);display:block;margin-bottom:var(--space-1)}

.exprow{display:flex;gap:var(--space-2);margin-top:var(--space-5)}
.exprow .primary,.exprow .secondary{flex:1;min-height:var(--control-h-lg)}
.explesser{display:flex;gap:var(--space-3);justify-content:center;
  margin-top:var(--space-3);flex-wrap:wrap}


/* ═══════════════ Toast und Overlay ═══════════════ */
.toast{position:fixed;bottom:calc(var(--space-6) + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:var(--fg);color:var(--fg-on-dark);
  padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);
  font-size:var(--text-sm);z-index:var(--z-toast);opacity:0;
  transition:opacity var(--dur) var(--ease);pointer-events:none;max-width:88vw;
  text-align:center;box-shadow:var(--shadow-overlay)}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(20,20,22,.6);display:none;z-index:var(--z-overlay);
  padding:var(--space-4);align-items:center;justify-content:center}
.ov.on{display:flex}
.card2{background:var(--surface);max-width:440px;width:100%;padding:var(--space-6);
  border-radius:var(--radius-lg);max-height:88vh;overflow:auto}
.card2 h3{margin:0 0 var(--space-2);font-size:var(--text-base)}
.card2 p{margin:0 0 var(--space-4);font-size:var(--text-md);color:var(--fg-muted)}
.card2 .row{display:flex;gap:var(--space-2)}
.card2 .row button{flex:1}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.offline{background:var(--surface-3);color:var(--fg-secondary);font-size:var(--text-xs);
  padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--border);display:none}
body.off .offline{display:block}

/* ═══════════════ Zeigegerät ═══════════════ */
@media(hover:hover) and (pointer:fine){
  .mi:hover,.w:hover,.recheck:hover,.fullbtn:hover,.addbtn:hover,
  .prueft:hover,.card2 .row button:hover,.drwb button:hover,
  .exprow .secondary:hover{background:var(--surface-3)}
  .finishbtn.blocked:hover{background:var(--border-strong);border-color:var(--border-heavy)}
  .finishbtn:not(.blocked):hover,.exprow .primary:hover,.card2 .row .ok:hover,
  .prueft.weiter:hover,.drwb button.weiter:hover{
    background:var(--fg-secondary);border-color:var(--fg-secondary)}
  .st:hover{background:var(--border-on-dark);color:var(--fg-on-dark)}
  .st[aria-selected="true"]:hover{background:var(--bg);color:var(--fg)}
  .home:hover,#dSel:hover{background:var(--border-on-dark)}
  .statb:hover,.fchip:hover,.namechip:hover,.rail button:hover,
  .kminus:hover,.kplus:hover,.zbtn:hover,.li .top .x:hover,.li .g .x:hover{border-color:var(--fg)}
  .statb.on:hover{border-color:var(--fg)}
  .adminlink:hover,.explesser button:hover{color:var(--fg)}
  .sec.collapsible>h3:hover{color:var(--fg-secondary)}
}

/* ═══════════════ Breite Viewports ═══════════════ */
@media(min-width:720px){
  header,.howto,.tools,main{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  /* max() verhindert, dass die Leiste aus dem Bild rutscht, wenn --maxw
     breiter ist als der Viewport (iPad 834px gegen --maxw 900px). */
  .rail{right:max(var(--space-1),calc(50% - (var(--maxw)/2) + var(--space-2)))}}
@media(min-width:768px){:root{--maxw:900px}}

/* ═══════════════ Teil 2 ═══════════════ */
.gshot--tap{cursor:pointer;border-radius:var(--radius-sm)}
.gshot--tap:active{background:var(--surface-4)}
/* Dominante Ladenanweisung. Blau, nicht rot: das hier ist eine
   Arbeitsanweisung, kein Fehlbestand. Rot bleibt den Fehlmengen. */
.ghint--stark{font-size:var(--text-md);font-weight:var(--weight-medium);
 color:var(--fg-secondary);background:var(--info-bg);
 border-left:4px solid var(--info);margin:0;
 padding:var(--space-3);line-height:var(--leading-tight)}
/* Hol-Listen: ein Muster für Wein und Getränke */
.holz{display:flex;align-items:center;gap:var(--space-2);
 border-bottom:1px solid var(--border);padding:var(--space-1) 0}
.holz .holzl{flex:1;display:flex;align-items:center;gap:var(--space-3);
 border:0;background:none;text-align:left;cursor:pointer;font:inherit;
 padding:var(--space-2) 0;min-height:var(--tap-min);color:inherit}
.holz.erledigt .holzl{opacity:.45}
.holz.erledigt .nm{text-decoration:line-through}
/* Abweichung bleibt bewusst leise: Text, kein Feld. */
.abwk{background:none;border:0;color:var(--fg-subtle);font-size:var(--text-xs);
 text-decoration:underline;cursor:pointer;padding:var(--space-2);
 min-height:var(--tap-min);flex-shrink:0;white-space:nowrap}
.abwk.on{color:var(--danger);font-weight:var(--weight-medium);text-decoration:none;
 border:1px solid var(--danger-border);border-radius:var(--radius-pill);
 background:var(--danger-bg);min-height:var(--control-h-sm);padding:0 var(--space-3)}

/* ══════ P26 · Verbindung ══════
   Die Erfassung bleibt unangetastet: sie schreibt weiter in localStorage
   und läuft weiter, wenn im Keller kein Netz ist. Neu ist nur, dass jeder
   Vorgang zusätzlich in eine Warteschlange geht und von dort zum Server
   wandert. Die Id kommt vom Gerät, der Server ist idempotent — doppeltes
   Senden schadet nicht. */
const API="/api";
const QKEY="hh_queue_v1", SPIEGELKEY="hh_spiegel_v1";
function ladeQ(){try{return JSON.parse(localStorage.getItem(QKEY))||[];}catch(e){return [];}}
function sichereQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q));}catch(e){}}
function inQ(rec){
  if(!rec||!rec.mode)return;
  if(!rec.vid)rec.vid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
  const q=ladeQ().filter(x=>x.vid!==rec.vid);
  q.push(JSON.parse(JSON.stringify(rec)));
  sichereQ(q.slice(-60));
  flushQ();
}
let flushLaeuft=false;
async function flushQ(){
  if(flushLaeuft||!navigator.onLine)return;
  flushLaeuft=true;
  let q=ladeQ();
  while(q.length){
    const rec=q[0];
    try{
      const r=await fetch(API+"/vorgang/"+encodeURIComponent(rec.vid),
        {method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(rec)});
      if(r.status===401){break;}                 /* Sitzung abgelaufen: liegen lassen */
      if(!r.ok&&r.status<500){q.shift();sichereQ(q);continue;}  /* untauglich: verwerfen */
      if(!r.ok)break;
      q.shift();sichereQ(q);
    }catch(e){break;}
  }
  flushLaeuft=false;
  const offen=ladeQ().length;
  const b=document.getElementById("qbadge");
  if(b)b.textContent=offen?offen+" offen":"";
}
window.addEventListener("online",flushQ);

async function zieheStand(){
  try{
    const r=await fetch(API+"/vorgaenge");
    if(!r.ok)return false;

}

const AKEY="hh_archiv";
function loadArch(){try{const r=localStorage.getItem(AKEY);if(r)return JSON.parse(r);}catch(e){}return{};}
function saveArch(a){try{localStorage.setItem(AKEY,JSON.stringify(a));}catch(e){}}
function archive(rec){
  if(!rec)return;
  inQ(rec);
  const a=loadArch();
  a[rec.mode+"_"+rec.tag]=Object.assign({},rec,{archiviert:new Date().toISOString()});
  const ks=Object.keys(a).sort((x,y)=>(a[x].archiviert||"").localeCompare(a[y].archiviert||""));
  /* Mit dem Eintrag gehen auch seine Bilder \u2013 sonst waechst der
     Bildspeicher unbegrenzt weiter. */
  while(ks.length>30){const weg=ks.shift();
    ((a[weg]||{}).fotos||[]).forEach(x=>{try{fdel(x.k);}catch(e){}});
    delete a[weg];}
  saveArch(a);}

const ZORD={1:1,2:2,5:3,3:4,4:5,6:6,7:7};

    ||((PLAN.restorder[a.id]==null?999:PLAN.restorder[a.id])-(PLAN.restorder[b.id]==null?999:PLAN.restorder[b.id]))
    ||(WIDX[a.id]-WIDX[b.id]);
}

/* ══════ P24 · Kellerstand nachschlagen ══════
   Die häufigste Frage an der Bar ist keine Fassung, sondern: haben wir
   davon noch was? Bisher hiess die Antwort hinuntergehen. Diese Ansicht
   rechnet sie aus der jüngsten Zählung und allem, was seither gebucht
   wurde — sie schreibt nichts und kann darum nichts kaputt machen.

   Ohne Zählung gibt es keinen Bestand. Dann steht das da, statt eine
   Zahl zu erfinden. */
function standDaten(){
  const a=loadArch(), ks=Object.keys(a);
  const rang={ware:0,keller:1,tag:2,fuellen:3,nach:4};
  /* Server zuerst, eigenes Archiv als Ergänzung. Was beide kennen, zählt
     einmal \u2014 die vid entscheidet. */
  const gesehen=new Set();
  const roh=[];
  spiegel().forEach(v=>{if(v&&v.mode){roh.push(v);if(v.vid)gesehen.add(v.vid);}});
  ks.map(k=>a[k]).forEach(v=>{if(v&&v.mode&&!(v.vid&&gesehen.has(v.vid)))roh.push(v);});
  const alle=roh.filter(v=>v&&v.mode)
    .slice().sort((x,y)=>(x.tag||"").localeCompare(y.tag||"")||((rang[x.mode]??9)-(rang[y.mode]??9)));
  /* Der laufende, noch nicht archivierte Vorgang zählt mit — sonst zeigt
     die Bar einen Stand, den das Fassen von heute früh schon überholt hat. */
  Object.keys(S||{}).forEach(k=>{const v=S[k];
    if(v&&v.mode&&hasData(k,v))alle.push(Object.assign({},v,{laufend:1}));});

  let basis=null,bi=-1;
  alle.forEach((v,i)=>{if(v.mode==="keller"&&WINES.some(w=>(v.zdone||{})[w.id])){basis=v;bi=i;}});
  const b={};
  if(basis)WINES.forEach(w=>{if((basis.zdone||{})[w.id])
    b[w.id]=g(basis.reihen,w.id)*6+g(basis.einzel,w.id);});

  let ein=0,raus=0;
  alle.forEach((v,i)=>{
    if(i<=bi)return;
    if(v.mode==="ware")(v.pos||[]).forEach(p=>{
      if(!p.id||p.id==="__neu"||!(+p.kisten>0))return;
      const n=(+p.kisten)*(p.kg?+p.kg:((PLAN.kiste||{})[p.id]||6));
      b[p.id]=(b[p.id]||0)+n;ein+=n;});
    if(v.mode==="tag"||v.mode==="fuellen"){
      const t={};["barrot","bar","backup","rest"].forEach(k=>
        Object.keys(v[k]||{}).forEach(id=>t[id]=(t[id]||0)+(+v[k][id]||0)));
      Object.keys(t).forEach(id=>{
        const n=(v.holtN&&v.holtN[id]!=null)?+v.holtN[id]:t[id];
        b[id]=(b[id]||0)-n;raus+=n;});
      Object.keys(v.zusatz||{}).forEach(id=>{b[id]=(b[id]||0)-(+v.zusatz[id]||0);raus+=+v.zusatz[id]||0;});
    }
    if(v.mode==="nach")Object.keys(v.ent||{}).forEach(id=>{
      b[id]=(b[id]||0)-(+v.ent[id]||0);raus+=+v.ent[id]||0;});
  });
  const warn=WINES.filter(w=>b[w.id]!=null&&b[w.id]<6).length;
  const minus=WINES.filter(w=>b[w.id]!=null&&b[w.id]<0).length;
  return {b,basis,ein,raus,warn,minus,hat:!!basis};
}

/* P25 · Wer nachschlägt, steht meistens schon im Keller. Die Flasche, die
   er dann mitnimmt, war bisher die häufigste Lücke im Bestand: geholt und
   nicht gemeldet. Genau daher kommen die negativen Zahlen. Ein Knopf
   schreibt sie in die laufende Sonderentnahme \u2014 abgeschlossen wird sie
   weiterhin im eigenen Modul, damit das Protokoll seine Form behält. */
function nimmRaus(id){
  const w=byId(id); if(!w)return;
  const cur=S.nach;
  if(cur&&(cur.finished||cur.tag!==today())){archive(cur);S.nach=blank("nach");}
  else if(!cur)S.nach=blank("nach");
  if(!S.nach.name)S.nach.name=whoAmI();

    ||(d.fotos||[]).length;

    ||Object.keys(d.gholt||{}).length||Object.keys(d.gcheck||{}).length||sum(d.gzusatz);

/* 3.5 · grün nur bei echter Vollständigkeit */
function stepComplete(i){
  const d=D();if(!d)return false;
  if(branch==="getr"&&mode!=="tag"){
    if(mode==="keller")return i===0?ALLE_LADEN().every(L=>(d.gdone||{})[L.id]):false;
    return i===0?sum(d.gent)>0:false;
  }
  if(mode==="fuellen"){
    if(i===0)return barUnits().every(barDone);
    if(i===1){const g2=gFehlt().filter(x=>!WEINLAGER.includes(x.id));
      return g2.length>0&&g2.every(x=>(d.gholt||{})[x.id]);}
    return false;
  }
  if(mode==="tag"){
    if(i===0)return barUnits().every(barDone);
    if(i===1)return WINES.filter(w=>PLAN.soll[w.id]!=null).every(w=>d.seen[w.id]||g(d.rest,w.id));
    if(i===2){const it=holList();return it.length>0&&it.every(x=>d.holt[x.w.id]);}
    return false;
  }
  if(mode==="keller")return i===0?WINES.every(w=>d.zdone[w.id]):false;
  if(mode==="nach")return i===0?sum(d.ent)>0:false;
  if(mode==="ware"){
    const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
    if(i===0)return pos.length>0;
    if(i===1)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.jok[x.id]);
    if(i===2)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.ein[x.id]);
  }
  return false;
}

/* ── Bar (zuerst) ── */
/* 2A · Der Barbereich wird Station für Station durchgegangen: erst die
   ungekühlten Rotweine, dann das ungekühlte Backup, dann Lade 1 bis 6.
   „Weiter" bestätigt die Station als geprüft und geht zur nächsten. */
let barIdx=0;
function barUnits(){
  /* P13/23 · Das Backup wird nicht mehr bedient. Der Topf bleibt in blank()
     und in allen Lesepfaden, damit archivierte Protokolle stimmen. */
  const u=mode==="fuellen"?[]
    :[{k:"liste",id:"barrot",t:"Bar · Rotweine",s:"Nicht gekühlt",marke:"R",
       arr:barSlots("barrot"),bucket:"barrot"}];
  ALLE_LADEN().forEach((L,i)=>u.push({k:"lade",id:L.id,t:L.t,L:L,marke:String(i+1)}));
  const off=(D()||{}).goffen||{};
  /* Grün überschreibt Gelb: bestätigte Laden gelten nicht mehr als offen. */
  u.forEach(x=>{x.offen=!!off[x.id]&&!barDone(x);});
  return u;
}
/* Wer eine Karte verlässt, ohne sie zu bestätigen, findet beim
   Zurückkommen einen gelben Hinweis \u2014 und sieht ihn schon in der
   Stationsleiste. */
function merkeOffen(u){
  if(!u||barDone(u))return;
  const d=D();d.goffen=d.goffen||{};d.goffen[u.id]=1;save();}
function barDone(u){
  const d=D();
  if(u.k==="lade")return !!(d.gdone||{})[u.id];
  return u.arr.every(p=>d.seen[p.id+"_"+u.bucket]||g(d[u.bucket],p.id));
}
function barMark(u){
  const d=D();d.gdone=d.gdone||{};
  if(u.k==="lade"){d.gdone[u.id]=1;save();return;}
  u.arr.forEach(p=>{d.seen[p.id+"_"+u.bucket]=1;});save();
}
function rBar(m){
  const d=D(),U=barUnits();railGroups=[];
  if(barIdx>=U.length)barIdx=U.length-1;if(barIdx<0)barIdx=0;
  const u=U[barIdx];

/* ── Restaurant ── */
/* Wie an der Bar: ein Schrank je Station, „geprueft" fuehrt zum naechsten.

let restIdx=0;
function schrankListe(n){

function schrankFertig(n){

}
function schrankBlock(m,n,list,anker,ohneKopf){
  const chk=w=>D().seen[w.id]||g(D().rest,w.id);

/* 3A · Erst die Fehlmengen antippen, dann bestätigen: der Rest ist da.
   Der Knopf steht am Ende der Liste, nicht davor. */
function pruefBtn(m,list,checkFn,label,weiter,naechste){
  const d=D(),done=list.filter(checkFn).length,all=list.length,fertig=done===all;
  const wrap=document.createElement("div");wrap.className="pruefw";

     Vorher stand beides in einem 42-Zeichen-Satz mit zwei Strichen. */
  b.innerHTML=fertig
    ? `<span class="pl">\u2713 gepr\u00fcft</span><span class="ps">${esc(label)}</span>`
    : `<span class="pl">Rest ist da${weiter?" \u2013 weiter":""}</span>`
      +`<span class="ps">${esc(label)}</span>`;

    const dd=D();

}
function schrankHead(m,titel,sub,list,checkFn,fullFn,fullLabel){
  const done=list.filter(checkFn).length,all=list.length,pct=Math.round(done/all*100);
  const wrap=document.createElement("div");wrap.className="hd1w";

/* 3.1 · Bestand: voll ist der Start, man tippt herunter auf das, was noch dasteht.
   Gespeichert wird weiterhin die Fehlmenge (soll − ist). */
function dotRow(w,bucket,soll,pos){
  const d=D();
  const key=bucket==="rest"?w.id:w.id+"_"+bucket;
  const b=document.createElement("div");b.className="w";
  const tx=document.createElement("div");
  tx.style.cssText="flex:1;min-width:0;display:flex;align-items:center;gap:11px";
  tx.innerHTML=`${pos?`<span class="pos">${pos}</span>`:""}
    <span class="tx"><span class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</span>
    <span class="mt">Soll ${soll}</span></span>`;
  const dots=document.createElement("span");dots.className="dots";
  const pts=[];
  for(let i=0;i<soll;i++){const s=document.createElement("span");s.className="dot";s.dataset.i=i;
    s.setAttribute("role","button");s.tabIndex=0;
    s.setAttribute("aria-label",`${w.wein}: noch ${i+1} von ${soll} da`);
    pts.push(s);dots.appendChild(s);}
  const missN=document.createElement("span");missN.className="miss-n";dots.appendChild(missN);
  tx.appendChild(dots);
  const cbox=document.createElement("div");cbox.className="chkbox";
  const chk=document.createElement("button");chk.className="chk";
  const lbl=document.createElement("span");lbl.className="chk-lbl";lbl.textContent="voll";
  cbox.append(chk,lbl);
  const upd=()=>{const f=g(D()[bucket],w.id),ist=soll-f,seen=!!D().seen[key]||f>0;
    pts.forEach((s,i)=>s.classList.toggle("off",i>=ist));
    missN.textContent=f?"\u2212"+f:"";
    b.className="w"+(f?" miss":(seen?" seen":""));
    chk.className="chk"+(f?" warn":(seen?" on":""));
    chk.textContent=f?"!":(seen?"\u2713":"");
    chk.setAttribute("aria-label",seen&&!f?`${w.wein} als voll bestätigt – antippen zum Lösen`:`${w.wein} als voll bestätigen`);
    renderFoot();};
  const setIst=ist=>{const d2=D(),f=Math.max(0,Math.min(soll,soll-ist));
    if(f>0)d2[bucket][w.id]=f;else delete d2[bucket][w.id];
    d2.seen[key]=1;save();upd();};
  dots.onclick=e=>{const s=e.target.closest(".dot");if(!s)return;
    const i=+s.dataset.i,ist=soll-g(D()[bucket],w.id);
    setIst(ist===i+1?i:i+1);};
  dots.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    const s=e.target.closest(".dot");if(!s)return;e.preventDefault();
    const i=+s.dataset.i,ist=soll-g(D()[bucket],w.id);
    setIst(ist===i+1?i:i+1);});
  chk.onclick=e=>{e.stopPropagation();const d2=D(),f=g(d2[bucket],w.id);
    if(f){delete d2[bucket][w.id];d2.seen[key]=1;}
    else if(d2.seen[key])delete d2.seen[key];else d2.seen[key]=1;
    save();upd();};
  b.append(tx,cbox);upd();return b;
}

/* Die Menge stimmt fast immer. Nur wenn im Lager etwas aus ist, klappt
   hier ein Feld auf \u2014 zurückhaltend, damit es nicht zum Normalfall wird. */
function abwKnopf(zeile,id,soll,menge,topf,zeigen){
  const k=document.createElement("button");k.className="abwk"+(menge!==soll?" on":"");
  k.type="button";
  k.textContent=menge!==soll?menge+" statt "+soll:"Abweichung";
  k.setAttribute("aria-label","Abweichende Menge für "+GN(id)+" eintragen");
  k.onclick=e=>{
    e.stopPropagation();
    if(zeile.querySelector(".abwfeld"))return;
    const inp=document.createElement("input");inp.className="abwfeld";
    inp.type="number";inp.inputMode="numeric";inp.min="0";inp.value=menge;
    inp.setAttribute("aria-label","Tatsächliche Menge");
    k.replaceWith(inp);inp.focus();inp.select();
    const fin=()=>{
      const v=Math.max(0,parseInt(inp.value,10)||0);
      if(v===soll)delete topf[id];else topf[id]=v;
      save();zeigen(v);
      k.className="abwk"+(v!==soll?" on":"");

      render();};
    inp.onblur=fin;inp.onkeydown=ev=>{if(ev.key==="Enter")inp.blur();};};
  zeile.appendChild(k);
}

  const b=document.createElement("button");b.className="addbtn";b.textContent="+ Position hinzufügen";
  b.onclick=()=>{d.pos.push({id:"",jg:"",kisten:1,neu:null});save();render();window.scrollTo(0,document.body.scrollHeight);};
  m.appendChild(b);
}
function posCard(p,i){
  const d=D(),c=document.createElement("div");c.className="li";
  const w=p.id&&p.id!=="__neu"?byId(p.id):null;
  const opts=WINES.map(x=>`<option value="${x.id}"${x.id===p.id?" selected":""}>${esc(x.winzer)} · ${esc(x.wein)}</option>`).join("");
  if(p.kistengr==null)p.kistengr=(p.id&&p.id!=="__neu"?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD);
  const kist=kg(p);
  c.innerHTML=`<div class="top"><b>Position ${i+1}</b><button class="x" aria-label="entfernen">\u00d7</button></div>
   <div class="g">
     <label class="fld" style="flex:2 1 100%"><span>Wein</span>
       <select class="selW"><option value="">— wählen —</option>${opts}<option value="__neu"${p.id==="__neu"?" selected":""}>+ Neuer Wein</option></select></label>
     <label class="fld"><span>Jahrgang</span><input class="inJ" value="${esc(p.jg)}" placeholder="2025"></label>
     <label class="fld"><span>Kisten</span><input class="inK" type="number" min="0" inputmode="numeric" value="${p.kisten}"></label>
     <label class="fld"><span>Kistengröße</span><input class="inKG" type="number" min="1" inputmode="numeric" value="${kist}"></label>
   </div>`;
  if(p.id==="__neu"){const n=p.neu||{};
    c.innerHTML+=`<div class="g" style="margin-top:4px">
      <label class="fld"><span>Winzer</span><input class="n_winzer" value="${esc(n.winzer)}"></label>
      <label class="fld"><span>Weinname</span><input class="n_wein" value="${esc(n.wein)}"></label>
      <label class="fld"><span>Rebsorte</span><input class="n_reb" value="${esc(n.reb)}"></label>
      <label class="fld"><span>Region</span><input class="n_region" value="${esc(n.region)}"></label>
      <label class="fld"><span>Farbe</span><select class="n_f">${["","WEISS","ROSÉ","ROT","BUBBLES","NATURAL"].map(x=>`<option${x===n.f?" selected":""}>${x}</option>`).join("")}</select></label>

  }else if(w){const fl=(+p.kisten||0)*kg(p),chg=p.jg&&p.jg!==w.jg;

      chg?`<br><b>Jahrgangswechsel:</b> bisher ${esc(w.jg)}, jetzt ${esc(p.jg)}`:
      (p.jg?`<br>Jahrgang unverändert (${esc(w.jg)})`:`<br>Bisher im Keller: Jg. ${esc(w.jg)} (Stand Juli 2026)`)}</div>`;}
  c.querySelector(".x").onclick=()=>{d.pos.splice(i,1);save();render();};
  c.querySelector(".selW").onchange=e=>{p.id=e.target.value;if(p.id==="__neu"&&!p.neu)p.neu={};
    p.kistengr=(p.id&&p.id!=="__neu")?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD;save();render();};
  c.querySelector(".inJ").oninput=e=>{p.jg=e.target.value;save();};
  c.querySelector(".inJ").onblur=()=>render();
  c.querySelector(".inK").oninput=e=>{p.kisten=Math.max(0,parseInt(e.target.value,10)||0);save();};
  c.querySelector(".inK").onblur=()=>render();
  c.querySelector(".inKG").oninput=e=>{p.kistengr=Math.max(1,parseInt(e.target.value,10)||KISTE_STD);save();};
  c.querySelector(".inKG").onblur=()=>render();
  ["winzer","wein","reb","region","f"].forEach(k=>{const el=c.querySelector(".n_"+k);
    if(el)el.oninput=e=>{p.neu=p.neu||{};p.neu[k]=e.target.value;save();};});
  return c;
}
function rJahr(m){
  const d=D(),items=d.pos.filter(p=>p.id&&p.id!=="__neu"),neu=d.pos.filter(p=>p.id==="__neu");
  if(!items.length&&!neu.length)return m.innerHTML='<p class="empty">Noch keine Kisten aufgenommen.</p>';
  if(items.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Jahrgänge prüfen</div><div class="hd1sub">Vergleich mit Stand Juli 2026</div>';
    items.forEach(p=>{const w=byId(p.id);if(!w)return;
      const chg=p.jg&&p.jg!==w.jg,ok=!!d.jok[p.id];
      const row=document.createElement("div");row.className="w"+(ok?" seen":"");
      const chk=document.createElement("button");chk.className="box2"+(ok?" on":"");chk.textContent=ok?"\u2713":"";
      chk.setAttribute("aria-label",`${w.wein} Jahrgang bestätigen`);
      chk.onclick=()=>{if(ok)delete d.jok[p.id];else d.jok[p.id]=1;save();render();};
      row.appendChild(chk);
      const tx=document.createElement("div");tx.className="tx";
      tx.innerHTML=`<div class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}${chg?'<span class="pill chg">geändert</span>':""}</div>
        <div class="mt">Keller ${esc(w.jg)} \u2192 Lieferung ${esc(p.jg||"?")}</div>`;
      row.appendChild(tx);
      const inp=document.createElement("input");inp.className="zf";inp.style.width="64px";
      inp.value=d.jneu[p.id]!=null?d.jneu[p.id]:(p.jg||"");inp.setAttribute("aria-label",`${w.wein} Jahrgang korrigieren`);
      inp.oninput=e=>{d.jneu[p.id]=e.target.value;save();};
      row.appendChild(inp);m.appendChild(row);});
  }
  if(neu.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Neue Weine</div><div class="hd1sub">Nicht im bisherigen Sortiment</div>';
    neu.forEach(p=>{const n=p.neu||{};
      const row=document.createElement("div");row.className="w";
      row.innerHTML=`<span class="tx"><span class="nm"><b>${esc(n.winzer)||"—"}</b> · ${esc(n.wein)||"—"}<span class="pill new">neu</span></span>
        <span class="mt">${esc(n.reb)||"?"} · ${esc(n.region)||"?"} · ${esc(n.f)||"?"} · Jg. ${esc(p.jg)||"?"}</span></span>
        <span class="qty">${(+p.kisten||0)*kg(p)}</span>`;
      m.appendChild(row);});
  }
}
function rEin(m){
  const d=D(),items=(d.pos||[]).filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0);
  if(!items.length)return m.innerHTML='<p class="empty">Keine Kisten zum Einräumen.</p>';
  const srt=items.slice().sort((a,b)=>wegCmp(byId(a.id)||a,byId(b.id)||b));
  let lz=null;
  srt.forEach(p=>{const w=byId(p.id);if(!w)return;const z=PLAN.zone[p.id];
    if(z!==lz){lz=z;const h=add(m,"hd1w","");h.innerHTML=`<div class="hd1">${PLAN.zonen[z].t}</div><div class="hd1sub">${PLAN.zonen[z].s}</div>`;}
    const fl=p.kisten*kg(p),on=!!d.ein[p.id];
    const b=document.createElement("button");b.className="w"+(on?" tick":"");
    b.innerHTML=`<span class="box2${on?" on":""}">${on?"\u2713":""}</span>
      <span class="tx"><span class="nm"><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</span>
      <span class="mt">${p.kisten} Kisten à ${kg(p)} · Jg. ${esc(p.jg||"?")}</span></span><span class="qty">${fl}</span>`;
    b.onclick=()=>{if(on)delete d.ein[p.id];else d.ein[p.id]=1;save();render();};
    m.appendChild(b);});
}

/* ── Farbnormalisierung ──────────────────────────────────────────────
   Die Produktfarben stammen von den Etiketten und decken einen sehr

   gefuellte Punkte nebeneinander liest sich das als Farbmusterkarte,
   nicht als Werkzeug. Hier wird der Bereich einmalig komprimiert —
   der Farbton bleibt, Buntheit und Helligkeit werden in ein schmales,
   warmes Band gezogen. Die Positionen bleiben unterscheidbar, die
   Lade wirkt als ein Ganzes. TONE.aus=true zeigt die Originalfarben. */

    const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;
    return Math.round(Math.max(0,Math.min(1,v))*255);};

/* Tippen erst beim Loslassen und nur, wenn der Finger stehen geblieben ist —
   sonst löst jeder Scrollversuch über einer Lade etwas aus. */
function gBindTap(el,L){
  let sx=0,sy=0,ziel=null;
  el.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;
    const t=e.target.closest("[data-gid]");
    ziel=(t&&el.contains(t))?t:null;});
  el.addEventListener("pointermove",e=>{
    if(!ziel)return;
    if(Math.abs(e.clientX-sx)>9||Math.abs(e.clientY-sy)>9)ziel=null;});
  el.addEventListener("pointercancel",()=>{ziel=null;});
  el.addEventListener("pointerup",e=>{
    if(!ziel)return;
    const t=e.target.closest("[data-gid]");
    if(t!==ziel){ziel=null;return;}
    const k=ziel.dataset.gid,i=+ziel.dataset.k,cur=sIst(k);
    const n=+ziel.dataset.n||sSoll(k);
    const w=zellRang(ziel,i,n);
    sSet(k,cur===w?w-1:w);gPaint(k);
    /* Wer eine Menge setzt, hat hingeschaut: die Spalte gilt als kontrolliert. */
    if(ziel.dataset.col)setGeprueft(ziel.dataset.col,1);
    const it2=ziel.closest(".gitem");

/* Nur das Gasteiner-Raster bleibt beim Ziehen: kurze Reihen, dort ist das
   durchgehende Auffüllen der schnellere Weg. */
function gBindPaint(el,L){
  let run=false;
  const fire=e=>{
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const p2=t&&t.closest("[data-gid]");
    if(!p2||!el.contains(p2))return;
    const k=p2.dataset.gid,i=+p2.dataset.k,cur=sIst(k);
    const n=+p2.dataset.n||sSoll(k);
    const w=zellRang(p2,i,n);
    const nv=(!run&&cur===w)?w-1:w;
    if(nv!==cur){sSet(k,nv);gPaint(k);gPaintLade(L);}
  };
  el.addEventListener("pointerdown",e=>{
    try{el.setPointerCapture(e.pointerId);}catch(x){}
    run=false;fire(e);run=true;e.preventDefault();});
  el.addEventListener("pointermove",e=>{
    if(el.hasPointerCapture&&el.hasPointerCapture(e.pointerId))fire(e);});
  const end=()=>{run=false;renderFoot();};
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

const GGAP=5;      /* zwischen den Kugeln */
const GCOL=8;      /* zwischen den Spalten */
function gBreite(){
  const m=$("#main");
  const w=(m&&m.clientWidth?m.clientWidth:Math.min(window.innerWidth,760))-32;
  return Math.max(180,w-22);
}
/* Die Lade ist ein Kasten, der Inhalt sitzt darin — nichts wird geschoben oder
   abgeschnitten. Die Stapelhöhe wird so gewählt, dass alle Spalten zusammen
   genau in die Breite passen und trotzdem gleich hoch enden. */
/* Angeschaut-Haken je Spalte. Reine Kontrolle, keine Mengenwirkung. */
function colKey(L,teile){return L.id+"|"+teile.map(t=>t[0]).join("+");}
function colGeprueft(k){const d=D();return !!((d&&d.gcheck)||{})[k];}
function setGeprueft(k,an){
  const d=D();d.gcheck=d.gcheck||{};
  if(an)d.gcheck[k]=1;else delete d.gcheck[k];
  save();
  document.querySelectorAll('[data-colwrap="'+k+'"]')
    .forEach(el=>el.classList.toggle("gcol--geprueft",!!an));
  document.querySelectorAll('[data-gchk="'+k+'"]')
    .forEach(el=>el.classList.toggle("gitem--geprueft",!!an));}
/* Eine Spalte kann zwei Sorten übereinander tragen (Raschhofer). */
function colTeile(c){return c.stapel?c.stapel:[[c[0],c[1]]];}

/* platz = wie viel Hoehe die Spalte im Raster beansprucht. Normalerweise
   gleich der Flaschenzahl. Steht dort mehr, bleiben die Punkte so gross
   wie bei den Nachbarn und die Spalte sitzt versetzt in deren Luecken. */
function colPlatz(c){return c.platz||colSum(c);}
function gMasse(cols,breite){
  const n=cols.map(colPlatz),k=n.length;
  const frei=(breite==null?gBreite():breite)-(k-1)*GCOL;
  const rez=n.reduce((a,x)=>a+1/x,0);
  let H=(frei+k*GGAP)/rez-GGAP;
  if((H+GGAP)/Math.max.apply(null,n)-GGAP<26)H=(26+GGAP)*Math.max.apply(null,n)-GGAP;
  if((H+GGAP)/Math.min.apply(null,n)-GGAP>52)H=(52+GGAP)*Math.min.apply(null,n)-GGAP;
  return {H:Math.round(H)};

/* Jede Flasche traegt ihre Nummer. Die groesste sichtbare Zahl ist der Bestand -
   man liest ihn ab, statt Punkte zu zaehlen. Leere Plaetze bleiben stumm. */
/* Die Zahl ist eine Orientierung, kein Etikett - sie soll erst auffallen,
   wenn man sie sucht. */
const NUMMERN=true;
/* Die Punktgroesse steht in CSS und haengt an der Viewport-Breite.
   Frueher stand hier eine feste 30 \u2013 dadurch war die Ziffer auf
   einem 52px-Punkt genauso klein wie auf einem 26px-Punkt. */
function cssPx(name,fallback){
  const v=parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue(name));
  return v||fallback;
}
const GPT_S=()=>cssPx("--gpt-s",30);
const GRACK_S=()=>cssPx("--grack",30);
/* Die Ziffer soll eine Orientierung sein, kein Etikett — aber lesbar.
   Eine feste weiße Ziffer verschwindet auf Gold und Gelb, eine feste
   dunkle auf Cola und Ginger Beer. Deshalb wird pro Punkt die hellere
   oder dunklere Variante gewählt und die Deckkraft nur so weit
   angehoben, bis sie eben lesbar ist — nicht weiter. */
function relLum(c){
  const s=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*s[0]+0.7152*s[1]+0.0722*s[2];
}
const ZIEL=1.9;   /* Zurückhaltend: spürbar, aber nicht plakativ. */
function ziffernfarbe(bg){
  const Lb=relLum(bg),ink=Lb>0.32?[28,28,30]:[255,255,255];
  const stufen=[0.22,0.28,0.35,0.45,0.6];
  for(let n=0;n<stufen.length;n++){
    const a=stufen[n],mix=[0,1,2].map(i=>ink[i]*a+bg[i]*(1-a)),Lf=relLum(mix);
    const r=(Math.max(Lf,Lb)+0.05)/(Math.min(Lf,Lb)+0.05);
    if(r>=ZIEL)return "rgba("+ink.join(",")+","+a+")";

/* Die Farbe kommt als Argument, nicht aus dem style-Attribut: gPaint

   Punkt bekommt col=null \u2013 dann faellt die Inline-Farbe weg und
   .gpt.off greift. */
function ptGroesse(el){

function nummer(pt,rang,d,col){
  if(!NUMMERN||d<24){pt.textContent="";pt.style.removeProperty("color");return;}
  pt.textContent=rang;
  pt.style.font="400 "+Math.max(7,Math.round(d*0.22))+"px/1 inherit";
  const m=/^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(col||"");

function gStack(k,n,H,inv){

  for(let i=0;i<n;i++){const pt=document.createElement("div");
    /* inv: die Lade wird von hinten befüllt, die Lücke steht vorne oben. */

    pt.className="gpt"+(on?"":" off");
    pt.style.width=pt.style.height=d+"px";
    pt.style.background=on?col:"none";

/* ══════ P10 · Fotos der Fassungsliste ══════
   Bilder liegen in IndexedDB, niemals in localStorage \u2014 ein einziges
   Foto sprengt dessen Grenze. Beim Import auf 1600px lange Kante und
   JPEG 0.75 reduziert. */
const FDB="hh_fotos",FST="bilder";
function fdb(){return new Promise((res,rej)=>{
  const r=indexedDB.open(FDB,1);
  r.onupgradeneeded=()=>{const db=r.result;
    if(!db.objectStoreNames.contains(FST))db.createObjectStore(FST);};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function fput(k,b){return fdb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(FST,"readwrite");t.objectStore(FST).put(b,k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function fget(k){return fdb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(FST,"readonly"),q=t.objectStore(FST).get(k);
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);}));}
function fdel(k){return fdb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(FST,"readwrite");t.objectStore(FST).delete(k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function fkeys(){return fdb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(FST,"readonly"),q=t.objectStore(FST).getAllKeys();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);}));}
/* Einmal beim Start: Bilder ohne Vorgang wegraeumen. Fehler bleiben
   still \u2013 das darf den Start nicht aufhalten. */
function fclean(){
  try{
    const halten=new Set(),a=loadArch();
    Object.keys(a).forEach(k=>((a[k]||{}).fotos||[]).forEach(x=>halten.add(x.k)));
    Object.keys(S||{}).forEach(k=>((S[k]||{}).fotos||[]).forEach(x=>halten.add(x.k)));
    fkeys().then(ks=>ks.forEach(k=>{if(!halten.has(k))fdel(k).catch(()=>{});}))
      .catch(()=>{});
  }catch(e){}
}
function fshrink(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*s));
    c.height=Math.max(1,Math.round(img.height*s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("leer")),"image/jpeg",0.75);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Bild"));};
  img.src=url;});}
function fillFotos(root){
  (root||document).querySelectorAll("[data-foto] img").forEach(img=>{
    const k=img.closest("[data-foto]").dataset.foto;
    fget(k).then(b=>{if(b)img.src=URL.createObjectURL(b);}).catch(()=>{});});}
function docFotos(){
  const f=D().fotos||[];

    f.map(x=>'<figure class="foto foto--gross" data-foto="'+esc(x.k)+'"><img alt="Fassungsliste">'+
      '<figcaption>Aufgenommen '+esc(x.zeit)+'</figcaption></figure>').join("")+

function rFotos(m){

/* ── Dokument-Bausteine (Tabellen) ── */
function tbl(head,rows,tot){return `<table><thead><tr>${head}</tr></thead><tbody>${rows}${tot||""}</tbody></table>`;}
function docHeadHtml(){const d=D();
  return docUeber()+`<div class="dh"><div class="t">${MODES[mode].t}</div>
    <div class="m"><span>Datum <b>${deTag(d.tag)}</b></span><span>Von <b>${esc(d.name)||"—"}</b></span>
    ${d.notiz?`<span>Notiz <b>${esc(d.notiz)}</b></span>`:""}</div></div>`;}
function docTag(){
  const d=D();
  const bar=sum(d.barrot)+sum(d.bar)+sum(d.backup),rest=sum(d.rest);
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Restaurant</span><b>${rest}</b></div>
    <div><span>Bar</span><b>${bar}</b></div>
    <div><span>Keller</span><b>${rest+bar}</b></div>
    <div><span>Getränke</span><b>${gFehltSum()}</b></div></div>`;
  const hl=holList();
  if(hl.length){let t2="",lz=null;
    hl.forEach(it=>{const z=PLAN.zone[it.w.id];if(z!==lz){lz=z;t2+=`<tr><td class="grp" colspan="3">${PLAN.zonen[z].t}</td></tr>`;}
      t2+=`<tr><td><b>${esc(it.w.winzer)}</b> · ${esc(it.w.wein)}</td><td>${it.q.join(" · ")}</td><td class="r"><b>${it.n}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Aus dem Keller geholt</h3>
      ${tbl(`<th>Wein</th><th>Wohin</th><th class="r">Fl.</th>`,t2,`<tr class="tot"><td colspan="2">Summe</td><td class="r">${rest+bar}</td></tr>`)}</div>`;}
  const zu=WINES.filter(w=>g(d.zusatz,w.id));
  if(zu.length){let t3="";
    zu.sort(wegCmp).forEach(w=>{t3+=`<tr><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td>`+
      `<td class="r"><b>${g(d.zusatz,w.id)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Zusätzlich entnommen</h3>
      ${tbl(`<th>Wein</th><th class="r">Flaschen</th>`,t3,
        `<tr class="tot"><td>Summe</td><td class="r">${sum(d.zusatz)}</td></tr>`)}</div>`;}
  h+=docGetrMenge(d.gent);
  h+=docGetrZusatz(d.gzusatz);
  h+=docFotos();
  return h;
}
function docFuellen(){
  const d=D();
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Getränke fehlten</span><b>${gFehltSum()}</b></div>
    <div><span>Laden</span><b>${ALLE_LADEN().length}</b></div></div>`;
  h+=gDocSec();
  h+=docGetrZusatz(d.gzusatz);
  return h;
}
function docKeller(){
  const d=D(),gez=WINES.filter(w=>d.zdone[w.id]),off=WINES.filter(w=>!d.zdone[w.id]);
  const tot=gez.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Gezählt</span><b>${gez.length}</b></div>
    <div><span>Offen</span><b>${off.length}</b></div><div><span>Flaschen</span><b>${tot}</b></div></div>`;
  if(gez.length){let tr="",lz=null;
    gez.sort(wegCmp).forEach(w=>{const z=PLAN.zone[w.id];
      if(z!==lz){lz=z;tr+=`<tr><td class="grp" colspan="5">${PLAN.zonen[z].t}</td></tr>`;}
      const R=g(d.reihen,w.id),E=g(d.einzel,w.id);
      tr+=`<tr><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td><td>${esc(w.jg)}</td>
        <td class="r">${R||"–"}</td><td class="r">${E||"–"}</td><td class="r"><b>${R*6+E}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Gezählter Bestand</h3>
      ${tbl(`<th>Wein</th><th>Jg.</th><th class="r">Reihen</th><th class="r">Einz.</th><th class="r">Fl.</th>`,tr,
        `<tr class="tot"><td colspan="4">Summe</td><td class="r">${tot}</td></tr>`)}</div>`;}
  if(off.length)h+=`<div class="sec"><h3>Nicht gezählt (${off.length})</h3>
    <p style="font-size:14px;color:#6A6A70">${off.map(w=>esc(w.winzer)+" "+esc(w.wein)).join(" · ")}</p></div>`;

}
function docNach(){
  const d=D(),rows=WINES.filter(w=>g(d.ent,w.id));
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Positionen</span><b>${rows.length}</b></div><div><span>Flaschen</span><b>${sum(d.ent)}</b></div>${
    sum(d.gent)?`<div><span>Getränke</span><b>${sum(d.gent)}</b></div>`:""}</div>`;
  if(rows.length){let tr="",lz=null;
    rows.sort(wegCmp).forEach(w=>{const z=PLAN.zone[w.id];
      if(z!==lz){lz=z;tr+=`<tr><td class="grp" colspan="2">${PLAN.zonen[z].t}</td></tr>`;}
      tr+=`<tr><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td><td class="r"><b>${g(d.ent,w.id)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Aus dem Keller geholt</h3>
      ${tbl(`<th>Wein</th><th class="r">Flaschen</th>`,tr,`<tr class="tot"><td>Summe</td><td class="r">${sum(d.ent)}</td></tr>`)}</div>`;}
  h+=docGetrMenge(d.gent);
  return h;
}
function docWare(){
  const d=D(),pos=d.pos.filter(p=>p.id&&p.kisten>0);
  const best=pos.filter(p=>p.id!=="__neu"),neu=pos.filter(p=>p.id==="__neu");
  const fl=pos.reduce((a,p)=>a+p.kisten*kg(p),0);
  const chg=best.filter(p=>{const w=byId(p.id);const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg;return w&&j&&j!==w.jg;});
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Positionen</span><b>${pos.length}</b></div>
    <div><span>Kisten</span><b>${pos.reduce((a,p)=>a+ +p.kisten,0)}</b></div><div><span>Flaschen</span><b>${fl}</b></div>
    <div class="${chg.length?"w2":""}"><span>Jg. neu</span><b>${chg.length}</b></div>
    <div class="${neu.length?"w2":""}"><span>Neu</span><b>${neu.length}</b></div></div>`;
  if(best.length){let tr="";
    best.forEach(p=>{const w=byId(p.id);if(!w)return;const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg,ch=j&&j!==w.jg;
      tr+=`<tr class="${ch?"flag":""}"><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td>
        <td>${esc(w.jg)}</td><td>${esc(j)||"–"}</td><td class="r">${p.kisten} à ${kg(p)}</td><td class="r"><b>${p.kisten*kg(p)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Lieferung</h3>${tbl(`<th>Wein</th><th>Bisher</th><th>Neu</th><th class="r">Ki.</th><th class="r">Fl.</th>`,tr)}</div>`;}
  if(neu.length){let tr="";
    neu.forEach(p=>{const n=p.neu||{};
      tr+=`<tr><td><b>${esc(n.winzer)||"—"}</b> · ${esc(n.wein)||"—"}</td><td>${esc(n.f)||"?"} · ${esc(n.reb)||"?"}</td>
        <td>${esc(n.region)||"?"}</td><td>${esc(p.jg)||"?"}</td><td class="r"><b>${p.kisten*kg(p)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Neue Weine</h3>${tbl(`<th>Wein</th><th>Farbe/Rebsorte</th><th>Region</th><th>Jg.</th><th class="r">Fl.</th>`,tr)}
      <div class="box"><b>In den Master aufnehmen.</b></div></div>`;}
  h+=docGetrMenge(d.gent);
  h+=chg.length?`<div class="box"><b>${chg.length} Jahrgangswechsel.</b><br>Weinkarte prüfen.</div>`:`<div class="box good"><b>Keine Jahrgangsänderung.</b></div>`;
  return h;
}

/* ── Export: Titel, HTML-Seite, Teilen, Mail, CSV ── */
function protoTitel(){const d=D();return `Fassungsprotokoll ${MODES[mode].t} – ${kurzTag(d.tag)} – ${d.name||"—"}`;}
/* 2.5 · Klartext-Ergebnis in zwei Sätzen */
function resultText(){
  const d=D();
  if(mode==="fuellen"){const g2=gFehlt().filter(x=>!WEINLAGER.includes(x.id));
    const offen=g2.filter(x=>!(d.gholt||{})[x.id]).length;
    return [g2.reduce((a,x)=>a+x.n,0)+" Getränke nachzufüllen.",
      offen?offen+" Position"+(offen===1?"":"en")+" noch offen.":"Alles geholt und eingeräumt."];}
  if(mode==="tag"){const fl=sum(d.rest)+sum(d.barrot)+sum(d.bar)+sum(d.backup);
    const zu=sum(d.zusatz),n=(d.fotos||[]).length;
    return [fl+" Flaschen aus dem Keller geholt"+(zu?", dazu "+zu+" zusätzlich entnommen.":"."),
      n?(n===1?"Fassungsliste als Foto beigelegt.":n+" Fotos der Fassungsliste beigelegt."):
        "Kein Foto der Fassungsliste."];}
  if(mode==="keller"){const gez=WINES.filter(w=>d.zdone[w.id]).length;
    const tot=WINES.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);
    return [gez+" von "+WINES.length+" Positionen gezählt, "+tot+" Flaschen.",
      gez===WINES.length?"Vollständig gezählt.":(WINES.length-gez)+" Positionen fehlen noch."];}
  if(mode==="nach"){const n=WINES.filter(w=>g(d.ent,w.id)).length;
    return [sum(d.ent)+" Flaschen aus dem Keller geholt.",
      n+" Position"+(n===1?"":"en")+(sum(d.gent)?" · dazu "+sum(d.gent)+" Getränke.":".")];}
  const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
  const fl=pos.reduce((a,x)=>a+x.kisten*kg(x),0);
  const chg=pos.filter(x=>{const w=byId(x.id);const j2=d.jneu[x.id]!=null?d.jneu[x.id]:x.jg;return w&&j2&&j2!==w.jg;}).length;
  return [pos.length+" Positionen, "+fl+" Flaschen geliefert.",
    chg?chg+" Jahrgangswechsel.":"Keine Jahrgangsänderung."];
}
