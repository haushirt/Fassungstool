function openHtml(){
  const w=window.open("","_blank");
  if(!w){dl(protoTitel()+".html",fullHtml(),"text/html");toast("Als Datei gespeichert");return;}
  w.document.write(fullHtml());w.document.close();
}
/* P11 · Das Protokoll geht als Datei mit, nicht als Fliesstext im
   Mailkoerper. Fotos kommen in voller Groesse mit. */
async function protoDateien(){
  const d=D(),basis=mode+"_"+d.tag;
  const f=[];
  try{f.push(new File([fullHtml()],"protokoll_"+basis+".html",{type:"text/html"}));}
  catch(e){console.error("HTML-Protokoll",e);}
  try{f.push(new File(["\ufeff"+csvText()],"protokoll_"+basis+".csv",{type:"text/csv"}));}
  catch(e){console.error("CSV-Protokoll",e);}
  const fotos=d.fotos||[];
  for(let i=0;i<fotos.length;i++){
    try{const b=await fget(fotos[i].k);
      if(b)f.push(new File([b],"fassungsliste_"+d.tag+"_"+(i+1)+".jpg",{type:"image/jpeg"}));
    }catch(e){}
  }
  return f;
}
async function doSenden(){
  const title=protoTitel();
  let files=[];
  try{files=await protoDateien();}catch(e){}
  if(!files.length){toast("Protokoll konnte nicht erstellt werden");return;}
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({title,files});return;}
    catch(e){if(e.name==="AbortError")return;}
  }
  files.forEach(f=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(f);a.download=f.name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
  toast("Dateien gespeichert – bitte anhängen");
  const sub=encodeURIComponent(title);
  const body=encodeURIComponent("Das Protokoll liegt im Download-Ordner: "+
    files.map(f=>f.name).join(", ")+"\n\nBitte die Dateien hier anhängen.\n");
  setTimeout(()=>{location.href=`mailto:${MAIL}?subject=${sub}&body=${body}`;},600);
}
function expCsv(){
  dl(protoTitel()+".csv","\ufeff"+csvText(),"text/csv");toast("CSV gespeichert");
}
function csvText(){
  const d=D(),e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const L=[];
  if(d.uebersteuert)L.push(["OHNE BESTÄTIGUNG FREIGEGEBEN",d.uebersteuert.von,
    d.uebersteuert.offen.join(" · ")].map(e).join(";"));
  L.push([protoTitel()].map(e).join(";"),
    ["Datum",d.tag,"Von",d.name||"—","Notiz",d.notiz||"—"].map(e).join(";"),"");
  if(mode==="tag"){
    L.push(["Aus dem Keller"].map(e).join(";"),["Bereich","Winzer","Wein","Anzahl","Wohin"].map(e).join(";"));
    holList().forEach(x=>L.push([PLAN.zonen[PLAN.zone[x.w.id]].t,x.w.winzer,x.w.wein,x.n,x.q.join(" / ")].map(e).join(";")));
  }else if(mode==="keller"){
    L.push(["Bereich","Farbe","Winzer","Wein","Jahrgang","Reihen","Einzeln","Flaschen","Status"].map(e).join(";"));
    WINES.slice().sort(wegCmp).forEach(w=>{const R=g(d.reihen,w.id),E=g(d.einzel,w.id);
      L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.f,w.winzer,w.wein,w.jg,R,E,R*6+E,d.zdone[w.id]?"gezählt":"NICHT GEZÄHLT"].map(e).join(";"));});
  }else if(mode==="nach"){
    L.push(["Bereich","Winzer","Wein","Flaschen"].map(e).join(";"));
    WINES.filter(w=>g(d.ent,w.id)).sort(wegCmp)
      .forEach(w=>L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.winzer,w.wein,g(d.ent,w.id)].map(e).join(";")));
  }else if(mode==="fuellen"){
    /* Eigener Zweig \u2013 sonst greift der Wareneingang auf d.pos zu,
       das es in diesem Modus gar nicht gibt. */
    const gf2=gFehlt();
    L.push(["GETR\u00c4NKE NACHF\u00dcLLEN"].map(e).join(";"),
      ["Position","Soll","Ist","Fehlt"].map(e).join(";"));
    gf2.forEach(x=>L.push([GN(x.id),GSOLL[x.id],GSOLL[x.id]-x.n,x.n].map(e).join(";")));
    L.push(["Summe","","",gf2.reduce((a,x)=>a+x.n,0)].map(e).join(";"));
  }else{
    L.push(["Winzer","Wein","Jg. bisher","Jg. neu","Kisten","Kistengröße","Flaschen","Status"].map(e).join(";"));
    d.pos.filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0).forEach(p=>{const w=byId(p.id);if(!w)return;
      const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg;
      L.push([w.winzer,w.wein,w.jg,j,p.kisten,kg(p),p.kisten*kg(p),(j&&j!==w.jg)?"JG GEÄNDERT":"ok"].map(e).join(";"));});
    const neu=d.pos.filter(p=>p.id==="__neu"&&p.kisten>0);
    if(neu.length){L.push("",["Neue Weine"].map(e).join(";"),["Winzer","Wein","Rebsorte","Region","Farbe","Jg.","Kisten","Kistengröße","Fl."].map(e).join(";"));
      neu.forEach(p=>{const n=p.neu||{};L.push([n.winzer,n.wein,n.reb,n.region,n.f,p.jg,p.kisten,kg(p),p.kisten*kg(p)].map(e).join(";"));});}
  }
  const zu=WINES.filter(w=>g(d.zusatz||{},w.id));
  if(zu.length){L.push("",["ZUSÄTZLICH ENTNOMMEN"].map(e).join(";"),
    ["Bereich","Winzer","Wein","Flaschen"].map(e).join(";"));
    zu.sort(wegCmp).forEach(w=>L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.winzer,w.wein,
      g(d.zusatz,w.id)].map(e).join(";")));}
  const gi=Object.keys(d.gent||{}).filter(id=>+d.gent[id]>0);
  if(gi.length){L.push("",["GETRÄNKE"].map(e).join(";"),["Position","Anzahl"].map(e).join(";"));
    gi.forEach(id=>L.push([GN(id),d.gent[id]].map(e).join(";")));}
  const gf=(mode==="tag"||(mode==="keller"&&branch==="getr"))?gFehlt():[];
  if(gf.length){L.push("",["GETRÄNKE NACHFÜLLEN"].map(e).join(";"),["Position","Soll","Ist","Fehlt"].map(e).join(";"));
    gf.forEach(x=>L.push([GN(x.id),GSOLL[x.id],GSOLL[x.id]-x.n,x.n].map(e).join(";")));}
  return L.join("\r\n");
}

function dl(n,t,ty){const b=new Blob([t],{type:ty+";charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

  if((mode==="tag"||mode==="fuellen")&&step===0&&barIdx>0){
    barIdx--;render();window.scrollTo(0,0);return;}
  if(mode==="tag"&&step===1&&restIdx>0&&!$("#q").value.trim()){

/* 4.1 / 4.5 · echte Höhen statt fester Werte */
function measure(){
  const r=document.documentElement;
  const t=$("#topwrap");
  if(t)r.style.setProperty("--topH",Math.round(t.getBoundingClientRect().height)+"px");
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>measure());
  ["#topwrap"].forEach(s=>{const el=$(s);if(el)ro.observe(el);});
}
let rsz=null;
window.addEventListener("resize",()=>{measure();
  clearTimeout(rsz);rsz=setTimeout(()=>{if(document.querySelector(".drw"))render();},180);});

/* 2.3 · Offline-Hinweis, kein Blocker */
function netState(){document.body.classList.toggle("off",navigator.onLine===false);}
window.addEventListener("online",netState);window.addEventListener("offline",netState);
netState();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
