  if(best.length){let tr="";
    best.forEach(p=>{const w=byId(p.id);if(!w)return;const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg,ch=j&&j!==w.jg;
      tr+=`<tr class="${ch?"flag":""}"><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td>
        <td>${esc(w.jg)}</td><td>${esc(j)||"–"}</td><td class="r">${p.kisten} à ${kg(p)}</td><td class="r"><b>${p.kisten*kg(p)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Lieferung</h3>${tbl(`<th>Wein</th><th>Bisher</th><th>Neu</th><th class="r">Ki.</th><th class="r">Fl.</th>`,tr)}</div>`;}
  if(neu.length){let tr="";
    neu.forEach(p=>{const n=p.neu||{};
      tr+=`<tr><td><b>${esc(n.winzer)||"—"}</b> · ${esc(n.wein)||"—"}</td><td>${esc(n.f)||"?"} · ${esc(n.reb)||"?"}</td>
        <td>${esc(n.region)||"?"}</td><td>${esc(p.jg)||"?"}</td><td class="r"><b>${p.kisten*kg(p)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Neue Weine</h3>${tbl(`<th>Wein</th><th>Farbe/Rebsorte</th><th>Region</th><th>Jg.</th><th class="r">Fl.</th>`,tr)}
      <div class="box"><b>In den Master aufnehmen.</b></div></div>`;}
  h+=docGetrMenge(d.gent);
  h+=chg.length?`<div class="box"><b>${chg.length} Jahrgangswechsel.</b><br>Weinkarte prüfen.</div>`:`<div class="box good"><b>Keine Jahrgangsänderung.</b></div>`;
  return h;
}

/* ── Export: Titel, HTML-Seite, Teilen, Mail, CSV ── */
function protoTitel(){const d=D();return `Fassungsprotokoll ${MODES[mode].t} – ${kurzTag(d.tag)} – ${d.name||"—"}`;}
/* 2.5 · Klartext-Ergebnis in zwei Sätzen */
function resultText(){
  const d=D();
  if(mode==="fuellen"){const g2=gFehlt().filter(x=>!WEINLAGER.includes(x.id));
    const offen=g2.filter(x=>!(d.gholt||{})[x.id]).length;
    return [g2.reduce((a,x)=>a+x.n,0)+" Getränke nachzufüllen.",
      offen?offen+" Position"+(offen===1?"":"en")+" noch offen.":"Alles geholt und eingeräumt."];}
  if(mode==="tag"){const fl=sum(d.rest)+sum(d.barrot)+sum(d.bar)+sum(d.backup);
    const zu=sum(d.zusatz);
    /* `holt` fehlt in Vorgaengen aelterer Fassungen; resultText() laeuft
       auch ueber das Archiv. */
    const off=holList().filter(x=>!(d.holt||{})[x.w.id]).length;
    return [fl+" Flaschen aus dem Keller geholt"+(zu?", dazu "+zu+" zusätzlich entnommen.":"."),
      off?off+(off===1?" Wein ist noch nicht geholt.":" Weine sind noch nicht geholt.")
         :"Alles geholt und eingeräumt."];}
  if(mode==="keller"){const gez=WINES.filter(w=>d.zdone[w.id]).length;
    const tot=WINES.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);
    return [gez+" von "+WINES.length+" Positionen gezählt, "+tot+" Flaschen.",
      gez===WINES.length?"Vollständig gezählt.":(WINES.length-gez)+" Positionen fehlen noch."];}
  if(mode==="nach"){const n=WINES.filter(w=>g(d.ent,w.id)).length;
    return [sum(d.ent)+" Flaschen aus dem Keller geholt"+
              (d.grund?" · "+grundText(d.grund):"")+".",
      n+" Position"+(n===1?"":"en")+(sum(d.gent)?" · dazu "+sum(d.gent)+" Getränke.":".")];}
  const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
  const fl=pos.reduce((a,x)=>a+x.kisten*kg(x),0);
  const chg=pos.filter(x=>{const w=byId(x.id);const j2=d.jneu[x.id]!=null?d.jneu[x.id]:x.jg;return w&&j2&&j2!==w.jg;}).length;
  return [pos.length+" Positionen, "+fl+" Flaschen geliefert.",
    chg?chg+" Jahrgangswechsel.":"Keine Jahrgangsänderung."];
}

function openHtml(){

}
/* P11 · Das Protokoll geht als Datei mit, nicht als Fliesstext im
   Mailkoerper. Seit F4 (18.09.2026) haengt kein Foto der Fassungsliste
   mehr daran. */
async function protoDateien(){
  const d=D(),basis=mode+"_"+d.tag;
  const f=[];
  try{f.push(new File([fullHtml()],"protokoll_"+basis+".html",{type:"text/html"}));}
  catch(e){console.error("HTML-Protokoll",e);}
  try{f.push(new File(["\ufeff"+csvText()],"protokoll_"+basis+".csv",{type:"text/csv"}));}
  catch(e){console.error("CSV-Protokoll",e);}
  return f;
}
async function doSenden(){
  const title=protoTitel();
  let files=[];
  try{files=await protoDateien();}catch(e){}
  if(!files.length){toast("Protokoll konnte nicht erstellt werden");return;}
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({title,files});return;}
    catch(e){if(e.name==="AbortError")return;}
  }
  files.forEach(f=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(f);a.download=f.name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
  toast("Dateien gespeichert – bitte anhängen");
  const sub=encodeURIComponent(title);
  const body=encodeURIComponent("Das Protokoll liegt im Download-Ordner: "+
    files.map(f=>f.name).join(", ")+"\n\nBitte die Dateien hier anhängen.\n");
  setTimeout(()=>{location.href=`mailto:${MAIL}?subject=${sub}&body=${body}`;},600);
}
function expCsv(){

function csvText(){
  const d=D(),e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const L=[];
  if(d.uebersteuert)L.push(["OHNE BESTÄTIGUNG FREIGEGEBEN",d.uebersteuert.von,
    d.uebersteuert.offen.join(" · ")].map(e).join(";"));
  L.push([protoTitel()].map(e).join(";"),
    ["Datum",d.tag,"Von",d.name||"—","Notiz",d.notiz||"—"].map(e).join(";"),"");
  if(mode==="tag"){
    L.push(["Aus dem Keller"].map(e).join(";"),["Bereich","Winzer","Wein","Anzahl","Wohin"].map(e).join(";"));
    holList().forEach(x=>L.push([PLAN.zonen[PLAN.zone[x.w.id]].t,x.w.winzer,x.w.wein,x.n,x.q.join(" / ")].map(e).join(";")));
  }else if(mode==="keller"){
    L.push(["Bereich","Farbe","Winzer","Wein","Jahrgang","Reihen","Einzeln","Flaschen","Status"].map(e).join(";"));
    WINES.slice().sort(wegCmp).forEach(w=>{const R=g(d.reihen,w.id),E=g(d.einzel,w.id);
      L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.f,w.winzer,w.wein,w.jg,R,E,R*6+E,d.zdone[w.id]?"gezählt":"NICHT GEZÄHLT"].map(e).join(";"));});
  }else if(mode==="nach"){
    L.push(["Bereich","Winzer","Wein","Flaschen"].map(e).join(";"));
    WINES.filter(w=>g(d.ent,w.id)).sort(wegCmp)
      .forEach(w=>L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.winzer,w.wein,g(d.ent,w.id)].map(e).join(";")));
  }else if(mode==="fuellen"){
    /* Eigener Zweig \u2013 sonst greift der Wareneingang auf d.pos zu,
       das es in diesem Modus gar nicht gibt. */
    const gf2=gFehlt();
    L.push(["GETR\u00c4NKE NACHF\u00dcLLEN"].map(e).join(";"),
      ["Position","Soll","Ist","Fehlt"].map(e).join(";"));
    gf2.forEach(x=>L.push([GN(x.id),GSOLL[x.id],GSOLL[x.id]-x.n,x.n].map(e).join(";")));
    L.push(["Summe","","",gf2.reduce((a,x)=>a+x.n,0)].map(e).join(";"));
  }else{
    L.push(["Winzer","Wein","Jg. bisher","Jg. neu","Kisten","Kistengröße","Flaschen","Status"].map(e).join(";"));
    d.pos.filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0).forEach(p=>{const w=byId(p.id);if(!w)return;
      const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg;
      L.push([w.winzer,w.wein,w.jg,j,p.kisten,kg(p),p.kisten*kg(p),(j&&j!==w.jg)?"JG GEÄNDERT":"ok"].map(e).join(";"));});
    const neu=d.pos.filter(p=>p.id==="__neu"&&p.kisten>0);
    if(neu.length){L.push("",["Neue Weine"].map(e).join(";"),["Winzer","Wein","Rebsorte","Region","Farbe","Jg.","Kisten","Kistengröße","Fl."].map(e).join(";"));
      neu.forEach(p=>{const n=p.neu||{};L.push([n.winzer,n.wein,n.reb,n.region,n.f,p.jg,p.kisten,kg(p),p.kisten*kg(p)].map(e).join(";"));});}
  }
  const zu=WINES.filter(w=>g(d.zusatz||{},w.id));
  if(zu.length){L.push("",["ZUSÄTZLICH ENTNOMMEN"].map(e).join(";"),
    ["Bereich","Winzer","Wein","Flaschen"].map(e).join(";"));
    zu.sort(wegCmp).forEach(w=>L.push([PLAN.zonen[PLAN.zone[w.id]].t,w.winzer,w.wein,
      g(d.zusatz,w.id)].map(e).join(";")));}
  const gi=Object.keys(d.gent||{}).filter(id=>+d.gent[id]>0);
  if(gi.length){L.push("",["GETRÄNKE"].map(e).join(";"),["Position","Anzahl"].map(e).join(";"));
    gi.forEach(id=>L.push([GN(id),d.gent[id]].map(e).join(";")));}
  const gf=(mode==="tag"||(mode==="keller"&&branch==="getr"))?gFehlt():[];
  if(gf.length){L.push("",["GETRÄNKE NACHFÜLLEN"].map(e).join(";"),["Position","Soll","Ist","Fehlt"].map(e).join(";"));
    gf.forEach(x=>L.push([GN(x.id),GSOLL[x.id],GSOLL[x.id]-x.n,x.n].map(e).join(";")));}
  return L.join("\r\n");
}

/* 2.3 · Offline-Hinweis, kein Blocker. Die eigene Zeile ist entfallen —
/* F4 · Der Bildspeicher geht mit dem Schritt.
   `hh_fotos` lag als eigene IndexedDB auf jedem Geraet; ein einziges Foto
   sprengt den localStorage, deshalb war sie noetig. Ohne den Schritt
   schreibt niemand mehr hinein — liegen bliebe sie trotzdem, auf jedem
   iPhone, mit allen Bildern darin. Sie wird deshalb EINMAL geloescht und
   das Fach `fotos` aus den gespeicherten Vorgaengen und dem Archiv
   genommen. Was dabei verloren geht, steht im Morgenbrief: die Bilder, die
   an bereits archivierten Protokollen hingen. Sie sind unwiederbringlich.
   Fehler bleiben still — das darf den Start nicht aufhalten. */
const FOTO_WEG="hh_fotos_geloescht_v1";
function aufraeumenFotospeicher(){
  try{
    /* Nur schreiben, wenn wirklich etwas wegzunehmen ist — sonst legt
       jeder Start denselben Stand noch einmal in den Speicher. */
    let ge=false;
    Object.keys(S||{}).forEach(k=>{ if(S[k]&&S[k].fotos){ delete S[k].fotos; ge=true; } });
    if(ge)save();
    const a=loadArch();let ga=false;
    Object.keys(a).forEach(k=>{ if(a[k]&&a[k].fotos){ delete a[k].fotos; ga=true; } });
    if(ga)saveArch(a);
  }catch(e){}
  try{
    if(localStorage.getItem(FOTO_WEG))return;
    if(!(window.indexedDB&&indexedDB.deleteDatabase)){
      /* Kein indexedDB (privates Fenster, gesperrter Speicher): die Marke
         bleibt weg, damit es der naechste Start noch einmal versucht. */
      return;
    }
    /* Die Marke erst setzen, wenn das Loeschen wirklich durch ist. Stand
       sie davor und das Loeschen scheiterte, bliebe die Datenbank fuer
       immer liegen und niemand versuchte es noch einmal. */
    const q=indexedDB.deleteDatabase("hh_fotos");
    const fertig=()=>{try{localStorage.setItem(FOTO_WEG,"1");}catch(e){}};
    q.onsuccess=fertig;
    /* „blocked" heisst: ein anderer Tab haelt die Datenbank offen. Dann
       beim naechsten Start noch einmal — keine Marke. */
    q.onerror=()=>{};
    q.onblocked=()=>{};
  }catch(e){}
}
