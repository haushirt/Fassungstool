<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#004947">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fassung">
<style>
/* ═══════════════════════════════════════════════════════════════════
   ACHTUNG · geteilte Gestaltungsschicht
   Dieser Block steht wortgleich in index.html und leitung.html.
   Wird hier etwas geändert, muss es in der anderen Datei genauso
   geändert werden — sonst laufen die beiden Oberflächen auseinander.
   Stand: v12 · 15.09.2026
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   Fassungstool · tokens.css
   Haus Hirt, Bad Gastein

   Eine Quelle für beide Oberflächen: index.html (Fassung, Finger) und
   leitung.html (Backoffice, Maus). Wer hier etwas ändert, ändert es an
   beiden Stellen — das ist der ganze Zweck der Datei.

   NICHT als Datei einbinden. tokens.css gab es kurz als eigene Datei;
   ohne Bauschritt muss sie von Hand mitgeliefert werden, und fehlt sie,
   steht die Seite nackt da. Der Block gehört deshalb in jede Seite
   hinein — wortgleich, siehe Kasten oben.

   Dichte: leitung.html setzt am <html> data-dichte="maus".
   ═══════════════════════════════════════════════════════════════════ */

/* ── Schriften ──────────────────────────────────────────────────────
   Barlow steht für Interstate, Cormorant Garamond für Mrs Eaves.
   Die Dateien liegen unter /fonts/. Fehlen sie, greift der Systemstack
   und nichts bricht — es sieht nur aus wie vorher.
   WICHTIG: die vier Dateien müssen in die Cache-Liste des Service
   Workers, sonst ist die App offline ohne Schrift.                     */
@font-face{font-family:"Barlow";src:url("/fonts/barlow-500.woff2") format("woff2");
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow";src:url("/fonts/barlow-600.woff2") format("woff2");
  font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Barlow";src:url("/fonts/barlow-700.woff2") format("woff2");
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url("/fonts/cormorant-600.woff2") format("woff2");
  font-weight:600;font-style:normal;font-display:swap}

:root{
  --marke:#462500;   /* Hauszeichen, Dunkelbraun */
  /* ── Flächen und Rahmen ── Haus-Hirt-Cream als Grund, Weiß als Inhalt */
  --bg:#ECE9E2;
  --surface:#FFFFFF;
  --surface-2:#F4F2EC;
  --surface-3:#EFEDE6;
  --surface-4:#E5E2D9;
  --border:#DDD9D0;
  --border-strong:#CBC6BA;
  --border-heavy:#B5AFA1;

  /* ── Text ── */
  --fg:#1C2220;
  --fg-secondary:#4E5654;
  --fg-muted:#5F6866;
  --fg-subtle:#5F6866;

  /* ── Text auf dunklen Leisten ── */
  --fg-on-dark:#FFFFFF;
  --fg-on-dark-2:#BFD0CE;
  --fg-on-dark-3:#9DB2AF;
  --surface-on-dark:rgba(255,255,255,.12);
  --surface-on-dark-2:rgba(255,255,255,.07);
  --border-on-dark:rgba(255,255,255,.16);

  /* ── Marke, Status ── */
  --accent:#004947;           /* Haus-Hirt-Teal */
  --accent-dunkel:#00605D;    /* gedrückter Zustand */
  --accent-tint:#E4EDEC;
  --accent-ring:rgba(0,73,71,.10);
  --danger:#B4471F;  --danger-bg:#FBEDE6;  --danger-fg:#7A3A12;
  --danger-border:#E7C3B2;  --danger-surface:#FDF9F6;
  --danger-ring:rgba(180,71,31,.10);
  --success:#3E7A3E;  --success-bg:#EFF5EE;  --success-fg:#2F5E2F;
  --success-border:#CFE0CC;  --success-tint:#DCEBD8;  --success-on-dark:#8FBF8F;
  --warn:#E0B200;  --warn-bg:#FDF3D0;  --warn-fg:#6B4E00;  --warn-border:#E6D6B4;
  --info:#004947;  --info-bg:#E4EDEC;  --info-border:#C5D8D6;
  --diff-minus:#3A5266;       /* Richtung, nicht Hinweis */

  /* Zielorte im Holen-Schritt */
  --tag-bar-bg:#F3E7D9;  --tag-bar-fg:#7A5426;
  --tag-back-bg:#EDE7F0; --tag-back-fg:#5A4A6A;

  /* ── Raum, 4px-Basis ── */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

  /* ── Radien ── */
  --radius-xs:2px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --radius-pill:999px; --radius-ctl:8px;
  --track-caps:.08em;

  /* ── Typografie ── */
  --font:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Im Keller wird nichts unter 15px gelesen — Kunstlicht, kalte Finger,
     Flasche in der anderen Hand. Die beiden kleinen Grade sind deshalb
     für den FINGER auf 15px gehoben; die Rangfolge macht dort Gewicht,
     Farbe und Laufweite, nicht mehr die Größe. Am Schreibtisch
     (data-dichte="maus") gelten weiter 11/13px — dort zählt Dichte, und
     die Leitung sitzt vor einem MacBook, nicht im Keller. */
  --text-xs:15px; --text-sm:15px; --text-md:15px; --text-base:16px;
  --text-lg:19px; --text-display:28px;
  --leading-tight:1.25; --leading-normal:1.45;
  --weight-regular:400; --weight-medium:600; --weight-bold:700;

  /* ── Bedienelemente · Finger ── */
  --tap-min:44px; --control-h-sm:36px; --control-h:44px; --control-h-lg:52px;

  /* ── Fokus und Bewegung ── */
  --ring:#004947; --ring-width:2px; --ring-offset:2px;
  --dur-fast:120ms; --dur:180ms; --ease:cubic-bezier(.2,0,0,1);

  /* ── Schichten ── */
  --z-rail:35; --z-top:40; --z-overlay:80; --z-toast:90;
  --shadow-overlay:0 4px 16px rgba(28,34,32,.25);

  /* ── Layout ── */
  --foot:0px; --rail:36px; --maxw:720px; --topH:92px;

  /* ── Getränke: Trefferflächen skalieren mit der Viewport-Breite ── */
  --gd:clamp(26px,7vw,42px);
  --gpt-s:clamp(26px,7.5vw,40px);
  --gcell:clamp(40px,11vw,64px);
  --grack:clamp(30px,9vw,52px);
  --gnum-on-dot:rgba(255,255,255,.5)
}

/* Maus statt Finger: dieselben Bauteile, engere Geometrie. */
[data-dichte="maus"]{
  --control-h:36px; --control-h-sm:28px; --control-h-lg:40px; --radius-ctl:6px;
  --text-xs:11px; --text-sm:13px
}
/* Auf schmalen Schirmen zählt wieder der Finger — auch im Backoffice. */
@media(max-width:900px){
  [data-dichte="maus"]{
    --control-h:44px; --control-h-sm:36px; --control-h-lg:52px; --radius-ctl:8px
  }
}

/* ═══════════════ Knopf ═══════════════
   Drei Stufen, klar getrennt: gefüllt trägt die Hauptsache, gerahmt die
   Nebensache, Text die Ausweichmöglichkeit. Wer alles rahmt, hat keine
   Hierarchie, nur Kästchen. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  min-height:var(--control-h);padding:0 var(--space-4);
  font:var(--weight-medium) var(--text-md)/1.2 var(--font);
  border:1px solid var(--border-strong);border-radius:var(--radius-ctl);
  background:var(--surface);color:var(--fg);text-align:center;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),
             color var(--dur-fast) var(--ease)}
.btn--stark{background:var(--accent);border-color:var(--accent);color:var(--fg-on-dark)}
.btn--leise{background:none;border-color:transparent;color:var(--fg-muted);
  font-weight:var(--weight-regular)}
.btn--klein{min-height:var(--control-h-sm);padding:0 var(--space-3);font-size:var(--text-sm)}
.btn--breit{width:100%}
.btn--gross{min-height:var(--control-h-lg);font-size:var(--text-base);width:100%}
.btn--gefahr{color:var(--danger)}
.btn:active{background:var(--surface-3)}
.btn--stark:active{background:var(--accent-dunkel);border-color:var(--accent-dunkel)}
.btn--leise:active{background:var(--surface-3);color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:default}
@media(hover:hover) and (pointer:fine){
  .btn:hover{background:var(--surface-2)}
  .btn--stark:hover{background:var(--accent-dunkel);border-color:var(--accent-dunkel)}
  .btn--leise:hover{background:var(--surface-3);color:var(--fg)}}

/* ═══════════════ Eingabe ═══════════════
   16px Grundgröße verhindert das Auto-Zoomen von iOS Safari. */
.feld,.wahl{width:100%;min-height:var(--control-h);
  padding:var(--space-2) var(--space-3);
  font:var(--weight-regular) var(--text-base)/1.3 var(--font);
  border:1px solid var(--border-strong);border-radius:var(--radius-ctl);
  background:var(--surface);color:var(--fg)}
.wahl{appearance:none;-webkit-appearance:none;padding-right:var(--space-8);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F6866' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px 16px}

/* ═══════════════ Karte, Hinweis, Pille ═══════════════
   Kanon aus der Leitung — die Fassungsseite zieht nach. */
.karte{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-5)}

.hinweis{border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  font-size:var(--text-md);line-height:var(--leading-normal);
  background:var(--info-bg);border:1px solid var(--info-border);color:var(--info)}
.hinweis.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-fg)}
.hinweis.bad{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-fg)}
.hinweis.good{background:var(--success-bg);border-color:var(--success-border);color:var(--success-fg)}
.hinweis b{font-weight:var(--weight-medium)}

/* Inhaltsspalten, die erklären — nicht Beiwerk. 11px war zu klein. */
.deutung{font-size:var(--text-sm);color:var(--fg-secondary);line-height:var(--leading-normal)}
.neg{color:var(--danger-fg);font-weight:var(--weight-bold)}

/* ═══════════════ Fokus ═══════════════ */
:where(button,input,select,textarea,a,[tabindex]):focus-visible{
  outline:var(--ring-width) solid var(--ring);
  outline-offset:var(--ring-offset);position:relative;z-index:1}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══════════════ Hauszeichen ═══════════════
   Der Hirte mit dem Hund. Nimmt currentColor an, skaliert verlustfrei,
   braucht keine Datei. In dunklen Leisten wird es über die Höhe
   bemessen — sonst sprengt ein breites Zeichen die 56px-Zeile. */
.marke{display:block;margin:0 0 var(--space-2);line-height:0}
.marke svg{display:block;width:100%;max-width:200px;height:auto;color:var(--marke)}
.marke--klein svg{max-width:180px}
.kopf .marke,header .marke{margin:0}
.kopf .marke svg,header .marke svg{
  color:var(--fg-on-dark);width:auto;height:24px;max-width:none}
.tuer .marke{margin:0 auto var(--space-3)}
.tuer .marke svg{max-width:220px;margin:0 auto}
/* Für Bildschirmlesegeräte bleibt der Name stehen, sichtbar ist er nicht. */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap}

</style>
<title>Fassungstool – Haus Hirt</title>
<style>

/* ═══════════════ Basis ═══════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);
  font:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{font-weight:var(--weight-medium)}
header :focus-visible,.foot :focus-visible{outline-color:var(--fg-on-dark)}


/* ═══════════════ Button-System ═══════════════
   Basis über die bestehenden Klassennamen, damit die imperative
   DOM-Erzeugung im JS unangetastet bleibt. */
.finishbtn,.recheck,.fullbtn,.addbtn,.prueft,
.exprow .primary,.exprow .secondary,
.card2 .row button,.drwb button,.navrow .b{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  min-height:var(--control-h);padding:0 var(--space-4);
  font:var(--weight-medium) var(--text-md)/1.2 var(--font);
  border:1px solid transparent;border-radius:var(--radius-md);
  background:none;color:var(--fg);text-align:center;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),
             color var(--dur-fast) var(--ease)}

/* sekundär */
.recheck,.fullbtn,.addbtn,.prueft,.card2 .row button,
.drwb button,.exprow .secondary{
  background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
/* Dritte Stufe: Ausweichmoeglichkeit, kein Rahmen. Vorher sah
   „Ueberspringen“ genauso aus wie „Zurueck“. */
.recheck{background:none;border-color:transparent;color:var(--fg-muted);
  font-weight:var(--weight-regular)}
.recheck:active{background:var(--surface-3)}
.navrow .b.leise{background:none;border-color:transparent;color:var(--fg-muted);
  font-weight:var(--weight-regular)}
.addbtn{border-style:dashed;color:var(--fg-muted)}
.recheck:active,.fullbtn:active,.addbtn:active,.prueft:active,
.card2 .row button:active,.drwb button:active,.exprow .secondary:active{
  background:var(--surface-3)}

/* primär */
.finishbtn,.exprow .primary,.card2 .row .ok,.prueft.weiter,.drwb button.weiter{
  background:var(--accent);color:var(--fg-on-dark);border-color:var(--accent)}
.finishbtn:active,.exprow .primary:active,.card2 .row .ok:active,
.prueft.weiter:active,.drwb button.weiter:active{
  background:var(--accent-dunkel);border-color:var(--accent-dunkel)}

/* erledigt */
.fullbtn.done,.prueft.on,.prueft.weiter.on,.drwb button.weiter.ok{
  background:var(--success-bg);border-color:var(--success);color:var(--success-fg)}

/* Blockiert: bewusst KEIN disabled/aria-disabled — der Knopf bleibt für alle
   bedienbar und beantwortet beim Antippen, warum es noch nicht weitergeht.
   Der Grund steht zusätzlich als Kasten darüber. */
/* Bleibt bedienbar und nennt beim Antippen den Grund — sieht aber nicht
   mehr aus wie ein ausgegrauter Knopf ohne Funktion. */
.finishbtn.blocked{
  background:var(--surface);color:var(--fg);border-color:var(--border-heavy)}
.finishbtn.blocked:active{background:var(--border-strong)}

/* Blockbreite */
.finishbtn,.prueft,.fullbtn,.addbtn,.recheck{width:100%}
.prueft{flex-direction:column;gap:1px;padding-top:var(--space-2);
  padding-bottom:var(--space-2)}
.prueft .pl{font-size:var(--text-md);font-weight:var(--weight-medium)}
.prueft .ps{font-size:var(--text-xs);font-weight:var(--weight-regular);
  color:var(--fg-muted)}
.prueft.weiter .ps{color:var(--fg-on-dark-2)}
.prueft.on .ps{color:var(--success-fg)}
.finishbtn{min-height:var(--control-h-lg);font-size:var(--text-base);
  margin-top:var(--space-6)}
.recheck{margin-top:var(--space-3)}
.fullbtn{margin-top:var(--space-2)}
.addbtn{margin-top:var(--space-4)}

/* Textknöpfe */
/* Unterstrichene Textlinks sahen aus wie rohes HTML. Gleiche Form wie die
   dritte Knopfstufe im Rest der App. */
.adminlink,.explesser button,.wechseln{
  background:none;border:0;color:var(--fg-muted);font-size:var(--text-sm);
  cursor:pointer;text-decoration:none;min-height:var(--tap-min);
  padding:0 var(--space-4);border-radius:var(--radius-md)}
.adminlink:active,.explesser button:active,.wechseln:active{background:var(--surface-3)}
/* „Backoffice" ist seit F5 ein echter Link (<a>), kein Knopf: er fuehrt
   auf eine andere Seite, und ein Link laesst sich halten, teilen und in
   einem neuen Tab oeffnen. Die Form bleibt die der dritten Knopfstufe;
   die Trefferflaeche haengt an min-height (44 px) und braucht dafuer
   display:flex statt block — ein Inline-Element nimmt keine Hoehe an. */
.adminlink{display:flex;align-items:center;justify-content:center;
  margin:var(--space-7) auto 0;width:fit-content}
.explesser button.del{color:var(--danger)}

/* ═══════════════ Eingabefelder ═══════════════
   16px verhindert das Auto-Zoomen von iOS Safari. */
#q,.fld input,.fld select,label.f input,.zf,.input{
  width:100%;min-height:var(--control-h);
  padding:var(--space-2) var(--space-3);
  font:var(--weight-regular) var(--text-base)/1.3 var(--font);
  border:1px solid var(--border-strong);border-radius:var(--radius-md);
  background:var(--surface);color:var(--fg)}
.zf,.zin,.input--pin{text-align:center;font-weight:var(--weight-bold);
  font-variant-numeric:tabular-nums}
.zf{width:48px;min-width:48px;padding:0}
/* text-indent gleicht den Sperrabstand hinter dem letzten Zeichen aus,
   sonst sitzt der Block sichtbar zu weit rechts. */
.input--pin{font-size:var(--text-lg);letter-spacing:.4em;text-indent:.4em;
  min-height:var(--control-h-lg)}

/* ═══════════════ Tabellenziffern ═══════════════ */
.cnt,.zval,.zsum,.zsumbig,.qty,.kpi b,.fh .big,.fi .v,.done-cta .big,
.kisteninfo b,.miss-n,.hd1 .cnt2,.stath i,.statb,.pos,
.gq,.gnum,.fachn,.rhd i,td.r,th.r{font-variant-numeric:tabular-nums}

/* ═══════════════ Menü ═══════════════ */
/* Runde 14 · Die Startseite traegt denselben Kopf wie ein Vorgang:
   Hausfarbe von Rand zu Rand, Titel, Datum darunter, rechts der Ausgang.
   Vorher stand „Haus Hirt" als dunkler Text im hellen Grund und ging
   zwischen den Kacheln unter. Das Polster gegen die iOS-Statusleiste
   sitzt jetzt im Kopf (F6), nicht mehr an der Seite. */
.menu{padding:0;max-width:none;margin:0}
.mkopf{background:var(--accent);color:var(--fg-on-dark);
  padding:max(12px,env(safe-area-inset-top)) var(--space-4) var(--space-4)}
.mkopf .hd{max-width:var(--maxw);margin:0 auto}
.mkopf h1{margin:0;font:var(--weight-medium) var(--text-lg)/1.15 var(--font-display);
  letter-spacing:.01em}
.minhalt{padding:var(--space-5) var(--space-4) var(--space-8);
  max-width:var(--maxw);margin:0 auto}
.mgrp{font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--fg-subtle);
  margin:var(--space-6) 0 var(--space-3);display:flex;align-items:center;gap:var(--space-3)}
.mgrp:first-of-type{margin-top:var(--space-1)}
.mgrp::after{content:"";flex:1;height:1px;background:currentColor;opacity:.28}
/* Runde 14 · Drei Gruppen, drei Töne.
   Service ist das Tagesgeschäft und trägt das Haus-Teal; die Gruppe der
   Sonderentnahme ist die Ausnahme und trägt den Warnton; „Bestand" ist
   Buchhaltung und bleibt sachlich grau. Der Ton sitzt an der Überschrift,
   am Trennstrich und ganz schwach hinter den Kacheln der Gruppe — genug, um die drei
   Blöcke im Vorbeigehen zu trennen, zu wenig, um bunt zu sein.
   Die Kacheln behalten Form, Schrift und Symbol; nur der Grund wechselt. */
/* „Ausser der Reihe" ist als Ueberschrift entfallen — „Sonderentnahme"
   sagt es selbst. Der Ton bleibt, damit die Kachel sich weiter von den
   Bloecken darueber und darunter abhebt. */
.grp--ausser{margin:var(--space-6) 0}
.grp{--ton:var(--fg-subtle); --tonbg:var(--surface)}
.grp .mgrp{color:var(--ton)}
.grp .mi{background:var(--tonbg)}
.grp--service{--ton:var(--accent); --tonbg:var(--accent-tint)}
.grp--ausser{--ton:var(--warn-fg); --tonbg:var(--warn-bg)}
.grp--bestand{--ton:var(--fg-subtle); --tonbg:var(--surface)}
/* Ein angefangener Vorgang bleibt rot, in jeder Gruppe — er ist der
   einzige Zustand, der die Gruppenfarbe schlagen darf. */
.grp .mi.run{background:var(--danger-surface)}
.mi{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--space-4);margin-bottom:var(--space-3);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease),
             background var(--dur-fast) var(--ease)}
.mi:active{transform:scale(.99);background:var(--surface-3)}
.mi .ic{width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-lg);
  background:var(--surface-3);flex-shrink:0;display:grid;place-items:center;color:var(--fg)}
.mi .ic svg{width:20px;height:20px}
.mi .txt{flex:1;min-width:0}
.mi b{display:block;font-size:var(--text-base);margin-bottom:var(--space-1);
  font-weight:var(--weight-medium)}
.mi span{display:block;font-size:var(--text-sm);color:var(--fg-muted);
  line-height:var(--leading-normal)}
.mi .when{display:inline-flex;align-items:center;gap:var(--space-1);
  margin-top:var(--space-2);font-size:var(--text-xs);color:var(--danger);
  font-weight:var(--weight-medium)}
.mi.run{border-color:var(--danger-border);background:var(--danger-surface)}
.mi.run .ic{background:var(--danger-bg);color:var(--danger)}
/* › als Textzeichen sass zu hoch und passte in der Strichstaerke nicht
   zu den 1,5px-Symbolen daneben. Gleiche Form, jetzt als Grafik. */
.mi .go,.gbtn .go2,.hwh .car2,.secarrow,.w .go,.offenz .go{
  font-size:0;width:16px;height:16px;flex-shrink:0;display:inline-block;
  background:currentColor;color:var(--fg-subtle);
  -webkit-mask:var(--chev) no-repeat center/16px 16px;
  mask:var(--chev) no-repeat center/16px 16px}
:root{--chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>")}

/* ═══════════════ Kopf ═══════════════ */
.topwrap{position:sticky;top:0;z-index:var(--z-top)}
/* F6 (18.09.2026): Der Kopf lag unter Uhrzeit, Mobilfunk-, WLAN- und
   Batteriesymbol. Die Seite laeuft als Web-App mit
   `apple-mobile-web-app-status-bar-style=black-translucent`: die
   Statusleiste liegt dann UEBER dem Inhalt, und ohne Polster steht der
   Titel darunter. `viewport-fit=cover` im meta-Tag ist die Bedingung
   dafuer, dass env() ueberhaupt eine Zahl liefert — ohne das ist es 0.
   Auf einem Schirm ohne Notch bleibt es bei 12 px. */
header{background:var(--accent);color:var(--fg-on-dark);
  padding:max(12px,env(safe-area-inset-top)) var(--space-4) 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.hd h1{margin:0;font:var(--weight-medium) var(--text-lg)/1.15 var(--font-display);
  letter-spacing:.01em}
.hd .subh{font-size:var(--text-xs);color:var(--fg-on-dark-3);margin-top:2px}
.hdr-r{display:flex;gap:var(--space-2);align-items:center}
.home{background:var(--surface-on-dark);border:0;color:var(--fg-on-dark);
  min-height:var(--control-h-sm);padding:0 var(--space-3);border-radius:var(--radius-md);
  font-size:var(--text-sm);cursor:pointer;
  transition:background var(--dur-fast) var(--ease)}
/* „Menü" und „?" sind 36px hoch — die beiden meistgedrückten Knöpfe der
   App lagen damit unter den 44px, die für den Daumen gelten. Die Optik
   bleibt, die Trefferfläche wächst auf --tap-min.
   Berichtigt (Runde 2, im Browser nachgemessen): „36 + 2×4 = 44" stimmte
   nur für „Menü". Ein absolut gesetztes ::after rechnet gegen die
   POLSTERkante seines Bezugsrahmens — bei „?" mit 1px Rahmen kamen
   dadurch nur 42px heraus. Jetzt steht die Größe direkt da, statt sie
   aus Rahmenbreiten zu erschließen. Waagrecht bleibt die Fläche dabei
   höchstens so breit wie der Knopf selbst, sonst stöße sie in den
   Nachbarn (Abstand der beiden: 8px). */
.home,.hilfebtn{position:relative}
.home::after,.hilfebtn::after{content:"";position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,var(--tap-min));height:max(100%,var(--tap-min))}
#dSel{background:var(--surface-on-dark);border:0;color:var(--fg-on-dark);
  min-height:var(--control-h-sm);padding:0 var(--space-2);border-radius:var(--radius-md);
  font-size:var(--text-sm)}
/* Fortschritt statt Reiter: vier Reiter passen bei 390px nicht nebeneinander
   und wurden rechts abgeschnitten. Punkte skalieren, Text sagt wo man ist. */
.steps{display:flex;align-items:center;gap:var(--space-3);
  margin-top:var(--space-2);height:36px}
/* Bis v27 lagen die Punkte 6px auseinander; die Trefferflaeche war
   24x44 und die der Nachbarn lag darin — wer im Keller Schritt 3 wollte,
   traf Schritt 2. Jetzt steht jeder Punkt in einer eigenen Zelle
   (Rand 18px links und rechts, Abstand 0). Die Linie dahinter haelt die
   Punkte optisch zusammen und zeigt den Weg durch die Schritte. */
.stpts{display:flex;gap:0;flex-shrink:0;position:relative}
.stpts::before{content:"";position:absolute;left:23px;right:23px;top:50%;
  height:2px;margin-top:-1px;border-radius:1px;
  background:var(--border-on-dark)}
.st{width:10px;height:10px;padding:0;border:0;border-radius:50%;margin:0 18px;
  background:var(--surface-on-dark);cursor:pointer;flex-shrink:0;
  transition:background var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.st.done{background:var(--success-on-dark)}
.st[aria-selected="true"]{background:var(--fg-on-dark);
  box-shadow:0 0 0 3px var(--border-on-dark)}
/* Trefferflaeche 46x46, der Punkt bleibt klein. Warum 46 und nicht 44:
   Die Zellen stossen aneinander. Bei genau 44 liegt der Rand des einen
   Griffs auf dem Rand des naechsten, und ein Druck genau auf die Naht
   gehoert rechnerisch beiden — ein Pixel Luft macht die Zuordnung
   eindeutig, auch fuer die Messung. */
.stpts .st{position:relative;z-index:1}
.stpts .st::after{content:"";position:absolute;inset:-18px}
.stlbl{font-size:var(--text-sm);font-weight:var(--weight-medium);
  color:var(--fg-on-dark-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══════════════ Anleitung ═══════════════ */
.howto{background:var(--surface-3);border-bottom:1px solid var(--border)}
.hwh{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:none;border:0;padding:var(--space-2) var(--space-4);cursor:pointer;
  font:inherit;color:inherit;min-height:var(--tap-min)}
.hwh b{flex:1;display:block;font-size:var(--text-sm);
  font-weight:var(--weight-regular);line-height:var(--leading-tight);color:var(--fg-muted)}
.howto.open .hwh b{font-size:var(--text-md);font-weight:var(--weight-medium);color:var(--fg)}
.ibadge{font-size:var(--text-xs);font-weight:var(--weight-medium);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--fg-subtle);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:2px var(--space-1);flex-shrink:0;line-height:1.2}
.howto.open .ibadge{color:var(--fg);border-color:var(--fg)}
.hwh .car2{color:var(--fg-muted);font-size:var(--text-sm);
  transition:transform var(--dur) var(--ease);flex-shrink:0}
.howto.open .hwh .car2{transform:rotate(90deg)}
.hwb{display:none;padding:0 var(--space-4) var(--space-3)}
.howto.open .hwb{display:block}
.hwb p{margin:0;font-size:var(--text-sm);color:var(--fg-muted);line-height:var(--leading-normal)}
.hwb .tip{margin-top:var(--space-2);font-size:var(--text-sm);color:var(--accent)}

.tools{padding:var(--space-3) var(--space-4);position:static;background:var(--bg);
  border-bottom:1px solid var(--border)}
/* Zweite Ebene: was der Schritt verlangt, steht oben. Wie man es
   bedient, steht hier \u2013 gleich in jedem Modus, damit man es an
   einer Stelle sucht und nicht in jedem Schritttext neu liest. */
.bedien{background:var(--bg)}
.bedien .hwh b{color:var(--fg-subtle)}
.bedien .ibadge{border-style:dashed}
.bedien .hwb dl{margin:0;font-size:var(--text-sm);line-height:var(--leading-normal)}
.bedien .hwb dt{font-weight:var(--weight-medium);color:var(--fg);margin-top:var(--space-3)}
.bedien .hwb dt:first-child{margin-top:0}
.bedien .hwb dd{margin:0;color:var(--fg-muted)}

main{padding:0 var(--space-4) var(--space-8);position:relative}
/* Traegt der Inhalt selbst schon eine Zurueck/Weiter-Leiste mit eigenem
   Rand nach unten, braucht <main> kein zweites Polster von 40 px. */
main:has(.navrow){padding-bottom:var(--space-3)}
main.hasrail{padding-right:calc(var(--rail) + var(--space-5))}

/* ═══════════════ Sprungleiste ═══════════════ */
.rail{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:var(--z-rail);
  display:flex;flex-direction:column;gap:2px}
/* Bei 320 px ragte die 44-px-Flaeche des Knopfes (36 px breit, 2 px vom
   Rand) rechts aus dem Fenster: der Daumen findet dort nichts mehr, weil
   dort kein Schirm mehr ist. Sechs Pixel Abstand holen sie ganz herein. */
@media (max-width:360px){ .rail{right:6px} }
/* Gedreht und auf 40px beschnitten wurde aus „Bubbles“ ein „Bubb“.
   Zwei Buchstaben, waagrecht, passen immer. */
.rail button{width:36px;min-height:var(--tap-min);padding:var(--space-2) 0;
  border-radius:var(--radius-md);border:1px solid var(--border);
  background:rgba(255,255,255,.94);color:var(--fg-muted);font-size:var(--text-xs);
  font-weight:var(--weight-bold);letter-spacing:.04em;cursor:pointer;
  display:grid;place-items:center;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
/* NEU GEMESSEN (Jagd 13): 36 px breit, also unter den 44 px des Hauses.
   Dieselbe Loesung wie bei „Menue" und „?" im Kopf: der Knopf bleibt
   gezeichnet wie er ist, seine Flaeche waechst in einem ::after. Die
   Leiste steht am rechten Rand; die zwei Pixel, die die Flaeche links
   uebersteht, liegen ueber der Seite, nicht ueber einem Nachbarn. */
.rail button{position:relative}
.rail button::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:var(--tap-min);height:100%}
.rail button:active{background:var(--accent);color:var(--fg-on-dark);border-color:var(--accent)}
.rail button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}

/* ═══════════════ Überschriften und Stationen ═══════════════ */
.lagerh{padding:var(--space-6) 0 var(--space-1);background:var(--bg)}
.lgt{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
  text-transform:uppercase;display:flex;align-items:center;gap:var(--space-2)}
.lgs{font-size:var(--text-sm);color:var(--fg-muted);margin-top:var(--space-1)}
/* Die Stationsleiste (R · 1 … 6) traegt sieben Knoepfe. Bei 320 px blieben
   davon 38 px je Knopf — unter den 44 px des Hauses, gemessen erst, seit
   ui-mass.cjs auch 320 px prueft. Sie bricht deshalb um, statt zu
   schrumpfen: zwei Zeilen sind kein Schoenheitsfehler, ein Fehlgriff im
   Keller schon. */
.stat{display:flex;flex-wrap:wrap;gap:var(--space-1);
  padding:var(--space-3) 0 var(--space-1)}
.statb{flex:1 1 var(--tap-min);min-width:var(--tap-min);height:var(--tap-min);
  border-radius:var(--radius-md);
  border:1px solid var(--border-strong);background:var(--surface);font:inherit;
  font-size:var(--text-sm);font-weight:var(--weight-bold);color:var(--fg-subtle);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.statb.done{background:var(--success-bg);border-color:var(--success);color:var(--success-fg)}
.statb.on{background:var(--accent);border-color:var(--accent);color:var(--fg-on-dark)}
.stath{padding:var(--space-4) 0 var(--space-1);display:flex;
  align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.stath b{font-size:var(--text-base);font-weight:var(--weight-medium)}
.stath i{font-style:normal;font-size:var(--text-xs);color:var(--fg-subtle);white-space:nowrap}
.hd1sub2{padding:0 0 var(--space-2);font-size:var(--text-sm);color:var(--fg-muted)}
.stats{padding:var(--space-1) 0 var(--space-3);font-size:var(--text-sm);
  color:var(--fg-muted)}
.stats .bar{display:block;height:3px;border-radius:var(--radius-xs);background:var(--border);
  margin-top:var(--space-2)}
.stats .bar i{display:block;height:100%;border-radius:var(--radius-xs);background:var(--accent)}
.reb8{display:inline-block;min-width:24px;padding:1px var(--space-1);
  border-radius:var(--radius-sm);background:var(--fg);color:var(--fg-on-dark);
  font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:.04em;vertical-align:2px}
.ach{color:var(--fg-muted);font-weight:var(--weight-medium)}
.gq.vorne{min-width:30px;text-align:right;font-size:var(--text-lg);
  font-weight:var(--weight-bold);flex-shrink:0;margin-right:2px}
.gq.vorne.aus{color:var(--fg-subtle)}
.pruefw{padding:var(--space-3) 0 var(--space-2)}
.hd1w{margin:var(--space-6) 0 0}
.hd1{font-size:var(--text-sm);font-weight:var(--weight-bold);padding:0 0 var(--space-2);
  border-bottom:2px solid var(--fg);display:flex;justify-content:space-between;
  align-items:baseline;gap:var(--space-3);letter-spacing:.02em}
.hd1 .cnt2{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--fg-muted)}
.hd1 .cnt2.full{color:var(--success)}
.hd1sub{font-size:var(--text-xs);color:var(--fg-muted);margin:var(--space-1) 0 var(--space-2)}
.prog{height:4px;background:var(--border);border-radius:var(--radius-xs);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);
  transition:width var(--dur) var(--ease)}
.prog i.full{background:var(--success)}
.reb{font-size:var(--text-xs);color:var(--fg-muted);margin:var(--space-4) 0 var(--space-1);
  font-weight:var(--weight-medium);letter-spacing:.02em}
.grpanchor{scroll-margin-top:calc(var(--topH) + var(--space-2))}

/* ═══════════════ Zeile ═══════════════ */
/* F3 · Die Zaehlringe fluchten.
   --dotsp ist das Raster der Ringe: 26 px Ring + 20 px Abstand = 46 px
   Trefferflaeche. Drei Ringe sind die groesste Zahl, die im Plan
   nebeneinander vorkommt (3 x 26 + 2 x 20 = 118). Mehr bricht um — die
   Spalte bleibt gleich breit, damit der erste Ring seine x-Position nie
   verlaesst. */
/* BERICHTIGUNG (Jagd 13, A1/B1): Das Raster stand zuerst an `.w` selbst.
   `.w` ist aber die Grundform ALLER Listenzeilen — acht Stellen tragen
   sie, nur eine davon ist die Zaehlzeile: die Archivliste (`:2318`), der
   Zaehler (`countRow`), die Jahrgaenge und das Einraeumen im
   Wareneingang, die Getraenkezeile (`getrRow`). Dort schob das Raster den
   Namen in die Ringspalte und den Zaehlknopf 31 px aus dem Fenster.
   Die Grundform ist deshalb wieder eine Reihe; das Raster traegt die
   Zaehlzeile allein (`.w--zaehl`). */
.w{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:var(--space-3) 0;display:flex;align-items:center;gap:var(--space-3);cursor:pointer;
  transition:background var(--dur-fast) var(--ease)}
/* Runde 14 · Die Ringe ahmen drei nebeneinander stehende Flaschen nach:
   34 px Ring, 10 px Luft — statt 26 und 20. Der Abstand von Mitte zu
   Mitte bleibt damit 44 px, die Trefferflaeche also unveraendert; optisch
   ruecken sie zusammen. Umgebrochen wird nie (`flex-wrap:nowrap`); passt
   eine lange Reihe nicht, werden die Ringe kleiner, nicht gestapelt.
   `--dotd` (Ringgroesse) und `--dotsp` (Breite der Spalte) setzt
   `ringMasse()` je Liste, damit alle Zeilen EINER Liste fluchten. */
.w--zaehl{--dotd:32px; --dotgap:13px;
  --dotsp:calc(3 * var(--dotd) + 2 * var(--dotgap));
  display:grid;grid-template-columns:minmax(0,1fr) var(--dotsp) 24px auto;
  align-items:center;column-gap:var(--space-2);gap:0}
.w:active{background:var(--surface-3)}
.wtx{display:flex;align-items:center;gap:11px;min-width:0}
.w .tx{flex:1;min-width:0}
/* Winzer als Vorzeile, Wein als Zeile. Vorher stand beides gleich gross
   nebeneinander und brach bei 390px in fast jeder Zeile um. */
/* Die Namensspalte ist seit F3 fest begrenzt (der Rest der Zeile gehoert
   den Ringen). Bei 320 px bleiben ihr rund 78 px — „Carnuntum" ist breiter
   als das. Getrennt wird deshalb automatisch, und was sich nicht trennen
   laesst, bricht hart um. Ueber den Ring laufen darf der Name nie: an ihm
   wird gezaehlt. */
/* Die Namensspalte ist fest begrenzt (der Rest der Zeile gehoert den
   Ringen). Bei 320 px bleiben ihr rund 80 px. Getrennt wird deshalb
   automatisch — aber an der richtigen Stelle: `overflow-wrap:anywhere`
   stand hier und zerlegte „GLATZER" zu „GLATZE / R". Jetzt trennt zuerst
   die Silbentrennung, und nur ein Wort, das auch dafuer zu lang ist,
   bricht hart (`break-word` statt `anywhere`). */
.nm{display:block;font-size:var(--text-base);line-height:1.32;
  overflow-wrap:break-word;hyphens:auto}
.nm b{display:block;font-size:var(--text-xs);font-weight:var(--weight-medium);
  text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--fg-muted);
  line-height:1.3}
.nm .wn{display:block;font-size:var(--text-base);font-weight:var(--weight-medium);
  line-height:1.3}
.nm .trenner{display:none}
.mt{display:block;font-size:var(--text-sm);color:var(--fg-muted);margin-top:2px}
.w.miss{background:var(--danger-bg);border-radius:var(--radius-md);
  border-bottom-color:transparent;padding-left:var(--space-2);padding-right:var(--space-2);
  margin:0 -6px}
.w.miss .nm{color:var(--danger-fg)}
/* Nicht die ganze Zeile daempfen: --fg-muted bei 50 % ist unter jeder
   Lesbarkeitsschwelle. Nur der Text, und nur so weit, dass die Zeile
   zurueckliegt. Das Haekchen bleibt voll. */
.w.seen .nm,.w.seen .mt{opacity:.62}
/* Runde 14 · Die Rebsorte traegt ihre Farbe in der Ueberschrift, nicht im
   Grund der Zeilen. Ein abwechselnder Grund hatte den Block zwar getrennt,
   aber nichts darueber gesagt, WELCHE Rebsorte kommt.
   Die Intensitaet bleibt niedrig: ein Balken links, die Schrift im selben
   Ton. Die Zeilen darunter bleiben unberuehrt — dort zaehlt der Zustand
   (fehlend, gesehen, abgehakt), und der darf von nichts uebertoent werden.
   Den Ton setzt `rebTon()` aus der Rebsorte; ohne Treffer bleibt es beim
   bisherigen Grau. */
.reb{--rebton:var(--fg-muted)}
.reb--farbe{color:var(--rebton);border-left:3px solid var(--rebton);
  padding-left:var(--space-2);margin-left:-3px;
  font-weight:var(--weight-bold)}
.w.tick{opacity:.5}
.w.tick .nm{text-decoration:line-through}

/* Konsum-Zähler */
.knum{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.kminus,.kplus{width:var(--tap-min);height:var(--tap-min);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-lg);
  color:var(--fg-muted);cursor:pointer;line-height:1;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.kminus:active,.kplus:active{background:var(--accent);color:var(--fg-on-dark)}
.kminus.hide{visibility:hidden}
.cnt{min-width:46px;height:var(--tap-min);border:2px solid var(--border-strong);
  border-radius:var(--radius-md);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-subtle);
  transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.cnt.on{border-color:var(--fg);color:var(--fg);background:var(--surface-3)}

/* Punkte und Häkchen */
/* Der Abstand zwischen den Punkten ist hier keine Zierde, sondern die
   Trefferflaeche: 26px Punkt + 20px Abstand = 46px Raster. Jeder Punkt
   traegt seinen Griff in einem ::after, die Griffe stossen aneinander und
   ueberlappen nicht — ein Fehlgriff faellt also nicht auf den Nachbarn.
   Im Plan hat keine Position mehr als drei Flaschen; kaeme je eine
   sechste dazu, bricht die Reihe um (max-width), statt den Namen des
   Weins zu zerdruecken. Die Zeilen der Punkte liegen dann 20px
   auseinander, damit auch senkrecht kein Griff in den naechsten laeuft. */
/* Linksbuendig, nicht mehr rechtsbuendig: „Die Ringe beginnen in JEDER
   Zeile an derselben x-Position" heisst, dass der ERSTE Ring die Marke
   setzt — bei einer Zeile mit einer Flasche genauso wie bei einer mit
   dreien. */
.dots{display:flex;flex-wrap:nowrap;justify-content:flex-start;
  gap:var(--dotgap);align-items:center;width:var(--dotsp);
  padding:var(--space-3) 0;cursor:pointer}
/* Drei volle schwarze Kreise je Zeile waren die groesste optische Last der
   Liste und trugen die kleinste Information: alle sagten dasselbe. Als Ring
   bleibt die Aussage, das Gewicht geht weg. Geometrie unveraendert. */
/* Bei 320 px (iPhone SE) blieben der Namensspalte neben drei Ringen nur
   78 px — „GLATZER" brach dann mitten im Wort um. Dort stehen zwei Ringe
   nebeneinander und der dritte eine Zeile tiefer: die Spalte wird schmaler,
   die x-Position des ERSTEN Rings bleibt, und der Name behaelt seine
   Zeilen. Das Raster von 46 px bleibt unangetastet. */
/* Kein Sonderfall mehr fuer 320 px. Der Abstand von Mitte zu Mitte liegt
   bei 45 px (32 Ring + 13 Luft). Die Trefferflaeche ist auf die 44 px des
   Hauses gedeckelt und bleibt damit eine Spur schmaler als die Teilung —
   so greift sie nie in den Nachbarn, auch nicht mit dem Rand des Daumens
   (siehe `.dot::after`). Die Ringe stehen trotzdem dicht wie drei Flaschen
   nebeneinander. */
.dot{position:relative;width:var(--dotd);height:var(--dotd);border-radius:50%;
  background:transparent;
  border:2px solid var(--accent);box-shadow:inset 0 0 0 20px var(--accent-ring)}
/* Die Trefferflaeche haengt nicht mehr am Ring, sondern am Abstand von
   Mitte zu Mitte: so gross wie moeglich, aber nie groesser als die Teilung
   — sonst griffe sie in den Nachbarn und ein Fehlgriff zaehlte die
   falsche Flasche herunter. Bei 34 px Ring und 10 px Luft sind das genau
   die 44 px des Hauses. */
.dot::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(var(--tap-min),calc(var(--dotd) + var(--dotgap)));
  height:var(--tap-min)}
.dot.off{background:none;border:2px dashed var(--border-heavy);box-shadow:none}
/* Rot wird nur, was fehlt. Die vorhandenen Flaschen derselben Zeile
   bleiben ruhig — sonst schreit die ganze Zeile, obwohl nur eine
   Position offen ist. */
.dot.fehlt,.w.miss .dot.off{border-color:var(--danger);border-style:dashed;
  box-shadow:inset 0 0 0 20px var(--danger-ring)}
.miss-n{font-size:var(--text-sm);font-weight:var(--weight-bold);color:var(--danger-fg);
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Runde 14 · „voll" sitzt auf der Mittellinie der Ringe, nicht darueber.
   Der Kasten ist so gross wie ein Ring (34 px); die Beschriftung haengt
   darunter, OHNE die Mitte zu verschieben (absolut gesetzt). Die
   Trefferflaeche bleibt 44 px im ::after. */
.chkbox{position:relative;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;height:var(--dotd,32px)}
.chk{position:relative;width:var(--dotd,32px);height:var(--dotd,32px);
  border:2px solid var(--border-heavy);
  border-radius:var(--radius-md);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-on-dark);background:var(--surface);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.chk.on{background:var(--success);border-color:var(--success)}
.chk.warn{background:var(--danger);border-color:var(--danger)}
.chk::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:var(--tap-min);height:var(--tap-min)}
.chk-lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:2px;font-size:var(--text-xs);font-weight:var(--weight-medium);
  color:var(--fg-subtle);letter-spacing:.03em;pointer-events:none}
.chkbox .chk.on+.chk-lbl{color:var(--success)}
.pos{width:20px;font-size:var(--text-sm);color:var(--fg-subtle);
  font-weight:var(--weight-bold);flex-shrink:0;text-align:right}
.box2{width:var(--control-h-sm);height:var(--control-h-sm);border:2px solid var(--fg);
  border-radius:var(--radius-md);flex-shrink:0;display:grid;place-items:center;
  font-size:var(--text-base);font-weight:var(--weight-bold);color:var(--fg-on-dark);
  background:var(--surface)}
.box2.on{background:var(--fg)}
.qty{font-size:var(--text-lg);font-weight:var(--weight-bold);min-width:32px;
  text-align:right;flex-shrink:0}

/* ═══════════════ Zählfelder ═══════════════ */
.zw{padding:var(--space-3) 0;border-bottom:1px solid var(--border)}
.zw.zebra{background:var(--surface-3)}
.zw.seen .nm{opacity:.55}
.ztop{margin-bottom:var(--space-2)}
/* NEU GEMESSEN (Jagd 13): Die Zeile traegt drei Felder — Reihen, Einzeln,
   Summe. Zwei davon brauchen je 122 px (40 + 34 + 40 + zwei Fugen), das
   dritte mindestens 60. Bei 320 px stehen 288 zur Verfuegung: die Summe
   ragte 18 px aus dem Fenster, die Seite rollte waagrecht (338 > 320) und
   nahm die Sprungleiste gleich mit hinaus. Aufgefallen ist das erst, seit
   das Messgeraet jeden Schritt jedes Modus ansieht — die Kellerzaehlung
   hat es bis Runde 12 nie gesehen.
   Jetzt bricht die Zeile um: bei 320 px steht die Summe unter den beiden
   Zaehlfeldern, ab 375 px wieder daneben. */
.zsteppers{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:flex-end}
.zstep{flex:1 1 122px;min-width:122px;text-align:center}
.zsteppers .zstep:last-child{flex:1 1 60px;min-width:60px}
.zstep .zl{font-size:var(--text-xs);color:var(--fg-subtle);
  font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.zsteprow{display:flex;align-items:center;gap:var(--space-1);justify-content:center}
.zbtn{width:40px;height:var(--tap-min);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-lg);
  color:var(--fg-muted);cursor:pointer;line-height:1;flex-shrink:0;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
/* NEU GEMESSEN (Jagd 13): 40 px breit. Die Fuge zwischen den Feldern ist
   4 px — eine Flaeche von 44 px steht damit genau bis zur Mitte der Fuge
   und stoesst an die des Nachbarn, ohne sie zu ueberlappen. */
.zbtn{position:relative}
.zbtn::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:var(--tap-min);height:100%}
.zbtn:active{background:var(--accent);color:var(--fg-on-dark)}
.zval{flex:1;min-width:34px;height:var(--tap-min);border:2px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-base);
  font-weight:var(--weight-bold);color:var(--fg-subtle);cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.zval.on{border-color:var(--fg);color:var(--fg);background:var(--surface-3)}
.zin{width:100%;padding:0}
.zsumbig{height:var(--tap-min);display:grid;place-items:center;font-size:var(--text-lg);
  font-weight:var(--weight-bold);color:var(--fg-subtle);border:2px solid transparent;
  border-radius:var(--radius-md)}
.zsumbig.on{color:var(--success)}
.kisteninfo{display:flex;gap:var(--space-3);margin:var(--space-4) 0 var(--space-1)}
.kisteninfo div{flex:1;text-align:center;background:var(--surface-3);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-2);
  font-size:var(--text-xs);color:var(--fg-muted)}
.kisteninfo b{display:block;font-size:var(--text-lg);color:var(--fg);
  font-weight:var(--weight-bold)}
.ztags{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-top:var(--space-1)}
.ztag{font-size:var(--text-xs);font-weight:var(--weight-bold);padding:2px var(--space-2);
  border-radius:var(--radius-pill)}
.ztag.rest{background:var(--info-bg);color:var(--info)}
.ztag.bar{background:var(--tag-bar-bg);color:var(--tag-bar-fg)}
.ztag.back{background:var(--tag-back-bg);color:var(--tag-back-fg)}
.fchips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:var(--space-4) 0 var(--space-1)}
.fchip{min-height:var(--tap-min);padding:0 var(--space-4);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-pill);font-size:var(--text-md);
  font-weight:var(--weight-medium);color:var(--fg-muted);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.fchip.on{background:var(--accent);color:var(--fg-on-dark);border-color:var(--accent)}
/* Runde 14 · Der Grund einer Sonderentnahme.
   Dieselbe Form wie die Farbfilter darunter — es ist dieselbe Handbewegung
   im selben Schritt, und sie trägt schon die 44 px. Der gewählte Grund
   steht im Haus-Teal, damit man beim Abschluss sieht, dass er gesetzt ist. */
/* BERICHTIGUNG (Beleg r14/390-sonderentnahme-grund): Die fünf Gründe
   standen als Pillen unmittelbar über den Farbfiltern — zwei Reihen
   derselben Form, ohne Grenze, nicht auseinanderzuhalten. Der Block
   bekommt deshalb eine eigene Fläche im Warnton der Sonderentnahme:
   dieselbe Farbe wie ihre Kachel auf der Startseite. */
.grundw{margin:var(--space-4) 0 var(--space-3);background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:var(--radius-lg);
  padding:var(--space-3) var(--space-4) var(--space-4)}
.grundw .hd1sub2{color:var(--warn-fg)}
.gruende{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.grundb{min-height:var(--tap-min);padding:0 var(--space-4);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-pill);font-size:var(--text-md);
  font-weight:var(--weight-medium);color:var(--fg-muted);cursor:pointer;font-family:inherit;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.grundb.on{background:var(--accent);color:var(--fg-on-dark);border-color:var(--accent)}
.zrow{display:flex;gap:var(--space-2);align-items:center;flex-shrink:0}
.zl{font-size:var(--text-xs);color:var(--fg-subtle);font-weight:var(--weight-medium)}
.zsum{font-size:var(--text-base);font-weight:var(--weight-bold);min-width:30px;text-align:right}
.zsum.on{color:var(--success)}

.empty{padding:var(--space-8) 0;text-align:center;color:var(--fg-subtle)}
.pill{display:inline-block;font-size:var(--text-xs);font-weight:var(--weight-bold);
  padding:2px var(--space-2);border-radius:var(--radius-pill);background:var(--surface-3);
  color:var(--fg-muted);margin-left:var(--space-2)}
.pill.new{background:var(--success-bg);color:var(--success)}
.pill.chg{background:var(--danger-bg);color:var(--danger-fg)}

/* ═══════════════ Lieferung ═══════════════ */
.li{border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3);
  margin-top:var(--space-3);background:var(--surface)}
.li .top{display:flex;justify-content:space-between;gap:var(--space-3);align-items:flex-start}
.li .top b{font-size:var(--text-base)}
.li .top .x,.li .g .x{background:none;border:1px solid var(--border-strong);
  color:var(--fg-muted);width:40px;height:40px;border-radius:var(--radius-md);
  cursor:pointer;flex-shrink:0;font-size:var(--text-base);
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.li .top .x:active,.li .g .x:active{background:var(--surface-3)}
.li .g{display:flex;gap:var(--space-2);margin-top:var(--space-3);flex-wrap:wrap;
  align-items:flex-end}
.fld{flex:1;min-width:90px}
.fld span{display:block;font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.li .info{margin-top:var(--space-3);font-size:var(--text-sm);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
  background:var(--surface-3);color:var(--fg-muted)}
.li .info.chg{background:var(--danger-bg);color:var(--danger-fg)}
.li .info b{color:inherit}

/* ═══════════════ Abschluss ═══════════════ */
.done-cta{padding:var(--space-7) 0 var(--space-3);text-align:center}
.done-cta .big{font-size:var(--text-display);font-weight:var(--weight-bold);line-height:1}
.done-cta .lb{font-size:var(--text-sm);color:var(--fg-muted);margin-top:var(--space-2)}

/* ═══════════════ Protokoll ═══════════════ */
.doc{padding:var(--space-4) 0}
.dh{border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:var(--space-4);margin-bottom:var(--space-4);background:var(--surface)}
.dh .t{font-size:var(--text-base);font-weight:var(--weight-medium)}
.dh .m{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-5);
  margin-top:var(--space-2);font-size:var(--text-sm);color:var(--fg-muted)}
.dh .m b{color:var(--fg);font-weight:var(--weight-medium)}
.sec{margin-top:var(--space-6)}
.sec>h3{font-size:var(--text-sm);margin:0 0 var(--space-1);padding-bottom:var(--space-2);
  border-bottom:2px solid var(--fg);text-transform:uppercase;letter-spacing:var(--track-caps);
  font-weight:var(--weight-bold);display:flex;justify-content:space-between;
  align-items:center;min-height:var(--tap-min)}
.secarrow{transition:transform var(--dur) var(--ease);color:var(--fg-muted);
  font-weight:var(--weight-regular)}
.sec.collapsible.closed .secarrow{transform:none}
.sec.collapsible:not(.closed) .secarrow{transform:rotate(90deg)}
.sec.collapsible.closed table{display:none}
.sec.collapsible.closed{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:var(--text-md)}
th{text-align:left;font-size:var(--text-xs);color:var(--fg-muted);
  border-bottom:1px solid var(--fg);padding:var(--space-2);font-weight:var(--weight-bold)}
th.r,td.r{text-align:right}
td{padding:var(--space-2);border-bottom:1px solid var(--border);vertical-align:top}
td.grp{background:var(--surface-3);font-size:var(--text-xs);font-weight:var(--weight-bold);
  text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--fg-muted);padding:var(--space-2)}
tr.flag{background:var(--danger-bg)}
tr.tot td{border-top:2px solid var(--fg);border-bottom:0;font-weight:var(--weight-bold);
  background:var(--surface-3)}
.kpi{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.kpi div{flex:1;min-width:72px;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-3);background:var(--surface)}
.kpi span{display:block;font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium)}
.kpi b{font-size:var(--text-lg);font-weight:var(--weight-bold)}
.kpi div.w2{border-color:var(--danger-border);background:var(--danger-bg)}
.kpi div.w2 b{color:var(--danger)}
/* Gleiche Form wie .hinweis im Backoffice: Vollrahmen, rundum gerundet. */
.box{border:1px solid var(--danger-border);background:var(--danger-bg);
  color:var(--danger-fg);border-radius:var(--radius-md);
  padding:var(--space-3) var(--space-4);margin-top:var(--space-4);
  font-size:var(--text-md);line-height:var(--leading-normal)}
.box.good{border-color:var(--success-border);background:var(--success-bg);
  color:var(--success-fg)}

/* ═══════════════ Name-Auswahl ═══════════════ */
.namebox{margin-top:var(--space-2)}
.namebox .nl{font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);margin-bottom:var(--space-2)}
.namechips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-3)}
.namechip{min-height:var(--tap-min);padding:0 var(--space-4);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-pill);font-size:var(--text-md);
  font-weight:var(--weight-medium);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.namechip.on{background:var(--fg);color:var(--fg-on-dark);border-color:var(--fg)}
label.f{display:block;margin-top:var(--space-3)}
label.f span{font-size:var(--text-xs);color:var(--fg-muted);
  font-weight:var(--weight-medium);display:block;margin-bottom:var(--space-1)}

.exprow{display:flex;gap:var(--space-2);margin-top:var(--space-5)}
.exprow .primary,.exprow .secondary{flex:1;min-height:var(--control-h-lg)}
.explesser{display:flex;gap:var(--space-3);justify-content:center;
  margin-top:var(--space-3);flex-wrap:wrap}


/* ═══════════════ Toast und Overlay ═══════════════ */
.toast{position:fixed;bottom:calc(var(--space-6) + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:var(--fg);color:var(--fg-on-dark);
  padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);
  font-size:var(--text-sm);z-index:var(--z-toast);opacity:0;
  transition:opacity var(--dur) var(--ease);pointer-events:none;max-width:88vw;
  text-align:center;box-shadow:var(--shadow-overlay)}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(20,20,22,.6);display:none;z-index:var(--z-overlay);
  padding:var(--space-4);align-items:center;justify-content:center}
.ov.on{display:flex}
.card2{background:var(--surface);max-width:440px;width:100%;padding:var(--space-6);
  border-radius:var(--radius-lg);max-height:88vh;overflow:auto}
.card2 h3{margin:0 0 var(--space-2);font-size:var(--text-base)}
.card2 p{margin:0 0 var(--space-4);font-size:var(--text-md);color:var(--fg-muted)}
.card2 .row{display:flex;gap:var(--space-2)}
.card2 .row button{flex:1}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══════════════ Zeigegerät ═══════════════ */
@media(hover:hover) and (pointer:fine){
  .mi:hover,.w:hover,.recheck:hover,.fullbtn:hover,.addbtn:hover,
  .prueft:hover,.card2 .row button:hover,.drwb button:hover,
  .exprow .secondary:hover{background:var(--surface-3)}
  .finishbtn.blocked:hover{background:var(--border-strong);border-color:var(--border-heavy)}
  .finishbtn:not(.blocked):hover,.exprow .primary:hover,.card2 .row .ok:hover,
  .prueft.weiter:hover,.drwb button.weiter:hover{
    background:var(--fg-secondary);border-color:var(--fg-secondary)}
  .st:hover{background:var(--border-on-dark);color:var(--fg-on-dark)}
  .st[aria-selected="true"]:hover{background:var(--bg);color:var(--fg)}
  .home:hover,#dSel:hover{background:var(--border-on-dark)}
  .statb:hover,.fchip:hover,.namechip:hover,.rail button:hover,
  .kminus:hover,.kplus:hover,.zbtn:hover,.li .top .x:hover,.li .g .x:hover{border-color:var(--fg)}
  .statb.on:hover{border-color:var(--fg)}
  .adminlink:hover,.explesser button:hover{color:var(--fg)}
  .sec.collapsible>h3:hover{color:var(--fg-secondary)}
}

/* ═══════════════ Breite Viewports ═══════════════ */
/* Vorher endete die dunkle Leiste mitten im Nichts, weil sie wie der Inhalt
   auf die Satzbreite beschnitten war. Die Fl\u00e4che geht jetzt durch, der Inhalt
   darin bleibt auf Satzbreite. */
@media(min-width:720px){
  .topwrap{background:var(--accent)}
  .topwrap>.howto,.topwrap>.tools{background:var(--bg);max-width:none}
  header>.hd,header>.steps{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  /* Die Statuszeile fluchtet ebenfalls mit dem Inhalt — ihre Regel steht
     weiter unten bei .netz, sonst überschriebe die spätere Kurzschrift
     padding: die hier gesetzten Seitenwerte. */
  .tools>#q,.howto>*{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  main{max-width:var(--maxw);margin-left:auto;margin-right:auto}
  .rail{right:max(var(--space-1),calc(50% - (var(--maxw)/2) - var(--rail) - var(--space-2)))}
  /* Name links, Zählung und Häkchen an einer festen rechten Kante — sonst
     liegen bei 1280px fünfhundert Pixel Leere dazwischen.

     BERICHTIGUNG (Beleg geraete/f3/ipadmini-bar-rotweine.png): Diese Regel
     hat bis Runde 14 auch die Zählzeile getroffen. Die hat aber VIER
     Kinder (Name · Ringe · Fehlzahl · Kästchen), und in einem Raster mit
     drei Spalten rutscht das vierte in die zweite Zeile: am iPad stand
     „voll" mittig unter dem Namen. Die Zählzeile bringt ihr eigenes Raster
     mit (`.w--zaehl`) und will hier nichts — ihre Namensspalte ist schon
     `1fr` und schiebt Ringe und Kästchen von selbst nach rechts.
     Derselbe Fehler wie A1 aus Runde 13: eine allgemeine `.w`-Regel greift
     in die Zählzeile. Deshalb hier ausdrücklich ausgenommen. */
  .w:not(.w--zaehl){display:grid;grid-template-columns:1fr auto auto;
     column-gap:var(--space-5);align-items:center}
  .w:not(.w--zaehl)>.tx{min-width:0}}
@media(min-width:768px){:root{--maxw:760px}}

/* ═══════════════ Teil 2 ═══════════════ */
.gshot--tap{cursor:pointer;border-radius:var(--radius-sm)}
.gshot--tap:active{background:var(--surface-4)}
/* Dominante Ladenanweisung. Blau, nicht rot: das hier ist eine
   Arbeitsanweisung, kein Fehlbestand. Rot bleibt den Fehlmengen. */
.ghint--stark{font-size:var(--text-md);font-weight:var(--weight-medium);
 color:var(--fg-secondary);background:var(--info-bg);
 border-left:4px solid var(--info);margin:0;
 padding:var(--space-3);line-height:var(--leading-tight)}
/* Hol-Listen: ein Muster für Wein und Getränke */
.holz{display:flex;align-items:center;gap:var(--space-2);
 border-bottom:1px solid var(--border);padding:var(--space-1) 0}
.holz .holzl{flex:1;display:flex;align-items:center;gap:var(--space-3);
 border:0;background:none;text-align:left;cursor:pointer;font:inherit;
 padding:var(--space-2) 0;min-height:var(--tap-min);color:inherit}
.holz.erledigt .holzl{opacity:.45}
.holz.erledigt .nm{text-decoration:line-through}
/* Abweichung bleibt leise \u2014 aber als Knopf erkennbar, nicht als
   unterstrichener Text. Ein Rahmen, sonst nichts. */
.abwk{background:none;color:var(--fg-muted);font-size:var(--text-xs);
 font-weight:var(--weight-medium);text-decoration:none;cursor:pointer;
 border:1px solid var(--border-strong);border-radius:var(--radius-pill);
 padding:0 var(--space-3);min-height:var(--control-h-sm);
 display:inline-flex;align-items:center;flex-shrink:0;white-space:nowrap}
.abwk:active{background:var(--surface-3)}
.abwk.on{color:var(--danger);font-weight:var(--weight-medium);text-decoration:none;
 border:1px solid var(--danger-border);border-radius:var(--radius-pill);
 background:var(--danger-bg);min-height:var(--control-h-sm);padding:0 var(--space-3)}
.abwfeld{width:56px;min-height:var(--control-h-sm);text-align:center;
 font-size:var(--text-base);font-weight:var(--weight-bold);
 font-variant-numeric:tabular-nums;border:2px solid var(--fg);
 border-radius:var(--radius-md);background:var(--surface);color:var(--fg);
 padding:0;flex-shrink:0}
.kisten{font-size:var(--text-sm);color:var(--fg-secondary);margin-top:var(--space-2);
 background:var(--surface-3);border-radius:var(--radius-md);
 padding:var(--space-2) var(--space-3)}
.kisten b{font-weight:var(--weight-bold);color:var(--fg)}
/* Navigation am Ende des Inhalts statt in einer festen Leiste */
/* F8 (18.09.2026): Zwischen Ladenkasten und „Ueberspringen" standen
   24 px Rand plus 40 px Fusspolster von <main> plus die halbe Knopfhoehe —
   auf dem iPhone mehrere Zentimeter nichts. Der Rand bleibt bei 24 px,
   das Fusspolster faellt weg, wo die Leiste selbst schon eines mitbringt
   (siehe main:has(.navrow) weiter unten). */
.navrow{display:flex;gap:var(--space-2);margin:24px 0 var(--space-4)}
.navrow .b{flex:1;min-height:var(--control-h-lg);background:var(--surface);
 border:1px solid var(--border-strong);color:var(--fg);
 border-radius:var(--radius-md);font:var(--weight-medium) var(--text-md)/1.2 var(--font);
 display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.navrow .b:active{background:var(--surface-3)}
.navrow .b.sm{flex:0 0 auto;padding:0 var(--space-5);color:var(--fg-muted)}
.navrow .b.go{background:var(--accent);border-color:var(--accent);color:var(--fg-on-dark)}
.navrow .b.go:active{background:var(--accent-dunkel)}
/* „Ueberspringen“ ist eine Ausweichmoeglichkeit, kein zweiter Hauptweg —
   vorher sah es genauso aus wie „Zurueck“ und stand gleich gross daneben. */
.navrow .b.go.leise{background:none;border-color:transparent;
 color:var(--fg-muted);font-weight:var(--weight-regular)}
.navrow .b.go.leise:active{background:var(--surface-3)}
/* Kontrollierte Spalte: ruhig, aber erkennbar */
.gcol--geprueft{background:var(--success-tint);border-radius:var(--radius-md);
 box-shadow:0 0 0 3px var(--success-tint);position:relative}
/* Der Haken gehoert ans Foto, nicht an die Spalte. */
.gcol--geprueft .gshot{position:relative}
.gcol--geprueft .gshot::after{content:"\2713";position:absolute;right:0;top:0;
 width:16px;height:16px;border-radius:50%;background:var(--success);
 color:var(--fg-on-dark);font-size:10px;line-height:16px;text-align:center}
.gcol--geprueft .gcap{color:var(--success-fg);font-weight:var(--weight-medium)}
/* Noch nicht kontrolliert */
/* Nicht kontrollierte Karten meldet die Stationsleiste \u2014 ein Kasten
   im Inhalt wiederholt das nur. Bestätigt schlägt offen. */
.statb.offen{border-color:var(--warn);background:var(--warn-bg);color:var(--warn-fg);
 box-shadow:inset 0 0 0 1px var(--warn)}
.statb.done,.statb.done.offen{background:var(--success-bg);border-color:var(--success);
 color:var(--success-fg);box-shadow:none}
.statb.on,.statb.on.offen,.statb.on.done{background:var(--accent);border-color:var(--accent);
 color:var(--fg-on-dark);box-shadow:none}
/* P8 · Startbild */
.login{padding:calc(var(--space-8) + env(safe-area-inset-top)) var(--space-4) var(--space-8);
  max-width:420px;margin:0 auto}
.login h1{font-size:var(--text-lg);margin:0 0 var(--space-1);letter-spacing:-.01em}
.login .sub{color:var(--fg-muted);font-size:var(--text-sm);margin:0 0 var(--space-4)}
.loginhilfe{font-size:var(--text-sm);color:var(--fg-muted);
  line-height:var(--leading-normal);margin:0 0 var(--space-6)}
.angemeldet{font-size:var(--text-sm);color:var(--fg-muted);
  margin:calc(var(--space-6) * -1 + var(--space-2)) 0 var(--space-6);
  display:flex;align-items:center;gap:var(--space-3)}
.angemeldet b{color:var(--fg);font-weight:var(--weight-medium)}
.wechseln{padding:0 var(--space-3)}
/* P8/4 · Datum als Zeile unter dem Titel */
.datumline{position:relative;display:inline-flex;align-items:center;
  font-size:var(--text-xs);color:var(--fg-on-dark-3);margin-top:2px;
  min-height:var(--tap-min);cursor:pointer}
.datumline input{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;margin:0;cursor:pointer}
/* P12 · Zusätzlich entnommen */
.zusatz{margin-top:var(--space-6);padding-top:var(--space-4);
  border-top:1px solid var(--border)}
.zusatzlink{background:none;border:0;color:var(--fg-muted);font-size:var(--text-sm);
  text-decoration:underline;cursor:pointer;min-height:var(--tap-min);padding:0}
.zusatzsum{font-size:var(--text-sm);color:var(--fg-muted);margin:var(--space-2) 0}
.zusatzq{margin:var(--space-3) 0}
.cnt.zin{min-width:46px;text-align:center;padding:0;border-width:2px;border-color:var(--fg)}
/* F4 (18.09.2026): Der Block „P10 · Fotos der Fassungsliste" stand hier.
   Der Fotoschritt ist ersatzlos entfallen — siehe review/INPUT-TEAM.md F4.
   Die Gestaltung der PRODUKTfotos in den Laden (.gshot) ist davon nicht
   betroffen und bleibt. */

/* ═══════════════ Mehrgerätebetrieb ═══════════════
   Der Übertragungszustand war eine 11px-Pille, absolut positioniert —
   ihr Bezugsrahmen war aber nicht die Kopfzeile, sondern das ganze
   klebende #topwrap. Sie landete je nach Schritt über der Suchzeile und
   stand dort hell auf hell. Dazu kam eine zweite Zeile („Offline –
   Protokoll später senden") mit einer anderen Zusage. Jetzt eine Zeile
   in voller Breite unter dem Kopf: Form, Wort und Farbe sagen dasselbe,
   damit auch bei Kellerlicht und Farbschwäche etwas ankommt. */
.netz{display:flex;align-items:flex-start;gap:var(--space-2);
  padding:var(--space-2) var(--space-4);
  font-size:var(--text-sm);line-height:var(--leading-normal);
  font-weight:var(--weight-medium);
  background:var(--surface-3);color:var(--fg-secondary);
  border-bottom:1px solid var(--border-strong)}
/* Punkt · Quadrat · Ring · Raute — der Zustand ist auch ohne Farbe lesbar.
   Der Satz darf zwei Zeilen brauchen (überholter Stand); das Zeichen sitzt
   dann auf der ERSTEN Zeile, nicht in der Mitte des Blocks — deshalb
   align-items:flex-start oben und der gerechnete Versatz hier. */
.netz::before{content:"";width:10px;height:10px;flex:none;
  margin-top:calc((var(--text-sm) * var(--leading-normal) - 10px) / 2);
  border-radius:50%;background:currentColor}
.netztext{flex:1 1 auto;min-width:0}
/* Quittieren ist ein Knopf, keine Geste. Sichtbar 36px, greifbar --tap-min.
   Nicht über inset:-Npx: ein absolut gesetztes ::after rechnet gegen die
   POLSTERkante seines Bezugsrahmens, der 1px-Rahmen fällt also heraus und
   die Fläche wäre 2px zu klein. Die Höhe steht deshalb direkt da.
   Den Fokusring stellt :focus-visible aus der Tokenebene. */
.netzok{position:relative;flex:none;align-self:flex-start;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--control-h-sm);padding:0 var(--space-3);
  font:var(--weight-medium) var(--text-sm)/1.2 var(--font);
  color:inherit;background:var(--surface);
  border:1px solid currentColor;border-radius:var(--radius-ctl);
  white-space:nowrap}
.netzok::after{content:"";position:absolute;left:0;right:0;
  top:50%;transform:translateY(-50%);min-height:var(--tap-min)}
.netzok:active{background:var(--surface-2)}
.netzok[hidden]{display:none}
.netz.ok{background:var(--success-bg);color:var(--success-fg);
  border-bottom-color:var(--success-border)}
.netz.wartet{background:var(--warn-bg);color:var(--warn-fg);
  border-bottom-color:var(--warn-border)}
.netz.wartet::before{border-radius:var(--radius-xs)}
.netz.offline::before{background:none;border:2px solid currentColor}
.netz.fehler{background:var(--danger-bg);color:var(--danger-fg);
  border-bottom-color:var(--danger-border)}
.netz.fehler::before{border-radius:var(--radius-xs);transform:rotate(45deg)}
/* Im Menü gibt es keine Leiste, an die sich die Zeile hängen könnte.
   Dort steht derselbe Zustand als Block über den Kacheln — gleiche
   Farben, gleiche Formen, gleicher Satz. Die Randfarbe muss nach
   .netz.ok/.wartet/.fehler stehen, sonst bliebe nur die Unterkante bunt. */
/* Runde 14 · Das Statusfeld auf der Startseite trägt zwei Zeilen: oben
   der Stand des Tages („Tagesfassung steht noch an"), darunter kleiner,
   was noch hinausgeht. Es ist die erste Auskunft beim Öffnen — und ein
   KNOPF: ein Tipp darauf öffnet die Begrüßung, in der ausführlich steht,
   was heute schon passiert ist. Damit ist das Fenster vom Anmelden nicht
   weg, sondern wohnt hier. */
.netz--tipp{width:100%;text-align:left;font:inherit;cursor:pointer;
  box-shadow:0 1px 3px rgba(28,28,30,.10)}
.netz--tipp:active{background:var(--surface-4)}
.netz--tipp::after{content:"\203a";grid-column:3;grid-row:1;
  font-size:var(--text-lg);line-height:1;opacity:.5;align-self:center}
.netz--block{border:1px solid var(--border-strong);
  border-radius:var(--radius-md);margin-bottom:var(--space-5);
  padding:var(--space-4);
  display:grid;grid-template-columns:auto 1fr auto;
  column-gap:var(--space-2);row-gap:2px;align-items:start}
/* Ohne Hauptzeile (kein Netz) rutscht die Übertragungszeile von selbst in
   die erste Reihe — deshalb wird nicht auf Zeilen gesetzt, sondern nur auf
   Spalten. */
.netzhaupt{grid-column:2;font-size:var(--text-base);
  font-weight:var(--weight-medium);line-height:var(--leading-tight)}
.netzhaupt:empty{display:none}
.netz--block .netztext{grid-column:2;font-size:var(--text-sm);
  font-weight:var(--weight-regular);opacity:.85}
.netz--block .netzok{grid-column:3;grid-row:1}
/* Der Punkt links gehört zur ersten Zeile, welche das auch ist. */
.netz--block::before{grid-column:1;grid-row:1;
  margin-top:calc((var(--text-base) * var(--leading-tight) - 10px) / 2)}

.netz--block.ok{border-color:var(--success-border)}
.netz--block.wartet{border-color:var(--warn-border)}
.netz--block.fehler{border-color:var(--danger-border)}
/* Der Ton des Blocks folgt dem Stand des TAGES, nicht der Übertragung:
   „ist da" ist die gute Nachricht, „steht noch an" die Aufgabe. Die
   Übertragung steht als zweite Zeile darunter und behält ihre eigene Form
   am Punkt links. Deshalb stehen diese Regeln NACH .ok/.wartet/.fehler —
   gleiche Spezifität, die spätere gewinnt.
   Eine Störung schlägt beides: wer nicht angemeldet ist oder einen
   überholten Stand hat, muss das zuerst sehen. */
.netz--block.netz--tagoffen:not(.fehler){background:var(--surface);
  color:var(--fg);border-color:var(--border-strong)}
.netz--block.netz--tagda:not(.fehler){background:var(--success-bg);
  color:var(--success-fg);border-color:var(--success-border)}
/* Ab 720px geht die Fläche durch, der Text fluchtet mit dem Inhalt —
   dieselbe linke Kante wie #main. Der Block im Menü sitzt schon im
   Inhaltsraster und bleibt davon ausgenommen. */
@media(min-width:720px){
  .netz:not(.netz--block){padding-left:max(var(--space-4),calc(50% - var(--maxw)/2));
    padding-right:max(var(--space-4),calc(50% - var(--maxw)/2))}}
.gruss{margin-bottom:var(--space-5);font-size:var(--text-md);
  line-height:var(--leading-normal)}
.gruss b{display:block;font-size:var(--text-lg);font-weight:var(--weight-medium);
  margin-bottom:2px}
.gruss span{color:var(--fg-muted)}
.fernzeile{background:var(--warn-bg);border:1px solid var(--warn-border);
  color:var(--warn-fg);border-radius:var(--radius-md);
  padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);
  font-size:var(--text-md);line-height:var(--leading-normal)}
.fernzeile b{display:block;font-weight:var(--weight-medium);margin-bottom:2px}

/* Die dritte Wahl in einer Frage — „Trotzdem neu beginnen“ — stand bis v27
   als graue Kleinschrift mitten im Textkoerper: 36px hoch, ohne Rahmen,
   ohne Flaeche. Sie sah aus wie eine Bildunterschrift und nicht wie etwas,
   das man druecken kann; ihre Folge stand drei Zeilen darueber in einem
   eigenen Absatz. Jetzt ist sie ein Knopf ueber die ganze Breite, traegt
   ihre Folge in der zweiten Zeile und hat denselben 44px-Griff wie jeder
   andere Knopf im Keller. Der Name ist NICHT `.wahl` — das ist in der
   geteilten Gestaltungsschicht das Auswahlfeld. */
.andererweg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  width:100%;min-height:var(--tap-min);margin:var(--space-5) 0 0;
  padding:var(--space-3) var(--space-4);text-align:left;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:var(--radius-ctl);color:var(--fg);font:inherit}
.andererweg b{font-weight:var(--weight-medium);font-size:var(--text-md)}
.andererweg span{font-size:var(--text-sm);color:var(--fg-muted);
  line-height:var(--leading-normal)}
.andererweg:active{background:var(--surface-3)}

/* ═══════════════ Hilfe-Sheet ═══════════════
   Ersetzt die zwei Dauerzeilen über dem Inhalt. Beides steht jetzt an
   einer Stelle, und die Liste beginnt rund 180px weiter oben. */
.hilfebtn{width:var(--control-h-sm);height:var(--control-h-sm);flex-shrink:0;
  border:1px solid var(--border-on-dark);background:var(--surface-on-dark);
  color:var(--fg-on-dark);border-radius:var(--radius-md);
  font-size:var(--text-md);font-weight:var(--weight-medium);cursor:pointer;
  display:grid;place-items:center;line-height:1}
.sheet{position:fixed;inset:0;z-index:var(--z-overlay);display:flex;
  align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheetgrund{position:absolute;inset:0;background:rgba(28,34,32,.45)}
.sheetkarte{position:relative;background:var(--surface);width:100%;
  max-width:var(--maxw);max-height:82vh;display:flex;flex-direction:column;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow:var(--shadow-overlay)}
.sheetkopf{display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4);border-bottom:1px solid var(--border)}
.sheetkopf h3{flex:1;margin:0;font-size:var(--text-base);
  font-weight:var(--weight-medium)}
.sheetkoerper{padding:var(--space-4) var(--space-4) var(--space-8);overflow:auto}
/* ── F9 · Begrüßung ──────────────────────────────────────────────────
   Nicht bildschirmfüllend: die Karte ist so hoch wie ihr Inhalt. Unten
   respektiert sie die Home-Leiste (safe-area-inset-bottom) — sonst liegt
   „Passt" auf einem iPhone ohne Knopf halb darunter. */
.gruss-sheet .sheetkarte{max-height:none;
  padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom))}
/* Der Griff sagt, dass sich das Fenster nach unten wegwischen lässt. */
.sheetgriff{width:40px;height:4px;border-radius:2px;background:var(--border-heavy);
  margin:var(--space-2) auto var(--space-1)}
.grusskoerper{padding:var(--space-4) var(--space-4) var(--space-3);text-align:left}
/* Klein und ruhig, aber nicht in Versalien: „FR., 18.09." liest sich wie
   eine Warnung. Der Tag ist eine Auskunft, keine Ansage. */
.grusstag{font-size:var(--text-md);font-weight:var(--weight-medium);
  color:var(--fg-muted)}
.grusshallo{font:var(--weight-medium) var(--text-lg)/1.2 var(--font-display);
  margin-top:var(--space-1);color:var(--fg)}
.grussstand{font-size:var(--text-md);color:var(--fg-muted);margin-top:var(--space-2);
  line-height:var(--leading-normal)}
.grussstand:empty{display:none}
.grussknoepfe{display:flex;gap:var(--space-2);padding:0 var(--space-4) var(--space-4)}
/* 52 px, nicht 46: die beiden Knöpfe sind das Letzte, was vor dem Keller
   getroffen werden muss. Die Untergrenze des Auftrags ist 46. */
.grussdatum,.grusspasst{flex:1;min-height:var(--control-h-lg);border-radius:var(--radius-md);
  font:inherit;font-size:var(--text-md);font-weight:var(--weight-medium);cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center}
.grussdatum{position:relative;background:var(--surface);
  border:1px solid var(--border-strong);color:var(--fg)}
.grussdatum:active{background:var(--surface-3)}
/* Durchsichtig über dem Knopf, volle Fläche — siehe `.datumline`. */
.grussdatum input{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.grusspasst{background:var(--accent);border:1px solid var(--accent);color:var(--fg-on-dark)}
.grusspasst:active{background:var(--accent-dunkel)}
.sheetkoerper .hp{margin:0;font-size:var(--text-md);line-height:var(--leading-normal)}
.sheetkoerper .htip{margin:var(--space-3) 0 0;font-size:var(--text-md);
  color:var(--accent);line-height:var(--leading-normal)}
.sheetkoerper h4{margin:var(--space-6) 0 var(--space-3);font-size:var(--text-xs);
  text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--fg-subtle);
  font-weight:var(--weight-medium);padding-bottom:var(--space-2);
  border-bottom:1px solid var(--border)}
.sheetkoerper dl{margin:0;font-size:var(--text-md);line-height:var(--leading-normal)}
.sheetkoerper dt{font-weight:var(--weight-medium);margin-top:var(--space-4)}
.sheetkoerper dt:first-child{margin-top:0}
.sheetkoerper dd{margin:2px 0 0;color:var(--fg-muted)}

/* ═══════════════ Anmeldung ═══════════════ */
/* Zeichen und Untertitel stehen mittig über dem linksbündigen Text —
   die Marke ist ein Kopf, keine Zeile im Satz. */
.loginbox{display:flex;flex-direction:column}
.loginbox .marke{margin:var(--space-6) auto var(--space-2)}
.loginbox .marke svg{margin:0 auto}
.loginbox>.sub{text-align:center;margin-bottom:var(--space-6)}
.pinreihe{display:flex;gap:var(--space-3);margin:var(--space-2) 0 var(--space-3)}
.pinfeld{flex:1;height:var(--control-h-lg);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);background:var(--surface);position:relative}
.pinfeld.voll::after{content:"";position:absolute;left:50%;top:50%;
  width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent)}
/* Die einzige Zeile, die sagt, warum es nicht weitergeht. Sie stand in
   --danger auf Cream — 4,4:1 und damit unter dem Schwellwert für 13px.
   --danger-fg ist derselbe Ton, nur dunkler: 7:1. Im Dialog liegt
   .card2 p mit gleicher Spezifität darüber, deshalb der zweite Selektor.
   Dieselbe Zeile trägt jetzt auch Verwaltung und Freigabe — eine Form
   für „geht nicht, und zwar deshalb", nicht drei. */
.pinfehler{min-height:20px;margin:0 0 var(--space-3);font-size:var(--text-sm);
  line-height:var(--leading-normal);font-weight:var(--weight-medium);
  color:var(--danger-fg)}
.card2 .pinfehler{margin:var(--space-2) 0 0;font-size:var(--text-sm);
  color:var(--danger-fg)}
.block{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);
  margin-top:var(--space-4)}
.ztaste{height:var(--control-h-lg);border:1px solid var(--border-strong);
  background:var(--surface);border-radius:var(--radius-md);
  font-size:var(--text-lg);font-weight:var(--weight-medium);color:var(--fg);
  font-variant-numeric:tabular-nums;cursor:pointer}
.ztaste:active{background:var(--surface-3)}
.ztaste--weg{font-size:var(--text-base);color:var(--fg-muted)}
/* Bei wechselnder Codelänge kann die App nicht raten, wann der Code zu
   Ende ist — es braucht eine Taste dafür. Sie liegt, wo bis v21 ein leeres
   Feld war: untere Reihe, linke Ecke, in Daumenweite. Sie leuchtet erst,
   wenn der Code lang genug ist, damit niemand gegen eine tote Taste tippt. */
.ztaste--ok{background:var(--accent);border-color:var(--accent);color:var(--fg-on-dark)}
.ztaste--ok:disabled{background:var(--surface-3);border-color:var(--border-strong);
