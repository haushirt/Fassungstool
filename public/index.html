  color:var(--fg-subtle);cursor:default}
.login h1{font:var(--weight-medium) var(--text-display)/1.1 var(--font-display);

/* ═══════════════ Offene Punkte ═══════════════
   Als Fließtext mit Mittelpunkten war diese Liste unlesbar und mit nichts

.offenbox .offenliste{margin-top:var(--space-2)}

  min-height:var(--tap-min);padding:var(--space-1) 0;text-align:left;

  border:2px solid var(--danger);opacity:.75}

<style>
/* ══════════════════ Getränke ══════════════════ */
.gseg{display:flex;margin:var(--space-3) 0 var(--space-1);border:1px solid var(--fg);
 border-radius:var(--radius-md);overflow:hidden}
.gseg button{flex:1;background:none;border:0;min-height:var(--tap-min);
 padding:0 var(--space-2);font:inherit;font-size:var(--text-sm);
 font-weight:var(--weight-medium);color:var(--fg-muted);cursor:pointer;
 display:flex;align-items:center;justify-content:center;gap:var(--space-2);
 transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.gseg button.on{background:var(--accent);color:var(--fg-on-dark)}
.gseg .gb{font-size:var(--text-xs);font-weight:var(--weight-bold);
 padding:1px var(--space-2);border-radius:var(--radius-pill);
 background:var(--danger-bg);color:var(--danger-fg);font-variant-numeric:tabular-nums}
.gseg button.on .gb{background:var(--border-on-dark);color:var(--fg-on-dark)}

.gate{padding:var(--space-5) 0 var(--space-2)}
.gate h2{margin:0 0 var(--space-1);font-size:var(--text-lg);font-weight:var(--weight-medium)}
.gate p.gs{margin:0 0 var(--space-5);font-size:var(--text-sm);color:var(--fg-muted)}
.gbtn{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
 border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-3);
 cursor:pointer;font:inherit;
 transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.gbtn.wein{background:var(--surface);border:1px solid var(--fg)}
.gbtn.getr{background:var(--surface-3);border:1px solid var(--border-strong);
 padding:var(--space-3) var(--space-4)}
.gbtn .gi{width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-lg);
 background:var(--surface-3);display:grid;place-items:center;flex-shrink:0}
.gbtn.getr .gi{width:var(--control-h-sm);height:var(--control-h-sm);background:var(--surface-4)}
.gbtn .gi svg,.gbtn.getr .gi svg{width:20px;height:20px}
.gbtn.getr .gi svg{stroke:var(--fg-muted)}
.gbtn b{display:block;font-size:var(--text-base);font-weight:var(--weight-medium)}
.gbtn.getr b{font-size:var(--text-md)}
.gbtn span.s{display:block;font-size:var(--text-sm);color:var(--fg-muted);margin-top:2px}
/* Kein font-size hier: das Zeichen › traegt sein Bild im Mask-Bild der
   Regel oben, die dafuer font-size:0 setzt. Stand hier eine Groesse, kam
   das Textzeichen zusaetzlich zur Grafik durch — in eigener Farbe auf
   eigenem Grund, also mit 1:1 Kontrast. */
.gbtn .go2{margin-left:auto;color:var(--fg-subtle)}

/* ── Lade ── */
.drw{margin:var(--space-4) 0 0;border:1px solid var(--border-heavy);
 border-radius:var(--radius-lg);background:var(--surface-3);overflow:hidden}
.drwf{background:var(--surface-4);border-bottom:1px solid var(--border-heavy);
 padding:var(--space-2) var(--space-3);display:flex;align-items:center;
 justify-content:space-between;gap:var(--space-2)}
.drwf b{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
 text-transform:uppercase;color:var(--fg-secondary)}
.drwf i{font-style:normal;font-size:var(--text-xs);color:var(--fg-muted);
 font-variant-numeric:tabular-nums;white-space:nowrap;
 border:1px solid var(--border-strong);border-radius:var(--radius-pill);
 padding:2px var(--space-2);background:var(--surface)}
.drwf i.low{color:var(--danger);font-weight:var(--weight-bold);
 border-color:var(--danger-border);background:var(--danger-bg)}
/* Der Griff versprach eine Ziehgeste, die es nicht gibt. */
.drwh{display:none}
/* F2 (18.09.2026) · Warum die Lade jetzt ein Raster ist.
   Vorher: `display:flex; align-items:flex-end; overflow:hidden`. Drei
   Folgen, alle drei im Keller gefaehrlich:
     1. Unten buendig heisst: eine Spalte mit zweizeiligem Kuerzel
        („Alm-dudler", „Weiss-bier afr.") wird hoeher und schiebt ihre
        Flaschen samt Kopfzahl nach OBEN. In Lade 6 standen dadurch fuenf
        Kopfzahlen auf fuenf verschiedenen Hoehen, und kein Name stand mehr
        neben der Flasche, zu der er gehoert.
     2. `overflow:hidden` verschluckte den Beweis: bei 390 px war der Inhalt
        359 px breit in einem Kasten von 356 px — die achte Kachel wurde um
        3 px beschnitten, und keine Messung sah es (siehe tests/ui-mass.cjs).
     3. Passt eine Spalte nicht mehr, wurde sie schmaler gerechnet statt
        umgebrochen; bei 320 px lag das Kuerzel „Gast. 0,25" 3 px
        AUSSERHALB des Fensters.
   Jetzt: gleich hohe Zellen in einem Raster, das umbricht. Jede Zelle
   traegt genau einen Stapel in fester Reihenfolge — Kopfzahl, Zaehlpunkte,
   Trennstrich, Flaschenbild, Name. Kein absolutes Positionieren, kein
   Umfliessen, kein Beschnitt. */
.drwi{padding:var(--space-4) var(--space-3) var(--space-3);
 touch-action:auto;
 background:var(--surface-2);box-shadow:inset 0 1px 3px rgba(28,28,30,.06)}
/* Runde 14: feste Spaltenzahl statt auto-fit — die Lade steht wieder so
   da, wie sie im Kuehler liegt. `--gspalten` setzt gFit(). Nur unter
   360 px bricht sie um (`.drwi--umbruch`); dort passt kein Kuerzel mehr
   neben das andere, und kleiner als 15 px wird im Service nicht gesetzt. */
.drwi:not(.top){display:grid;
 grid-template-columns:repeat(var(--gspalten,4),1fr);
 gap:8px;align-items:start;justify-items:stretch}
.drwi--umbruch{grid-template-columns:repeat(auto-fit,minmax(72px,1fr))!important}
.drwi.top{display:flex;gap:var(--space-2);justify-content:center;align-items:flex-start}
.gcol{display:flex;flex-direction:column;align-items:center;position:relative;
 width:100%;min-width:0}
/* Kopfzahlen aller Spalten auf EINER Linie — auch dort, wo zwei Sorten
   uebereinander in derselben Spalte liegen (Lade 6: Red Ale ueber Pale
   Ale). Die zweite Zahl stand vorher mitten in der Spalte, zwischen den
   beiden Stapeln. */
.gnums{display:flex;gap:var(--space-2);align-items:baseline;justify-content:center;
 min-height:calc(var(--text-sm) * var(--leading-tight));margin-bottom:var(--space-2);
 flex-wrap:nowrap}
/* Gemeinsame Hoehe fuer alle Spalten einer Lade: damit stehen die
   Trennstriche auf einer Linie, egal ob die Spalte zehn oder sieben
   Flaschen fasst. Die Punkte haengen an der Standlinie unten, so wie die
   Flaschen in der Lade stehen. Die Hoehe setzt gFit(). */
.gstks{display:flex;flex-direction:column;align-items:center;
 justify-content:flex-end;gap:5px;width:100%}
.gnum{font-size:var(--text-sm);font-weight:var(--weight-bold);
 font-variant-numeric:tabular-nums;line-height:var(--leading-tight);
 letter-spacing:-.02em;color:var(--fg);white-space:nowrap}
.gnum.low{color:var(--danger)}
.gnum .tot{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--fg-subtle);
 text-decoration:none}

/* Wie in der Lade: hinten stehen die vollen, vorne fehlt es.
   Auf dem Schirm heißt das oben voll, unten grau. */
.gstk{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px}
.gpt{border-radius:50%;flex-shrink:0;width:var(--gd);height:var(--gd);align-self:center;
 display:flex;align-items:center;justify-content:center;color:var(--gnum-on-dot);
 font-variant-numeric:tabular-nums;letter-spacing:.02em;user-select:none}
.gpt.off{background:none!important;border:1px solid var(--border-heavy);
 color:transparent!important;box-shadow:inset 0 1px 2px rgba(28,28,30,.04)}
.gbase{width:80%;height:2px;background:var(--border-heavy);margin:var(--space-2) 0 0}
.gshot{height:52px;width:100%;display:flex;align-items:flex-end;justify-content:center;
 margin-top:var(--space-1)}
/* Gemeinsame Hoehe und gemeinsame Standlinie — sonst stehen Tetrapak,
   Weinflasche und Sprite in drei Massstaeben nebeneinander. */
.gshot img{display:block;opacity:.94;max-width:100%;max-height:44px;width:auto;
 height:auto;object-fit:contain;object-position:bottom}

/* Eine Zeile, abgeschnitten. Das Bild sagt ohnehin, was in der Flasche ist. */
/* Je Stapel steht das Kuerzel nur unter der untersten Flasche. Die leeren
   Kuerzel darueber reservierten trotzdem Hoehe und zogen den Stapel auf. */
/* Die Hoehe war mit 15px an die alte Schriftgroesse geheftet. Seit
   --text-xs auf 15px steht, braucht die Zeile 15 x 1,25 = 18,75px — das
   Kuerzel wurde unten beschnitten, „Fritsch (Karl)" verlor die Klammern.
   Jetzt folgt die Hoehe der Zeile, nicht einer festen Zahl. */
/* F2: Der Name gehoert unter SEINE Flasche und darf nie beschnitten
   werden. Zwei Zeilen Platz (2,6 em) halten die Namen aller Spalten auf
   einer Linie, auch wenn nur eine davon umbricht; getrennt wird
   automatisch, und was sich nicht trennen laesst, bricht hart um, statt
   in den Nachbarn zu laufen. */
.gcap{font-size:var(--text-xs);line-height:1.2;text-align:center;
 color:var(--fg-secondary);margin-top:var(--space-1);padding:0 1px;
 min-height:2.6em;
 white-space:normal;overflow-wrap:anywhere;hyphens:auto;
 width:100%;max-width:100%}
/* Runde 14: In den Spaltenladen darf das Kuerzel die Fuge mitbenutzen.
   Bei 390 px ist eine Spalte 35 px breit, die Fuge 8 — das Kuerzel bekommt
   damit 43 px statt 35 und braucht nicht mehr mitten im Wort zu brechen
   („San-bitte-r"). Die Kuerzel sind so gewaehlt, dass kein Wort breiter
   als diese 43 px wird; zwei Nachbarn stossen damit hoechstens aneinander,
   sie ueberlappen nie. Geprueft wird das in tests/ui-mass.cjs
   („Kuerzel in den Laden ueberlappen einander nicht"). */
.drwi:not(.top) .gcap{width:calc(100% + 8px);max-width:none;margin-left:-4px}
/* Dasselbe in Lade 1: die Zelle ist 40-48 px breit, die Fuge 8 px. */
.drwi.top .gitem .gcap{width:calc(100% + 8px);max-width:none;margin-left:-4px}
/* Im Fach haelt ein leeres Kuerzel die Grundlinie \u2014 sonst rutschen
   Saeulen ohne Beschriftung gegenueber ihren Nachbarn nach unten. In den
   Spaltenladen hat seit F2 jede Flasche einen Namen; :empty kommt dort
   nicht mehr vor und wuerde die Zellen sonst ungleich hoch machen. */
.zgrp .gcap:empty{visibility:hidden}
/* Der Versatz jeder zweiten Spalte — eine eigene Marke am Ladenkasten und
   ein Kuerzel von doppelter Spaltenbreite — ist mit dem Raster
   gegenstandslos geworden und ersatzlos entfallen: Er war die Antwort auf
   zu schmale Spalten (Lade 4 bei 390 px: 34 px je Spalte, Kuerzel 46 px
   breit). Das Raster gibt jeder Spalte mindestens 72 px und bricht sonst
   um — die Kuerzel stehen damit wieder alle auf einer Linie, statt
   abwechselnd eine Zeile tiefer. */

/* Fächer in einer Lade: eigener Kasten, waagrechte Reihen. */
.fach{margin:var(--space-3) var(--space-3) 0;border:1px solid var(--border-strong);
 border-radius:var(--radius-md);background:var(--surface-2);padding:var(--space-3);
 box-shadow:inset 0 1px 3px rgba(28,28,30,.06)}
.fach:last-of-type{margin-bottom:2px}
.facht{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
 text-transform:uppercase;color:var(--fg-muted);margin-bottom:var(--space-2);
 display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)}
.fachn{font-size:var(--text-sm);font-weight:var(--weight-bold);
 font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;color:var(--fg)}
.fachn.low{color:var(--danger)}
.fachn .tot{font-size:var(--text-xs);color:var(--fg-subtle);text-decoration:none;
 font-weight:var(--weight-medium)}
.zeilen{display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
/* Stapel unten bündig, damit die Kürzel auf einer Linie stehen. */
.zeile{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:flex-end;
 justify-content:center}
.zgrp--stapel{gap:var(--space-2)}
.zgrp{display:flex;flex-direction:column;align-items:center;gap:var(--space-1)}
/* Flaschen stehen übereinander, die Sorten nebeneinander. */
.zpts{display:flex;flex-direction:column;gap:5px;align-items:center}
/* Liegend gestapelt: die Flaschen liegen nebeneinander in der Lade. */
.zpts.quer{flex-direction:row}
.zgrp .gpt{width:var(--gpt-s);height:var(--gpt-s)}
.zgrp .gcap{width:auto;max-width:none;margin-top:0}
.fach .rrows{row-gap:var(--space-2);column-gap:var(--space-1)}

.gcell{position:relative;cursor:pointer;display:grid;place-items:center;flex-shrink:0;
 width:var(--gcell);height:var(--gcellh,calc(var(--gcell) * 1.24))}
/* Die Zelle ist ein Fach in der Lade, keine Karte auf einer Fläche:
   heller Innenraum, feine Kontur, ein Hauch Tiefe an der Oberkante. */
.gcell .gsh{position:absolute;inset:0;border:1px solid var(--border);
 background:var(--surface);border-radius:var(--radius-sm);
 box-shadow:0 1px 0 rgba(0,73,71,.07)}
.gcell svg{position:relative;z-index:1;width:80%;height:80%}
.gcell img{position:absolute;left:10%;right:10%;top:6%;bottom:6%;width:80%;height:88%;
 object-fit:contain;z-index:1;display:block}
.gcell.gx img,.gcell.gx svg{opacity:.16;filter:grayscale(1)}
.gcell.gx .gsh{background:none;border-style:dashed;border-color:var(--border-heavy)}
.gsq{display:flex;flex-direction:column;gap:var(--space-2)}
.gitem{display:flex;flex-direction:column;align-items:center;width:var(--gcell)}
/* Auch im Rasterfach zweizeilig statt abgeschnitten: „Johannisbeere"
   wurde sonst zu „Johannisbee…". Gleiche Regel wie in den Fotoladen. */
.gitem .gcap{margin-top:var(--space-1);min-height:2.6em;white-space:normal;
 overflow:visible;height:auto;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.gitem.gx .gcap{color:var(--danger)}
/* Miniatur-Schleier: dieselbe Sprache wie die kontrollierte Spalte
   in den Fotoladen, nur auf Zellengroesse. */
.gitem--geprueft .gcell .gsh{background:var(--success-tint);border-color:var(--success)}
.gitem--geprueft .gcap{color:var(--success-fg);font-weight:var(--weight-medium)}
.gspal{width:var(--gcell)}
.gspec{display:flex;gap:var(--space-2);padding-left:var(--space-2);margin-left:var(--space-1);
 border-left:1px solid var(--border);align-self:stretch;justify-content:center}
.gspec .gsq{flex-shrink:0}

.rsec{padding:var(--space-3);display:flex;gap:var(--space-3);justify-content:center;
 align-items:flex-end;touch-action:auto}
.rdiv{height:1px;background:var(--border-strong);margin:0 var(--space-3)}
.rsec2{padding:var(--space-3)}
.rhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-3)}
.rhd b{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
 text-transform:uppercase;color:var(--fg-secondary)}
.rhd i{font-style:normal;font-size:var(--text-sm);font-weight:var(--weight-bold);
 font-variant-numeric:tabular-nums}
.rhd i.low{color:var(--danger)}
.rhd i .tot{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--fg-subtle);
 text-decoration:none}
/* Enge Spalten, weite Zeilen: jede Reihe liest sich als ein Träger zu sechst. */
.rrows{display:grid;grid-template-columns:repeat(6,max-content);column-gap:3px;
 row-gap:var(--space-5);justify-content:center;cursor:pointer;touch-action:none}
.rrows .gpt{width:var(--grack);height:var(--grack);margin:0!important}

.drwb{padding:0 var(--space-2) var(--space-3);display:flex;gap:var(--space-2)}
.drwb button{flex:1;font-size:var(--text-sm)}
.drwb button.weiter{font-size:var(--text-md)}
.drwb button.reset{flex:0 0 auto;color:var(--fg-subtle);font-weight:var(--weight-regular)}
.ghint{font-size:var(--text-xs);color:var(--fg-subtle);
 padding:var(--space-2) var(--space-3);margin:0}

@media(min-width:768px){
 .gladen{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--space-4);align-items:start}
 .gladen .drw.wide{grid-column:1 / -1}}

/* Produktfotos in Listenzeilen bleiben in ihrem Kästchen. */
.gic{overflow:hidden}
.gic img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.gic svg{width:100%;height:100%}
.gic--row{width:26px;height:32px;display:flex;align-items:flex-end;
 justify-content:center;flex-shrink:0}
.gic--row img{max-height:32px}
.gic--row svg{width:20px;height:20px}

.gblk{background:var(--surface-3);margin:var(--space-5) calc(var(--space-4) * -1) 0;
 padding:var(--space-3) var(--space-4) var(--space-4);border-top:1px solid var(--border-strong)}
.gblkh{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:var(--track-caps);
 text-transform:uppercase;color:var(--fg-secondary);padding-bottom:var(--space-2);
 border-bottom:1px solid var(--border-strong);display:flex;justify-content:space-between}
.gblkh i{font-style:normal;letter-spacing:0;text-transform:none;
 font-weight:var(--weight-medium);color:var(--fg-subtle)}

@media(hover:hover) and (pointer:fine){
 .gbtn:hover{background:var(--surface-2)}
 .gbtn.getr:hover{background:var(--surface-4)}
 .gseg button:hover{background:var(--surface-3)}
 .gseg button.on:hover{background:var(--fg-secondary)}
 .holz:hover{background:var(--surface-3)}}

</style>

/* P8 · Es gibt nur noch eine Codeebene: den persönlichen Zugangscode.
   Verwaltung und Freigabe hatten bis v12 einen eigenen vierstelligen Code,
   der als Konstante in dieser Datei stand. Klartext in einer öffentlich
   ausgelieferten HTML-Datei ist keine Sperre, sondern eine Unterschrift. */
/* Die vier Codes standen bis v11 im Klartext in dieser Datei — wer die
   Seite aufrief, konnte sie lesen. Die Anmeldung läuft jetzt über den
   Server. Für den Keller ohne Netz merkt sich das Gerät, wer sich hier
   schon einmal erfolgreich angemeldet hat: als Prüfsumme, nicht als Code.
   Ein fremdes Gerät kommt damit nicht hinein, ein bekanntes schon. */
const K_BEKANNT="hh_bekannt_v1";
async function codeSumme(code){
  try{
    const b=new TextEncoder().encode("hh:"+code);
    const h=await crypto.subtle.digest("SHA-256",b);
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "roh:"+code; }
}
async function merkeCode(code,name){
  const k=await codeSumme(code);
  const m=(()=>{try{return JSON.parse(localStorage.getItem(K_BEKANNT))||{};}catch(e){return {};}})();
  /* Pro Person genau ein Code — der zuletzt beim Server bestätigte. Sonst
     bleibt ein ersetzter Code auf jedem Gerät liegen, das ihn einmal
     gesehen hat: Er käme ohne Netz weiter in die App und öffnete
     Verwaltung und Freigabe. Die vier ersten Codes des Hauses sind aus der
     Geschichte des Anhangs bekannt; sie zu ersetzen hilft nur, wenn sie
     auf den Geräten auch verschwinden. Das geschieht bei der ersten
     Anmeldung mit dem neuen Code. */
  for(const s of Object.keys(m)) if(m[s]===name&&s!==k) delete m[s];
  m[k]=name; try{localStorage.setItem(K_BEKANNT,JSON.stringify(m));}catch(e){}
}
async function bekannterCode(code){
  const k=await codeSumme(code);
  try{ return (JSON.parse(localStorage.getItem(K_BEKANNT))||{})[k]||null; }catch(e){ return null; }
}

/* ── Betriebstag ──────────────────────────────────────────────────────
   F1 (18.09.2026): Der Tag wurde bis hierher aus `toISOString()` gelesen,
   also in UTC. Zwischen Mitternacht und 02:00 Ortszeit (Sommerzeit) lieferte
   das den VORTAG — und `blank()` zog fuer die Tagesfassung zusaetzlich einen
   weiteren Tag ab. Am Freitag stand deshalb „Fuer Donnerstag" im Kopf,
   waehrend die Kellerzaehlung daneben den Freitag schrieb: zwei Schluessel
   fuer denselben Abend. Gerechnet wird jetzt in Europe/Vienna, an einer
   Stelle, und die Tagesfassung laeuft auf den Tag, an dem sie gemacht wird.
   Dieselbe Funktion steht in leitung.html — wer eine aendert, aendert beide. */
function wienTag(d){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Vienna",
    year:"numeric",month:"2-digit",day:"2-digit"}).format(d||new Date());
}
/* Einen Betriebstag zurueck, ohne Zeitzonenfalle: Mittag UTC liegt von
   jeder Sommer-/Winterzeitumstellung weit genug entfernt. */
function tagMinus(iso,n){
  const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-n);
  return d.toISOString().slice(0,10);
}
function today(){return wienTag();}
function yest(){return tagMinus(today(),1);}

/* ══════════════════ Mehrgerätebetrieb ══════════════════
   Grundsatz: Das Gerät ist die Wahrheit, solange es allein ist. Der
   Server ist die Wahrheit, sobald mehrere Geräte im Spiel sind. Dazwischen
   liegt ein Ausgang (eine Warteschlange), der nie etwas verliert.

   Alles hier ist zusätzlich. Antwortet der Server nicht, bleibt die App
   exakt das, was sie vorher war: ein Werkzeug, das offline im Keller
   funktioniert und sein Protokoll per Mail weitergibt.

   Ein Vorgang ist ein vollständiger Zustand, kein Zuwachs. Er wird unter
   seinem Schlüssel (modus_tag) abgelegt; die höhere Zählnummer gewinnt.
   Zwei Leute am selben Vorgang sind kein Merge-Problem, sondern eine
   Frage an den Menschen — deshalb wird gefragt, nicht zusammengerechnet. */
const API="/api";
/* ── Rolle ───────────────────────────────────────────────────────────────
   F5 (18.09.2026): Der Fuss der Startseite trug einen Knopf „Verwaltung"
   und keinen einzigen Weg ins Backoffice. „Verwaltung" ist weg; an seiner
   Stelle steht „Backoffice" — aber nur fuer die Leitung.
   Woher die Rolle kommt: aus `GET /api/ich`, das der Worker schon hat
   (src/index.js, „/api/ich" liefert {name, rolle}). Die Anmeldung selbst
   wird dafuer NICHT angefasst — kein Code, kein Token, kein Speicher der
   Anmeldung aendert sich. Ohne Netz bleibt die Rolle unbekannt und der
   Link ungezeigt: lieber ein fehlender Link als einer, der ins Leere
   fuehrt. Die Rolle liegt in der Sitzung, nicht dauerhaft — beim
   Personenwechsel ist sie damit von selbst weg. */
const RKEY="hh_rolle";
function meineRolle(){try{return sessionStorage.getItem(RKEY)||"";}catch(e){return "";}}
function setRolle(r){try{r?sessionStorage.setItem(RKEY,r):sessionStorage.removeItem(RKEY);}catch(e){}}
async function zieheRolle(){
  if(!whoAmI())return;
  try{
    const r=await fetch(API+"/ich",{credentials:"same-origin",
      headers:{accept:"application/json"}});
    if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))return;
    const j=await r.json();
    const alt=meineRolle();
    setRolle(j.rolle||"");
    /* Erst der Server, dann der Link: die Startseite steht beim ersten
       Aufbau schon da. Nur neu zeichnen, wenn sich wirklich etwas aendert
       und man auch hinsieht. */
    if((j.rolle||"")!==alt && !mode && $("#menu").style.display!=="none")renderMenu();
  }catch(e){}
}
const K_AUSGANG="hh_ausgang_v1", K_GERAET="hh_geraet_v1",
      K_ZAEHL="hh_zaehlnr_v1", K_FERN="hh_fern_v1",
      K_UEBERHOLT="hh_ueberholt_v1";

function uuid(){
  try{ if(crypto.randomUUID)return crypto.randomUUID(); }catch(e){}
  return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function geraetId(){
  let g=null; try{g=localStorage.getItem(K_GERAET);}catch(e){}
  if(!g){ g=uuid(); try{localStorage.setItem(K_GERAET,g);}catch(e){} }
  return g;
}
const GERAET=geraetId();
const jlese=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f;}catch(e){return f;}};
const jschreib=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

let NETZ={zustand:"unbekannt", offen:0, ueberholt:0, letzte:0, laeuft:false};
let FERN=jlese(K_FERN,{});          /* schluessel → Vorgang vom Server  */
let AEND=0;                          /* Zeitstempel der letzten Änderung */
function merkeAenderung(){ AEND=Date.now(); }

function schluesselVon(rec){ return rec.mode+"_"+rec.tag; }
function zaehlnr(sch,neu){
  const z=jlese(K_ZAEHL,{});
  if(neu){ z[sch]=(z[sch]||0)+1; jschreib(K_ZAEHL,z); }
  return z[sch]||0;
}

/* Der Ausgang hält je Schlüssel höchstens einen Eintrag: Ein Vorgang ist
   ein Zustand, kein Zuwachs — der neuere ersetzt den älteren restlos. */
function inDenAusgang(rec,status){
  if(!rec||!rec.mode||!rec.tag)return;
  const sch=schluesselVon(rec);
  const a=jlese(K_AUSGANG,[]).filter(x=>x.schluessel!==sch);
  /* Der Server nimmt den Vorgang selbst entgegen (PUT /api/vorgang/<id>),
     nicht einen Umschlag darum. Was er zur Einordnung braucht \u2014 Gerät
     und Zählnummer \u2014 reist deshalb IM Vorgang mit und kommt so auch
     wieder zurück. */
  const paket=JSON.parse(JSON.stringify(rec));
  delete paket._gesendet;
  paket.geraet=GERAET;
  paket.zaehlnr=zaehlnr(sch,true);
  paket.name=rec.name||whoAmI()||"";
  paket.zeit=new Date().toISOString();
  a.push({schluessel:sch, id:uuid(), daten:paket, versuche:0});
  jschreib(K_AUSGANG,a);
  NETZ.offen=a.length; netzChip();
}

/* ── Sackfach für überholte Stände ─────────────────────────────────────
   409 heißt: Auf einem anderen Gerät gibt es einen neueren Stand
   desselben Vorgangs. Noch einmal senden hilft nicht — der Server lehnt
   denselben Stand wieder ab, und die Reihe dahinter stünde still. Der
   Eintrag muss also aus der Warteschlange heraus.
   Wegwerfen darf man ihn aber nicht (Regel 6): Wer eine Stunde gezählt
   hat, hörte sonst als einzige Antwort die grüne Zeile „alles übertragen".
   Er wandert deshalb ins Sackfach, bleibt im Gerät und bleibt sichtbar,
   bis ihn jemand zur Kenntnis genommen hat. */
function ueberholtAlle(){ return jlese(K_UEBERHOLT,[]); }
function ueberholtOffen(){ return ueberholtAlle().filter(x=>!x.quittiert); }
function insSackfach(e,fremd){
  /* Je Vorgang der jüngste überholte Stand — ein zweiter Konflikt am
     selben Schlüssel ersetzt den ersten. Zwanzig Einträge sind die
     Obergrenze, damit der Gerätespeicher nicht zuläuft. */
  const a=ueberholtAlle().filter(x=>x.schluessel!==e.schluessel);
  a.push({schluessel:e.schluessel, id:e.id, daten:e.daten,
          zeit:(e.daten&&e.daten.zeit)||new Date().toISOString(),
          fremd:fremd?{name:fremd.name||"", zeit:fremd.zeit||"",
                       zaehlnr:+fremd.zaehlnr||0}:null,
          quittiert:0});
  jschreib(K_UEBERHOLT,a.slice(-20));
}
/* Zur Kenntnis genommen. Der Stand bleibt liegen, nur die Zeile schweigt. */
function ueberholtQuittieren(){
  jschreib(K_UEBERHOLT,ueberholtAlle().map(x=>{x.quittiert=1;return x;}));
  NETZ.ueberholt=0; netzChip();
}

async function schiebe(){
  if(NETZ.laeuft)return; NETZ.laeuft=true;
  try{
    let a=jlese(K_AUSGANG,[]);
    while(a.length){
      const e=a[0];
      let r;
      try{
        /* Der Schlüssel modus_tag IST die Kennung des Vorgangs. Zweimal
           dasselbe Paket schreibt damit dieselbe Zeile \u2014 doppeltes
           Senden nach einem Netzabbruch kann keine Geistervorgänge
           erzeugen, ganz ohne Idempotenzschlüssel. */
        r=await fetch(API+"/vorgang/"+encodeURIComponent(e.schluessel),
          {method:"PUT",credentials:"same-origin",
           headers:{"content-type":"application/json"},
           body:JSON.stringify(e.daten)});
      }catch(err){ NETZ.zustand="offline"; break; }
      if(r.status===401){ NETZ.zustand="abgemeldet"; break; }
      if(r.status>=500||r.status===429){ NETZ.zustand="serverfehler"; break; }
      if(!r.ok && r.status!==409){ NETZ.zustand="serverfehler"; break; }
      /* 409: nicht verloren, sondern überholt — der Stand geht ins
         Sackfach, bevor er die Reihe verlässt. */
      if(r.status===409){
        let fremd=null;
        try{ const j=await r.json(); fremd=(j&&j.server)||null; }catch(err){}
        insSackfach(e,fremd);
      }
      a=jlese(K_AUSGANG,[]).filter(x=>x.id!==e.id);
      jschreib(K_AUSGANG,a);
      NETZ.zustand="verbunden"; NETZ.letzte=Date.now();
    }
    NETZ.offen=jlese(K_AUSGANG,[]).length;
    NETZ.ueberholt=ueberholtOffen().length;
  } finally { NETZ.laeuft=false; netzChip(); }
}

async function zieheFern(){
  try{
    const r=await fetch(API+"/vorgaenge",{credentials:"same-origin",
      headers:{accept:"application/json"}});
    if(r.status===401){ NETZ.zustand="abgemeldet"; netzChip(); return; }
    if(!r.ok||!(r.headers.get("content-type")||"").includes("json")){
      NETZ.zustand="kein-server"; netzChip(); return; }
    const j=await r.json();
    const liste=Array.isArray(j)?j:(j.vorgaenge||[]);
    /* Der Worker liefert den Vorgang flach: die gespeicherten Daten,
       darüber gelegt id, tag, mode, name, finished, archiviert. */
    const f={};
    liste.forEach(v=>{
      if(!v||!v.mode||!v.tag)return;
      const sch=v.id||(v.mode+"_"+v.tag);
      f[sch]={schluessel:sch, modus:v.mode, tag:v.tag, name:v.name||"",
              status:v.finished?"fertig":"laeuft",
              geraet:v.geraet||"", zaehlnr:+v.zaehlnr||0,
              zeit:v.zeit||v.archiviert||"", daten:v};
    });
    const vorher=JSON.stringify(Object.keys(FERN).sort().map(k=>[k,FERN[k].zaehlnr,FERN[k].status]));
    FERN=f; jschreib(K_FERN,FERN);
    NETZ.zustand="verbunden"; NETZ.letzte=Date.now();
    /* Der Fernstand trifft nach dem ersten Aufbau ein. Ohne dieses
       Nachzeichnen bliebe die Zeile „Läuft gerade woanders" bis zum
       nächsten Menüaufruf unsichtbar. */
    const nachher=JSON.stringify(Object.keys(FERN).sort().map(k=>[k,FERN[k].zaehlnr,FERN[k].status]));
    if(vorher!==nachher && !mode && whoAmI() && $("#menu").style.display!=="none"){
      renderMenu();
    }
    /* Die Begrüßung steht schon, wenn der Server antwortet. Ihre dritte
       Zeile wird dann nachgetragen statt zu fehlen. */
    if(typeof grussFuellen==="function" && !$("#gruss").hidden)grussFuellen();
  }catch(e){ NETZ.zustand="offline"; }
  netzChip();
}

/* Läuft anderswo etwas? Das beantwortet die Zeile über den Kacheln. */
function fernOffen(){
  const heute=today(), gestern=yest();
  return Object.values(FERN).filter(v=>
    v.status==="laeuft" && v.geraet!==GERAET && (v.tag===heute||v.tag===gestern));
}
/* Gibt es zu diesem Modus einen neueren Stand woanders? */
function fernNeuer(m){
  /* BERICHTIGUNG (Jagd 13, A2): Hier stand `today()`, waehrend `start()`
     mit `vorgabeTag()` rechnet. Wer in der Begruessung einen anderen Tag
     gewaehlt hatte, bekam den Dialog „Auf einem anderen Geraet weiter?"
     fuer den HEUTIGEN Tag, und `start()` legte danach einen leeren
     Vorgang fuer den GEWAEHLTEN an: der uebernommene Stand war sofort
     wieder weg, und der Dialog kam nie wieder, weil die Zaehlnummer
     quittiert war. Beide Seiten fragen jetzt denselben Tag. */
  const ziel=vorgabeTag();
  const v=FERN[m+"_"+ziel];
  if(!v||v.geraet===GERAET)return null;
  const eigen=zaehlnr(m+"_"+ziel);
  return (v.zaehlnr||0)>eigen ? v : null;
}

/* Der Satz für einen Stand, den der Server nicht angenommen hat.
   Gelesen wird er im Keller oder kurz danach, müde, nach einer Stunde
   Zählen. Drei Dinge muss er leisten, mehr nicht:
     1. Es ist NICHT draußen — und es geht auch nicht mehr von selbst
        hinaus (sonst wäre es eine Zeile „… wartet").
     2. Woran erkenne ich, welchen Stand es trifft? → die eigene Uhrzeit.
     3. Muss ich noch einmal hinunter? → Nein: „hat danach gezählt".
   Weg ist, was nur Wettlauf erzählt („war mit einem neueren Stand
   schneller") und die erfundene Bedienung („Tippen, wenn gesehen") —
   quittiert wird am Knopf daneben. */
function ueberholtSatz(l){
  /* Welcher Vorgang? „Dein Stand" allein sagt es nicht. An einem Abend
     laufen leicht drei: Tagesfassung, eine Sonderentnahme für die Küche,
     ein Nachfüllen an der Bar. Ob die Stunde Zählen weg ist oder eine
     Flasche für den Koch, ist ein Unterschied — und bei mehreren Ständen
     war „3 Stände sind nicht übernommen" gar keine Auskunft mehr.
     Der Name steht deshalb vorn wie eine Betreffzeile. Er hängt nicht am
     Artikel: „Deine Nachfüllen" gäbe es sonst. */
  const name=e=>{ const m=(e.daten&&e.daten.mode)
      ||String(e.schluessel||"").split("_")[0];
    return (MODES[m]&&MODES[m].t)||"Vorgang"; };
  /* Die Uhrzeit allein genügt nur am selben Tag. Ein Gerät, das über
     Nacht ohne Netz im Spind lag, meldet sonst „von 20:40" und meint
     gestern — und der eigene Stand ist am Datum nicht wiederzuerkennen. */
  const wann=s=>{ const d=new Date(s||0); if(isNaN(d))return "";
    const uhr=d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
    const h=new Date(), tage=Math.round(
      (new Date(h.getFullYear(),h.getMonth(),h.getDate())
       -new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
    if(tage<=0)return uhr;
    if(tage===1)return "gestern "+uhr;
    return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit"})+" "+uhr; };
  if(l.length>1){
    const n=l.map(name);
    return n.length<=3
      ? "Nicht übernommen: "+n.join(", ")+". Andere Geräte haben danach gezählt."
      : l.length+" Stände sind nicht übernommen – andere Geräte "
        +"haben danach gezählt.";
  }
  const e=l[0]||{}, meine=wann(e.zeit), wer=(e.fremd&&e.fremd.name)||"";
  return name(e)+": Dein Stand"+(meine?" von "+meine:"")+" ist nicht "

/* Ein Satz, der beantwortet: Ist meine Arbeit draußen oder noch im Gerät?
   Vorher stand „Offline" in zwei Zeilen mit zwei verschiedenen Zusagen.
   „Nicht angemeldet" und „Server antwortet nicht" sind Fehler, keine
   Ruhezustände — sie tragen jetzt auch die Form und Farbe eines Fehlers.
   navigator.onLine wird mitgelesen: wer die App im Keller ohne Netz
   öffnet, bekommt sonst erst beim ersten Sendeversuch eine Auskunft. */
/* Runde 14 · Der Satz, wegen dem man die App aufmacht.
   `tagesSatz()` erzählt alles, was heute passiert ist, in bis zu fünf
   Sätzen. Für die Zeile ganz oben zählt eine Frage: Ist die Tagesfassung
   schon da? Ohne Netz kennt das Gerät die Vorgänge des Tages nicht — dann
   steht hier nichts, statt etwas zu behaupten (dieselbe Regel wie in
   `tagesSatz` und in der Begrüßung). */
function tagesStand(){
  if(NETZ.zustand!=="verbunden")return {t:"",k:""};
  const heute=today();
  const alle=Object.values(FERN).filter(v=>v.tag===heute&&v.modus==="tag");
  const fertig=alle.find(v=>v.status==="fertig");
  if(fertig){
    const d=new Date(fertig.zeit||0);
    const uhr=isNaN(d)?"":d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
    return {t:"Tagesfassung ist da"+(uhr?" · "+uhr:"")+
              (fertig.name?" · "+fertig.name:""), k:"gut"};
  }
  if(alle.length)return {t:"Tagesfassung ist angefangen",k:"offen"};
  return {t:"Tagesfassung steht noch an",k:"offen"};
}

function netzChip(){
  /* Zwei Orte, ein Zustand: die Leiste unter dem Kopf (im Vorgang) und
     der Block über den Kacheln (im Menü). Nach dem Abschluss steht man
     im Menü — dort wurde bisher gar nichts mehr angezeigt, auch der
     überholte Stand nicht. Sichtbar ist immer nur einer von beiden; der
     andere liegt in einem Elternteil mit display:none. */
  const els=document.querySelectorAll(".netz"); if(!els.length)return;
  const z=NETZ.zustand, o=NETZ.offen;
  const weg=(navigator.onLine===false)||z==="offline";
  /* F7 (18.09.2026): „offen" hiess in dieser Zeile „die Warteschlange ist
     leer" und zwei Zeilen darueber „die Aufgabe ist unerledigt". Auf der
     Startseite standen beide Bedeutungen uebereinander: der Satz zur
     Tagesfassung („heute noch offen") und direkt darunter dieselbe
     Vokabel fuer eine leere Warteschlange.
     Diese Zeile spricht jetzt nur noch von der UEBERTRAGUNG; das Wort
     „offen" gehoert der Aufgabe. */
  /* „Alles übertragen" war zweideutig: über der Zeile steht, dass die
     Tagesfassung noch aussteht — und darunter, es sei alles übertragen.
     Gemeint war immer: auf diesem GERÄT liegt nichts mehr, was noch
     hinaus muss. Genau das steht jetzt da. Die Zeile spricht vom Gerät,
     die Zeile darüber von der Arbeit. */
  const viele=o===1?"1 Vorgang liegt noch auf diesem Gerät"
                   :o+" Vorgänge liegen noch auf diesem Gerät";
  const ueb=ueberholtOffen();
  let t="", k="", quittierbar=false;
  /* „Nicht angemeldet" steht davor: solange das gilt, geht überhaupt
     nichts hinaus. Gleich danach aber der überholte Stand — er darf nie
     hinter der grünen Zeile „alles übertragen" verschwinden. */
  if(z==="kein-server"&&!ueb.length){ t=""; }
  else if(z==="abgemeldet"){ t="Nicht angemeldet – bitte neu anmelden"; k="fehler"; }
  else if(ueb.length){ t=ueberholtSatz(ueb); k="fehler"; quittierbar=true; }
  else if(weg&&o>0){ t=viele+" – kein Netz"; k="wartet"; }
  else if(weg){ t="Kein Netz – alles ist im Gerät gespeichert"; k="offline"; }
  else if(z==="serverfehler"){ t=o>0?"Server antwortet nicht – "+viele
                                    :"Server antwortet nicht"; k="fehler"; }
  else if(o>0){ t=viele; k="wartet"; }
  else if(z==="verbunden"){ t="Nichts liegt mehr auf diesem Gerät"; k="ok"; }
  els.forEach(el=>{
    /* Der Block auf der Startseite bleibt stehen, solange er wenigstens
       eine der beiden Zeilen zu sagen hat — die Frage „ist die
       Tagesfassung da?" ist auch dann eine Antwort wert, wenn nichts mehr
       zu übertragen ist. */
    const istBlock=el.classList.contains("netz--block");
    if(!t && !(istBlock && tagesStand().t)){ el.style.display="none"; return; }
    el.style.display="";
    /* className nicht überschreiben — der Block im Menü trägt zusätzlich
       .netz--block und verlöre sonst seinen Rahmen. */
    el.classList.remove("ok","wartet","offline","fehler");
    if(k)el.classList.add(k);
    const txt=el.querySelector(".netztext");
    if(txt)txt.textContent=t; else el.textContent=t;
    /* Nur der Block auf der Startseite trägt die Hauptzeile. Die schmale
       Leiste im Vorgang bleibt, wie sie war: dort weiss man, was man
       gerade tut. */
    const haupt=el.querySelector(".netzhaupt");
    if(haupt){
      const st=tagesStand();
      haupt.textContent=st.t;
      el.classList.toggle("netz--tagoffen",st.k==="offen");
      el.classList.toggle("netz--tagda",st.k==="gut");
    }
    const btn=el.querySelector(".netzok");
    if(btn){ btn.hidden=!quittierbar; btn.onclick=ueberholtQuittieren; }
  });
}

let LETZTER_ZWISCHEN=0;
function sammle(){
  Object.keys(MODES).forEach(m=>{
    const d=S[m];
    if(d&&d.finished&&!d._gesendet){ d._gesendet=1; inDenAusgang(d,"fertig"); }

function zwischenstand(){
  if(!mode)return;

/* Ein Satz zur Lage, bevor die Kacheln kommen. Er fasst zusammen, was
   heute schon passiert ist \u2014 aus den Vorgängen des Servers, nicht aus
   dem eigenen Gerät. Ohne Server bleibt es beim Gruß; ein erfundener
   Tagesbericht wäre schlimmer als gar keiner. */
function tagesSatz(){
  const heute=today();
  const alle=Object.values(FERN).filter(v=>v.tag===heute);
  const ich=whoAmI();
  const wann=v=>{ const t=new Date(v.zeit||0);
    return isNaN(t)?"":t.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}); };
  const frueh=v=>{ const t=new Date(v.zeit||0); return !isNaN(t)&&t.getHours()<11; };
  const teile=[];
  const fertig=alle.filter(v=>v.status==="fertig");
  const laeuft=alle.filter(v=>v.status==="laeuft");

  fertig.forEach(v=>{
    const wer=(v.name===ich)?"Du hast":esc(v.name||"Jemand")+" hat";
    if(v.modus==="tag")   teile.push(wer+(frueh(v)?" in der Früh":" um "+wann(v))+" die Tagesfassung gemacht.");
    if(v.modus==="fuellen")teile.push(wer+" um "+wann(v)+" nachgefüllt.");
    if(v.modus==="ware")  teile.push(wer+" eine Lieferung einsortiert.");
    if(v.modus==="keller")teile.push(wer+" den Keller gezählt.");
    if(v.modus==="nach")  teile.push(wer+" außer der Reihe etwas geholt.");
  });
  if(!alle.some(v=>v.modus==="tag"))
    teile.push(laeuft.some(v=>v.modus==="tag")
      ? "Die Tagesfassung ist angefangen, aber noch offen."
      : "Die Tagesfassung ist heute noch offen.");
  return teile;
}

function hasData(k,d){
  if(k==="tag")return sum(d.rest)||sum(d.barrot)||sum(d.bar)||sum(d.backup)||sum(d.zusatz)
    ||Object.keys(d.seen||{}).length||Object.keys(d.getr||{}).length||sum(d.gent);
  if(k==="keller")return Object.keys(d.zdone||{}).length||Object.keys(d.getr||{}).length;
  if(k==="fuellen")return Object.keys(d.getr||{}).length||Object.keys(d.gdone||{}).length
    ||Object.keys(d.gholt||{}).length||Object.keys(d.gcheck||{}).length||sum(d.gzusatz);
  if(k==="nach")return sum(d.ent)||sum(d.gent)||sum(d.gzusatz);
  if(k==="ware")return (d.pos||[]).length||sum(d.gent);
}
/* Ein Satz über den Inhalt eines Vorgangs – für die Frage „steht schon".
   Bewusst ohne `D()`/`summaryBig()`: die beiden lesen den GERADE offenen
   Vorgang über globale Zustände, hier ist der bisherige gemeint. */
function kurzInhalt(m,d){
  if(!d) return "";
  if(m==="ware"){
    const pos=(d.pos||[]).filter(p=>p.id&&+p.kisten>0);
    return pos.length+(pos.length===1?" Position":" Positionen")+" · "+
      pos.reduce((a,p)=>a+(+p.kisten||0)*kg(p),0)+" Flaschen";
  }
  if(m==="nach")    return (sum(d.ent)+sum(d.gent))+" Flaschen entnommen";
  if(m==="keller")  return Object.keys(d.zdone||{}).length+" Weine gezählt";
  if(m==="fuellen") return sum(d.gent)+" Getränke nachgefüllt";
  return (sum(d.rest)+sum(d.barrot)+sum(d.bar)+sum(d.backup))+" Flaschen aus dem Keller";
}
function start(m){

     Organisationsproblem, kein Datenproblem — und es muss sichtbar sein. */
  const fremd=fernNeuer(m);

        .toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}))} Uhr.</p>

      dabei ersetzt.</p>`;

      save();$("#ov").classList.remove("on");$("#ovOk").textContent="Ja";
      start._uebernommen=false;start(m);};
    /* Ablehnen heisst ablehnen. Bis v26 stand hier `=false`: `start(m)`
       fragte `fernNeuer(m)` erneut, bekam denselben fremden Stand und
       öffnete den Dialog sofort wieder — der Weg „Abbrechen" war eine
       Schleife, aus der nur „Übernehmen" herausführte. Mit `=true` läuft

     Ein Vorgang ist ein VOLLSTÄNDIGER Zustand unter dem Schlüssel
     <modus>_<tag>. Wer nach einer abgeschlossenen Lieferung noch einmal

  if(cur&&cur.finished&&cur.tag===ziel&&hasData(m,cur)&&!start._zweiter){

      archive(cur); S[m]=blank(m); save(); weiter(); };
    $("#ovNo").onclick=()=>{ $("#ov").classList.remove("on");
      $("#ovOk").textContent="Ja"; mode=null; renderMenu(); };
    return;
  }

  /* BERICHTIGUNG (Jagd 13, A3): Diese Zeile raeumte einen laufenden
     Vorgang still weg, sobald sein Tag nicht mehr der vorgeschlagene war.
     Solange der Tag nur um Mitternacht wechselte, fiel das kaum auf; seit
     „Anderes Datum" (F9) loest es ein Fingertipp aus — eine angefangene
     Tagesfassung war danach leer, ohne Frage und ohne Hinweis.
     Jetzt gilt: Ein Vorgang mit Inhalt, der noch laeuft, wird nie ohne
     Frage verlassen. Ein leerer darf still weichen, dabei geht nichts
     verloren. */
  if(cur&&!cur.finished&&cur.tag!==ziel&&hasData(m,cur)&&!start._tagfrage){
    const weiter=(mitTag)=>{
      $("#ov").classList.remove("on");$("#ovOk").textContent="Ja";
      if(mitTag)setTagWahl(mitTag===today()?null:mitTag);
      start._tagfrage=true; start(m); start._tagfrage=false; };
    $("#ovT").textContent=MODES[m].t+" für "+deTag(cur.tag)+" ist angefangen";
    $("#ovBody").innerHTML=`<p>Auf diesem Gerät läuft ${esc(MODES[m].t)} für
      <b>${esc(deTag(cur.tag))}</b> – ${esc(kurzInhalt(m,cur))}.
      Vorgeschlagen ist gerade <b>${esc(deTag(ziel))}</b>.</p>
      <button class="andererweg" id="ovNeu"><b>Neu für ${esc(deTag(ziel))} beginnen</b>
      <span>Der angefangene Stand für ${esc(deTag(cur.tag))} wandert ins Archiv
      und ist im laufenden Betrieb nicht mehr in der Hand.</span></button>`;
    $("#ov").classList.add("on");
    $("#ovOk").textContent="Weiter am "+kurzTag(cur.tag);
    $("#ovOk").onclick=()=>weiter(cur.tag);
    $("#ovBody").querySelector("#ovNeu").onclick=()=>{
      archive(cur);S[m]=blank(m);save();weiter(null); };
    $("#ovNo").onclick=()=>{ $("#ov").classList.remove("on");
      $("#ovOk").textContent="Ja"; mode=null; renderMenu(); };
    return;
  }
  if(cur&&(cur.finished||cur.tag!==ziel)){archive(cur);S[m]=blank(m);}
  else if(!cur)S[m]=blank(m);
  if(!S[m].name)S[m].name=whoAmI();
  step=0;save();
  $("#menu").style.display="none";$("#app").style.display="";
  $("#mTitle").textContent=MODES[m].t;
  buildSteps();
  render();window.scrollTo(0,0);
}
function buildSteps(){

     abgeschnitten \u2014 ohne Hinweis darauf, dass da noch etwas ist. Punkte

  const L=steps();

    '<span class="stpts">'+L.map((t,i)=>
      `<button class="st" role="tab" aria-controls="main" data-s="${i}" title="${esc(t)}"`+

    /* Der NAME des Schritts steht vorn. Die Punkte daneben sagen bereits,
       der wievielte von wie vielen es ist; stand das Wort \u201eSchritt\u201c noch
       einmal davor, blieb bei 390px f\u00fcr \u201eRestaurant\u201c nur \u201eRes\u2026\u201c \u00fcbrig.

    '</span><span class="stlbl"><span class="vh">Schritt </span>'+

function stepComplete(i){
  const d=D();if(!d)return false;
  if(branch==="getr"&&mode!=="tag"){
    if(mode==="keller")return i===0?ALLE_LADEN().every(L=>(d.gdone||{})[L.id]):false;
    return i===0?sum(d.gent)>0:false;
  }
  if(mode==="fuellen"){
    if(i===0)return barUnits().every(barDone);
    if(i===1){const g2=gFehlt().filter(x=>!WEINLAGER.includes(x.id));
      return g2.length>0&&g2.every(x=>(d.gholt||{})[x.id]);}
    return false;
  }
  if(mode==="tag"){
    if(i===0)return barUnits().every(barDone);
    if(i===1)return WINES.filter(w=>PLAN.soll[w.id]!=null).every(w=>d.seen[w.id]||g(d.rest,w.id));
    if(i===2){const it=holList();return it.length>0&&it.every(x=>d.holt[x.w.id]);}
    return false;
  }
  if(mode==="keller")return i===0?WINES.every(w=>d.zdone[w.id]):false;
  if(mode==="nach")return i===0?sum(d.ent)>0:false;
  if(mode==="ware"){
    const pos=(d.pos||[]).filter(x=>x.id&&x.kisten>0);
    if(i===0)return pos.length>0;
    if(i===1)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.jok[x.id]);
    if(i===2)return pos.length>0&&pos.filter(x=>x.id!=="__neu").every(x=>d.ein[x.id]);
  }
  return false;
}

/* ── Runde 14 · Die Farbe der Rebsorte ────────────────────────────────
   Die Ueberschrift eines Rebsortenblocks traegt einen Ton, der zur Sorte
   passt: Gruener Veltliner gruen-gelb, Blaufraenkisch dunkelrot, Sekt
   gold. Er hilft, den Block im Vorbeigehen zu erkennen — deshalb bleibt
   er gedeckt. Bunt wird die Liste nicht: der Ton sitzt nur in der Zeile
   ueber dem Block, nicht hinter den Weinen.
   Gefunden wird ueber die REBSORTE (`w.r`), nicht ueber die Gruppe: die
   Gruppe „Cuvée" gibt es weiss wie rot. Findet sich nichts, entscheidet
   die Farbe des Weins (`w.f`); findet sich auch die nicht, bleibt es
   beim bisherigen Grau. */
/* BERICHTIGUNG (Messung Runde 14): Die ersten Toene waren hell und satt —
   auf dem hellen Grund der Liste kamen die zwoelf Weissweinsorten nur auf
   2,0 bis 3,0 : 1. Das ist Schrift, nicht Zierat, und 4,5 : 1 ist Pflicht.
   Gleiche Farbe, gleicher Buntton, nur dunkler: der Veltliner bleibt
   olivgruen, der Riesling golden, der Chardonnay ockrig — lesbar sind sie
   jetzt alle. Gemessen gegen rgb(236,233,226), den Grund der Liste. */
const REBTON={
  "Grüner Veltliner":"#5E6D24", "Riesling":"#79661C", "Sauvignon Blanc":"#537036",
  "Weißburgunder":"#706742", "Chardonnay":"#766528", "Grauburgunder":"#6F6754",
  "Roter Veltliner":"#885E36", "Muskateller":"#616D24", "Gemischter Satz":"#606B4C",
  "Traminer":"#8F5B37",
  "Zweigelt":"#9B2335", "Blaufränkisch":"#74203A", "Pinot Noir":"#A04256",
  "Merlot":"#6B2231", "Sangiovese":"#8A2B24", "Barbera":"#77222E",
  "Schaumwein":"#7E631D"};
const FARBTON={WEISS:"#6A6A41", "ROSÉ":"#A34D57", ROT:"#8A2B39",
  NATURAL:"#766637", BUBBLES:"#7E631D"};
function rebTon(w){return REBTON[w&&w.r]||FARBTON[w&&w.f]||null;}
/* Ueberschrift eines Rebsortenblocks. */
function rebKopf(m,w){
  const el=add(m,"reb",esc(w.grp));

  if(t){el.classList.add("reb--farbe");el.style.setProperty("--rebton",t);}

const DISPORD=["WEISS","ROSÉ","ROT","NATURAL","BUBBLES"];

/* ── Sprungleiste ── */
/* Vertikal gesetzt und auf 40px beschnitten wurde aus \u201eBubbles\u201c ein
   \u201eBubb\u201c \u2014 das liest sich wie ein Fehler. Zwei Buchstaben passen immer. */
const RAILKURZ={"Rot":"RT","Rosé":"RS","Weiss":"WS","Weiß":"WS","Cuvée Weiss":"CV",
  "Cuvée":"CV","Natural":"NT","Natur":"NT","Bubbles":"BB","Einzelgänger":"EG"};
function railKurz(t){
  if(RAILKURZ[t])return RAILKURZ[t];
  const m2=/^\s*\D*?(\d+)\s*$/.exec(t);
  if(m2)return (t.trim()[0]+m2[1]).toUpperCase();
  return t.replace(/[^A-Za-zÄÖÜäöü]/g,"").slice(0,2).toUpperCase();
}
let railGroups=[];
/* Runde 14 · Eine Breite fuer die Ringspalte, je Liste.
   Die Ringe duerfen nie untereinander stehen. Passt die laengste Zeile
   einer Liste nicht in ihren Anteil der Breite, werden die Ringe kleiner —
   und zwar fuer ALLE Zeilen der Liste, damit sie weiter fluchten. Der
   Namensspalte bleiben so immer rund 45 Prozent der Zeile.
   Im Plan hat nur eine Position mehr als drei Flaschen (Serena, sechs);
   ueberall sonst bleibt es bei 34 px. */
function ringMasse(m){
  const zeilen=[...m.querySelectorAll(".w--zaehl")];
  if(!zeilen.length){
    m.style.removeProperty("--dotd");m.style.removeProperty("--dotsp");return;}
  const n=Math.max.apply(null,zeilen.map(z=>+z.dataset.soll||1));
  /* BERICHTIGUNG (Messung Runde 14, zweimal nachgemessen):
     Der Griff darf nie breiter sein als die Teilung, sonst greift er in den
     Nachbarring. Bei 30 + 12 = 42 war er zwei Pixel zu schmal fuer die
     44 px des Hauses. Bei 32 + 12 = 44 ist er genau so breit wie die
     Teilung — und dann liegt die Naht zwischen zwei Ringen exakt dort, wo
     der Daumen am Rand aufsetzt: gemessen faellt der Punkt an den Nachbarn.
     Deshalb eine Teilung von 45: Griff 44 (Hausregel erfuellt), Naht bei
     22,5 px, der Rand des Daumens landet sicher im eigenen Ring.
     Ring 32 statt 34 — kleiner, wie gewuenscht; die Luft waechst dafuer um
     einen Pixel von 12 auf 13. */
  const G=13, D=32;
  /* BERICHTIGUNG: Hier wurden die Ringe kleiner, sobald eine Liste mehr
     als drei Flaschen fuehrte. Das trifft im Plan nur Serena (sechs) —
     und dafuer sollen NICHT alle anderen Zeilen schrumpfen. Die Ringe
     behalten ihre Groesse, die Spalte wird breiter. Gestapelt wird nie. */
  m.style.setProperty("--dotd",D+"px");
  m.style.setProperty("--dotgap",G+"px");
  m.style.setProperty("--dotsp",(n*D+(n-1)*G)+"px");
}

function buildRail(show){
  const rail=$("#rail");
  if(!show||!railGroups.length){rail.innerHTML="";$("#main").classList.remove("hasrail");return;}
  $("#main").classList.add("hasrail");
  rail.innerHTML=railGroups.map(g2=>`<button data-anchor="${g2.id}" title="${esc(g2.kurz)}" aria-label="${esc(g2.kurz)}">${railKurz(g2.kurz)}</button>`).join("");
  rail.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const el=document.getElementById("anchor_"+b.dataset.anchor);
    if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
  /* NEU GEMESSEN (Jagd 13): Die Leiste steht `position:fixed` in der Mitte
     des FENSTERS. Der klebende Kopf (Titel, Schritte, Netzzeile) steht
     darueber und deckt bei 320 x 568 die oberen Pixel des ersten Knopfes
     zu: wer im Keller „Rot" oben antippt, trifft die Statuszeile. Gemessen
     an fuenf von zwoelf Tastpunkten.
     Die Leiste wird deshalb in der Mitte des Raumes UNTER dem Kopf
     zentriert, nicht in der Mitte des Fensters. Die Hoehe des Kopfes
     steht erst zur Laufzeit fest — sie haengt an Hinweiszeile und
     Suchfeld —, also wird sie gemessen. */
  const setzeMitte=()=>{
    const kopf=$("#topwrap");
    const h=kopf?kopf.getBoundingClientRect().height:0;
    rail.style.top="calc(50% + "+Math.round(h/2)+"px)";
  };
  setzeMitte();

/* ── Bar (zuerst) ── */
/* 2A · Der Barbereich wird Station für Station durchgegangen: erst die
   ungekühlten Rotweine, dann das ungekühlte Backup, dann Lade 1 bis 6.
   „Weiter" bestätigt die Station als geprüft und geht zur nächsten. */
let barIdx=0;
function barUnits(){
  /* P13/23 · Das Backup wird nicht mehr bedient. Der Topf bleibt in blank()
     und in allen Lesepfaden, damit archivierte Protokolle stimmen. */
  const u=mode==="fuellen"?[]
    :[{k:"liste",id:"barrot",t:"Bar · Rotweine",s:"Nicht gekühlt",marke:"R",
       arr:barSlots("barrot"),bucket:"barrot"}];
  ALLE_LADEN().forEach((L,i)=>u.push({k:"lade",id:L.id,t:L.t,L:L,marke:String(i+1)}));
  const off=(D()||{}).goffen||{};
  /* Grün überschreibt Gelb: bestätigte Laden gelten nicht mehr als offen. */
  u.forEach(x=>{x.offen=!!off[x.id]&&!barDone(x);});
  return u;
}
/* Wer eine Karte verlässt, ohne sie zu bestätigen, findet beim
   Zurückkommen einen gelben Hinweis \u2014 und sieht ihn schon in der
   Stationsleiste. */
function merkeOffen(u){
  if(!u||barDone(u))return;
  const d=D();d.goffen=d.goffen||{};d.goffen[u.id]=1;save();}
function barDone(u){
  const d=D();
  if(u.k==="lade")return !!(d.gdone||{})[u.id];
  return u.arr.every(p=>d.seen[p.id+"_"+u.bucket]||g(d[u.bucket],p.id));
}
function barMark(u){
  const d=D();d.gdone=d.gdone||{};
  if(u.k==="lade"){d.gdone[u.id]=1;save();return;}
  u.arr.forEach(p=>{d.seen[p.id+"_"+u.bucket]=1;});save();
}
function rBar(m){

/* 3.1 · Bestand: voll ist der Start, man tippt herunter auf das, was noch dasteht.

  cbox.append(chk,lbl);
  const upd=()=>{const f=g(D()[bucket],w.id),ist=soll-f,seen=!!D().seen[key]||f>0;
    pts.forEach((s,i)=>s.classList.toggle("off",i>=ist));

    b.className="w w--zaehl"+(f?" miss":(seen?" seen":""));

    setIst(ist===i+1?i:i+1);});
  chk.onclick=e=>{e.stopPropagation();const d2=D(),f=g(d2[bucket],w.id);
    if(f){delete d2[bucket][w.id];d2.seen[key]=1;}

    save();upd();};

}

/* Die Menge stimmt fast immer. Nur wenn im Lager etwas aus ist, klappt

/* ══════ Runde 14 · Der Grund einer Sonderentnahme ══════
   „3 Flaschen weg" ohne Grund ist fuer die Leitung keine Auskunft,
   sondern eine Frage. Fuenf feste Knoepfe, ein Tipper, keine Tastatur —
   so am 17.09. entschieden (review/ENTSCHIEDEN-NACHTS.md Nr. 7), samt
   der drei Festlegungen, die dort das Bauen entscheiden:
     · Der Grund gehoert zum VORGANG, nicht zur einzelnen Zeile. Zwei
       Gruende sind zwei Sonderentnahmen.
     · Kein sechster Knopf „Anderes" — er waere binnen zwei Wochen die
       Voreinstellung und die Unterscheidung wertlos.
     · Keine Migration: der Grund reist in `daten` mit und geht im
       Journal in `ereignis.notiz`, vorn und in fester Form
       (`grund=bruch`), damit das Backoffice ihn gruppieren kann.
   Wortlaut und Reihenfolge sind ausdruecklich vorlaeufig und gehoeren
   mit dem Team abgestimmt. */
const GRUENDE=[
  ["kueche","Küche"],
  ["personal","Personal"],
  ["bruch","Bruch/Kork"],
  ["verkostung","Verkostung/Gast"],
  ["zimmer","Zimmer"]];
function grundText(k){const g2=GRUENDE.find(x=>x[0]===k);return g2?g2[1]:"";}
function rGrund(m){
  const d=D();
  const w=document.createElement("div");w.className="grundw";
  const t=document.createElement("div");t.className="hd1sub2";
  t.textContent=d.grund?"Grund":"Wofür wird geholt?";
  w.appendChild(t);
  const r=document.createElement("div");r.className="gruende";
  GRUENDE.forEach(([k,lab])=>{
    const b=document.createElement("button");
    b.type="button";b.className="grundb"+(d.grund===k?" on":"");
    b.textContent=lab;
    b.setAttribute("aria-pressed",d.grund===k?"true":"false");
    b.onclick=()=>{const dd=D();dd.grund=(dd.grund===k)?"":k;save();render();};
    r.appendChild(b);});
  w.appendChild(r);
  m.appendChild(w);
}

function rNach(m){
  const q=$("#q").value.trim().toLowerCase();
  rGrund(m);
  // Farb-Filterchips
  const chips=document.createElement("div");chips.className="fchips";
  const orderF=["ROT","WEISS","ROSÉ","NATURAL","BUBBLES"];
  orderF.forEach(f=>{
    const b=document.createElement("button");b.className="fchip"+(nachFilter===f?" on":"");
    b.textContent=FARBKURZ[f];
    b.onclick=()=>{nachFilter=nachFilter===f?null:f;render();};
    chips.appendChild(b);});
  m.appendChild(chips);
  // erfasste immer oben
  const erf=WINES.filter(w=>g(D().ent,w.id));
  if(erf.length&&!q&&!nachFilter){
    add(m,"reb","Schon geholt");erf.forEach(w=>m.appendChild(nachRow(w)));
  }
  // Liste nur bei Suche oder Filter
  if(!q&&!nachFilter){
    if(!erf.length)m.appendChild(Object.assign(document.createElement("p"),
      {className:"empty",textContent:"Wein suchen oder oben eine Farbe wählen."}));
    else{const hint=document.createElement("p");hint.className="empty";hint.style.paddingTop="var(--space-6)";
      hint.textContent="Weiteren Wein suchen oder Farbe wählen.";m.appendChild(hint);}
    return;
  }
  let list=WINES.filter(w=>!q||(w.winzer+" "+w.wein+" "+w.reb).toLowerCase().includes(q));
  if(nachFilter)list=list.filter(w=>w.f===nachFilter);
  list=list.slice().sort((a,b)=>DISPORD.indexOf(a.f)-DISPORD.indexOf(b.f));
  if(!list.length)return m.appendChild(Object.assign(document.createElement("p"),{className:"empty",textContent:"Kein Wein gefunden."}));
  let lg=null;
  list.forEach(w=>{if(w.grp!==lg){lg=w.grp;rebKopf(m,w);}m.appendChild(nachRow(w));});
}

/* ── Kellerzählung ── */
function rZaehl(m){
  const d=D();railGroups=[];
  const zones=[...new Set(WINES.map(w=>PLAN.zone[w.id]))].sort((a,b)=>ZR(a)-ZR(b));
  zones.forEach(z=>{
    const list=WINES.filter(w=>PLAN.zone[w.id]===z).sort(wegCmp);
    const done=list.filter(w=>d.zdone[w.id]).length,pct=Math.round(done/list.length*100);
    railGroups.push({id:"z_"+z,kurz:PLAN.zonen[z].t.slice(0,4)});
    const wrap=add(m,"hd1w grpanchor","");wrap.id="anchor_z_"+z;
    wrap.innerHTML=`<div class="hd1">${PLAN.zonen[z].t}<span class="cnt2${done===list.length?" full":""}">${done}/${list.length}</span></div>
      <div class="hd1sub">${PLAN.zonen[z].s}</div>
      <div class="prog"><i class="${done===list.length?"full":""}" style="width:${pct}%"></i></div>`;
    let lg=null,zi=0;
    list.forEach(w=>{if(w.grp!==lg){lg=w.grp;rebKopf(m,w);}m.appendChild(zRow(w,zi++));});
  });
}
function zRow(w,idx){
  const d=D(),on=!!d.zdone[w.id];
  const row=document.createElement("div");row.className="zw"+(on?" seen":"")+(idx%2?" zebra":"");
  const top=document.createElement("div");top.className="ztop";
  top.innerHTML=`<span class="nm"><b>${esc(w.winzer)}</b><span class="wn">${esc(w.wein)}</span></span>
    <span class="mt">${esc(w.jg)} · ${esc(w.region)}</span>`;
  row.appendChild(top);
  const z=document.createElement("div");z.className="zsteppers";
  const stepper=(bucket,lab)=>{
    const box=document.createElement("div");box.className="zstep";
    const set=(v)=>{v=Math.max(0,v);if(v)d[bucket][w.id]=v;else delete d[bucket][w.id];
      const tot=g(d.reihen,w.id)*6+g(d.einzel,w.id);
      if(tot>0)d.zdone[w.id]=1;else delete d.zdone[w.id];
      save();
      valEl.textContent=g(d[bucket],w.id);valEl.classList.toggle("on",!!g(d[bucket],w.id));
      row.classList.toggle("seen",tot>0);
      sumEl.textContent=tot;sumEl.classList.toggle("on",!!tot);renderFoot();};
    const mn=document.createElement("button");mn.className="zbtn";mn.textContent="\u2212";
    mn.setAttribute("aria-label",`${w.wein} ${lab} weniger`);mn.onclick=()=>set(g(d[bucket],w.id)-1);
    const valEl=document.createElement("button");valEl.className="zval"+(g(d[bucket],w.id)?" on":"");
    valEl.textContent=g(d[bucket],w.id);valEl.setAttribute("aria-label",`${w.wein} ${lab} eingeben`);
    valEl.onclick=()=>{
      if(box.querySelector(".zin"))return;
      const inp=document.createElement("input");inp.type="number";inp.inputMode="numeric";
      inp.className="zval zin";inp.value=g(d[bucket],w.id);
      inp.setAttribute("aria-label",`${w.wein} ${lab} eingeben`);
      valEl.replaceWith(inp);inp.focus();inp.select();
      const fin=()=>{set(parseInt(inp.value,10)||0);inp.replaceWith(valEl);};
      inp.onblur=fin;
      inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();};};
    const pl=document.createElement("button");pl.className="zbtn";pl.textContent="+";
    pl.setAttribute("aria-label",`${w.wein} ${lab} mehr`);pl.onclick=()=>set(g(d[bucket],w.id)+1);
    const l=document.createElement("div");l.className="zl";l.textContent=lab;
    const rowb=document.createElement("div");rowb.className="zsteprow";rowb.append(mn,valEl,pl);
    box.append(l,rowb);return box;};
  const valRefs={};
  const sumEl=document.createElement("div");sumEl.className="zsumbig"+((g(d.reihen,w.id)*6+g(d.einzel,w.id))?" on":"");
  sumEl.textContent=g(d.reihen,w.id)*6+g(d.einzel,w.id);
  z.append(stepper("reihen","Reihen ×6"),stepper("einzel","Einzeln"));
  const sumWrap=document.createElement("div");sumWrap.className="zstep";
  sumWrap.innerHTML=`<div class="zl">Summe</div>`;sumWrap.appendChild(sumEl);
  z.appendChild(sumWrap);
  row.appendChild(z);return row;
}

/* ── Wareneingang ── */
function rKisten(m){
  const d=D();
  if(!d.pos.length)add(m,"empty","Noch nichts aufgenommen.");
  d.pos.forEach((p,i)=>m.appendChild(posCard(p,i)));
  const b=document.createElement("button");b.className="addbtn";b.textContent="+ Position hinzufügen";
  b.onclick=()=>{d.pos.push({id:"",jg:"",kisten:1,neu:null});save();render();window.scrollTo(0,document.body.scrollHeight);};
  m.appendChild(b);
}
function posCard(p,i){
  const d=D(),c=document.createElement("div");c.className="li";
  const w=p.id&&p.id!=="__neu"?byId(p.id):null;
  const opts=WINES.map(x=>`<option value="${x.id}"${x.id===p.id?" selected":""}>${esc(x.winzer)} · ${esc(x.wein)}</option>`).join("");
  if(p.kistengr==null)p.kistengr=(p.id&&p.id!=="__neu"?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD);
  const kist=kg(p);
  c.innerHTML=`<div class="top"><b>Position ${i+1}</b><button class="x" aria-label="entfernen">\u00d7</button></div>
   <div class="g">
     <label class="fld" style="flex:2 1 100%"><span>Wein</span>
       <select class="selW"><option value="">— wählen —</option>${opts}<option value="__neu"${p.id==="__neu"?" selected":""}>+ Neuer Wein</option></select></label>
     <label class="fld"><span>Jahrgang</span><input class="inJ" value="${esc(p.jg)}" placeholder="2025"></label>
     <label class="fld"><span>Kisten</span><input class="inK" type="number" min="0" inputmode="numeric" value="${p.kisten}"></label>
     <label class="fld"><span>Kistengröße</span><input class="inKG" type="number" min="1" inputmode="numeric" value="${kist}"></label>
   </div>`;
  if(p.id==="__neu"){const n=p.neu||{};
    c.innerHTML+=`<div class="g" style="margin-top:4px">
      <label class="fld"><span>Winzer</span><input class="n_winzer" value="${esc(n.winzer)}"></label>
      <label class="fld"><span>Weinname</span><input class="n_wein" value="${esc(n.wein)}"></label>
      <label class="fld"><span>Rebsorte</span><input class="n_reb" value="${esc(n.reb)}"></label>
      <label class="fld"><span>Region</span><input class="n_region" value="${esc(n.region)}"></label>
      <label class="fld"><span>Farbe</span><select class="n_f">${["","WEISS","ROSÉ","ROT","BUBBLES","NATURAL"].map(x=>`<option${x===n.f?" selected":""}>${x}</option>`).join("")}</select></label>
    </div><div class="info">Neuer Wein – wird im Protokoll als Neuzugang geführt.</div>`;
  }else if(w){const fl=(+p.kisten||0)*kg(p),chg=p.jg&&p.jg!==w.jg;
    c.innerHTML+=`<div class="info${chg?" chg":""}">${fl} Flaschen · ${kg(p)}er Kisten${
      chg?`<br><b>Jahrgangswechsel:</b> bisher ${esc(w.jg)}, jetzt ${esc(p.jg)}`:
      (p.jg?`<br>Jahrgang unverändert (${esc(w.jg)})`:`<br>Bisher im Keller: Jg. ${esc(w.jg)} (Stand Juli 2026)`)}</div>`;}
  c.querySelector(".x").onclick=()=>{d.pos.splice(i,1);save();render();};
  c.querySelector(".selW").onchange=e=>{p.id=e.target.value;if(p.id==="__neu"&&!p.neu)p.neu={};
    p.kistengr=(p.id&&p.id!=="__neu")?(PLAN.kiste[p.id]||KISTE_STD):KISTE_STD;save();render();};
  c.querySelector(".inJ").oninput=e=>{p.jg=e.target.value;save();};
  c.querySelector(".inJ").onblur=()=>render();
  c.querySelector(".inK").oninput=e=>{p.kisten=Math.max(0,parseInt(e.target.value,10)||0);save();};
  c.querySelector(".inK").onblur=()=>render();
  c.querySelector(".inKG").oninput=e=>{p.kistengr=Math.max(1,parseInt(e.target.value,10)||KISTE_STD);save();};
  c.querySelector(".inKG").onblur=()=>render();
  ["winzer","wein","reb","region","f"].forEach(k=>{const el=c.querySelector(".n_"+k);
    if(el)el.oninput=e=>{p.neu=p.neu||{};p.neu[k]=e.target.value;save();};});
  return c;
}
function rJahr(m){
  const d=D(),items=d.pos.filter(p=>p.id&&p.id!=="__neu"),neu=d.pos.filter(p=>p.id==="__neu");
  if(!items.length&&!neu.length)return m.innerHTML='<p class="empty">Noch keine Kisten aufgenommen.</p>';
  if(items.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Jahrgänge prüfen</div><div class="hd1sub">Vergleich mit Stand Juli 2026</div>';
    items.forEach(p=>{const w=byId(p.id);if(!w)return;
      const chg=p.jg&&p.jg!==w.jg,ok=!!d.jok[p.id];
      const row=document.createElement("div");row.className="w"+(ok?" seen":"");
      const chk=document.createElement("button");chk.className="box2"+(ok?" on":"");chk.textContent=ok?"\u2713":"";
      chk.setAttribute("aria-label",`${w.wein} Jahrgang bestätigen`);
      chk.onclick=()=>{if(ok)delete d.jok[p.id];else d.jok[p.id]=1;save();render();};
      row.appendChild(chk);
      const tx=document.createElement("div");tx.className="tx";
      tx.innerHTML=`<div class="nm"><b>${esc(w.winzer)}</b><span class="wn">${esc(w.wein)}${chg?'<span class="pill chg">geändert</span>':""}</span></div>
        <div class="mt">Keller ${esc(w.jg)} \u2192 Lieferung ${esc(p.jg||"?")}</div>`;
      row.appendChild(tx);
      const inp=document.createElement("input");inp.className="zf";inp.style.width="64px";
      inp.value=d.jneu[p.id]!=null?d.jneu[p.id]:(p.jg||"");inp.setAttribute("aria-label",`${w.wein} Jahrgang korrigieren`);

  if(neu.length){
    const h=add(m,"hd1w","");h.innerHTML='<div class="hd1">Neue Weine</div><div class="hd1sub">Nicht im bisherigen Sortiment</div>';
    neu.forEach(p=>{const n=p.neu||{};
      const row=document.createElement("div");row.className="w";
      row.innerHTML=`<span class="tx"><span class="nm"><b>${esc(n.winzer)||"—"}</b><span class="wn">${esc(n.wein)||"—"}<span class="pill new">neu</span></span></span>
        <span class="mt">${esc(n.reb)||"?"} · ${esc(n.region)||"?"} · ${esc(n.f)||"?"} · Jg. ${esc(p.jg)||"?"}</span></span>
        <span class="qty">${(+p.kisten||0)*kg(p)}</span>`;
      m.appendChild(row);});
  }
}
function rEin(m){
  const d=D(),items=(d.pos||[]).filter(p=>p.id&&p.id!=="__neu"&&p.kisten>0);
  if(!items.length)return m.innerHTML='<p class="empty">Keine Kisten zum Einräumen.</p>';
  const srt=items.slice().sort((a,b)=>wegCmp(byId(a.id)||a,byId(b.id)||b));
  let lz=null;
  srt.forEach(p=>{const w=byId(p.id);if(!w)return;const z=PLAN.zone[p.id];
    if(z!==lz){lz=z;const h=add(m,"hd1w","");h.innerHTML=`<div class="hd1">${PLAN.zonen[z].t}</div><div class="hd1sub">${PLAN.zonen[z].s}</div>`;}
    const fl=p.kisten*kg(p),on=!!d.ein[p.id];
    const b=document.createElement("button");b.className="w"+(on?" tick":"");
    b.innerHTML=`<span class="box2${on?" on":""}">${on?"\u2713":""}</span>
      <span class="tx"><span class="nm"><b>${esc(w.winzer)}</b><span class="wn">${esc(w.wein)}</span></span>
      <span class="mt">${p.kisten} Kisten à ${kg(p)} · Jg. ${esc(p.jg||"?")}</span></span><span class="qty">${fl}</span>`;
    b.onclick=()=>{if(on)delete d.ein[p.id];else d.ein[p.id]=1;save();render();};
    m.appendChild(b);});
}

/* ── Farbnormalisierung ──────────────────────────────────────────────
   Die Produktfarben stammen von den Etiketten und decken einen sehr
   weiten Bereich ab: Karminrot neben Fast-Schwarz neben Gold. Als
   gefuellte Punkte nebeneinander liest sich das als Farbmusterkarte,
   nicht als Werkzeug. Hier wird der Bereich einmalig komprimiert —
   der Farbton bleibt, Buntheit und Helligkeit werden in ein schmales,
   warmes Band gezogen. Die Positionen bleiben unterscheidbar, die
   Lade wirkt als ein Ganzes. TONE.aus=true zeigt die Originalfarben. */
/* Die Punktfarben stammen jetzt aus den Etiketten und Deckeln der
   Produktfotos — Wiedererkennung geht vor Harmonie. Die Kompression
   bleibt als Schalter erhalten: TONE.aus=false dämpft wieder. */
const TONE={aus:true,L:0.50,kL:0.88,Cmax:0.155,kC:0.80};
function toneHex(h){
  if(TONE.aus||typeof h!=="string"||h.charAt(0)!=="#"||h.length!==7)return h;
  const s2l=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  const l2s=c=>{c=Math.max(0,Math.min(1,c));
    const v=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;
    return Math.round(Math.max(0,Math.min(1,v))*255);};
  const r=s2l(parseInt(h.substr(1,2),16)),g=s2l(parseInt(h.substr(3,2),16)),
        b=s2l(parseInt(h.substr(5,2),16)),cb=x=>Math.cbrt(x);
  let l=cb(0.4122214708*r+0.5363325363*g+0.0514459929*b),
      m=cb(0.2119034982*r+0.6806995451*g+0.1073969566*b),
      s=cb(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  const L=0.2104542553*l+0.7936177850*m-0.0040720468*s,
        A=1.9779984951*l-2.4285922050*m+0.4505937099*s,
        B=0.0259040371*l+0.7827717662*m-0.8086757660*s;
  const C=Math.hypot(A,B),f=C>1e-6?(Math.min(C,TONE.Cmax)*TONE.kC)/C:0;
  const L2=TONE.L+(L-TONE.L)*TONE.kL,a2=A*f,b2=B*f;
  l=Math.pow(L2+0.3963377774*a2+0.2158037573*b2,3);
  m=Math.pow(L2-0.1055613458*a2-0.0638541728*b2,3);
  s=Math.pow(L2-0.0894841775*a2-1.2914855480*b2,3);
  return "#"+[l2s(4.0767416621*l-3.3077115913*m+0.2309699292*s),
              l2s(-1.2684380046*l+2.6097574011*m-0.3413193965*s),
              l2s(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]
    .map(v=>v.toString(16).toUpperCase().padStart(2,"0")).join("");
}
function toneAll(o){Object.keys(o).forEach(k=>{o[k]=toneHex(o[k]);});}
toneAll(GETR.col);toneAll(GETR.spec);

/* Welcher Topf gehört zu welchem Platz? Ohne Angabe: die Getränkezählung. */
const GBUCK={},WSOLL={};
function wSlots(L){const r=[];
  (L.fach||[]).forEach(F=>{

function gIst(id,b,soll){

const GGAP=5;      /* zwischen den Kugeln */

const NUMMERN=true;

const GRACK_S=()=>cssPx("--grack",30);
/* Die Ziffer soll eine Orientierung sein, kein Etikett — aber lesbar.

   oder dunklere Variante gewählt und die Deckkraft nur so weit

    const nsp=spalten.length;
    const frei=innenBreite(inner,nsp)-14;
    const w=Math.max(26,Math.min(64,Math.floor(frei/nsp)));
    inner.style.setProperty("--gcell",w+"px");
    spalten.forEach(sp=>sp.style.removeProperty("--gcellh"));

       In Lade 1 hat die Tetrapak-Spalte sieben Plaetze, die Flaschenspalte

        const c=zelle.getBoundingClientRect().height;
        const neu=Math.round(c+(ziel-hoehen[i])/hoch.n)+"px";
        flaschen.forEach(sp=>sp.style.setProperty("--gcellh",neu));
      }
    }
    return;
  }
  const inner=box.querySelector(L.kind==="col"?".drwi":".rsec");if(!inner)return;
  const cols=L.cols,k=cols.length;
  /* ── Runde 14 · Alle Spalten in EINER Reihe ────────────────────────────
     F2 hatte das Raster umbrechen lassen, damit die Kuerzel nicht mehr
     ineinanderlaufen. Der Preis war die Hoehe: Lade 4 stand bei 390 px in
     zwei Reihen zu vier Spalten und war 1040 px hoch statt 608 — die Lade
     passte auf keinen Schirm mehr, und die acht Spalten standen nicht
     mehr so, wie die Flaschen in der Lade liegen.
     Jetzt stehen sie wieder nebeneinander, und der Platz wird ueber die
     PUNKTGROESSE geholt statt ueber den Umbruch: Alle Stapel enden auf
     derselben Linie, also bekommt eine Spalte mit zehn Flaschen kleinere
     Punkte als eine mit sieben. Genau so liegt die Lade auch im Kuehler.
     Dass die Kuerzel trotzdem nicht kollidieren, macht nicht mehr das
     Raster, sondern der Text: sie sind auf zwei Zeilen à rund vier Zeichen
     gekuerzt (GETR.kurz). Unter 360 px reicht auch das nicht mehr — dort
     bricht das Raster weiter um (siehe .drwi--umbruch). */
  const schmal=window.matchMedia&&window.matchMedia("(max-width:360px)").matches;
  inner.classList.toggle("drwi--umbruch",!!schmal);
  inner.style.setProperty("--gspalten",k);

  /* Die Spaltenbreite kommt aus dem Raster — gemessen, nicht gerechnet. */
  const erste=inner.querySelector(".gcol");
  const cb=erste?erste.clientWidth:72;
  const platz=cols.map(colPlatz);
  /* Die KUERZESTE Saeule gibt die Hoehe vor, nicht die laengste. Nur so
     fuellt jede Spalte dieselbe Hoehe aus: die kuerzeste mit den groessten
     Kugeln, die laengste mit den kleinsten. Stuende hier die laengste,
     waere die Kugel ueberall gleich gross (die Zelle deckelt sie) und die
     kurzen Spalten haetten oben Luft — genau das Bild, das die Lade nicht
     zeigt: im Kuehler sind alle Reihen gleich lang. */
  const minPlatz=Math.min.apply(null,platz);

  /* Die Hoehe der Lade. Zwei Deckel:
       · die breiteste zulaessige Kugel (34 px, aus Runde 12) mal der
         laengsten Saeule — mehr waere Angeberei;
       · die Spaltenbreite, denn ein Punkt darf nie breiter sein als seine
         Zelle.
     Aus beidem folgt EINE Hoehe H fuer alle Stapel; die Punktgroesse
     rechnet dann jede Spalte fuer sich aus H und ihrer Flaschenzahl. */
  const DMAX=Math.max(18,Math.min(34,cb-4));
  const H=minPlatz*(DMAX+GGAP)-GGAP;
  inner.querySelectorAll(".gstks").forEach(el=>{el.style.height=H+"px";});

  cols.forEach((c,ci)=>{
    const teile=colTeile(c),ges=colSum(c);
    /* Die Kugel dieser Spalte: so gross, dass ihre Saeule genau H hoch
       wird. Nie groesser als die Zelle, nie kleiner als 14 px — darunter
       trifft niemand mehr einen einzelnen Punkt. */
    const n=platz[ci];
    const dd=Math.max(14,Math.min(DMAX,Math.floor((H-(n-1)*GGAP)/n)));
    teile.forEach(([id,anz])=>{
      const st=box.querySelector('.gstk [data-gid="'+L.id+'/'+id+'"]');
      const stk=st&&st.parentNode;if(!stk)return;
      /* Traegt eine Spalte zwei Sorten uebereinander (Lade 6: Red Ale
         ueber Pale Ale), teilen sie sich H im Verhaeltnis ihrer Flaschen. */
      stk.style.height=(anz*(dd+GGAP)-GGAP)+"px";
      stk.style.removeProperty("margin-top");
      stk.style.removeProperty("margin-bottom");
      stk.querySelectorAll(".gpt").forEach(pt=>{
        pt.style.width=pt.style.height=dd+"px";});
      const cv=stk.closest(".gcol");
      if(cv)cv.style.removeProperty("width");});});
  /* Die Ziffern haengen an der Punktgroesse und muessen nach dem
     Umrechnen neu gesetzt werden — gPaint() macht das mit der richtigen
     Farbe. */
  gLadeKeys(L).forEach(gPaint);
}

function gHolBlock(m){
  const f=gFehlt().filter(x=>!WEINLAGER.includes(x.id));

  if(!f.length){

       niemand bestätigt hat, gilt als voll — „Alle Laden sind voll" war
       dann keine Zählung, sondern eine Annahme. */
    const oL=ALLE_LADEN().filter(L=>!(d0.gdone||{})[L.id]).length;

        +" noch nicht best\u00e4tigt.</b><br>Was nicht gez\u00e4hlt ist, gilt als voll. "
        +"Vorher noch die offenen Laden an der Bar pr\u00fcfen.");
    else add(m,"box good","<b>Nichts zu holen.</b><br>Alle Laden sind voll.");}
  else{
    /* Wie beim Wein: erledigte Zeilen wandern nach unten. */
    const offen=f.filter(x=>!d0.gholt[x.id]),fertig=f.filter(x=>d0.gholt[x.id]);

    if(fertig.length)holBlock(m,"Erledigt",fertig.reduce((a,x)=>a+x.n,0),fertig);
  }

/* Eine Tragekiste fasst 20 Flaschen \u2014 unabhängig vom Getränk.
   Gerechnet wird über die Gesamtmenge, nicht je Position: man packt

function offenList(){

    [1,2,3,4].forEach(n=>{if(!schrankFertig(n))o.push(SCHRANK[n].kurz+" nicht geprüft");});
  }
  if(mode==="fuellen"){
    const g2=gFehlt().filter(x=>!WEINLAGER.includes(x.id));
    const goff=g2.filter(x=>!(d.gholt||{})[x.id]).length;
    if(goff)o.push("Noch nicht alles geholt – "+goff+(goff===1?" Getränk":" Getränke"));
    barUnits().forEach(u=>{if(!barDone(u))o.push(u.t+" nicht geprüft");});
    ALLE_LADEN().forEach(L=>{if(!(d.gdone||{})[L.id])o.push(L.t+" nicht bestätigt");});

/* ══════ F4 · Der Fotoschritt ist weg ══════
   Hier stand „P10 · Fotos der Fassungsliste": eine IndexedDB `hh_fotos`,
   Aufnahme, Verkleinern auf 1600 px, Galerie, Anhang an das Protokoll —
   und in `offenList()` ein offener Punkt, der ein Bild der Liste
   verlangte und eine vollständige Fassung in die Freigabe zwang.
   Am 17.09.2026 entschieden, am 18.09.2026 ersatzlos entfernt: Schritt,
   Knopf, Kacheltext, Hilfetext, der offene Punkt, das Fach `fotos` im
   Vorgangspaket, die Anzeige im Backoffice und der Bildspeicher selbst.
   `aufraeumenFotospeicher()` (weiter unten, beim Start) loescht die
   IndexedDB EINMAL — sonst bliebe sie auf jedem Geraet liegen.
   An seine Stelle kommt nichts. Der Vortagsabgleich ist eine eigene
   Aufgabe und gehoert ins Backoffice, nicht in den Keller ohne Netz. */

/* ── Dokument-Bausteine (Tabellen) ── */
function tbl(head,rows,tot){return `<table><thead><tr>${head}</tr></thead><tbody>${rows}${tot||""}</tbody></table>`;}
function docHeadHtml(){const d=D();
  return docUeber()+`<div class="dh"><div class="t">${MODES[mode].t}</div>
    <div class="m"><span>Datum <b>${deTag(d.tag)}</b></span><span>Von <b>${esc(d.name)||"—"}</b></span>
    ${d.notiz?`<span>Notiz <b>${esc(d.notiz)}</b></span>`:""}</div></div>`;}
function docTag(){
  const d=D();
  const bar=sum(d.barrot)+sum(d.bar)+sum(d.backup),rest=sum(d.rest);
  let h=docHeadHtml();
  h+=`<div class="kpi"><div><span>Restaurant</span><b>${rest}</b></div>
    <div><span>Bar</span><b>${bar}</b></div>
    <div><span>Keller</span><b>${rest+bar}</b></div>
    <div><span>Getränke</span><b>${gFehltSum()}</b></div></div>`;
  const hl=holList();
  if(hl.length){let t2="",lz=null;
    hl.forEach(it=>{const z=PLAN.zone[it.w.id];if(z!==lz){lz=z;t2+=`<tr><td class="grp" colspan="3">${PLAN.zonen[z].t}</td></tr>`;}
      t2+=`<tr><td><b>${esc(it.w.winzer)}</b> · ${esc(it.w.wein)}</td><td>${it.q.join(" · ")}</td><td class="r"><b>${it.n}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Aus dem Keller geholt</h3>
      ${tbl(`<th>Wein</th><th>Wohin</th><th class="r">Fl.</th>`,t2,`<tr class="tot"><td colspan="2">Summe</td><td class="r">${rest+bar}</td></tr>`)}</div>`;}
  const zu=WINES.filter(w=>g(d.zusatz,w.id));
  if(zu.length){let t3="";
    zu.sort(wegCmp).forEach(w=>{t3+=`<tr><td><b>${esc(w.winzer)}</b> · ${esc(w.wein)}</td>`+
      `<td class="r"><b>${g(d.zusatz,w.id)}</b></td></tr>`;});
    h+=`<div class="sec"><h3>Zusätzlich entnommen</h3>
      ${tbl(`<th>Wein</th><th class="r">Flaschen</th>`,t3,
        `<tr class="tot"><td>Summe</td><td class="r">${sum(d.zusatz)}</td></tr>`)}</div>`;}
  h+=docGetrMenge(d.gent);
  h+=docGetrZusatz(d.gzusatz);
  return h;
}
function docFuellen(){
  const d=D();

    <div><span>Laden</span><b>${ALLE_LADEN().length}</b></div></div>`;

}
function docKeller(){
  const d=D(),gez=WINES.filter(w=>d.zdone[w.id]),off=WINES.filter(w=>!d.zdone[w.id]);
  const tot=gez.reduce((a,w)=>a+g(d.reihen,w.id)*6+g(d.einzel,w.id),0);

function docNach(){

function docWare(){
  const d=D(),pos=d.pos.filter(p=>p.id&&p.kisten>0);
  const best=pos.filter(p=>p.id!=="__neu"),neu=pos.filter(p=>p.id==="__neu");
  const fl=pos.reduce((a,p)=>a+p.kisten*kg(p),0);
  const chg=best.filter(p=>{const w=byId(p.id);const j=d.jneu[p.id]!=null?d.jneu[p.id]:p.jg;return w&&j&&j!==w.jg;});
