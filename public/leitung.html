/* ════════════ 4 · Bestand fortschreiben ════════════
   Bestand = jüngste Zählung + alles danach Eingegangene − alles danach Entnommene.
   Ohne Zählung gibt es keinen Bestand, nur Bewegung — das wird auch so gesagt. */
function bestand(){
  /* Je Artikel die JÜNGSTE Zählung, nicht eine Zählung für alle.

     Bis v22 suchte diese Rechnung einen einzigen Basis-Vorgang und
     übernahm nur die darin gezählten Weine. Wer die Zählliste dieser
     Seite benutzt — drei auffällige Positionen nachzählen —, setzte damit
     die anderen vierundfünfzig auf „—": Der Bestand verschwand vom
     Schirm, und der Banner meldete seelenruhig „Seither 0 Flaschen
     eingegangen". Der Worker rechnet es seit jeher richtig
     (`bestand()` in src/index.js führt `letzteZaehlung` je Artikel);
     die Leitung sah den falschen der beiden Wege. */
  const zuletzt={};                 /* Artikel → der Vorgang, dessen Zählung gilt */
  let basis=null;
  VORGAENGE.forEach(v=>{
    if(!v.zaehlung) return;
    basis=v;                        /* die jüngste Zählung trägt die Zeile im Banner */
    Object.keys(v.zaehlung).forEach(id=>{ if(v.zaehlung[id]!=null) zuletzt[id]=v; });
  });
  const b={}, seit={ein:{}, raus:{}}, unklar={};
  VORGAENGE.forEach(v=>{
    if(v.zaehlung) Object.keys(v.zaehlung).forEach(id=>{
      if(v.zaehlung[id]!=null && zuletzt[id]===v) b[id]=v.zaehlung[id];
    });
    /* ENTNAHMEN: „danach" heisst `tag > Zähltag` ODER (`tag = Zähltag` UND
       es ist keine Zählung). `tag > Zähltag` allein wäre falsch — am
       Morgen gezählt, am Abend desselben Tages gefasst: diese Entnahme
       fiele sonst unter den Tisch. Der Zeitstempel stand hier bis v28 und
       ist fort: er sagt, wann das Paket ANKAM, nicht wann gezählt wurde
       (siehe `nachZeit`). Dieselbe Regel rechnet der Worker
       (`bestand()` in src/index.js, `ORDER BY tag, Zählung zuerst`). */
    const nach=id=>{ const z=zuletzt[id]; if(!z) return false;
      return (v.tag||"")>(z.tag||"") ||
             ((v.tag||"")===(z.tag||"") && tagRang(v)>tagRang(z)); };
    /* WARENEINGANG am Zähltag SELBST ist der eine Fall, den keine
       Reihenfolge entscheiden kann: stand die Lieferung schon im Keller,
       als gezählt wurde, oder kam sie danach? `ts` sagt es nicht — er ist
       die Ankunftszeit des Pakets beim Server (deshalb rechnet seit v29
       niemand mehr mit ihm). Bis v29 wurde sie addiert und damit doppelt
       gezählt (10 gezählte + 24 gelieferte = 34, obwohl die 24 in den 10
       schon drin sein können).

       Seit v30: NICHT addieren, sondern ausweisen (`unklar`). Die Zählung
       ist die härtere Tatsache — sie hat die Flaschen gesehen. Die Zahl
       ist damit im Zweifel zu niedrig statt zu hoch: jemand geht nachsehen,
       statt dass eine Bestellung ausbleibt. Derselbe Schnitt im Worker. */
    /* Dieselben drei Wächter in derselben Reihenfolge wie im Worker. */
    Object.keys(v.eingang).forEach(id=>{
      const z=zuletzt[id];
      if(!z) return;                                   /* ohne Zählung kein Bestand */
      if((v.tag||"")<(z.tag||"")) return;              /* vor dem Zähltag zählt nicht */
      if((v.tag||"")===(z.tag||"")){                   /* am Zähltag: ausweisen */
        unklar[id]=(unklar[id]||0)+v.eingang[id]; return; }
      b[id]=(b[id]||0)+v.eingang[id]; seit.ein[id]=(seit.ein[id]||0)+v.eingang[id]; });
    Object.keys(v.wein).forEach(id=>{ if(!nach(id)) return;
      b[id]=(b[id]||0)-v.wein[id]; seit.raus[id]=(seit.raus[id]||0)+v.wein[id]; });
  });
  return {basis, b, seit, unklar, hat:!!basis};
}

/* Die am Zähltag gelieferte, NICHT mitgerechnete Menge ist keine Fußnote
   der Bestandsansicht: JEDE Zahl, die auf `bestand()` aufsetzt, ist um sie
   zu niedrig — die Bestellliste, der Minus-Alarm, die Zählliste. Bis v30
   stand der erklärende Satz nur unter „Kellerbestand", gerechnet wurde
   überall. Damit die Angabe mitreist, stehen die drei Fragen hier an EINER
   Stelle. Die Zahlen selbst bleiben, wie sie sind (Entscheidung Nr. 10). */
const unklarMenge = (B,id) => (B.unklar||{})[id]||0;
const unklarZeilenSatz = u =>
  "Am Zähltag "+num(u)+" Flaschen geliefert — ob die Zählung sie schon "+
  "enthält, ist nicht feststellbar. Nicht mitgerechnet.";
/* Ein Bestand unter null, der sich vollständig aus dieser Menge erklärt,
   ist KEIN überholter Zählstand: dieselbe Zählung plus die ausgewiesene
   Lieferung ergäbe eine Zahl ≥ 0. „Neu zählen" wäre dort die falsche
   Maßnahme — nachsehen, ob die Lieferung schon in der Zählung steckte,
   ist die richtige. Getrennt wird deshalb, nicht zusammengezählt. */
function minusGeteilt(B){
  const minus=WINES.filter(w=>B.b[w.id]!=null && B.b[w.id]<0);
  const erklaert=minus.filter(w=>B.b[w.id]+unklarMenge(B,w.id)>=0);
  return {minus, erklaert, echt:minus.filter(w=>erklaert.indexOf(w)<0)};
}

/* ── Betriebstag ──────────────────────────────────────────────────────
   F1 (18.09.2026): Das Backoffice bildete „heute" und „gestern" mit
   `toISOString()`, also in UTC — zwischen Mitternacht und 02:00 Ortszeit
   war das der Vortag, und die Leitung rechnete gegen einen anderen Tag als
   die App im Keller. Wortgleich mit `wienTag()` in index.html: wer eine
   aendert, aendert beide. */
function wienTag(d){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Vienna",
    year:"numeric",month:"2-digit",day:"2-digit"}).format(d||new Date());
}
function tagMinus(iso,n){
  const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-n);
  return d.toISOString().slice(0,10);
}
/* Verbrauch je Tag über das Fenster in EINST.tage */
function verbrauch(){
  const g=tagMinus(wienTag(),EINST.tage);
  const w={}, gt={}; const tage=new Set();
  VORGAENGE.forEach(v=>{
    if((v.tag||"") < g) return;
    if(v.mode==="ware"||v.mode==="keller") return;
    tage.add(v.tag);
    Object.keys(v.wein).forEach(id=>w[id]=(w[id]||0)+v.wein[id]);
    Object.keys(v.getr).forEach(id=>gt[id]=(gt[id]||0)+v.getr[id]);
  });
  const n=Math.max(1, tage.size);
  const proTag={}; Object.keys(w).forEach(id=>proTag[id]=w[id]/n);
  const gProTag={}; Object.keys(gt).forEach(id=>gProTag[id]=gt[id]/n);
  return {proTag, gProTag, tage:n, wein:w, getr:gt};
}

/* ════════════ 5 · Z-Bericht ════════════
   Hier stand bis v22 ein ZWEITER Leser für den gastronovi-Bericht —
   `zahl`, `felder`, `istStrich`, `zParse`, eine Abschrift von
   `src/gnparse.js`. Am ersten echten Bericht (Nr. 37) hat sich gezeigt,
   was eine Abschrift wert ist: Der Worker las 48 Positionen mit 145 Stück
   und 602,50 €, dieselbe Datei im Backoffice 106 Positionen mit 1345,75
   Stück und 5166,70 € — Steuersätze, Kellner und Warengruppen als
   Getränke, und das auf dem Schirm, den die Leitung morgens zuerst
   aufmacht. Ein Fehler war behoben, der andere nicht, weil niemand wusste,
   dass es ihn zweimal gibt.

   Deshalb liest diese Seite den Bericht nicht mehr selbst. Sie schickt ihn
   zum Worker (`POST /api/fassungsliste`) und holt ihn von dort zurück
   (`GET /api/fassungsliste`). Es gibt einen Leser, eine Zahl, und beides
   steht in der Datenbank statt im Browser dieses MacBooks — auch der
   Bericht, der per Mail hereinkommt. */

/* ── Zuordnung. Weine über das Rebsorten-Kürzel automatisch, Getränke nie ── */
const KUERZEL={GV:"Grüner Veltliner", RI:"Riesling", RIE:"Riesling", SB:"Sauvignon Blanc",
  WB:"Weißburgunder", CH:"Chardonnay", GB:"Grauburgunder", RV:"Roter Veltliner",
  MU:"Muskateller", MUS:"Muskateller", GS:"Gemischter Satz", GEM:"Gemischter Satz",
  ZW:"Zweigelt", BF:"Blaufränkisch", PN:"Pinot Noir", ME:"Merlot", MER:"Merlot",
  SA:"Sangiovese", BA:"Barbera", TR:"Traminer", CU:"Cuvée", CUV:"Cuvée"};
const flach = s => String(s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function autoWein(name){
  const m=/^([A-ZÄÖÜ]{2,3})\s+(.+)$/.exec(String(name).trim());
  if(!m) return null;
  const kz=m[1].toUpperCase(), rest=m[2];
  const reb=KUERZEL[kz]; if(!reb) return null;
  const teil=rest.split(",");
  const winzer=flach(teil[0]);
  if(!winzer) return null;
  let kand=WINES.filter(w=>{
    const wf=flach(w.winzer);
    return wf===winzer || wf.startsWith(winzer) || winzer.startsWith(wf) || wf.includes(winzer);
  });
  /* Das Kürzel bestätigt gegen — es entscheidet nicht allein */
  kand=kand.filter(w=>flach(w.reb).includes(flach(reb)) || flach(w.r).includes(flach(reb)));
  if(kand.length===1) return {id:kand[0].id, sicher:true};
  if(kand.length>1 && teil[1]){
    const wein=flach(teil[1].replace(/\d+\s*[\/,.]?\d*\s*l?$/,""));
    const eng=kand.filter(w=>flach(w.wein) && (flach(w.wein).includes(wein.split(" ")[0]) || wein.includes(flach(w.wein))));
    if(eng.length===1) return {id:eng[0].id, sicher:true};
  }
  return null;
}

/* Verkauf in Flaschen: (anzahl × ausschank_ml) / gebinde_ml.
   Fehlt eine der beiden Zahlen, wird KEINE erfunden — die Position bleibt
   aus der Rechnung heraus und wird als „Größe fehlt" ausgewiesen.
   Rückgabe: {ok:true, fl} oder {ok:false, fehlt:"ausschank"|"gebinde"}. */
function flaschen(p, artId){
  const aus = mlAusText(p.name);          /* Ausschank je verkaufter Einheit */
  const geb = gebindeGroesse(artId, p.name);
  if(!aus)                    return {ok:false, fehlt:"ausschank", aus:null, geb};
  if(geb.quelle!=="bestaetigt") return {ok:false, fehlt:"gebinde", aus, geb};
  return {ok:true, fl:(+p.anzahl||0)*aus/geb.ml, aus, geb};
}

function zuordnung(pos){
  if(REZ[pos.name] && REZ[pos.name].length) return {status:"rezept"};
  const z=MAP[pos.name];
  if(z==="__ignoriert") return {status:"ignoriert"};
  if(z) return {status:"fest", id:z};
  const a=autoWein(pos.name);
  if(a) return {status:"auto", id:a.id};
  return {status:"offen"};
}

/* ════════════ 6 · Abgleich Verkauf ↔ Fassung ════════════ */
/* Warum eine Zeile keinen Befund bekommt — an einer Stelle, damit
   Tabelle, Mittagsblick und CSV denselben Satz sagen. */
const UNKLAR_GRUND={
  groesse:     "Größe fehlt",
  keinbericht: "kein Z-Bericht im Zeitraum"
};
const unklarSatz = g => "kein Abgleich möglich — " + (UNKLAR_GRUND[g] || "Verkauf nicht bestimmbar");
/* Der Grund „offen" stand hier bis v28 und ist seit v29 fort
   (`review/ENTSCHIEDEN-NACHTS.md`, Punkt 9): eine nicht zugeordnete
   Kassenposition betrifft per Definition KEINEN bestimmten Artikel und
   darf deshalb auch keinem Artikel den Befund nehmen. In Bericht 37 sind
   dreißig der offenen Namen Speisen (Schnittlauch, Käse, HP Omelett) —
   eine einzige davon schaltete den Schwund für ALLE Artikel ohne
   gerechneten Verkauf ab: 12 Flaschen aus dem Keller, 0 verkauft,
   „kein Abgleich möglich". Was offen ist, sagt der Hinweis über der
   Tabelle („n Kassenpositionen ohne Zuordnung"). */

/* Ein Teil der Positionen eines Artikels konnte nicht gerechnet werden,
   ein anderer schon: dann bleibt die Differenz stehen — mit Vorbehalt.
   Eine halbe Wahrheit, die sich als ganze ausgibt, ist der teuerste Fall;
   eine Differenz MIT Vorbehalt ist besser als gar keine. */
const vorbehaltSatz = v =>
  v.ohne+" von "+v.gesamt+" Positionen ohne Größe — die Differenz ist unvollständig";

/* Der Befund einer GERECHNETEN Zeile — an einer Stelle für Tabelle und CSV.
   Warum die Fallunterscheidung: Eine Zeile mit Vorbehalt sagte bis v30 bei
   `diff 0` „stimmt" in Grün. Sie stimmt aber nicht — ein Teil des Verkaufs
   steckt gar nicht in der Rechnung (2 gerechnete + 3 ohne Größe, 2
   entnommen → diff 0 bei einem Drittel fehlender Rechnung). Die Null ist
   dort keine geprüfte Null, sondern eine halbe Rechnung. Deshalb dieselbe
   neutrale Plakette wie bei „kein Abgleich"; der Satz daneben
   (`vorbehaltSatz`) sagt, wie viel fehlt.
   Ab einer Differenz von 0,5 Flaschen bleibt der Befund, wie er war:
   „kleine Abweichung"/„prüfen" behauptet nichts über Vollständigkeit,
   sondern nennt eine Untergrenze — und die gilt mit Vorbehalt erst recht. */
const BEFUND = r => Math.abs(r.diff)<0.5
  ? (r.vorbehalt ? {w:"unvollständig", k:"p-grau"} : {w:"stimmt", k:"p-ok"})
  : Math.abs(r.diff)<2 ? {w:"kleine Abweichung", k:"p-warn"}
  : {w:"prüfen", k:"p-bad"};

function abgleich(tag, spanne){
  spanne = spanne || 1;
  const bis=tag, von=tagMinus(tag,spanne-1);
  const imFenster = t => t>=von && t<=bis;

  const verk={}, offen=[], ohneGroesse=[], berichte=[];
  /* Artikel, deren VERKAUF in diesem Zeitraum nicht bestimmbar ist.
     Für sie gibt es keine Differenz und keine Deutung — die Entnahme
     steht da, weil sie bekannt ist, aber ohne Urteil.
     Bis v26 fehlte diese Karte, und das war der teuerste Fehler des
     Schirms: `ids` entsteht aus `keys(verk) ∪ keys(ent)`. Eine Position
     ohne bestätigte Größe fällt aus `verk` heraus, steht aber über die
     Tagesfassung in `ent` — sie wurde damit zur VOLLEN Abweichung mit
     der Deutung „mehr geholt als verkauft — Vorrat aufgebaut oder
     Schwund", während der Hinweis darüber wörtlich sagte, sie zähle
     „weder als Verkauf noch als Abweichung". Mit dem Mapping, wie es in
     der Live-D1 steht (keine einzige bestätigte Gebindegröße), war `verk`
     leer und JEDE Zeile stand als „prüfen" da. */
  const unklar={};
  const nichtRechenbar=(id,grund)=>{ if(id && !unklar[id]) unklar[id]=grund; };
  /* Je Artikel: wie viele Kassenpositionen ihn betreffen und wie viele
     davon mangels Größe draußen blieben. Gezählt wird WÄHREND des Laufs,
     entschieden erst DANACH — im Lauf selbst weiß niemand, ob derselbe
     Artikel an einer späteren Position noch eine gerechnete Zahl bekommt.
     Genau daran scheiterte v28: `nichtRechenbar(id,"groesse")` wurde
     sofort gesetzt und löschte rückwirkend einen schon gerechneten
     Verkauf (Spritzerwein: 1,80 Fl. gerechnet, Entnahme 9 → die Zeile
     sagte „kein Abgleich möglich" statt +7,2). */
  const posZahl={}, posOhne={};
  const zaehlePos=(id,gerechnet)=>{ if(!id) return;
    posZahl[id]=(posZahl[id]||0)+1;
    if(!gerechnet) posOhne[id]=(posOhne[id]||0)+1; };
  /* Dritter Zustand neben „zugeordnet" und „offen": zugeordnet, aber die
     Größe ist nicht bestätigt. Solche Positionen gehen weder in `verk`
     noch in die Differenz ein — sonst sähe eine fehlende Zahl aus wie
     Schwund. Mehrere Kassenzeilen desselben Namens (Bar/Restaurant,
     Regel 7) werden hier zusammengezählt. */
  const merkeOhneGroesse=(p, artId, r, rezept)=>{
    const da=ohneGroesse.find(o=>o.name===p.name);
    if(da){ da.anzahl+=(+p.anzahl||0); return; }
    /* `rezept` ist wichtiger, als es aussieht: bei einem zerlegten
       Mischgetränk ist `id` NICHT der Artikel der Kassenposition, sondern
       der BESTANDTEIL, dem die Größe fehlt. Wer daraus eine Zuordnung
       macht, schreibt „Aperol Spritz = Prosecco" — und der Worker zieht
       damit rückwirkend alle gespeicherten Berichtszeilen nach
       (src/index.js, `UPDATE fassungszeile SET artikel …`). Diese Zeilen
       bekommen deshalb keinen Bestätigungsknopf. */
    ohneGroesse.push({name:p.name, anzahl:(+p.anzahl||0), id:artId,
      fehlt:r.fehlt, aus:r.aus, geb:r.geb, rezept:!!rezept});
  };
  Object.keys(ZBER).filter(imFenster).sort().forEach(t=>{
    const z=ZBER[t]; berichte.push(z);
    z.positionen.forEach(p=>{
      const r=REZ[p.name];
      if(r && r.length){                       /* zerlegtes Mischgetränk */
        /* Auch hier gilt: ohne bestätigtes Gebinde keine Flaschenzahl.
           Fehlt sie bei einem Bestandteil, bleibt die ganze Position
           draußen — ein halb gerechnetes Rezept wäre die schlimmere Zahl. */
        const gebs=r.map(x=>gebindeGroesse(x.id, null));
        const luecke=gebs.findIndex(g=>g.quelle!=="bestaetigt");
        if(luecke>=0){
          merkeOhneGroesse(p, r[luecke].id, {fehlt:"gebinde", aus:r[luecke].ml, geb:gebs[luecke]}, true);
          /* Die ganze Position bleibt draußen — also fehlt der Verkauf
             JEDES Bestandteils, nicht nur der des einen mit der Lücke. */
          r.forEach(x=>zaehlePos(x.id,false));
          return;
        }
        r.forEach((x,i)=>{ verk[x.id]=(verk[x.id]||0)+(+p.anzahl||0)*x.ml/gebs[i].ml;
          zaehlePos(x.id,true); });
        return;
      }
      const zu=zuordnung(p);
      if(zu.status==="offen"){ if(!offen.some(o=>o.name===p.name)) offen.push(p); return; }
      if(zu.status==="ignoriert") return;
      const f=flaschen(p, zu.id);
      if(!f.ok){ merkeOhneGroesse(p, zu.id, f); zaehlePos(zu.id,false); return; }
      verk[zu.id]=(verk[zu.id]||0)+f.fl; zaehlePos(zu.id,true);
    });
  });
  const z=berichte.length?berichte[berichte.length-1]:null;

  /* Alles, was im Fenster aus dem Keller ging */
  const ent={};
  VORGAENGE.filter(v=>imFenster(v.tag)).forEach(v=>{
    Object.keys(v.wein).forEach(id=>ent[id]=(ent[id]||0)+v.wein[id]);
    Object.keys(v.getr).forEach(id=>ent[id]=(ent[id]||0)+v.getr[id]);
  });

  /* Jetzt erst, mit dem vollständigen Lauf im Rücken: keine einzige
     Position gerechnet → kein Befund; wenigstens eine gerechnet → Befund
     mit Vorbehalt. */
  const vorbehalt={};
  Object.keys(posOhne).forEach(id=>{
    if((posZahl[id]||0)>posOhne[id]) vorbehalt[id]={ohne:posOhne[id], gesamt:posZahl[id]};
    else nichtRechenbar(id,"groesse");
  });
  /* Ohne Z-Bericht ist die Verkaufsseite nicht leer, sondern unbekannt —
     der einzige verbliebene Grund, der einen Artikel ganz stumm stellt.
     Er betrifft nur Artikel ohne gerechneten Verkauf; wer eine gerechnete
     Zahl hat, behält seine Differenz. */
  if(!berichte.length) Object.keys(ent).forEach(id=>{
    if(!(verk[id]>0)) nichtRechenbar(id,"keinbericht");
  });

  const ids=Array.from(new Set([...Object.keys(verk), ...Object.keys(ent)]));
  const zeilen=ids.map(id=>{
    const w=byId(id);
    const v=verk[id]||0, e=ent[id]||0, u=unklar[id]||null;
    /* `diff` ist bei einer unklaren Zeile ausdrücklich `null`, nicht 0:
       eine 0 hieße „stimmt". Alle Leser filtern über `Math.abs(r.diff)`,
       und `Math.abs(null)` ist 0 — die Zeile fällt damit aus jeder
       Auffälligkeitsliste heraus, auch wenn eine Stelle die Prüfung auf
       `r.unklar` vergessen sollte. */
    return {id, name: w ? (w.winzer+" · "+w.wein) : GN(id), art: w?"Wein":"Getränk",
            verkauf:v, entnahme:e, diff: u?null:e-v, unklar:u,
            vorbehalt: u?null:(vorbehalt[id]||null)};
  }).sort((a,b)=>(a.unklar?1:0)-(b.unklar?1:0)
                 || Math.abs(b.diff)-Math.abs(a.diff) || b.verkauf-a.verkauf);

  return {z, zeilen, offen, ohneGroesse, unklar, vorbehalt, verk, ent, von, bis, spanne,
          berichte:berichte.length};
}

/* ════════════ 7 · Ansichten ════════════ */
const SEITEN=[
  {id:"heute",     t:"Mittagsblick",     grp:"Täglich"},
  {id:"abgleich",  t:"Verkauf ↔ Fassung"},
  {id:"import",    t:"Z-Bericht"},
  {id:"bestand",   t:"Kellerbestand",    grp:"Bestand"},
  {id:"bestellen", t:"Nachbestellen"},
  {id:"getraenke", t:"Getränke"},
  {id:"zaehlliste",t:"Zählliste"},
  {id:"speicher",  t:"Speicher",          grp:"Nachschlagen"},
  {id:"zuordnung", t:"Zuordnung"},
  {id:"rezepte",   t:"Rezepturen"},
  {id:"team",      t:"Mitarbeiter",       grp:"Verwaltung"},
  {id:"einst",     t:"Einstellungen"}
];
let SEITE="heute", SPANNE=7;

function zaehler(id){
  const t=letzterTag();
  if(id==="zuordnung"){ const a=abgleich(t); return a.offen.length||null; }
  if(id==="bestellen"){ return bestellliste().length||null; }
  if(id==="zaehlliste"){ return zaehlliste().length||null; }
  if(id==="speicher"){ return VORGAENGE.length||null; }
  if(id==="abgleich"){ const a=abgleich(t, SPANNE);
    /* Ohne Z-Bericht im Fenster ist jede „Differenz" die reine Entnahme.
       Eine rote Zahl in der Navigation behauptete dann einen Befund, den
       die Ansicht daneben selbst als „noch kein Abgleich" bezeichnet. */
    if(!a.berichte) return null;
    /* Eine Zeile ohne bestimmbaren Verkauf ist kein Befund. Sie zählt
       deshalb nicht in die rote Zahl — sonst stünde dort die Menge der
       fehlenden ANGABEN und läse sich wie die Menge fehlender Flaschen. */
    return a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1).length||null; }
  return null;
}

function zeichneNav(){
  const n=$("#nav"); n.innerHTML="";
  SEITEN.forEach(s=>{
    if(s.grp){ const g=document.createElement("div"); g.className="grp"; g.textContent=s.grp; n.appendChild(g); }
    const b=document.createElement("button");
    b.className=(SEITE===s.id?"on":"");
    const z=zaehler(s.id);
    b.innerHTML=`<span>${esc(s.t)}</span>`+
      (z?`<span class="zahl ${s.id==="zuordnung"||s.id==="abgleich"?"rot":""}">${z}</span>`:"");
    /* Auf schmalen Schirmen liegt die Navigation über dem Inhalt und
       schließt sich nach der Wahl von selbst. */
    b.onclick=()=>{ SEITE=s.id; document.body.classList.remove("navoffen");
      zeichne(); window.scrollTo(0,0); };
    n.appendChild(b);
  });
}

function letzterTag(){
  /* Der Betriebstag, um den es geht: gestern, sofern es dazu etwas gibt */
  const gestern=tagMinus(wienTag(),1);
  if(ZBER[gestern] || VORGAENGE.some(v=>v.tag===gestern)) return gestern;
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort();
  return tage[tage.length-1] || gestern;
}
function deTag(iso){
  if(!iso) return "—";
  const d=new Date(iso+"T12:00");
  return d.toLocaleDateString("de-AT",{weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"});
}

/* ── Mittagsblick ───────────────────────────────────────────────────── */
function vHeute(m){
  const tag=letzterTag(), a=abgleich(tag, SPANNE), B=bestand(), V=verbrauch();
  const heutigeVorg=VORGAENGE.filter(v=>v.tag===tag);
  const fassung=heutigeVorg.find(v=>v.mode==="tag");
  const best=bestellliste();
  const grob=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=2);
  const ohneUrteil=a.zeilen.filter(r=>r.unklar).length;
  const minus=minusGeteilt(B);

  m.innerHTML=`<section>
    <h2>Mittagsblick</h2>
    <div class="unter">Betriebstag ${esc(deTag(tag))} · Abgleich über ${SPANNE} Tage · ${esc(quelleSatz())}</div></section>`;

  const k=document.createElement("section");
  k.className="gitter g4";
  /* Der große Slot ist für Ziffern gebaut. Ein grünes „eingegangen" darin
     wiegt schwerer als die rote 7 daneben — obwohl nur die 7 eine Handlung
     auslöst. Zustände bekommen deshalb die schmale Variante. */
  const kachel=(t,w,u,kl,status)=>
    `<div class="kpi ${kl||""}${status?" kpi--status":""}"><span>${t}</span>`+
    `<b>${w}</b><small>${u||"&nbsp;"}</small></div>`;
  k.innerHTML=
    kachel("Tagesfassung", fassung?"eingegangen":"fehlt",
      fassung?esc(fassung.name||"ohne Namen")+" · "+fassung.flWein+" Fl. Wein":"noch keine Fassung für diesen Tag",
      fassung?"ok":"warn", true)+
    kachel("Z-Berichte", a.berichte?a.berichte+" von "+SPANNE+" Tagen":"fehlen",
      a.z?(a.z.positionen.length+" Positionen · "+eur(a.z.umsatz)+" zuletzt"):"noch nicht importiert",
      a.berichte>=SPANNE?"ok":a.berichte?"warn":"bad", true)+
    /* Eine grüne Null heißt „geprüft, alles in Ordnung". Ohne Z-Bericht im
       Fenster ist aber nichts geprüft, und ohne Kellerzählung ist kein
       Bestand berechenbar (§4.3: ohne Zählung kein Bestand, nur Bewegung) —
       die Bestellliste KANN dann nichts finden. Am ersten Tag nach dem
       Livegang stand hier zweimal Grün über einer leeren Datenbank.
       Fehlt die Grundlage, steht ein Strich da, kein Haken. */
    /* Eine grüne Null darf nur dastehen, wenn auch wirklich verglichen
       wurde. Sind alle Zeilen ohne bestimmbaren Verkauf, ist nichts
       geprüft — das steht dann da, statt „decken sich". */
    kachel("Auffällige Differenzen", a.berichte?grob.length:"—",
      a.berichte
        ?(grob.length
          ?("über "+SPANNE+" Tage nicht ausgeglichen"+(ohneUrteil?" · "+ohneUrteil+" ohne Abgleich":""))
          :ohneUrteil
            ?(ohneUrteil+" Positionen ohne Abgleich — Größe fehlt oder Position nicht zugeordnet")
            :"Verkauf und Entnahme decken sich")
        :"kein Z-Bericht im Zeitraum — nicht vergleichbar",
      a.berichte?(grob.length>4?"bad":(grob.length||ohneUrteil)?"warn":"ok"):"")+
    kachel("Nachbestellen", B.hat?best.length:"—",
      B.hat
        ?(best.length?("Reichweite unter "+EINST.reichweite+" Tagen"):"nichts unter der Schwelle")
        :"keine Kellerzählung — Bestand nicht berechenbar",
      B.hat?(best.length?"warn":"ok"):"");
  m.appendChild(k);

  /* Was heute noch fehlt */
  const fehlt=[];
  if(!fassung) fehlt.push("Für "+deTag(tag)+" liegt keine Tagesfassung vor.");
  if(!ZBER[tag]) fehlt.push("Der Z-Bericht zu diesem Tag ist noch nicht eingelesen.");
  else if(a.berichte<SPANNE) fehlt.push("Im Zeitraum fehlen "+(SPANNE-a.berichte)+" Z-Berichte — die Differenzen sind darum zu hoch.");
  if(a.offen.length) fehlt.push(a.offen.length+" Kassenpositionen sind keinem Artikel zugeordnet — sie fehlen im Abgleich.");
  /* „Größe fehlt" ist kein Befund, sondern eine offene Angabe. Deshalb
     steht die Zahl hier und nicht bei den Abweichungen. */
  if(a.ohneGroesse.length) fehlt.push("Größe fehlt: "+a.ohneGroesse.length
    +" zugeordnete Kassenpositionen ("+num(a.ohneGroesse.reduce((x,o)=>x+o.anzahl,0))
    +" Einheiten) haben keine bestätigte Größe — sie zählen weder als Verkauf noch als Abweichung."
    +" Unter „Verkauf ↔ Fassung“ lassen sie sich gesammelt bestätigen.");
  if(!B.hat) fehlt.push("Es gibt noch keine Kellerzählung. Ohne sie ist kein Bestand berechenbar, nur Bewegung.");
  else {
    /* „Die Zählung ist überholt, neu zählen" ist der falsche Satz für einen
       Bestand, der nur deshalb unter null steht, weil die Lieferung des
       Zähltags bewusst nicht mitgerechnet wird. Die Zählung ist dann in
       Ordnung; es fehlt eine Angabe, keine Zählung. Deshalb zwei Sätze. */
    if(minus.echt.length) fehlt.push(minus.echt.length+" Positionen stehen rechnerisch unter null — die Zählung vom "+deTag(B.basis.tag)+" ist überholt. Neu zählen.");
    if(minus.erklaert.length) fehlt.push(minus.erklaert.length+" Position"+(minus.erklaert.length===1?" steht":"en stehen")
      +" nur deshalb unter null, weil am Zähltag "+num(minus.erklaert.reduce((x,w)=>x+unklarMenge(B,w.id),0))
      +" Flaschen geliefert wurden, die nicht mitgerechnet sind. Das ist kein Zählfehler — im Keller nachsehen.");
  }
  if(fehlt.length){
    const s=document.createElement("section");
    s.innerHTML=`<h3>Was noch fehlt</h3><div class="hinweis warn">${fehlt.map(esc).join("<br>")}</div>`;
    m.appendChild(s);
  }

  /* Die größten Ausreißer */
  const s2=document.createElement("section");
  const top=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1).slice(0,10);
  s2.innerHTML=`<h3>Größte Abweichungen · ${esc(deTag(a.von))} bis ${esc(deTag(a.bis))}</h3>`+
    /* Ohne Z-Bericht ist der Verkauf nicht 0, sondern unbekannt. Dieselbe
       Warnung steht in „Verkauf ↔ Fassung"; hier fehlte sie, und der
       Mittagsblick ist der Schirm, den die Leitung morgens zuerst sieht.
       Sie hing bis v26 an `top.length` — seit die Zeilen ohne bestimmbaren
       Verkauf aus `top` herausfallen, wäre sie genau dann verschwunden,
       wenn sie gebraucht wird. */
    (!a.berichte&&a.zeilen.length?`<div class="hinweis warn" style="margin-bottom:var(--space-4)">
      Kein Z-Bericht im Zeitraum. Der Verkauf ist damit unbekannt — die Entnahme steht
      unter „Verkauf ↔ Fassung“ ohne Urteil. Das ist noch kein Abgleich.</div>`:"")+
    (a.berichte&&ohneUrteil?`<div class="hinweis" style="margin-bottom:var(--space-4)">
      ${ohneUrteil} Position${ohneUrteil===1?"":"en"} stehen hier nicht: für sie ist der Verkauf
      nicht bestimmbar (keine bestätigte Größe oder kein Z-Bericht). Ihre Entnahme ist
      weder Abweichung noch Schwund — nachzulesen unter „Verkauf ↔ Fassung“.</div>`:"")+
    (top.length? `<div class="tabhuelle"><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauf</th><th class="r">Entnahme</th><th class="r">Differenz</th><th>Deutung</th>
      </tr></thead><tbody>${top.map(r=>`<tr>
        <td>${esc(r.name)} <span class="mini">${r.art}</span></td>
        <td class="r">${num(r.verkauf)}</td><td class="r">${num(r.entnahme)}</td>
        <td class="r ${r.diff>0?"diff-plus":"diff-minus"}">${r.diff>0?"+":""}${num(r.diff)}</td>
        <td class="deutung">${r.diff>0?"mehr geholt als verkauft — Vorrat aufgebaut oder Schwund":"mehr verkauft als geholt — Vorrat wird abgebaut"}${
          /* Auch hier gesagt: der Mittagsblick ist der Schirm, den die
             Leitung morgens zuerst sieht, und eine Differenz aus halb
             gerechnetem Verkauf darf dort nicht als ganze dastehen. */
          r.vorbehalt?"<br><span class=\"dim\">"+esc(vorbehaltSatz(r.vorbehalt))+"</span>":""}</td>
      </tr>`).join("")}</tbody></table></div>`
    /* Drei verschiedene Lagen, die bis v26 alle „Keine Abweichung über
       einer Flasche" sagten — auch dann, wenn gar nichts vergleichbar war. */
    : `<div class="karte leer">${!a.zeilen.length
        ?"Weder Verkauf noch Entnahme in diesem Zeitraum — es gibt noch nichts zu vergleichen."
        :a.zeilen.some(r=>!r.unklar)
        ?"Keine Abweichung über einer Flasche."
        :"Für keine Position ist der Verkauf bestimmbar — es gibt noch nichts zu vergleichen."}</div>`);
  /* Der Bestellvorschlag darunter hat „Alle ansehen" — gleiche Stelle,
     also auch hier ein Weg in die volle Ansicht. Der Weg muss auch dann
     dastehen, wenn KEINE Abweichung übrig ist, aber Zeilen ohne Urteil:
     drüben stehen sie samt Grund und samt Sammelbestätigung. */
  const wegDorthin = top.length || ohneUrteil;
  if(wegDorthin)s2.insertAdjacentHTML("beforeend",
    `<div class="reihe" style="margin-top:12px">
       <button class="b leise" id="bAlleAbw">Zum vollständigen Abgleich</button></div>`);
  m.appendChild(s2);
  if(wegDorthin)$("#bAlleAbw").onclick=()=>{ SEITE="abgleich"; zeichne(); window.scrollTo(0,0); };

  /* Bestellvorschlag kompakt */
  if(best.length){
    const s3=document.createElement("section");
    s3.innerHTML=`<h3>Bestellvorschlag</h3><div class="tabhuelle"><table><thead><tr>
      <th>Wein</th><th class="r">Bestand</th><th class="r">Pro Tag</th><th class="r">Reicht</th><th class="r">Kisten</th>
      </tr></thead><tbody>${best.slice(0,8).map(r=>`<tr>
        <td>${esc(r.w.winzer)} · ${esc(r.w.wein)}
          ${r.unklar?`<div class="mini">${esc(unklarZeilenSatz(r.unklar))}</div>`:""}</td>
        <td class="r">${num(r.bestand)}</td><td class="r">${num(r.proTag)}</td>
        <td class="r"><span class="pill ${r.reichweite<7?"p-bad":"p-warn"}">${r.reichweite===Infinity?"—":Math.floor(r.reichweite)+" T"}</span></td>
        <td class="r"><b>${esc(bestellSpanne(r))}</b> × ${r.kg}</td></tr>`).join("")}</tbody></table></div>
      <div class="reihe" style="margin-top:12px"><button class="b" id="bMehr">Alle ansehen</button></div>`;
    m.appendChild(s3);
    $("#bMehr").onclick=()=>{ SEITE="bestellen"; zeichne(); };
  }
}

/* ── Abgleich ───────────────────────────────────────────────────────── */
function vAbgleich(m){
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort().reverse();
  const tag=vAbgleich.tag && tage.includes(vAbgleich.tag) ? vAbgleich.tag : letzterTag();
  vAbgleich.tag=tag;
  const a=abgleich(tag, SPANNE);

  m.innerHTML=`<section><h2>Verkauf ↔ Fassung</h2>
    <div class="unter">Was die Kasse gebucht hat, gegen das, was aus dem Keller geholt wurde.
    Gerechnet wird in Flaschen: Anzahl × Ausschank in Millilitern, geteilt durch das Gebinde.<br>
    Was am Abend verkauft wird, holt oft erst der nächste Tag nach. Über einen einzelnen Tag
    verschiebt das jede Zeile — über eine Woche gleicht es sich aus.</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<label class="mini">Bis Betriebstag</label>
    <select id="selTag">${tage.map(t=>`<option value="${t}" ${t===tag?"selected":""}>${esc(deTag(t))}</option>`).join("")}</select>
    <label class="mini" style="margin-left:10px">Zeitraum</label>
    <select id="selSpanne">${[1,7,14,30].map(n=>`<option value="${n}" ${n===SPANNE?"selected":""}>${n===1?"nur dieser Tag":n+" Tage"}</option>`).join("")}</select>
    <span class="mini">${a.berichte} Z-Bericht${a.berichte===1?"":"e"} im Zeitraum</span>
    <span class="rechts"></span>
    <button class="b klein" id="bCsv">Als CSV</button>`;
  m.appendChild(w);
  $("#selTag").onchange=e=>{ vAbgleich.tag=e.target.value; zeichne(); };
  $("#selSpanne").onchange=e=>{ SPANNE=+e.target.value; zeichne(); };
  $("#bCsv").onclick=()=>csvAbgleich(tag,a);

  if(!a.berichte){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis warn">In diesem Zeitraum liegt kein Z-Bericht vor.
      Ohne ihn zeigt die Tabelle nur die Entnahme.</div>`;
    m.appendChild(s);
  }else if(a.berichte<a.spanne){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis">${a.berichte} von ${a.spanne} Tagen sind eingelesen.
      Für die übrigen fehlt der Verkauf — die Differenzen fallen entsprechend zu hoch aus.</div>`;
    m.appendChild(s);
  }
  if(a.offen.length){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis bad">${a.offen.length} Kassenpositionen ohne Zuordnung —
      ihr Verkauf fehlt in dieser Rechnung.
      <button class="b klein" id="bZu" style="margin-left:8px">Jetzt zuordnen</button></div>`;
    m.appendChild(s); $("#bZu").onclick=()=>{ SEITE="zuordnung"; zeichne(); };
  }
  /* Der dritte Zustand: zugeordnet, aber die Größe ist nicht bestätigt.
     Bewusst NICHT rot und bewusst nicht in der Differenz — hier fehlt eine
     Angabe, es fehlt keine Flasche. */
  if(a.ohneGroesse.length){
    const stk=a.ohneGroesse.reduce((x,o)=>x+o.anzahl,0);
    const s=document.createElement("section");
    /* Ein eigener Abschnitt mit Überschrift, nicht ein Hinweiskasten ohne
       Kopf: Er steht zwischen der Filterzeile und der Abgleichtabelle, und
       ohne Überschrift war nicht zu sehen, wo er anfängt und wo er aufhört.
       Die Zahl gehört in die Überschrift — sie ist das Maß der Arbeit, die
       hier liegt. */
    s.innerHTML=`<div class="abschnitt"><div>
      <h3>Größe fehlt · ${a.ohneGroesse.length} Kassenposition${a.ohneGroesse.length===1?"":"en"}</h3>
      <div class="unter">${num(stk)} verkaufte Einheiten sind zugeordnet, ihre Größe aber nicht
      bestätigt — sie bleiben aus der Mengenrechnung heraus, als fehlende Angabe und nicht als
      Abweichung</div></div></div>
      <div class="tabhuelle"><table><thead><tr>
        <th>Kassenname</th><th class="r">Menge</th><th>Artikel</th><th>Was fehlt</th><th>Vorschlag</th>
      </tr></thead><tbody>${a.ohneGroesse.map(o=>`<tr>
        <td>${esc(o.name)}</td><td class="r">${num(o.anzahl)}</td>
        <td>${o.rezept ? "Mischgetränk · Bestandteil "+esc(artName(o.id)) : esc(artName(o.id))}</td>
        <td>${o.rezept
          ? "Für "+esc(artName(o.id))+" fehlt die Flaschengröße"
          : o.fehlt==="ausschank"
          ? "Die Ausschankmenge steht nicht im Kassennamen"
          : "Die Gebindegröße des Artikels ist nicht bestätigt"}</td>
        <td>${o.rezept ? '<span class="dim">kein Knopf an dieser Zeile — die Größe gehört zum Bestandteil und wird an dessen eigener Kassenposition bestätigt</span>'
          : o.fehlt==="ausschank" ? '<span class="dim">kein Vorschlag — Kassenname oder Rezeptur nötig</span>'
          : o.geb.ml
            ? `<span class="vorschlag"><span>${o.geb.ml} ml <span class="mini">(${esc(o.geb.woher)})</span></span>
               <button class="b klein" data-geb="${esc(o.name)}" data-art="${esc(o.id)}"
                 data-ml="${o.geb.ml}">Übernehmen</button></span>`
            : '<span class="dim">kein Vorschlag — Gebindegröße von Hand eintragen</span>'}</td>
      </tr>`).join("")}</tbody></table></div>`;
    m.appendChild(s);
    s.querySelectorAll("button[data-geb]").forEach(b=>b.onclick=()=>
      bestaetigeGebinde(b.dataset.geb, b.dataset.art, +b.dataset.ml));

    /* Der Sammelweg. Er steht bewusst UNTER der Tabelle: erst die Liste
       lesen (Kassenname, Artikel, Vorschlag, Herkunft), dann bestätigen.
       Angefasst wird nur, was einen Vorschlag hat — Positionen, bei denen
       die Ausschankmenge im Kassennamen fehlt, kann niemand vorschlagen,
       und ein Sammelknopf darf sie nicht stillschweigend mitnehmen. */
    const vorschlaege=a.ohneGroesse
      .filter(o=>o.fehlt==="gebinde" && !o.rezept && o.id && o.geb && +o.geb.ml>0)
      .map(o=>({name:o.name, id:o.id, ml:+o.geb.ml}));
    const ohneVorschlag=a.ohneGroesse.length-vorschlaege.length;
    if(vorschlaege.length){
      const z=document.createElement("div");
      z.className="hinweis abschnitt";
      z.innerHTML=`<div>Für ${vorschlaege.length} dieser Positionen steht oben ein Vorschlag samt Herkunft.
        ${ohneVorschlag ? "Die übrigen "+ohneVorschlag+" bleiben unberührt: dort fehlt die Ausschankmenge im Kassennamen, oder es ist ein Mischgetränk." : ""}</div>
        <button class="b tat" id="bGebAlle">Alle ${vorschlaege.length} Vorschläge übernehmen</button>`;
      s.appendChild(z);
      const bAlle=z.querySelector("#bGebAlle");
      bAlle.onclick=async()=>{
        bAlle.disabled=true; bAlle.textContent="Wird bestätigt …";
        await bestaetigeAlleGebinde(vorschlaege);   /* zeichnet danach neu */
      };
    }
  }

  const s=document.createElement("section");
  const wein=a.zeilen.filter(r=>r.art==="Wein"), getr=a.zeilen.filter(r=>r.art!=="Wein");
  /* Eine Zeile ohne bestimmbaren Verkauf bekommt KEINE Differenz und
     keine Deutung. Die Entnahme bleibt stehen — sie ist bekannt —, in der
     Differenzspalte steht ein Strich, und der Befund sagt, woran es
     liegt. Seit v28 wieder als Plakette: `p-grau` hatte mit 4,43:1 keinen
     tragfähigen Farbwert und war deshalb keine Plakette wert — mit
     --fg-secondary sind es 5,83:1 auf demselben Grund. Die Plakette sagt
     „kein Abgleich", der Grund steht im Klartext daneben; so trägt die
     Spalte in jeder Zeile dieselbe Form, und die unklaren Zeilen
     verschwinden nicht mehr zwischen den Pillen der anderen. */
  const zeile=r=>`<tr>
    <td>${esc(r.name)}</td>
    <td class="r">${r.unklar?"—":num(r.verkauf)}</td>
    <td class="r">${num(r.entnahme)}</td>
    <td class="r ${r.unklar||Math.abs(r.diff)<0.5?"dim":(r.diff>0?"diff-plus":"diff-minus")}">${
      r.unklar?"—":(r.diff>0?"+":"")+num(r.diff)}</td>
    <td>${r.unklar?'<span class="befund"><span class="pill p-grau">kein Abgleich</span>'
        +'<span class="dim">'+esc(UNKLAR_GRUND[r.unklar]||"Verkauf nicht bestimmbar")+'</span></span>'
        /* Mit Vorbehalt: der Satz daneben sagt, dass ein Teil des Verkaufs
           fehlt. Die Differenz ist damit eine Untergrenze — verschwiegen
           wäre sie eine Behauptung. Welche Plakette dazugehört, entscheidet
           `BEFUND`: bei Differenz 0 die neutrale, nie die grüne. Die Hülle
           `.befund` bekommt nur diese Zeile; eine Zeile ohne Vorbehalt
           sieht aus wie bisher. */
        :(pill=>r.vorbehalt
          ? '<span class="befund">'+pill
            +'<span class="dim">'+esc(vorbehaltSatz(r.vorbehalt))+'</span></span>'
          : pill)(
           (b=>'<span class="pill '+b.k+'">'+esc(b.w)+'</span>')(BEFUND(r)))}</td></tr>`;
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauf Fl.</th><th class="r">Entnahme Fl.</th><th class="r">Differenz</th><th>Befund</th>
    </tr></thead><tbody>
      ${wein.length?`<tr class="zwt"><td colspan="5">Wein</td></tr>`+wein.map(zeile).join(""):""}
      ${getr.length?`<tr class="zwt"><td colspan="5">Getränke</td></tr>`+getr.map(zeile).join(""):""}
      ${a.zeilen.length?"":`<tr><td colspan="5" class="leer">Für diesen Tag gibt es nichts zu vergleichen.</td></tr>`}
    </tbody></table></div>`;
  m.appendChild(s);
}

function csvAbgleich(tag,a){
  const e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const L=[["Abgleich Verkauf gegen Fassung"].map(e).join(";"),
           ["Betriebstag",tag].map(e).join(";"),"",
           ["Artikel","Art","Verkauf Fl.","Entnahme Fl.","Differenz","Befund"].map(e).join(";")];
  /* Unklare Zeilen lassen Verkauf und Differenz LEER. Eine 0 in der
     Ausfuhr ist eine Zahl, mit der jemand weiterrechnet — und „0 verkauft,
     7 entnommen" ist genau die Behauptung, die hier niemand belegen kann. */
  a.zeilen.forEach(r=>L.push([r.name,r.art,
    r.unklar?"":num(r.verkauf), num(r.entnahme), r.unklar?"":num(r.diff),
    r.unklar?unklarSatz(r.unklar)
      :BEFUND(r).w                                  /* dasselbe Wort wie in der Tabelle */
       +(r.vorbehalt?" · "+vorbehaltSatz(r.vorbehalt):"")
    ].map(e).join(";")));
  if(a.offen.length){ L.push("",["Ohne Zuordnung"].map(e).join(";"),["Kassenname","Anzahl"].map(e).join(";"));
    a.offen.forEach(p=>L.push([p.name,p.anzahl].map(e).join(";"))); }
  /* Ohne diesen Block sähe die Ausfuhr vollständig aus, obwohl ein Teil
     des Verkaufs mangels bestätigter Größe gar nicht gerechnet wurde. */
  if(a.ohneGroesse.length){ L.push("",["Größe nicht bestätigt — nicht gerechnet"].map(e).join(";"),
    ["Kassenname","Anzahl","Artikel","Was fehlt","Vorschlag ml"].map(e).join(";"));
    a.ohneGroesse.forEach(o=>L.push([o.name,o.anzahl,
      (o.rezept?"Bestandteil ":"")+artName(o.id),
      o.rezept?"Gebindegröße des Bestandteils"
        :o.fehlt==="ausschank"?"Ausschankmenge im Kassennamen":"Gebindegröße des Artikels",
      o.rezept?"":(o.geb.ml||"")].map(e).join(";"))); }
  hol("abgleich_"+tag+".csv", "\uFEFF"+L.join("\r\n"), "text/csv");
}
function hol(name, inhalt, typ){
  const b=new Blob([inhalt],{type:typ+";charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ── Z-Bericht einlesen ─────────────────────────────────────────────── */
function vImport(m){
  m.innerHTML=`<section><h2>Z-Bericht</h2>
    <div class="unter">Der gastronovi-Bericht über den Vortag, morgens gezogen.
    Datei hierher ziehen oder den Text einfügen.</div></section>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="zone" id="zone">Bericht hierher ziehen<br><span class="mini">oder klicken, um eine Datei zu wählen</span></div>
    <div style="margin-top:16px"><textarea id="roh" placeholder="… oder den Inhalt hier einfügen"></textarea></div>
    <div class="reihe" style="margin-top:12px">
      <button class="b stark" id="bLies">Einlesen</button>
      <span class="mini" id="stat"></span></div>`;
  m.appendChild(s);

  const zone=$("#zone"), roh=$("#roh");
  const datei=f=>{ const fr=new FileReader(); fr.onload=()=>{ roh.value=fr.result; pruefe(); }; fr.readAsText(f,"utf-8"); };
  zone.onclick=()=>{ const i=document.createElement("input"); i.type="file";
    i.accept=".csv,.txt,text/*"; i.onchange=()=>i.files[0]&&datei(i.files[0]); i.click(); };
  zone.ondragover=e=>{ e.preventDefault(); zone.classList.add("ueber"); };
  zone.ondragleave=()=>zone.classList.remove("ueber");
  zone.ondrop=e=>{ e.preventDefault(); zone.classList.remove("ueber");
    if(e.dataTransfer.files[0]) datei(e.dataTransfer.files[0]); };

  const vor=document.createElement("section"); vor.id="vor"; m.appendChild(vor);

  /* Die Vorschau zeigt, was der SERVER gelesen hat — nicht, was diese
     Seite vermutet. Vor dem Einlesen gibt es deshalb keine Zahlen,
     sondern nur den Hinweis, dass der Bericht bereitliegt. */
  function pruefe(){
    const t=roh.value.trim();
    $("#stat").textContent = t ? "Bereit zum Einlesen" : "";
  }

  function zeigeVorschau(tag){
    const z=ZBER[tag]; if(!z){ vor.innerHTML=""; return; }
    let auto=0, offen=0, ign=0;
    z.positionen.forEach(p=>{ const zu=zuordnung(p);
      if(zu.status==="offen") offen++; else if(zu.status==="ignoriert") ign++; else auto++; });
    /* Die Tabellenhülle bringt ihre Scrollfläche jetzt selbst mit —
       das frühere Inline-Styling würde die neue Regel überschreiben. */
    vor.innerHTML=`<h3>Eingelesen</h3>
      <div class="gitter g4" style="margin-bottom:16px">
        <div class="kpi kpi--status"><span>Betriebstag</span><b>${z.tag?esc(deTag(z.tag)):"nicht erkannt"}</b><small>${esc(z.nr||"")}</small></div>
        <div class="kpi"><span>Positionen</span><b>${z.positionen.length}</b><small>${eur(z.umsatz)}</small></div>
        <div class="kpi"><span>Zugeordnet</span><b>${auto}</b><small>${ign} ignoriert</small></div>
        <div class="kpi ${offen?"warn":"ok"}"><span>Offen</span><b>${offen}</b><small>brauchen eine Zuordnung</small></div>
      </div>
      <div class="tabhuelle"><table><thead><tr>
        <th>Kassenname</th><th class="r">Anzahl</th><th class="r">Umsatz</th><th>Zuordnung</th><th class="r">Flaschen</th>
      </tr></thead><tbody>${z.positionen.map(p=>{
        const zu=zuordnung(p); const w=zu.id?byId(zu.id):null;
        const nm=zu.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
          :zu.status==="offen"?'<span class="pill p-bad">offen</span>'
          :`${esc(w?w.winzer+" · "+w.wein:GN(zu.id))} <span class="pill ${zu.status==="auto"?"p-neu":"p-ok"}">${zu.status==="auto"?"automatisch":"bestätigt"}</span>`;
        return `<tr><td>${esc(p.name)}</td>
          <td class="r">${num(p.anzahl)}</td><td class="r">${p.umsatz?eur(p.umsatz):"—"}</td>
          <td>${nm}</td><td class="r">${(f=>!zu.id?"—":f.ok?num(f.fl)
            :`<span class="dim">Größe fehlt</span>`)(zu.id?flaschen(p,zu.id):null)}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  }
  roh.oninput=pruefe;

  $("#bLies").onclick=async()=>{
    const text=roh.value.trim();
    if(!text) return toast("Erst einen Bericht einfügen");
    const b=$("#bLies"); b.disabled=true; $("#stat").textContent="Wird eingelesen …";
    try{
      const r=await fetch("/api/fassungsliste",{method:"POST",
        headers:{"content-type":"text/plain;charset=utf-8"}, body:text});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        $("#stat").textContent="";
        return toast(r.status===403 ? "Nur die Leitung darf Berichte einlesen"
          : j.fehler || "Der Bericht wurde nicht angenommen");
      }
      await ladeBerichte();
      $("#stat").textContent="";
      toast("Z-Bericht für "+deTag(j.tag)+" eingelesen"
        + (j.storno ? " · "+j.storno+" storniert, ohne Artikel" : ""));
      zeigeVorschau(j.tag);
      vAbgleich.tag=j.tag;
      SEITE=(function(){const a=abgleich(j.tag); return a.offen.length?"zuordnung":"abgleich";})();
      zeichne();
    }catch(e){
      $("#stat").textContent="";
      toast("Keine Verbindung — ohne Server kann der Bericht nicht eingelesen werden");
    }finally{ b.disabled=false; }
  };

  const alt=Object.keys(ZBER).sort().reverse();
  const s2=document.createElement("section");
  s2.innerHTML=`<h3>Auf dem Server</h3>` + (alt.length
    ? `<div class="tabhuelle"><table><thead><tr>
        <th>Betriebstag</th><th>Bericht</th><th class="r">Positionen</th><th class="r">Umsatz</th><th></th>
        </tr></thead><tbody>${alt.map(t=>`<tr>
          <td>${esc(deTag(t))}</td><td class="dim">${esc(ZBER[t].nr||"—")}</td>
          <td class="r">${ZBER[t].positionen.length}</td><td class="r">${eur(ZBER[t].umsatz)}</td>
          <td class="r"><button class="b klein" data-auf="${t}">Ansehen</button></td></tr>`).join("")}
        </tbody></table></div>
       <div class="mini" style="margin-top:8px">Auch die Berichte, die per Mail hereingekommen sind.
         Derselbe Betriebstag zweimal eingelesen ersetzt den alten — löschen muss niemand.</div>`
    : `<div class="karte leer">Auf dem Server liegt noch kein Z-Bericht.</div>`);
  m.appendChild(s2);
  s2.querySelectorAll("[data-auf]").forEach(b=>b.onclick=()=>zeigeVorschau(b.dataset.auf));
}

/* ── Kellerbestand ──────────────────────────────────────────────────── */
function vBestand(m){
  const B=bestand(), V=verbrauch();
  m.innerHTML=`<section><h2>Kellerbestand</h2>
    <div class="unter">Jüngste Zählung, fortgeschrieben mit allem, was seither ein- und ausgegangen ist.</div></section>`;

  if(!B.hat){
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis warn">Es liegt keine Kellerzählung vor.
       Ohne Zählung gibt es keinen Bestand — nur die Bewegung der letzten Vorgänge.</div></section>`);
  }else{
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis">Basis ist die Zählung vom ${esc(deTag(B.basis.tag))}${B.basis.name?" durch "+esc(B.basis.name):""}.
       Seither ${summe(B.seit.ein)} Flaschen eingegangen, ${summe(B.seit.raus)} entnommen.</div></section>`);
    /* Lieferung am Zähltag selbst: weder Fehler noch Warnung, sondern eine
       Angabe — deshalb `hinweis` ohne `warn`/`bad`. Ein Artikel wird beim
       Namen genannt, mehrere nur gezählt (der Satz bliebe sonst unlesbar);
       die Einzelmenge steht ohnehin in der Zeile des Artikels. */
    const uIds=Object.keys(B.unklar||{}).filter(id=>B.unklar[id]>0);
    if(uIds.length){
      const w0=byId(uIds[0]);
      const wer=uIds.length===1
        ?`${num(B.unklar[uIds[0]])} Flaschen ${w0?w0.winzer+" · "+w0.wein:uIds[0]}`
        :`${num(summe(B.unklar))} Flaschen zu ${uIds.length} Artikeln`;
      m.insertAdjacentHTML("beforeend",
        `<section><div class="hinweis">Am Zähltag wurden ${esc(wer)} geliefert — ob die Zählung
         sie schon enthält, ist nicht feststellbar. Sie sind im Bestand nicht mitgerechnet;
         der Bestand ist insoweit eher zu niedrig als zu hoch.</div></section>`);
    }
    /* Zwei verschiedene Lagen, zwei verschiedene Maßnahmen — siehe
       `minusGeteilt`. Die erklärte Lage ist eine Angabe, keine Warnung. */
    const M=minusGeteilt(B);
    if(M.echt.length) m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis bad">${M.echt.length} Positionen stehen rechnerisch unter null.
       Entweder wurde ohne Vorgang aus dem Keller geholt, oder die Zählung ist zu alt.
       Beides löst dieselbe Maßnahme aus: neu zählen.</div></section>`);
    if(M.erklaert.length) m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis">${M.erklaert.length} weitere Position${M.erklaert.length===1?"":"en"}
       ${M.erklaert.length===1?"steht":"stehen"} nur deshalb unter null, weil die Lieferung vom Zähltag
       nicht mitgerechnet ist. Das ist kein Zählfehler — im Keller nachsehen genügt.</div></section>`);
  }

  const zonen={};
  WINES.forEach(w=>{ const z=PLAN.zone[w.id]||7; (zonen[z]=zonen[z]||[]).push(w); });
  const reihen=[];
  Object.keys(zonen).map(Number).sort((a,b)=>a-b).forEach(z=>{
    reihen.push(`<tr class="zwt"><td colspan="7">${esc((PLAN.zonen[z]||{}).t||("Zone "+z))} · ${esc((PLAN.zonen[z]||{}).s||"")}</td></tr>`);
    zonen[z].sort((a,b)=>(PLAN.restorder[a.id]??999)-(PLAN.restorder[b.id]??999)).forEach(w=>{
      const b=B.b[w.id], pt=V.proTag[w.id]||0;
      const u=unklarMenge(B,w.id);               /* am Zähltag geliefert, nicht mitgerechnet */
      const rw = b==null||!pt ? Infinity : (b<=0 ? 0 : b/pt);
      const soll=PLAN.soll[w.id]||0;
      const anteil=b!=null&&soll?Math.min(100,Math.round(b/(soll*4)*100)):0;
      reihen.push(`<tr>
        <td><b>${esc(w.winzer)}</b> · ${esc(w.wein)} <span class="mini">${esc(w.jg)}</span>
          ${u?`<div class="mini">${esc(unklarZeilenSatz(u))}</div>`:""}</td>
        <td class="mini">${esc(w.reb)}</td>
        <td class="r">${b==null?'<span class="dim">—</span>'
          :b<0?`<b class="neg">${num(b)}</b>`:`<b>${num(b)}</b>`}</td>
        <td class="r dim">${soll||"—"}</td>
        <td class="r">${pt?num(pt):'<span class="dim">—</span>'}</td>
        <td class="r">${rw===Infinity?'<span class="dim">—</span>':
          b<=0?'<span class="pill p-bad">leer</span>':
          `<span class="pill ${rw<7?"p-bad":rw<EINST.reichweite?"p-warn":"p-ok"}">${Math.floor(rw)} T</span>`}</td>
        <td><div class="balken"><i class="${b!=null&&b<6?"knapp":anteil>60?"satt":""}" style="width:${anteil}%"></i></div></td>
      </tr>`);
    });
  });

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Rebsorte</th><th class="r">Bestand Fl.</th><th class="r">Soll Schrank</th>
    <th class="r">Pro Tag</th><th class="r">Reicht</th><th>&nbsp;</th>
    </tr></thead><tbody>${reihen.join("")}</tbody></table></div>
    <div class="mini" style="margin-top:10px">Verbrauch je Tag über die letzten ${V.tage} erfassten Tage.</div>`;
  m.appendChild(s);
}

/* ── Nachbestellen ──────────────────────────────────────────────────── */
function bestellliste(){
  const B=bestand(), V=verbrauch(), out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id]; if(b==null) return;
    const pt=V.proTag[w.id]||0; if(!pt) return;
    const rw = b<=0 ? 0 : b/pt; if(rw>=EINST.reichweite) return;
    const kg=(PLAN.kiste||{})[w.id]||6;
    const ziel=Math.ceil(pt*EINST.reichweite*1.5);        /* auf anderthalb Fenster auffüllen */
    const kisten=Math.max(1, Math.ceil(Math.max(0,ziel-Math.max(0,b))/kg));
    /* Am Zähltag geliefert und deshalb nicht im Bestand (Entscheidung
       Nr. 10): dieselbe Formel ein zweites Mal, mit der oberen statt der
       unteren Zahl. Keine neue Regel — dieselbe Regel auf beide Enden
       angewandt. Ergibt sie weniger Kisten, ist der Vorschlag eine Spanne
       statt einer Zahl, und die Zeile sagt warum. Ohne das schlug die
       Liste für einen Wein 11 × 12 Flaschen vor, während 16 im Keller
       standen (Zählung 10, Lieferung 24 am selben Tag, dreimal 6 gefasst). */
    const u=unklarMenge(B,w.id);
    const kistenMin = u ? Math.ceil(Math.max(0,ziel-Math.max(0,b+u))/kg) : kisten;
    out.push({w, bestand:b, proTag:pt, reichweite:rw, kg, kisten, unklar:u,
              kistenMin:Math.min(kistenMin,kisten)});
  });
  return out.sort((a,b)=>a.reichweite-b.reichweite);
}
/* „5–11" statt „11", sobald die beiden Enden auseinanderfallen. */

/* ── Zuordnung ──────────────────────────────────────────────────────── */
function vZuordnung(m){
  m.innerHTML=`<section><h2>Zuordnung</h2>
    <div class="unter">Kassenname zu Artikel. Weine mit Rebsorten-Kürzel gehen automatisch durch.
    Getränke folgen keiner Systematik — jedes wird einmal bestätigt und ist danach festgelegt.
    „Ignorieren“ ist ein vollwertiger Zustand: Speisen, Kaffee, Fassbier.</div></section>`;

  const namen={};
  Object.values(ZBER).forEach(z=>z.positionen.forEach(p=>{
    if(!namen[p.name]) namen[p.name]={name:p.name, anzahl:0, tage:0};
    namen[p.name].anzahl+=p.anzahl; namen[p.name].tage++;
  }));
  const L=Object.values(namen).sort((a,b)=>{
    const za=zuordnung(a), zb=zuordnung(b);
    const rang=x=>x.status==="offen"?0:x.status==="auto"?1:2;
    return rang(za)-rang(zb) || b.anzahl-a.anzahl;
  });
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Noch kein Z-Bericht eingelesen.</div></section>`);
    return;
  }
  const optionen=`<option value="">— offen —</option><option value="__ignoriert">Ignorieren</option>`+
    `<optgroup label="Wein">${WINES.map(w=>`<option value="${w.id}">${esc(w.winzer)} · ${esc(w.wein)} ${esc(w.jg)}</option>`).join("")}</optgroup>`+
    `<optgroup label="Getränke">${GIDS.map(id=>`<option value="${id}">${esc(GN(id))}</option>`).join("")}</optgroup>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Kassenname</th><th class="r">Menge gesamt</th><th>Zuordnung</th><th>Zustand</th></tr></thead><tbody>
    ${L.map(p=>{ const z=zuordnung(p);
      return `<tr><td>${esc(p.name)}</td><td class="r">${num(p.anzahl)}</td>
        <td><select class="klein" data-name="${esc(p.name)}">${optionen}</select></td>
        <td>${z.status==="offen"?'<span class="pill p-bad">offen</span>'
            :z.status==="auto"?'<span class="pill p-neu">automatisch — bestätigen</span>'
            :z.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
            :'<span class="pill p-ok">festgelegt</span>'}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="bAuto">Alle automatischen Weinvorschläge übernehmen</button></div>`;
  m.appendChild(s);

  s.querySelectorAll("select[data-name]").forEach(sel=>{
    const nm=sel.dataset.name, z=zuordnung({name:nm});
    sel.value = MAP[nm] ? MAP[nm] : (z.status==="auto" ? z.id : "");
    sel.onchange=async()=>{
      const wert=sel.value, vorher=MAP[nm];
      if(wert) MAP[nm]=wert; else delete MAP[nm];
      schreib(K_MAP,MAP);
      /* Die bestätigte Gebindegröße gehörte zum bisherigen Artikel. Nach
         einem Wechsel ist sie nicht mehr bestätigt — sonst rechnet die
         neue Zuordnung mit der Flasche der alten. */
      if(GEB_BEST[nm]!=null && wert!==vorher){ delete GEB_BEST[nm]; schreib(K_GEB,GEB_BEST); }
      const ok=await sendeZuordnung(nm, wert);
      zeichne();
      if(ok) toast("Zuordnung gespeichert");
    };
  });
  $("#bAuto").onclick=async()=>{
    const neu=[];
    L.forEach(p=>{ if(MAP[p.name]) return; const a=autoWein(p.name); if(a) neu.push([p.name,a.id]); });
    if(!neu.length) return toast("Kein Vorschlag offen");
    $("#bAuto").disabled=true;
    let n=0;
    for(const [nm,id] of neu){ MAP[nm]=id; if(await sendeZuordnung(nm,id)) n++; }
    schreib(K_MAP,MAP); $("#bAuto").disabled=false; zeichne();
    toast(n===neu.length ? n+" Weine übernommen"
      : n+" von "+neu.length+" übernommen — der Rest nur auf diesem Gerät");
  };
}
