<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitung – Fassungstool · Haus Hirt</title>
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F6F4EE; --surface-3:#F3F1EB; --surface-4:#ECE9E1;
  --border:#E6E4DE; --border-strong:#D8D5CD; --border-heavy:#C6C2B8;
  --fg:#1C1C1E; --fg-secondary:#5A5A60; --fg-muted:#6A6A70; --fg-subtle:#686870;
  --accent:#9A7B44;
  --danger:#B4471F; --danger-bg:#FBEDE6; --danger-fg:#7A3A12; --danger-border:#E7C3B2;
  --success:#3E7A3E; --success-bg:#EFF5EE; --success-fg:#2F5E2F;
  --info:#3A5266; --info-bg:#EDF2F6; --info-border:#D3E0EA;
  --warn-bg:#FBF3E2; --warn-fg:#7A5426; --warn-border:#E6D6B4;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --track-caps:.08em;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-xs:11px; --text-sm:13px; --text-md:15px; --text-base:16px; --text-lg:19px; --text-display:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--text-md)/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}

/* ══ Kopf ══ */
.kopf{position:sticky;top:0;z-index:40;background:#1C1C1E;color:#fff;
  display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-6);height:56px}
.kopf h1{font-size:var(--text-md);font-weight:600;letter-spacing:.01em}
.kopf .haus{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--track-caps);color:#9A9AA0}
.kopf .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-pill);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);font-size:var(--text-xs);color:#fff}
.chip .pkt{width:7px;height:7px;border-radius:50%;background:#8FBF8F}
.chip.aus .pkt{background:#C6C2B8}
.kopf button.k{height:30px;padding:0 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);font-size:var(--text-sm)}
.kopf button.k:hover{background:rgba(255,255,255,.18)}

/* ══ Gerüst ══ */
.huelle{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 56px)}
nav.seite{border-right:1px solid var(--border);background:var(--surface-2);padding:var(--space-5) var(--space-3)}
nav.seite .grp{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--track-caps);
  color:var(--fg-subtle);padding:0 10px;margin:var(--space-5) 0 var(--space-2)}
nav.seite .grp:first-child{margin-top:0}
nav.seite button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:8px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--fg-secondary);text-align:left}
nav.seite button:hover{background:var(--surface-4)}
nav.seite button.on{background:var(--surface);color:var(--fg);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--border-strong)}
nav.seite .zahl{font-size:var(--text-xs);font-weight:600;padding:1px 7px;border-radius:var(--radius-pill);
  background:var(--surface-4);color:var(--fg-muted)}
nav.seite button.on .zahl{background:var(--surface-3)}
nav.seite .zahl.rot{background:var(--danger-bg);color:var(--danger-fg)}
main{padding:var(--space-7) var(--space-7) var(--space-8);max-width:1180px}

/* ══ Bausteine ══ */
h2{font-size:var(--text-display);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.unter{color:var(--fg-muted);font-size:var(--text-sm);margin-top:6px}
h3{font-size:var(--text-base);font-weight:600;margin-bottom:var(--space-3)}
section{margin-bottom:var(--space-8)}
.karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5)}
.gitter{display:grid;gap:var(--space-4)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4)}
.kpi span{display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--fg-subtle)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi small{display:block;color:var(--fg-muted);font-size:var(--text-sm);margin-top:2px}
.kpi.warn{background:var(--warn-bg);border-color:var(--warn-border)}
.kpi.warn b,.kpi.warn small{color:var(--warn-fg)}
.kpi.bad{background:var(--danger-bg);border-color:var(--danger-border)}
.kpi.bad b,.kpi.bad small{color:var(--danger-fg)}
.kpi.ok{background:var(--success-bg);border-color:#CFE0CC}
.kpi.ok b,.kpi.ok small{color:var(--success-fg)}

th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:var(--text-sm);vertical-align:middle}
th{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--track-caps);
  color:var(--fg-subtle);font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:5}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.tabhuelle{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.zwt td{background:var(--surface-3);font-size:var(--text-xs);text-transform:uppercase;
  letter-spacing:var(--track-caps);color:var(--fg-subtle);font-weight:600}
.dim{color:var(--fg-muted)}
.mini{font-size:var(--text-xs);color:var(--fg-subtle)}
.pill{display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);font-size:var(--text-xs);font-weight:600}
.p-ok{background:var(--success-bg);color:var(--success-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-bad{background:var(--danger-bg);color:var(--danger-fg)}
.p-neu{background:var(--info-bg);color:var(--info)}
.p-grau{background:var(--surface-4);color:var(--fg-muted)}
.diff-plus{color:var(--danger-fg);font-weight:600}
.diff-minus{color:var(--info);font-weight:600}

button.b{height:36px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border-heavy);
  background:var(--surface);font-size:var(--text-sm);font-weight:600}
button.b:hover{background:var(--surface-2)}
button.b.stark{background:#1C1C1E;color:#fff;border-color:#1C1C1E}
button.b.stark:hover{background:#33333A}
button.b.klein{height:28px;padding:0 10px;font-weight:400}
.reihe{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.rechts{margin-left:auto}
select,input[type=text],input[type=number],input[type=date]{height:36px;padding:0 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border-heavy);background:var(--surface);font-size:var(--text-sm)}
select.klein{height:28px;font-size:var(--text-xs);max-width:270px}
textarea{width:100%;min-height:150px;padding:var(--space-3);border-radius:var(--radius-md);
  border:1px solid var(--border-heavy);font:400 12px/1.5 var(--mono);background:var(--surface);resize:vertical}
.hinweis{border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);
  background:var(--info-bg);border:1px solid var(--info-border);color:var(--info)}
.hinweis.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-fg)}
.hinweis.bad{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-fg)}
.leer{text-align:center;padding:var(--space-8) var(--space-4);color:var(--fg-muted);font-size:var(--text-sm)}
.zone{display:flex;align-items:center;justify-content:center;min-height:190px;border:2px dashed var(--border-heavy);
  border-radius:var(--radius-lg);background:var(--surface-2);color:var(--fg-muted);font-size:var(--text-sm);
  text-align:center;padding:var(--space-5);cursor:pointer}
.zone:hover,.zone.ueber{border-color:var(--accent);background:#FAF6EF;color:var(--fg)}
.balken{height:6px;border-radius:3px;background:var(--surface-4);overflow:hidden;min-width:70px}
.balken i{display:block;height:100%;background:var(--accent)}
.balken i.knapp{background:var(--danger)}
.balken i.satt{background:var(--success)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#1C1C1E;color:#fff;
  padding:10px 18px;border-radius:var(--radius-pill);font-size:var(--text-sm);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:90}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

/* Gebindegröße in Millilitern. Steht im Namen — sonst 750 für Wein,
   und für Getränke ohne Angabe zählt ein Verkauf als eine Flasche. */
function mlAusText(t){
  if(!t) return null;
  const s = String(t).toLowerCase();
  let letzte=null, m;
  const rx=/(\d+(?:[.,]\d+)?)\s*(ml|cl|l)\b/g;
  while((m=rx.exec(s))) letzte=m;
  if(letzte){
    const v=parseFloat(letzte[1].replace(",","."));
    return letzte[2]==="ml"?v : letzte[2]==="cl"?v*10 : v*1000;
  }
  const br=/(\d)\s*\/\s*(\d)\b/.exec(s);            /* 1/8 Wein = 125 ml */
  if(br) return Math.round(1000*(+br[1]/+br[2])/1) === 125 ? 125 : (1000*(+br[1]/+br[2]));
  return null;
}
const GEBINDE = (()=>{ const g={};
  WINES.forEach(w=>g[w.id]=750);
  GIDS.forEach(id=>g[id]= mlAusText(GN(id)) || null);
  return g; })();

/* ════════════ 2 · Vorgänge einlesen und vereinheitlichen ════════════
   Aus dem v11-Blob wird je Vorgang ein flaches Ergebnis:
     wein{id:n}     Flaschen aus dem Weinkeller geholt
     getr{id:n}     Flaschen aus dem Getränkelager geholt
     zaehlung{id:n} gezählter Kellerbestand (nur Kellerzählung)
     eingang{id:n}  Wareneingang in Flaschen                            */
const summe = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);

function kistenGr(p){ if(p && p.kg) return +p.kg; return (PLAN.kiste||{})[p.id] || 6; }

function normVorgang(v){
  if(!v || !v.mode) return null;
  const o={mode:v.mode, tag:v.tag||"", name:v.name||"", notiz:v.notiz||"",
           fertig:!!v.finished, ts:v.archiviert||"", wein:{}, getr:{},
           zaehlung:null, gzaehlung:null, eingang:{}, fotos:(v.fotos||[]).length,
           roh:v};
  const zu=(t,id,n)=>{ n=+n||0; if(n) t[id]=(t[id]||0)+n; };

  if(v.mode==="tag" || v.mode==="fuellen"){
    /* rest/bar/barrot/backup halten die Fehlmengen je Ort — genau das,
       was aus dem Keller geholt wird. holtN überschreibt pro Wein. */
    const soll={};
    ["barrot","bar","backup","rest"].forEach(k=>
      Object.keys(v[k]||{}).forEach(id=>soll[id]=(soll[id]||0)+(+v[k][id]||0)));
    Object.keys(soll).forEach(id=>{
      const n=(v.holtN && v.holtN[id]!=null) ? +v.holtN[id] : soll[id];
      zu(o.wein,id,n);
    });
    Object.keys(v.zusatz||{}).forEach(id=>zu(o.wein,id,v.zusatz[id]));
    /* Getränke: getr[id] ist der Ist-Stand in der Lade, Fehlmenge = Soll − Ist */
    GIDS.forEach(id=>{
      const ist=(v.getr && v.getr[id]!=null) ? +v.getr[id] : GSOLL[id];
      const fehlt=Math.max(0, GSOLL[id]-ist);
      const n=(v.gholtN && v.gholtN[id]!=null) ? +v.gholtN[id] : fehlt;
      zu(o.getr,id,n);
    });
    if(v.getr && Object.keys(v.getr).length) o.gzaehlung=Object.assign({},v.getr);
  }

  if(v.mode==="nach"){
    Object.keys(v.ent||{}).forEach(id=>zu(o.wein,id,v.ent[id]));
  }

  if(v.mode==="keller"){
    const z={}; let hat=false;
    WINES.forEach(w=>{
      if(!(v.zdone||{})[w.id]) return;
      z[w.id]=(+(v.reihen||{})[w.id]||0)*6 + (+(v.einzel||{})[w.id]||0); hat=true;
    });
    if(hat) o.zaehlung=z;
    if(v.getr && Object.keys(v.getr).length) o.gzaehlung=Object.assign({},v.getr);
  }

  if(v.mode==="ware"){
    (v.pos||[]).forEach(p=>{
      if(!p.id || p.id==="__neu" || !(+p.kisten>0)) return;
      zu(o.eingang, p.id, (+p.kisten)*kistenGr(p));
    });
  }

  /* gent (Getränke zusätzlich entnommen) taucht in mehreren Modi auf */
  Object.keys(v.gent||{}).forEach(id=>zu(o.getr,id,v.gent[id]));
  Object.keys(v.gzusatz||{}).forEach(id=>zu(o.getr,id,v.gzusatz[id]));

  o.flWein=summe(o.wein); o.flGetr=summe(o.getr);
  return o;
}

/* Reihenfolge: Betriebstag, danach die natürliche Abfolge innerhalb eines Tages */
const MODUSRANG={ware:0, keller:1, tag:2, fuellen:3, nach:4};
function nachZeit(a,b){

}

/* ════════════ 4 · Bestand fortschreiben ════════════
   Bestand = jüngste Zählung + alles danach Eingegangene − alles danach Entnommene.
   Ohne Zählung gibt es keinen Bestand, nur Bewegung — das wird auch so gesagt. */
function bestand(){
  let basis=null, basisIdx=-1;
  VORGAENGE.forEach((v,i)=>{ if(v.zaehlung){ basis=v; basisIdx=i; } });
  const b={}, seit={ein:{}, raus:{}};
  if(basis) WINES.forEach(w=>{ if(basis.zaehlung[w.id]!=null) b[w.id]=basis.zaehlung[w.id]; });
  VORGAENGE.forEach((v,i)=>{
    if(i<=basisIdx) return;
    Object.keys(v.eingang).forEach(id=>{ b[id]=(b[id]||0)+v.eingang[id]; seit.ein[id]=(seit.ein[id]||0)+v.eingang[id]; });
    Object.keys(v.wein).forEach(id=>{ b[id]=(b[id]||0)-v.wein[id]; seit.raus[id]=(seit.raus[id]||0)+v.wein[id]; });
  });
  return {basis, b, seit, hat:!!basis};
}

/* Verbrauch je Tag über das Fenster in EINST.tage */
function verbrauch(){
  const heute=new Date(), grenze=new Date(heute); grenze.setDate(grenze.getDate()-EINST.tage);
  const g=grenze.toISOString().slice(0,10);
  const w={}, gt={}; const tage=new Set();
  VORGAENGE.forEach(v=>{
    if((v.tag||"") < g) return;
    if(v.mode==="ware"||v.mode==="keller") return;
    tage.add(v.tag);
    Object.keys(v.wein).forEach(id=>w[id]=(w[id]||0)+v.wein[id]);
    Object.keys(v.getr).forEach(id=>gt[id]=(gt[id]||0)+v.getr[id]);
  });
  const n=Math.max(1, tage.size);
  const proTag={}; Object.keys(w).forEach(id=>proTag[id]=w[id]/n);
  const gProTag={}; Object.keys(gt).forEach(id=>gProTag[id]=gt[id]/n);
  return {proTag, gProTag, tage:n, wein:w, getr:gt};
}

/* ════════════ 5 · Z-Bericht lesen ════════════
   Sektionsdokument: gequotete Felder, Tabulator als Trenner, Sektionen
   zwischen Strichlinien, keine Kopfzeile. Vier Fallen sind eingebaut:
     · gleiche Namen mehrfach → über den Namen summieren
     · Nullpreis-Zeilen zählen mit
     · Größe steht im Namen, es gilt das letzte Vorkommen
     · der Positionsblock kennt keine Warengruppe                        */
function zahl(s){
  if(s==null) return null;
  let t=String(s).trim().replace(/[€\s]/g,"");
  if(!t || !/[\d]/.test(t)) return null;
  if(t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  const v=parseFloat(t);
  return isNaN(v)?null:v;
}
function felder(zeile){
  return zeile.split("\t").map(f=>{
    let t=f.trim();
    if(t.startsWith('"') && t.endsWith('"') && t.length>1) t=t.slice(1,-1);
    return t.replace(/""/g,'"').trim();
  });
}
const istStrich = z => /^[\s"'\-–—_=]*[-–—_=]{5,}[\s"'\-–—_=]*$/.test(z);

function zParse(text){
  const zeilen=text.split(/\r?\n/);
  const sekt=[]; let akt={titel:"(Kopf)", zeilen:[]}; let strichZuvor=false;
  zeilen.forEach(z=>{
    if(!z.trim()) { return; }
    if(istStrich(z)){ strichZuvor=true; return; }
    const f=felder(z).filter((x,i,a)=>!(x==="" && i===a.length-1));
    if(!f.length) return;
    const nurEins = f.filter(x=>x!=="").length===1;
    if(strichZuvor && nurEins){
      akt={titel:f.find(x=>x!=="")||"(ohne Titel)", zeilen:[]}; sekt.push(akt);
      strichZuvor=false; return;
    }
    strichZuvor=false;
    akt.zeilen.push(f);
  });
  if(!sekt.length) sekt.push(akt);
  else if(akt.zeilen.length && sekt[0]!==akt && !sekt.includes(akt)) sekt.unshift(akt);

  /* Betriebstag: das Datum hinter "Bis" */
  let tag="";
  const alle=text.split(/\r?\n/);
  for(const z of alle){
    const f=felder(z);
    if(/^bis\b/i.test(f[0]||"")){
      const d=/(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(f.slice(1).join(" ")||f[0]);
      if(d){ tag=`${d[3]}-${String(d[2]).padStart(2,"0")}-${String(d[1]).padStart(2,"0")}`; break; }
    }
  }
  /* Nummer des Berichts, falls vorhanden */
  let nr="";
  const mz=/Z\s*(\d+)/.exec(alle.slice(0,25).join(" ")); if(mz) nr="Z "+mz[1];

  /* Positionsblock: die Sektion mit den meisten Zeilen aus Text + Zahl */
  let beste=null, bestN=0;
  sekt.forEach(s=>{
    const n=s.zeilen.filter(f=>f.length>=2 && f[0] && !/^\d/.test(f[0]) && zahl(f[1])!=null).length;
    if(n>bestN){ bestN=n; beste=s; }
  });

  const roh=[];
  (beste?beste.zeilen:[]).forEach(f=>{
    if(f.length<2) return;
    const name=f[0]; const anz=zahl(f[1]);
    if(!name || anz==null) return;
    if(/^(summe|gesamt|total|zwischensumme)/i.test(name)) return;
    roh.push({name, anzahl:anz, preis:zahl(f[2]), umsatz:zahl(f[3])!=null?zahl(f[3]):zahl(f[2])});
  });

  /* Doppelte Namen summieren — sonst fehlt ein Viertel des Ausschanks */
  const map={};
  roh.forEach(p=>{
    const k=p.name;
    if(!map[k]) map[k]={name:k, anzahl:0, umsatz:0, zeilen:0};
    map[k].anzahl+=p.anzahl; map[k].umsatz+=(p.umsatz||0); map[k].zeilen++;
  });
  const pos=Object.values(map).sort((a,b)=>b.anzahl-a.anzahl);

  return {tag, nr, sektionen:sekt.map(s=>({titel:s.titel, n:s.zeilen.length})),
          block: beste?beste.titel:"—", positionen:pos,
          umsatz: pos.reduce((a,p)=>a+(p.umsatz||0),0)};
}

/* ── Zuordnung. Weine über das Rebsorten-Kürzel automatisch, Getränke nie ── */
const KUERZEL={GV:"Grüner Veltliner", RI:"Riesling", RIE:"Riesling", SB:"Sauvignon Blanc",
  WB:"Weißburgunder", CH:"Chardonnay", GB:"Grauburgunder", RV:"Roter Veltliner",
  MU:"Muskateller", MUS:"Muskateller", GS:"Gemischter Satz", GEM:"Gemischter Satz",
  ZW:"Zweigelt", BF:"Blaufränkisch", PN:"Pinot Noir", ME:"Merlot", MER:"Merlot",
  SA:"Sangiovese", BA:"Barbera", TR:"Traminer", CU:"Cuvée", CUV:"Cuvée"};
const flach = s => String(s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function autoWein(name){
  const m=/^([A-ZÄÖÜ]{2,3})\s+(.+)$/.exec(String(name).trim());
  if(!m) return null;
  const kz=m[1].toUpperCase(), rest=m[2];
  const reb=KUERZEL[kz]; if(!reb) return null;
  const teil=rest.split(",");
  const winzer=flach(teil[0]);
  if(!winzer) return null;
  let kand=WINES.filter(w=>{
    const wf=flach(w.winzer);
    return wf===winzer || wf.startsWith(winzer) || winzer.startsWith(wf) || wf.includes(winzer);
  });
  /* Das Kürzel bestätigt gegen — es entscheidet nicht allein */
  kand=kand.filter(w=>flach(w.reb).includes(flach(reb)) || flach(w.r).includes(flach(reb)));
  if(kand.length===1) return {id:kand[0].id, sicher:true};
  if(kand.length>1 && teil[1]){
    const wein=flach(teil[1].replace(/\d+\s*[\/,.]?\d*\s*l?$/,""));
    const eng=kand.filter(w=>flach(w.wein) && (flach(w.wein).includes(wein.split(" ")[0]) || wein.includes(flach(w.wein))));
    if(eng.length===1) return {id:eng[0].id, sicher:true};
  }
  return null;
}

/* Verkauf in Flaschen: (anzahl × ausschank_ml) / gebinde_ml */
function flaschen(p, artId){
  const aus = mlAusText(p.name);
  const geb = artId ? GEBINDE[artId] : null;
  if(aus && geb) return p.anzahl*aus/geb;
  if(artId && byId(artId)) return p.anzahl*(aus||750)/750;
  return p.anzahl;                                   /* eine Einheit = eine Flasche */
}

function zuordnung(pos){
  if(REZ[pos.name] && REZ[pos.name].length) return {status:"rezept"};
  const z=MAP[pos.name];
  if(z==="__ignoriert") return {status:"ignoriert"};
  if(z) return {status:"fest", id:z};
  const a=autoWein(pos.name);
  if(a) return {status:"auto", id:a.id};
  return {status:"offen"};
}

/* ════════════ 6 · Abgleich Verkauf ↔ Fassung ════════════ */
function abgleich(tag, spanne){
  spanne = spanne || 1;
  const bis=tag, von=(()=>{ const d=new Date(tag+"T12:00");
    d.setDate(d.getDate()-(spanne-1)); return d.toISOString().slice(0,10); })();
  const imFenster = t => t>=von && t<=bis;

  const verk={}, offen=[], berichte=[];
  Object.keys(ZBER).filter(imFenster).sort().forEach(t=>{
    const z=ZBER[t]; berichte.push(z);
    z.positionen.forEach(p=>{
      const r=REZ[p.name];
      if(r && r.length){                       /* zerlegtes Mischgetränk */
        r.forEach(t=>{
          const geb=GEBINDE[t.id]||null;
          verk[t.id]=(verk[t.id]||0)+(geb ? p.anzahl*t.ml/geb : p.anzahl);
        });
        return;
      }
      const zu=zuordnung(p);
      if(zu.status==="offen"){ if(!offen.some(o=>o.name===p.name)) offen.push(p); return; }
      if(zu.status==="ignoriert") return;
      verk[zu.id]=(verk[zu.id]||0)+flaschen(p, zu.id);
    });
  });
  const z=berichte.length?berichte[berichte.length-1]:null;

  /* Alles, was im Fenster aus dem Keller ging */
  const ent={};
  VORGAENGE.filter(v=>imFenster(v.tag)).forEach(v=>{
    Object.keys(v.wein).forEach(id=>ent[id]=(ent[id]||0)+v.wein[id]);
    Object.keys(v.getr).forEach(id=>ent[id]=(ent[id]||0)+v.getr[id]);
  });

  const ids=Array.from(new Set([...Object.keys(verk), ...Object.keys(ent)]));
  const zeilen=ids.map(id=>{
    const w=byId(id);
    const v=verk[id]||0, e=ent[id]||0;
    return {id, name: w ? (w.winzer+" · "+w.wein) : GN(id), art: w?"Wein":"Getränk",
            verkauf:v, entnahme:e, diff:e-v};
  }).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff) || b.verkauf-a.verkauf);

  return {z, zeilen, offen, verk, ent, von, bis, spanne, berichte:berichte.length};
}

function letzterTag(){
  /* Der Betriebstag, um den es geht: gestern, sofern es dazu etwas gibt */
  const d=new Date(); d.setDate(d.getDate()-1);
  const gestern=d.toISOString().slice(0,10);
  if(ZBER[gestern] || VORGAENGE.some(v=>v.tag===gestern)) return gestern;
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort();
  return tage[tage.length-1] || gestern;
}
function deTag(iso){
  if(!iso) return "—";
  const d=new Date(iso+"T12:00");

}

      fassung?esc(fassung.name||"ohne Namen")+" · "+fassung.flWein+" Fl. Wein":"noch keine Fassung für diesen Tag",
      fassung?"ok":"warn")+
    kachel("Z-Berichte", a.berichte?a.berichte+" von "+SPANNE:"fehlen",
      a.z?(a.z.positionen.length+" Positionen · "+eur(a.z.umsatz)+" zuletzt"):"noch nicht importiert",
      a.berichte>=SPANNE?"ok":a.berichte?"warn":"bad")+
    kachel("Auffällige Differenzen", grob.length,
      grob.length?"über "+SPANNE+" Tage nicht ausgeglichen":"Verkauf und Entnahme decken sich",
      grob.length>4?"bad":grob.length?"warn":"ok")+
    kachel("Nachbestellen", best.length,
      best.length?("Reichweite unter "+EINST.reichweite+" Tagen"):"nichts unter der Schwelle",
      best.length?"warn":"ok");
  m.appendChild(k);

  /* Was heute noch fehlt */
  const fehlt=[];
  if(!fassung) fehlt.push("Für "+deTag(tag)+" liegt keine Tagesfassung vor.");
  if(!ZBER[tag]) fehlt.push("Der Z-Bericht zu diesem Tag ist noch nicht eingelesen.");
  else if(a.berichte<SPANNE) fehlt.push("Im Fenster fehlen "+(SPANNE-a.berichte)+" Z-Berichte — die Differenzen sind darum zu hoch.");
  if(a.offen.length) fehlt.push(a.offen.length+" Kassenpositionen sind keinem Artikel zugeordnet — sie fehlen im Abgleich.");
  if(!B.hat) fehlt.push("Es gibt noch keine Kellerzählung. Ohne sie ist kein Bestand berechenbar, nur Bewegung.");
  else if(minus.length) fehlt.push(minus.length+" Positionen stehen rechnerisch unter null — die Zählung vom "+deTag(B.basis.tag)+" ist überholt. Neu zählen.");
  if(fehlt.length){
    const s=document.createElement("section");
    s.innerHTML=`<h3>Was noch fehlt</h3><div class="hinweis warn">${fehlt.map(esc).join("<br>")}</div>`;
    m.appendChild(s);
  }

  /* Die grössten Ausreisser */
  const s2=document.createElement("section");
  const top=a.zeilen.filter(r=>Math.abs(r.diff)>=1).slice(0,10);
  s2.innerHTML=`<h3>Grösste Abweichungen · ${esc(deTag(a.von))} bis ${esc(deTag(a.bis))}</h3>`+
    (top.length? `<div class="tabhuelle"><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauf</th><th class="r">Entnahme</th><th class="r">Differenz</th><th>Deutung</th>
      </tr></thead><tbody>${top.map(r=>`<tr>
        <td>${esc(r.name)} <span class="mini">${r.art}</span></td>
        <td class="r">${num(r.verkauf)}</td><td class="r">${num(r.entnahme)}</td>
        <td class="r ${r.diff>0?"diff-plus":"diff-minus"}">${r.diff>0?"+":""}${num(r.diff)}</td>
        <td class="mini">${r.diff>0?"mehr geholt als verkauft — Vorrat aufgebaut oder Schwund":"mehr verkauft als geholt — Vorrat wird abgebaut"}</td>
      </tr>`).join("")}</tbody></table></div>`
    : `<div class="karte leer">Keine Abweichung über einer Flasche.</div>`);
  m.appendChild(s2);

  /* Bestellvorschlag kompakt */
  if(best.length){
    const s3=document.createElement("section");
    s3.innerHTML=`<h3>Bestellvorschlag</h3><div class="tabhuelle"><table><thead><tr>
      <th>Wein</th><th class="r">Bestand</th><th class="r">Pro Tag</th><th class="r">Reicht</th><th class="r">Kisten</th>
      </tr></thead><tbody>${best.slice(0,8).map(r=>`<tr>
        <td>${esc(r.w.winzer)} · ${esc(r.w.wein)}</td>
        <td class="r">${num(r.bestand)}</td><td class="r">${num(r.proTag)}</td>
        <td class="r"><span class="pill ${r.reichweite<7?"p-bad":"p-warn"}">${r.reichweite===Infinity?"—":Math.floor(r.reichweite)+" T"}</span></td>
        <td class="r"><b>${r.kisten}</b> × ${r.kg}</td></tr>`).join("")}</tbody></table></div>
      <div class="reihe" style="margin-top:12px"><button class="b" id="bMehr">Alle ansehen</button></div>`;
    m.appendChild(s3);
    $("#bMehr").onclick=()=>{ SEITE="bestellen"; zeichne(); };
  }
}

/* ── Abgleich ───────────────────────────────────────────────────────── */
function vAbgleich(m){
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort().reverse();
  const tag=vAbgleich.tag && tage.includes(vAbgleich.tag) ? vAbgleich.tag : letzterTag();
  vAbgleich.tag=tag;
  const a=abgleich(tag, SPANNE);

  m.innerHTML=`<section><h2>Verkauf ↔ Fassung</h2>
    <div class="unter">Was die Kasse gebucht hat, gegen das, was aus dem Keller geholt wurde.
    Gerechnet wird in Flaschen: Anzahl × Ausschank in Millilitern, geteilt durch das Gebinde.<br>
    Was am Abend verkauft wird, holt oft erst der nächste Tag nach. Über einen einzelnen Tag
    verschiebt das jede Zeile — über eine Woche gleicht es sich aus.</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<label class="mini">Bis Betriebstag</label>
    <select id="selTag">${tage.map(t=>`<option value="${t}" ${t===tag?"selected":""}>${esc(deTag(t))}</option>`).join("")}</select>
    <label class="mini" style="margin-left:10px">Zeitraum</label>
    <select id="selSpanne">${[1,7,14,30].map(n=>`<option value="${n}" ${n===SPANNE?"selected":""}>${n===1?"nur dieser Tag":n+" Tage"}</option>`).join("")}</select>
    <span class="mini">${a.berichte} Z-Bericht${a.berichte===1?"":"e"} im Fenster</span>
    <span class="rechts"></span>
    <button class="b klein" id="bCsv">Als CSV</button>`;
  m.appendChild(w);
  $("#selTag").onchange=e=>{ vAbgleich.tag=e.target.value; zeichne(); };
  $("#selSpanne").onchange=e=>{ SPANNE=+e.target.value; zeichne(); };
  $("#bCsv").onclick=()=>csvAbgleich(tag,a);

  if(!a.berichte){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis warn">In diesem Fenster liegt kein Z-Bericht vor.
      Ohne ihn zeigt die Tabelle nur die Entnahme.</div>`;
    m.appendChild(s);
  }else if(a.berichte<a.spanne){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis">${a.berichte} von ${a.spanne} Tagen sind eingelesen.
      Für die übrigen fehlt der Verkauf — die Differenzen fallen entsprechend zu hoch aus.</div>`;
    m.appendChild(s);
  }
  if(a.offen.length){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis bad">${a.offen.length} Kassenpositionen ohne Zuordnung —
      ihr Verkauf fehlt in dieser Rechnung.
      <button class="b klein" id="bZu" style="margin-left:8px">Jetzt zuordnen</button></div>`;
    m.appendChild(s); $("#bZu").onclick=()=>{ SEITE="zuordnung"; zeichne(); };
  }

  const s=document.createElement("section");
  const wein=a.zeilen.filter(r=>r.art==="Wein"), getr=a.zeilen.filter(r=>r.art!=="Wein");
  const zeile=r=>`<tr>
    <td>${esc(r.name)}</td>
    <td class="r">${num(r.verkauf)}</td>
    <td class="r">${num(r.entnahme)}</td>
    <td class="r ${Math.abs(r.diff)<0.5?"dim":(r.diff>0?"diff-plus":"diff-minus")}">${r.diff>0?"+":""}${num(r.diff)}</td>
    <td>${Math.abs(r.diff)<0.5?'<span class="pill p-ok">stimmt</span>'
        :Math.abs(r.diff)<2?'<span class="pill p-warn">kleine Abweichung</span>'
        :'<span class="pill p-bad">prüfen</span>'}</td></tr>`;
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauf Fl.</th><th class="r">Entnahme Fl.</th><th class="r">Differenz</th><th>Befund</th>
    </tr></thead><tbody>
      ${wein.length?`<tr class="zwt"><td colspan="5">Wein</td></tr>`+wein.map(zeile).join(""):""}
      ${getr.length?`<tr class="zwt"><td colspan="5">Getränke</td></tr>`+getr.map(zeile).join(""):""}
      ${a.zeilen.length?"":`<tr><td colspan="5" class="leer">Für diesen Tag gibt es nichts zu vergleichen.</td></tr>`}
    </tbody></table></div>`;
  m.appendChild(s);
}

function csvAbgleich(tag,a){
  const e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const L=[["Abgleich Verkauf gegen Fassung"].map(e).join(";"),
           ["Betriebstag",tag].map(e).join(";"),"",
           ["Artikel","Art","Verkauf Fl.","Entnahme Fl.","Differenz"].map(e).join(";")];
  a.zeilen.forEach(r=>L.push([r.name,r.art,num(r.verkauf),num(r.entnahme),num(r.diff)].map(e).join(";")));
  if(a.offen.length){ L.push("",["Ohne Zuordnung"].map(e).join(";"),["Kassenname","Anzahl"].map(e).join(";"));
    a.offen.forEach(p=>L.push([p.name,p.anzahl].map(e).join(";"))); }
  hol("abgleich_"+tag+".csv", "\uFEFF"+L.join("\r\n"), "text/csv");
}
function hol(name, inhalt, typ){
  const b=new Blob([inhalt],{type:typ+";charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ── Z-Bericht einlesen ─────────────────────────────────────────────── */
function vImport(m){
  m.innerHTML=`<section><h2>Z-Bericht</h2>
    <div class="unter">Der gastronovi-Bericht über den Vortag, morgens gezogen.
    Datei hierher ziehen oder den Text einfügen.</div></section>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="zone" id="zone">Bericht hierher ziehen<br><span class="mini">oder klicken, um eine Datei zu wählen</span></div>
    <div style="margin-top:16px"><textarea id="roh" placeholder="… oder den Inhalt hier einfügen"></textarea></div>
    <div class="reihe" style="margin-top:12px">
      <button class="b stark" id="bLies">Einlesen</button>
      <span class="mini" id="stat"></span></div>`;
  m.appendChild(s);

  const zone=$("#zone"), roh=$("#roh");
  const datei=f=>{ const fr=new FileReader(); fr.onload=()=>{ roh.value=fr.result; pruefe(); }; fr.readAsText(f,"utf-8"); };
  zone.onclick=()=>{ const i=document.createElement("input"); i.type="file";
    i.accept=".csv,.txt,text/*"; i.onchange=()=>i.files[0]&&datei(i.files[0]); i.click(); };
  zone.ondragover=e=>{ e.preventDefault(); zone.classList.add("ueber"); };
  zone.ondragleave=()=>zone.classList.remove("ueber");
  zone.ondrop=e=>{ e.preventDefault(); zone.classList.remove("ueber");
    if(e.dataTransfer.files[0]) datei(e.dataTransfer.files[0]); };

  const vor=document.createElement("section"); vor.id="vor"; m.appendChild(vor);

  function pruefe(){
    const t=roh.value.trim(); if(!t){ vor.innerHTML=""; return; }
    const z=zParse(t);
    let auto=0, offen=0, ign=0;
    z.positionen.forEach(p=>{ const zu=zuordnung(p);
      if(zu.status==="offen") offen++; else if(zu.status==="ignoriert") ign++; else auto++; });
    vor.innerHTML=`<h3>Vorschau</h3>
      <div class="gitter g4" style="margin-bottom:16px">
        <div class="kpi"><span>Betriebstag</span><b style="font-size:19px">${z.tag?esc(deTag(z.tag)):"nicht erkannt"}</b><small>${esc(z.nr||"")}</small></div>
        <div class="kpi"><span>Positionen</span><b>${z.positionen.length}</b><small>Block „${esc(z.block)}“</small></div>
        <div class="kpi"><span>Zugeordnet</span><b>${auto}</b><small>${ign} ignoriert</small></div>
        <div class="kpi ${offen?"warn":"ok"}"><span>Offen</span><b>${offen}</b><small>brauchen eine Zuordnung</small></div>
      </div>
      <div class="tabhuelle" style="max-height:420px;overflow:auto"><table><thead><tr>
        <th>Kassenname</th><th class="r">Anzahl</th><th class="r">Umsatz</th><th>Zuordnung</th><th class="r">Flaschen</th>
      </tr></thead><tbody>${z.positionen.map(p=>{
        const zu=zuordnung(p); const w=zu.id?byId(zu.id):null;
        const nm=zu.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
          :zu.status==="offen"?'<span class="pill p-bad">offen</span>'
          :`${esc(w?w.winzer+" · "+w.wein:GN(zu.id))} <span class="pill ${zu.status==="auto"?"p-neu":"p-ok"}">${zu.status==="auto"?"automatisch":"bestätigt"}</span>`;
        return `<tr><td>${esc(p.name)}${p.zeilen>1?` <span class="mini">${p.zeilen} Zeilen summiert</span>`:""}</td>
          <td class="r">${num(p.anzahl)}</td><td class="r">${p.umsatz?eur(p.umsatz):"—"}</td>
          <td>${nm}</td><td class="r">${zu.id?num(flaschen(p,zu.id)):"—"}</td></tr>`;
      }).join("")}</tbody></table></div>`;
    $("#stat").textContent = z.tag ? "Bereit — "+z.positionen.length+" Positionen" : "Betriebstag nicht erkannt, bitte prüfen";
    vor._z=z;
  }
  roh.oninput=pruefe;
  $("#bLies").onclick=()=>{
    const z=vor._z; if(!z) return toast("Erst einen Bericht einfügen");
    if(!z.tag) return toast("Ohne Betriebstag lässt sich nichts zuordnen");
    ZBER[z.tag]=z; schreib(K_ZBER,ZBER);
    toast("Z-Bericht für "+deTag(z.tag)+" gespeichert");
    vAbgleich.tag=z.tag; SEITE = (function(){const a=abgleich(z.tag); return a.offen.length?"zuordnung":"abgleich";})();
    zeichne();
  };

  const alt=Object.keys(ZBER).sort().reverse();
  if(alt.length){
    const s2=document.createElement("section");
    s2.innerHTML=`<h3>Bereits eingelesen</h3><div class="tabhuelle"><table><thead><tr>
      <th>Betriebstag</th><th>Bericht</th><th class="r">Positionen</th><th class="r">Umsatz</th><th></th>
      </tr></thead><tbody>${alt.map(t=>`<tr>
        <td>${esc(deTag(t))}</td><td class="dim">${esc(ZBER[t].nr||"—")}</td>
        <td class="r">${ZBER[t].positionen.length}</td><td class="r">${eur(ZBER[t].umsatz)}</td>
        <td class="r"><button class="b klein" data-weg="${t}">Löschen</button></td></tr>`).join("")}
      </tbody></table></div>`;
    m.appendChild(s2);
    s2.querySelectorAll("[data-weg]").forEach(b=>b.onclick=()=>{
      delete ZBER[b.dataset.weg]; schreib(K_ZBER,ZBER); zeichne(); toast("Gelöscht"); });
  }
}

/* ── Kellerbestand ──────────────────────────────────────────────────── */
function vBestand(m){
  const B=bestand(), V=verbrauch();
  m.innerHTML=`<section><h2>Kellerbestand</h2>
    <div class="unter">Jüngste Zählung, fortgeschrieben mit allem, was seither ein- und ausgegangen ist.</div></section>`;

  if(!B.hat){
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis warn">Es liegt keine Kellerzählung vor.
       Ohne Zählung gibt es keinen Bestand — nur die Bewegung der letzten Vorgänge.</div></section>`);
  }else{
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis">Basis ist die Zählung vom ${esc(deTag(B.basis.tag))}${B.basis.name?" durch "+esc(B.basis.name):""}.
       Seither ${summe(B.seit.ein)} Flaschen eingegangen, ${summe(B.seit.raus)} entnommen.</div></section>`);
    const minus=WINES.filter(w=>B.b[w.id]!=null && B.b[w.id]<0);
    if(minus.length) m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis bad">${minus.length} Positionen stehen rechnerisch unter null.
       Entweder wurde ohne Vorgang aus dem Keller geholt, oder die Zählung ist zu alt.
       Beides löst dieselbe Massnahme aus: neu zählen.</div></section>`);
  }

  const zonen={};
  WINES.forEach(w=>{ const z=PLAN.zone[w.id]||7; (zonen[z]=zonen[z]||[]).push(w); });
  const reihen=[];
  Object.keys(zonen).map(Number).sort((a,b)=>a-b).forEach(z=>{
    reihen.push(`<tr class="zwt"><td colspan="7">${esc((PLAN.zonen[z]||{}).t||("Zone "+z))} · ${esc((PLAN.zonen[z]||{}).s||"")}</td></tr>`);
    zonen[z].sort((a,b)=>(PLAN.restorder[a.id]??999)-(PLAN.restorder[b.id]??999)).forEach(w=>{
      const b=B.b[w.id], pt=V.proTag[w.id]||0;
      const rw = b==null||!pt ? Infinity : (b<=0 ? 0 : b/pt);
      const soll=PLAN.soll[w.id]||0;
      const anteil=b!=null&&soll?Math.min(100,Math.round(b/(soll*4)*100)):0;
      reihen.push(`<tr>
        <td><b>${esc(w.winzer)}</b> · ${esc(w.wein)} <span class="mini">${esc(w.jg)}</span></td>
        <td class="mini">${esc(w.reb)}</td>
        <td class="r">${b==null?'<span class="dim">—</span>'
          :b<0?`<b style="color:var(--danger-fg)">${num(b)}</b>`:`<b>${num(b)}</b>`}</td>
        <td class="r dim">${soll||"—"}</td>
        <td class="r">${pt?num(pt):'<span class="dim">—</span>'}</td>
        <td class="r">${rw===Infinity?'<span class="dim">—</span>':
          b<=0?'<span class="pill p-bad">leer</span>':
          `<span class="pill ${rw<7?"p-bad":rw<EINST.reichweite?"p-warn":"p-ok"}">${Math.floor(rw)} T</span>`}</td>
        <td><div class="balken"><i class="${b!=null&&b<6?"knapp":anteil>60?"satt":""}" style="width:${anteil}%"></i></div></td>
      </tr>`);
    });
  });

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Rebsorte</th><th class="r">Bestand Fl.</th><th class="r">Soll Schrank</th>
    <th class="r">Pro Tag</th><th class="r">Reicht</th><th>&nbsp;</th>
    </tr></thead><tbody>${reihen.join("")}</tbody></table></div>
    <div class="mini" style="margin-top:10px">Verbrauch je Tag über die letzten ${V.tage} erfassten Tage.</div>`;
  m.appendChild(s);
}

/* ── Nachbestellen ──────────────────────────────────────────────────── */
function bestellliste(){
  const B=bestand(), V=verbrauch(), out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id]; if(b==null) return;
    const pt=V.proTag[w.id]||0; if(!pt) return;
    const rw = b<=0 ? 0 : b/pt; if(rw>=EINST.reichweite) return;
    const kg=(PLAN.kiste||{})[w.id]||6;
    const ziel=Math.ceil(pt*EINST.reichweite*1.5);        /* auf anderthalb Fenster auffüllen */
    const kisten=Math.max(1, Math.ceil(Math.max(0,ziel-Math.max(0,b))/kg));
    out.push({w, bestand:b, proTag:pt, reichweite:rw, kg, kisten});
  });
  return out.sort((a,b)=>a.reichweite-b.reichweite);
}
function vBestellen(m){
  const L=bestellliste();
  m.innerHTML=`<section><h2>Nachbestellen</h2>
    <div class="unter">Alles, dessen Bestand bei gleichbleibendem Verbrauch keine ${EINST.reichweite} Tage mehr trägt.
    Der Vorschlag füllt auf das Anderthalbfache dieses Fensters auf, aufgerundet auf ganze Kisten.</div></section>`;
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Nichts unter der Schwelle.</div></section>`);
    return;
  }
  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Winzer</th><th class="r">Bestand</th><th class="r">Pro Tag</th>
    <th class="r">Reicht</th><th class="r">Kisten</th><th class="r">Flaschen</th>
    </tr></thead><tbody>${L.map(r=>`<tr>
      <td><b>${esc(r.w.wein)}</b> <span class="mini">${esc(r.w.jg)}</span></td>
      <td>${esc(r.w.winzer)}</td>
      <td class="r">${num(r.bestand)}</td><td class="r">${num(r.proTag)}</td>
      <td class="r"><span class="pill ${r.reichweite<7?"p-bad":"p-warn"}">${Math.floor(r.reichweite)} T</span></td>
      <td class="r"><b>${r.kisten}</b> <span class="mini">à ${r.kg}</span></td>
      <td class="r">${r.kisten*r.kg}</td></tr>`).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="bKop">Als Text kopieren</button>
      <button class="b" id="bCsv2">Als CSV</button></div>`;
  m.appendChild(s);
  $("#bKop").onclick=()=>{
    const t="Bestellvorschlag Haus Hirt · "+new Date().toLocaleDateString("de-AT")+"\n\n"+
      L.map(r=>`${r.kisten} × ${r.kg}er  ${r.w.winzer}, ${r.w.wein} ${r.w.jg}`).join("\n");
    navigator.clipboard.writeText(t).then(()=>toast("In die Zwischenablage kopiert"),()=>toast("Kopieren nicht möglich"));
  };
  $("#bCsv2").onclick=()=>{
    const e=s2=>'"'+String(s2??"").replace(/"/g,'""')+'"';
    const R=[["Winzer","Wein","Jahrgang","Bestand","Verbrauch/Tag","Reichweite","Kisten","Kistengröße","Flaschen"].map(e).join(";")];
    L.forEach(r=>R.push([r.w.winzer,r.w.wein,r.w.jg,num(r.bestand),num(r.proTag),
      Math.floor(r.reichweite),r.kisten,r.kg,r.kisten*r.kg].map(e).join(";")));
    hol("bestellvorschlag.csv","\uFEFF"+R.join("\r\n"),"text/csv");
  };
}

/* ── Getränke ───────────────────────────────────────────────────────── */
function vGetraenke(m){
  const V=verbrauch();
  let letzterIst=null;
  VORGAENGE.forEach(v=>{ if(v.gzaehlung) letzterIst=v; });
  m.innerHTML=`<section><h2>Getränke</h2>
    <div class="unter">Soll und letzter Ist-Stand in den Laden. Ein Kellerbestand wird für Getränke nicht geführt —
    was hier steht, ist die Bar, nicht das Lager.</div></section>`;
  const s=document.createElement("section");
  const zeilen=GIDS.map(id=>{
    const soll=GSOLL[id];

function vZuordnung(m){
  m.innerHTML=`<section><h2>Zuordnung</h2>
    <div class="unter">Kassenname zu Artikel. Weine mit Rebsorten-Kürzel gehen automatisch durch.
    Getränke folgen keiner Systematik — jedes wird einmal bestätigt und ist danach festgelegt.
    „Ignorieren“ ist ein vollwertiger Zustand: Speisen, Kaffee, Fassbier.</div></section>`;

  const namen={};
  Object.values(ZBER).forEach(z=>z.positionen.forEach(p=>{
    if(!namen[p.name]) namen[p.name]={name:p.name, anzahl:0, tage:0};
    namen[p.name].anzahl+=p.anzahl; namen[p.name].tage++;
  }));
  const L=Object.values(namen).sort((a,b)=>{
    const za=zuordnung(a), zb=zuordnung(b);
    const rang=x=>x.status==="offen"?0:x.status==="auto"?1:2;
    return rang(za)-rang(zb) || b.anzahl-a.anzahl;
  });
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Noch kein Z-Bericht eingelesen.</div></section>`);
    return;
  }
  const optionen=`<option value="">— offen —</option><option value="__ignoriert">Ignorieren</option>`+
    `<optgroup label="Wein">${WINES.map(w=>`<option value="${w.id}">${esc(w.winzer)} · ${esc(w.wein)} ${esc(w.jg)}</option>`).join("")}</optgroup>`+
    `<optgroup label="Getränke">${GIDS.map(id=>`<option value="${id}">${esc(GN(id))}</option>`).join("")}</optgroup>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Kassenname</th><th class="r">Menge gesamt</th><th>Zuordnung</th><th>Zustand</th></tr></thead><tbody>
    ${L.map(p=>{ const z=zuordnung(p);
      return `<tr><td>${esc(p.name)}</td><td class="r">${num(p.anzahl)}</td>
        <td><select class="klein" data-name="${esc(p.name)}">${optionen}</select></td>
        <td>${z.status==="offen"?'<span class="pill p-bad">offen</span>'
            :z.status==="auto"?'<span class="pill p-neu">automatisch — bestätigen</span>'
            :z.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
            :'<span class="pill p-ok">festgelegt</span>'}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="bAuto">Alle automatischen Weinvorschläge übernehmen</button></div>`;
  m.appendChild(s);

  s.querySelectorAll("select[data-name]").forEach(sel=>{
    const nm=sel.dataset.name, z=zuordnung({name:nm});
    sel.value = MAP[nm] ? MAP[nm] : (z.status==="auto" ? z.id : "");
    sel.onchange=()=>{
      if(sel.value) MAP[nm]=sel.value; else delete MAP[nm];
      schreib(K_MAP,MAP); zeichne(); toast("Zuordnung gespeichert");
    };
  });
  $("#bAuto").onclick=()=>{
    let n=0;
    L.forEach(p=>{ if(MAP[p.name]) return; const a=autoWein(p.name); if(a){ MAP[p.name]=a.id; n++; } });
    schreib(K_MAP,MAP); zeichne(); toast(n+" Weine übernommen");
  };
}

/* ════════════ 7d · Zählliste ════════════
   Zählen nach Bedarf statt nach Kalender. Wer weiss, welche zwölf
   Positionen auseinanderlaufen, zählt in fünf Minuten das Richtige —
   statt in einer Stunde alles, und das zu selten. */
function zaehlliste(){
  const B=bestand(), V=verbrauch(), t=letzterTag(), A=abgleich(t, SPANNE);
  const dif={}; A.zeilen.forEach(r=>dif[r.id]=r.diff);
  const out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id], d=dif[w.id]||0, pt=V.proTag[w.id]||0;
    let grund=null, rang=9;
    if(b!=null && b<0){ grund="rechnerisch unter null"; rang=0; }
    else if(Math.abs(d)>=3){ grund="Verkauf und Entnahme "+num(Math.abs(d))+" Fl. auseinander"; rang=1; }
    else if(b!=null && b<6 && pt>0){ grund="unter einer Reihe"; rang=2; }
    if(!grund) return;
    out.push({w, bestand:b, diff:d, grund, rang});
  });
  return out.sort((a,b)=>a.rang-b.rang || Math.abs(b.diff)-Math.abs(a.diff));
}
function vZaehlliste(m){
  const L=zaehlliste();
  m.innerHTML=`<section><h2>Zählliste</h2>
    <div class="unter">Nicht alles, sondern das Auffällige. Positionen unter null, Positionen deren
    Verkauf und Entnahme über ${SPANNE} Tage auseinanderlaufen, und was unter eine Reihe gefallen ist.</div></section>`;
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Nichts zu prüfen — alles im Rahmen.</div></section>`);
    return;
  }
  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Kellerbereich</th><th class="r">Rechnerisch</th><th>Warum zählen</th>
    </tr></thead><tbody>${L.map(r=>`<tr>
      <td><b>${esc(r.w.winzer)}</b> · ${esc(r.w.wein)} <span class="mini">${esc(r.w.jg)}</span></td>
      <td class="mini">${esc((PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"—")}</td>
      <td class="r">${r.bestand==null?'<span class="dim">—</span>'
        :r.bestand<0?`<b style="color:var(--danger-fg)">${r.bestand}</b>`:`<b>${r.bestand}</b>`}</td>
      <td><span class="pill ${r.rang===0?"p-bad":r.rang===1?"p-warn":"p-grau"}">${esc(r.grund)}</span></td>
    </tr>`).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="zKop">Als Zettel kopieren</button>
      <button class="b" id="zCsv">Als CSV</button>
      <span class="mini rechts">${L.length} von ${WINES.length} Positionen</span></div>`;
  m.appendChild(s);
  $("#zKop").onclick=()=>{
    const txt="Zählliste "+new Date().toLocaleDateString("de-AT")+"\n\n"+
      L.map(r=>`☐  ${(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"?"} · ${r.w.winzer}, ${r.w.wein} ${r.w.jg}   ____ Reihen  ____ einzeln`).join("\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich"));
  };
  $("#zCsv").onclick=()=>{
    const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
    const R=[["Bereich","Winzer","Wein","Jahrgang","Rechnerisch","Grund","Reihen","Einzeln"].map(e).join(";")];
    L.forEach(r=>R.push([(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"",r.w.winzer,r.w.wein,r.w.jg,
      r.bestand==null?"":r.bestand,r.grund,"",""].map(e).join(";")));
    hol("zaehlliste.csv","\uFEFF"+R.join("\r\n"),"text/csv");
  };
}

/* ════════════ 7e · Speicher ════════════
   Jede Fassung, die je durchgelaufen ist — vollständig, nicht als
   Zusammenfassung. Wer wissen will, warum vor drei Wochen zwölf Flaschen
   gebucht wurden, braucht die Zeilen, nicht die Summe. */
let SPFILTER={modus:"", wer:"", q:""}, SPOFFEN=null;
function vSpeicher(m){
  const alle=VORGAENGE.slice().reverse();
  const leute=Array.from(new Set(alle.map(v=>v.name).filter(Boolean))).sort();

  m.innerHTML=`<section><h2>Speicher</h2>
    <div class="unter">${alle.length} Vorgänge aus ${esc(QUELLE)}.
    ${QUELLE==="Lokal"?"Lokal hält die App die letzten 30 — am Server fällt dieser Deckel weg.":""}</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<input type="text" id="spQ" placeholder="Name, Notiz oder Datum" value="${esc(SPFILTER.q)}" style="width:250px">
    <select id="spM"><option value="">Alle Vorgänge</option>
      ${Object.keys(MODUSNAME).map(k=>`<option value="${k}"${SPFILTER.modus===k?" selected":""}>${MODUSNAME[k]}</option>`).join("")}</select>
    <select id="spW"><option value="">Alle Personen</option>
      ${leute.map(n=>`<option value="${esc(n)}"${SPFILTER.wer===n?" selected":""}>${esc(n)}</option>`).join("")}</select>
    <span class="rechts"></span><button class="b klein" id="spCsv">Alles als CSV</button>`;
  m.appendChild(w);
  $("#spQ").oninput=e=>{SPFILTER.q=e.target.value; malSpeicher();};
  $("#spM").onchange=e=>{SPFILTER.modus=e.target.value; malSpeicher();};
  $("#spW").onchange=e=>{SPFILTER.wer=e.target.value; malSpeicher();};
  $("#spCsv").onclick=()=>csvSpeicher(gefiltert());

  const liste=document.createElement("section"); liste.id="spListe"; m.appendChild(liste);
  const detail=document.createElement("section"); detail.id="spDetail"; m.appendChild(detail);
  malSpeicher();

  function gefiltert(){
    const q=SPFILTER.q.trim().toLowerCase();
    return alle.filter(v=>
      (!SPFILTER.modus || v.mode===SPFILTER.modus) &&
      (!SPFILTER.wer   || v.name===SPFILTER.wer) &&
      (!q || (v.name+" "+v.notiz+" "+v.tag+" "+deTag(v.tag)).toLowerCase().includes(q)));
  }
  function malSpeicher(){
    const L=gefiltert();
    $("#spListe").innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Betriebstag</th><th>Vorgang</th><th>Wer</th><th class="r">Wein</th><th class="r">Getränke</th>
      <th>Zustand</th><th></th></tr></thead><tbody>
      ${L.length?L.map((v,i)=>`<tr>
        <td>${esc(deTag(v.tag))}</td><td>${esc(MODUSNAME[v.mode]||v.mode)}</td>
        <td>${esc(v.name||"—")}</td>
        <td class="r">${v.flWein||'<span class="dim">—</span>'}</td>
        <td class="r">${v.flGetr||'<span class="dim">—</span>'}</td>
        <td>${v.fertig?'<span class="pill p-ok">fertig</span>':'<span class="pill p-warn">läuft</span>'}
            ${v.zaehlung?' <span class="pill p-neu">Zählung</span>':""}
            ${v.fotos?` <span class="mini">${v.fotos} Foto${v.fotos>1?"s":""}</span>`:""}</td>
        <td class="r"><button class="b klein" data-oe="${alle.indexOf(v)}">Ansehen</button></td></tr>`).join("")
        :`<tr><td colspan="7" class="leer">Nichts gefunden.</td></tr>`}
      </tbody></table></div>`;
    $("#spListe").querySelectorAll("[data-oe]").forEach(b=>b.onclick=()=>{
      SPOFFEN=alle[+b.dataset.oe]; malDetail();
      $("#spDetail").scrollIntoView({behavior:"smooth", block:"start"});});
    if(SPOFFEN) malDetail();
  }
  function malDetail(){
    const v=SPOFFEN; if(!v) return;
    const nm=id=>{const w=byId(id); return w?w.winzer+" · "+w.wein+" "+w.jg:GN(id);};
    const tab=(titel,o,einheit)=>{
      const ks=Object.keys(o||{}).filter(k=>+o[k]); if(!ks.length) return "";
      return `<h3 style="margin-top:24px">${titel}</h3><div class="tabhuelle"><table><thead><tr>
        <th>Position</th><th class="r">${einheit}</th></tr></thead><tbody>
        ${ks.sort((a,b)=>o[b]-o[a]).map(k=>`<tr><td>${esc(nm(k))}</td><td class="r"><b>${num(o[k])}</b></td></tr>`).join("")}
        <tr class="zwt"><td>Summe</td><td class="r">${num(summe(o))}</td></tr></tbody></table></div>`;
    };
    $("#spDetail").innerHTML=`<div class="karte" style="margin-top:24px">
      <div class="reihe">
        <div><h3 style="margin:0">${esc(MODUSNAME[v.mode]||v.mode)} · ${esc(deTag(v.tag))}</h3>
          <div class="mini">${esc(v.name||"ohne Namen")}${v.ts?" · abgelegt "+esc(new Date(v.ts).toLocaleString("de-AT")):""}</div></div>
        <span class="rechts"></span>
        <button class="b klein" id="spJson">Rohdaten</button>
        <button class="b klein" id="spZu">Schliessen</button></div>
      ${v.notiz?`<div class="hinweis" style="margin-top:14px">${esc(v.notiz)}</div>`:""}
      ${v.zaehlung?`<div class="hinweis" style="margin-top:14px">Diese Zählung ist die Basis aller
        Bestände danach. ${Object.keys(v.zaehlung).length} Positionen, ${summe(v.zaehlung)} Flaschen.</div>`:""}
      ${tab("Aus dem Weinkeller geholt", v.wein, "Flaschen")}
      ${tab("Aus dem Getränkelager geholt", v.getr, "Flaschen")}
      ${tab("Wareneingang", v.eingang, "Flaschen")}
      ${v.zaehlung?tab("Gezählter Bestand", v.zaehlung, "Flaschen"):""}
      ${(!summe(v.wein)&&!summe(v.getr)&&!summe(v.eingang)&&!v.zaehlung)
        ?`<div class="leer">Dieser Vorgang hat keine Mengen bewegt.</div>`:""}
    </div>`;
    $("#spZu").onclick=()=>{SPOFFEN=null; $("#spDetail").innerHTML="";};
    $("#spJson").onclick=()=>hol(`vorgang_${v.mode}_${v.tag}.json`,
      JSON.stringify(v.roh,null,2), "application/json");
  }
}
function csvSpeicher(L){
  const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  const R=[["Betriebstag","Vorgang","Wer","Position","Art","Menge","Notiz"].map(e).join(";")];
  L.forEach(v=>{
    const zeile=(o,art)=>Object.keys(o||{}).filter(k=>+o[k]).forEach(k=>{
      const w=byId(k);
      R.push([v.tag, MODUSNAME[v.mode]||v.mode, v.name,
        w?w.winzer+" "+w.wein:GN(k), art, o[k], v.notiz].map(e).join(";"));});
    zeile(v.wein,"Weinkeller"); zeile(v.getr,"Getränkelager");
    zeile(v.eingang,"Wareneingang"); if(v.zaehlung) zeile(v.zaehlung,"Zählung");
  });
  hol("speicher.csv","\uFEFF"+R.join("\r\n"),"text/csv");
}

        <button class="b" id="rzPlus">Zutat hinzufügen</button>
        <span class="rechts"></span>

      <div class="reihe" style="margin-bottom:8px">
        <select data-zi="${i}" style="max-width:300px">${zutatOpt}</select>
        <input type="number" data-zm="${i}" value="${t.ml}" min="10" max="1000" step="10" style="width:100px">
        <span class="mini">ml je Verkauf</span>
        <button class="b klein" data-zx="${i}">Weg</button></div>`).join("")
      : `<div class="mini">Noch keine Zutat.</div>`;
    $("#rzZut").querySelectorAll("[data-zi]").forEach(sel=>{
      sel.value=zut[+sel.dataset.zi].id;
      sel.onchange=()=>{zut[+sel.dataset.zi].id=sel.value;};});
    $("#rzZut").querySelectorAll("[data-zm]").forEach(inp=>
      inp.oninput=()=>{zut[+inp.dataset.zm].ml=Math.max(0,+inp.value||0);});
    $("#rzZut").querySelectorAll("[data-zx]").forEach(b=>
      b.onclick=()=>{zut.splice(+b.dataset.zx,1); malZut();});
  };
  malZut();
  $("#rzPlus").onclick=()=>{zut.push({id:GIDS[0], ml:200}); malZut();};
  $("#rzSave").onclick=()=>{
    const nm=$("#rzName").value;
    if(!nm) return toast("Erst eine Kassenposition wählen");
    if(!zut.length) return toast("Ohne Zutat ist es keine Rezeptur");
    REZ[nm]=zut.map(t=>({id:t.id, ml:t.ml})); schreib(K_REZ,REZ);
    zeichne(); toast("Rezeptur gespeichert");
  };
  s.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{
    delete REZ[b.dataset.rw]; schreib(K_REZ,REZ); zeichne(); toast("Gelöscht");});
}

/* ════════════ 7g · Mitarbeiter ════════════
   Codes und Rollen gehören der Leitung, nicht dem Quelltext. Solange
   alles im Browser läuft, ist ein Code eine Unterschrift und keine
   Sperre — das steht hier auch so, damit niemand mehr hineinliest. */
function vTeam(m){
  m.innerHTML=`<section><h2>Mitarbeiter</h2>
    <div class="unter">Wer sich anmelden darf und was ihm die App dann zeigt.
    Codes werden nur beim Anlegen eingegeben und nirgends gespeichert —
    am Server liegt eine PBKDF2-Prüfsumme, sonst nichts. Wer seinen Code
    vergisst, bekommt einen neuen; auslesen kann ihn niemand.</div></section>`;

  const s=document.createElement("section");
  s.innerHTML=`<div id="teamL"><div class="karte leer">Wird geladen \u2026</div></div>
    <h3 style="margin-top:32px">Aufnehmen oder Code neu setzen</h3>
    <div class="karte">
      <div class="reihe" style="margin-bottom:12px">
        <label style="width:140px">Name</label>
        <input type="text" id="nName" placeholder="Vor- und Nachname" style="width:280px"></div>
      <div class="reihe" style="margin-bottom:12px">
        <label style="width:140px">Rolle</label>
        <select id="nRolle">${Object.keys(ROLLNAME).map(k=>
          `<option value="${k}">${ROLLNAME[k]}</option>`).join("")}</select>
        <span class="mini" id="nHint">${esc(RECHTETEXT.service)}</span></div>
      <div class="reihe" style="margin-bottom:16px">
        <label style="width:140px">Code</label>
        <input type="text" id="nCode" placeholder="vier bis acht Ziffern" maxlength="8"
          inputmode="numeric" style="width:180px">
        <button class="b klein" id="nWuerfel">Vorschlagen</button></div>
      <div class="reihe">
        <button class="b stark" id="nAdd">Speichern</button>
        <span class="mini rechts">Der Code erscheint danach nirgends mehr. Jetzt notieren.</span></div>
    </div>`;
  m.appendChild(s);

  $("#nRolle").onchange=e=>{ $("#nHint").textContent=RECHTETEXT[e.target.value]||""; };
  $("#nWuerfel").onclick=()=>{
    const a=new Uint32Array(1); crypto.getRandomValues(a);
    $("#nCode").value=String(1000+(a[0]%9000));
  };

  let LEUTE=[];
  const male=()=>{
    $("#teamL").innerHTML=LEUTE.length?`<div class="tabhuelle"><table><thead><tr>
      <th>Name</th><th style="width:200px">Rolle</th><th>Sieht</th><th style="width:120px">Zustand</th>
      </tr></thead><tbody>${LEUTE.map(p=>`<tr>
        <td><b>${esc(p.name)}</b></td>
        <td><select class="klein" data-rp="${esc(p.id)}">${Object.keys(ROLLNAME).map(k=>
          `<option value="${k}"${p.rolle===k?" selected":""}>${ROLLNAME[k]}</option>`).join("")}</select></td>
        <td class="mini">${esc(RECHTETEXT[p.rolle]||"")}</td>
        <td><button class="b klein" data-ap="${esc(p.id)}">${p.aktiv?"Sperren":"Freigeben"}</button></td>
      </tr>`).join("")}</tbody></table></div>`
      :`<div class="karte leer">Noch niemand angelegt.</div>`;
    $("#teamL").querySelectorAll("[data-rp]").forEach(sel=>sel.onchange=()=>{
      const p=LEUTE.find(x=>x.id===sel.dataset.rp);
      sende({id:p.id,name:p.name,rolle:sel.value,aktiv:p.aktiv});});
    $("#teamL").querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
      const p=LEUTE.find(x=>x.id===b.dataset.ap);
      sende({id:p.id,name:p.name,rolle:p.rolle,aktiv:p.aktiv?0:1});});
  };
  const hole=async()=>{
    try{
      const r=await fetch("/api/personen");
      if(r.status===403){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Nur die Leitung darf Mitarbeiter verwalten.</div>`; return; }
      if(!r.ok){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Der Server antwortet nicht. Mitarbeiter lassen sich
         nur mit Verbindung pflegen.</div>`; return; }
      LEUTE=(await r.json()).personen||[]; male();
    }catch(e){ $("#teamL").innerHTML=
      `<div class="hinweis warn">Keine Verbindung zum Server.</div>`; }
  };
  const sende=async(body)=>{
    try{
      const r=await fetch("/api/personen",{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json();
      if(!r.ok)return toast(j.fehler||"Nicht gespeichert");
      toast("Gespeichert"); hole();
    }catch(e){ toast("Keine Verbindung"); }
  };
  $("#nAdd").onclick=()=>{
    const nm=$("#nName").value.trim(), code=$("#nCode").value.trim();
    if(!nm) return toast("Ohne Namen geht es nicht");
    if(!/^\d{4,8}$/.test(code)) return toast("Der Code hat vier bis acht Ziffern");
    const da=LEUTE.find(p=>p.name.toLowerCase()===nm.toLowerCase());
    sende({id:da?da.id:undefined, name:nm, rolle:$("#nRolle").value, code, aktiv:1});
    $("#nName").value=""; $("#nCode").value="";
  };
  hole();
}

/* ════════════ 8 · Aufbau ════════════ */
const ANSICHT={heute:vHeute, abgleich:vAbgleich, import:vImport, bestand:vBestand,
  bestellen:vBestellen, getraenke:vGetraenke, zaehlliste:vZaehlliste, speicher:vSpeicher,
  zuordnung:vZuordnung, rezepte:vRezepte, team:vTeam, einst:vEinst};

function zeichne(){
  zeichneNav();
  const m=$("#inhalt"); m.innerHTML="";
  (ANSICHT[SEITE]||vHeute)(m);
  $("#tQuelle").textContent=QUELLE;
  $("#cQuelle").classList.toggle("aus", QUELLE==="Keine Daten");
  const t=letzterTag();
  $("#tStand").textContent=deTag(t);
  $("#cStand").classList.toggle("aus", !VORGAENGE.some(v=>v.tag===t));
}

$("#bNeu").onclick=async()=>{ await ladeDaten(); zeichne(); toast("Aktualisiert"); };
$("#bFass").onclick=()=>{ location.href="index.html"; };

/* Zweite Ansicht im selben Browser: neue Stände kommen von selbst an */
window.addEventListener("storage", e=>{
  if([K_STAND,K_ARCHIV].includes(e.key)){ ladeDaten().then(zeichne); }
});

(async()=>{
  await werBinIch();
  await ladeDaten();
  /* Ohne Sitzung und ohne lokale Daten hat diese Seite nichts zu zeigen —
     dann besser eine klare Tür als eine leere Tabelle. */
  if(!ICH && QUELLE==="Nicht angemeldet") return verlangeAnmeldung();
  zeichne();
  if(ICH && ICH.rolle!=="leitung"){
    document.getElementById("cQuelle").insertAdjacentHTML("beforebegin",
      `<span class="chip aus"><span class="pkt"></span>${ICH.rolle}: nur lesen</span>`);
  }
})();
</script>
