      <td><span class="pill ${r.rang===0?"p-bad":r.rang===1?"p-warn":"p-grau"}">${esc(r.grund)}</span></td>
    </tr>`).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="zKop">Als Zettel kopieren</button>
      <button class="b" id="zCsv">Als CSV</button>
      <span class="mini rechts">${L.length} von ${WINES.length} Positionen</span></div>`;
  m.appendChild(s);
  $("#zKop").onclick=()=>{
    const txt="Zählliste "+new Date().toLocaleDateString("de-AT")+"\n\n"+
      L.map(r=>`☐  ${(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"?"} · ${r.w.winzer}, ${r.w.wein} ${r.w.jg}   ____ Reihen  ____ einzeln`).join("\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich"));
  };
  $("#zCsv").onclick=()=>{
    const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
    const R=[["Bereich","Winzer","Wein","Jahrgang","Rechnerisch","Grund","Reihen","Einzeln"].map(e).join(";")];
    L.forEach(r=>R.push([(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"",r.w.winzer,r.w.wein,r.w.jg,
      r.bestand==null?"":r.bestand,r.grund,"",""].map(e).join(";")));
    hol("zaehlliste.csv","\uFEFF"+R.join("\r\n"),"text/csv");
  };
}

/* ════════════ 7e · Eingänge ════════════
   B3 (Runde 18) · Alles, was aus dem Keller gemeldet wurde — je Vorgang
   mit MENGEN, nicht nur mit Positionsnamen.

   Warum neben „Speicher" und nicht statt dessen: „Speicher" ist die
   Werkbank der Leitung (Suche, CSV, Rohdaten) und bleibt, wie sie ist.
   „Eingänge" ist der Blick von aussen auf denselben Bestand — was ist
   hereingekommen, wie viel, von wem. Drei Dinge, die der Speicher nicht
   zeigte und die hier stehen:

   · `eingang` (Wareneingang) und `zaehlung` (Kellerzählung) zählten nie
     in die Spalten „Wein"/„Getränke" — ein Wareneingang über 24 Kisten
     stand mit zwei Strichen da (hospitality-pro, Runde 5). Die Liste
     nennt deshalb JEDE Menge des Vorgangs, nicht nur die Entnahme.
   · `gzaehlung` (der gezählte Ist-Stand der Getränkelade) wurde in
     `normVorgang` berechnet und nirgends gezeigt. Eine Kellerzählung,
     die nur Getränke gezählt hat, sagte deshalb „Dieser Vorgang hat
     keine Mengen bewegt" — bei 57 gezählten Flaschen.
   · Die Notiz stand nur im Detail, nicht in der Liste; bei einer
     Sonderentnahme ist sie oft der ganze Inhalt.

   Zwei leere Zustände, nicht einer (ui-designer, Runde 3): „nichts da"
   und „nichts passt" sind verschiedene Nachrichten. */
let EGFILTER={modus:"", wer:"", q:""}, EGOFFEN=null, EGFREMD=null;

/* Ein Vorgang hat auf dem Server eine `id`; lokal (Rückfall auf den
   Gerätespeicher) hat er keine. Der Schlüssel muss beides überstehen,
   weil er ein neu gezeichnetes Detail wiederfindet. */
const vgSchluessel = v => (v && v.roh && v.roh.id)
  || (v ? v.mode+"_"+v.tag+"_"+(v.ts||"")+"_"+(v.name||"") : "");

/* Die Mengenblöcke eines Vorgangs, in der Reihenfolge, in der sie im
   Keller entstehen. `art:"zaehlung"` behält die Nullen: eine gezählte 0
   heisst „nichts mehr da" und ist eine Angabe, keine fehlende Zeile. */
function vgBloecke(v){
  const B=[], hat=o=>o&&Object.keys(o).length,
        bewegt=o=>o&&Object.keys(o).some(k=>+o[k]);
  if(bewegt(v.wein))     B.push({t:"Aus dem Weinkeller geholt",         o:v.wein,      art:"bewegung"});
  if(bewegt(v.getr))     B.push({t:"Aus dem Getränkelager geholt",      o:v.getr,      art:"bewegung"});
  if(bewegt(v.eingang))  B.push({t:"Wareneingang · geliefert",          o:v.eingang,   art:"bewegung"});
  if(hat(v.zaehlung))    B.push({t:"Gezählter Bestand · Weinkeller",    o:v.zaehlung,  art:"zaehlung"});
  if(hat(v.gzaehlung))   B.push({t:"Gezählter Bestand · Getränkelade",  o:v.gzaehlung, art:"zaehlung"});
  return B;
}
/* Kurzfassung derselben Blöcke für die Liste — je Zeile eine Zahl mit
   Einheit, statt zweier Spalten, die bei drei von fünf Vorgangsarten
   leer bleiben. */
function vgMengen(v){
  return vgBloecke(v).map(b=>{
    const s=num(summe(b.o));
    if(b.t.startsWith("Aus dem Weinkeller"))    return s+" Fl. Wein";
    if(b.t.startsWith("Aus dem Getränkelager")) return s+" Fl. Getränke";
    if(b.t.startsWith("Wareneingang"))          return s+" Fl. geliefert";
    if(b.t.endsWith("Weinkeller"))              return s+" Fl. gezählt (Wein)";
    return s+" Fl. gezählt (Getränke)";
  });
}
const vgName = id => { const w=byId(id); return w ? w.winzer+" · "+w.wein+" "+w.jg : GN(id); };

/* ── Der Laufweg durch den Keller ────────────────────────────────────
   Dieselbe Ordnung wie `wegCmp` in public/index.html: erst die Zone in
   der Gehrichtung (Rot, Rosé, Natural, Weiss, Cuvée Weiss, Bubbles,
   Einzelgänger), darin der Platz im Regal, zuletzt die
   Stammdatenreihenfolge. `ZORD` ist deshalb Zeichen für Zeichen die
   Kopie aus der App — die Gehrichtung ist nicht die Zonennummer.
   Der einzige Unterschied: hier wird nach Artikel-id verglichen, dort
   nach Wein-Objekt.

   Warum das hier gebraucht wird (Runde 20): Das Vorgangsfenster baute
   je Topf eine eigene Tabelle und sortierte jede absteigend nach Menge.
   Bei Gleichstand entschied die Einfügereihenfolge — und die ist beim
   Zählblock die Stammdatenreihenfolge, beim Holblock dagegen
   `barrot, bar, backup, rest`. „Gezählt" und „geholt" standen deshalb
   in verschiedenen Reihenfolgen und mit verschiedener Zeilenzahl
   nebeneinander, was wie ein Widerspruch aussah und keiner war.
   Eine Tabelle, eine Zeile je Artikel, EINE Sortierung — und zwar die,
   die auch im Keller gilt. */
const WIDX={}; WINES.forEach((w,i)=>WIDX[w.id]=i);
const GIDX={}; GIDS.forEach((id,i)=>GIDX[id]=i);
const ZORD={1:1,2:2,5:3,3:4,4:5,6:6,7:7};
const ZR = z => ZORD[z] || z || 99;
function wegCmp(a,b){
  return (ZR(PLAN.zone[a])-ZR(PLAN.zone[b]))
    || ((PLAN.restorder[a]==null?999:PLAN.restorder[a])
       -(PLAN.restorder[b]==null?999:PLAN.restorder[b]))
    || ((WIDX[a]==null?999:WIDX[a])-(WIDX[b]==null?999:WIDX[b]));
}
/* Getränke haben keine Kellerzone — sie stehen in der Reihenfolge der
   Laden, so wie sie beim Zählen durchgegangen werden. */
const ladeCmp = (a,b) => (GIDX[a]??999)-(GIDX[b]??999);

/* ── Was ein Vorgang zu sagen hat, in EINER Form ─────────────────────
   Zwei Zahlen je Artikel, für Fenster und Druckblatt gemeinsam gebaut:
   eine Quelle, zwei Ausgaben. Die Abschnitte mit `zwei:true` tragen
   beide Spalten, die anderen nur eine — eine Zählung hat keinen
   Verbrauch, eine Lieferung auch nicht, und dort steht dann nichts,
   keine 0. */
function vgTafel(v){
  const A=[];
  const istWein = id => !!byId(id);
  const zwei=(titel, holTopf, nurArt, cmp, was)=>{
    const ids=[...new Set([...Object.keys(holTopf||{}),
                           ...Object.keys(v.verbraucht||{})])]
      .filter(nurArt)
      .filter(id=>(+((holTopf||{})[id])||0) || (+((v.verbraucht||{})[id])||0))
      .sort(cmp);
    if(!ids.length) return;
    A.push({titel, was, zwei:true, ids,
      zeilen:ids.map(id=>({ id,
        verbraucht:(v.verbraucht||{})[id],
        geholt:(holTopf||{})[id],
        extra:(v.extra||{})[id]||0 })),
      sVerbraucht:ids.reduce((x,id)=>x+(+((v.verbraucht||{})[id])||0),0),
      sGeholt:ids.reduce((x,id)=>x+(+((holTopf||{})[id])||0),0)});
  };
  zwei("Wein", v.wein, istWein, wegCmp, "Flaschen");
  zwei("Getränke", v.getr, id=>!istWein(id), ladeCmp, "Flaschen");
  const eins=(titel, topf, nullenBehalten, cmp, fuss)=>{
    if(!topf || !Object.keys(topf).length) return;
    const ids=Object.keys(topf).filter(id=>nullenBehalten || +topf[id]).sort(cmp);
    if(!ids.length) return;
    A.push({titel, zwei:false, ids, fuss,
      zeilen:ids.map(id=>({id, wert:topf[id]})),
      summe:ids.reduce((x,id)=>x+(+topf[id]||0),0)});
  };
  eins("Wareneingang · geliefert", v.eingang, false, (a,b)=>
    istWein(a)&&istWein(b)?wegCmp(a,b):istWein(a)?-1:istWein(b)?1:ladeCmp(a,b));
  /* Eine gezählte 0 heisst „nichts mehr da" und ist eine Angabe — sie
     bleibt stehen. */
  eins("Gezählter Bestand · Weinkeller", v.zaehlung, true, wegCmp,
       "Ist-Stand, keine Entnahme.");
  eins("Gezählter Bestand · Getränkelade", v.gzaehlung, true, ladeCmp,
       "Ist-Stand, keine Entnahme.");
  return A;
}
/* Die beiden Spaltenköpfe sagen, wofür die Zahl da ist — sonst sind es
   zwei Zahlen ohne Auftrag. */
/* Lang und kurz nebeneinander: Am Schreibtisch steht der ganze Satz,
   am Handy nur das Wort. Gemessen bei 393 px mit den langen Köpfen:
   die Namensspalte fiel auf ein Wort je Zeile („Wern / er / Achs").
   Die Langform bleibt unter der Tabelle stehen, sie geht nicht
   verloren. */
const SPALTE = (lang, kurz, wofuer) =>
  `<span class="spL">${lang}</span><span class="spK">${kurz}</span>`
  + `<span class="spuz">${wofuer}</span>`;
const SP_VERBRAUCHT = ["oben gefehlt", "→ Z-Bericht"];
const SP_GEHOLT     = ["aus dem Keller", "→ Bestand"];
/* Die Kopfzeile eines Vorgangs: wer, wann, und ob mit Code freigegeben.
   `zeit` ist die Uhr des GERÄTS; `ts` die Ankunft beim Server. Fehlt
   die erste, wird die zweite gezeigt und ausdrücklich so benannt. */
function vgWann(v){
  if(v.zeit){ const d=new Date(v.zeit); if(!isNaN(d))
    return "gefasst "+d.toLocaleString("de-AT",{day:"2-digit",month:"2-digit",
      hour:"2-digit",minute:"2-digit"}); }
  if(v.ts){ const d=new Date(v.ts); if(!isNaN(d))
    return "angekommen "+d.toLocaleString("de-AT",{day:"2-digit",month:"2-digit",
      hour:"2-digit",minute:"2-digit"}); }
  return "";
}
function vgFreigabeSatz(v){
  const u=v.uebersteuert; if(!u) return "";
  const offen=Array.isArray(u.offen)?u.offen.filter(Boolean):[];
  return "Ohne Bestätigung freigegeben"+(u.von?" von "+u.von:"")
    +(offen.length?" — offen war: "+offen.join(" · "):"")+".";
}
const GRUNDWORT={bruch:"Bruch", kueche:"Küche", personal:"Personal",
  verkostung:"Verkostung", zimmer:"Zimmer"};
function vgKopfZeile(v){
  const t=[esc(v.name||"ohne Namen")];
  const w=vgWann(v); if(w) t.push(esc(w));
  if(v.grund) t.push(esc(GRUNDWORT[v.grund]||v.grund));
  t.push(v.fertig?"abgeschlossen":"läuft noch");
  return t.join(" · ");
}

/* ── Die Tafel als HTML ──────────────────────────────────────────────
   Eine Tabelle je Abschnitt, eine ZEILE je Artikel, und wo es zwei
   Zahlen gibt, stehen sie nebeneinander in derselben Zeile. Damit kann
   die Anzahl der einen nicht mehr von der Anzahl der anderen abweichen
   — bis Runde 20 waren es zwei Tabellen mit zwei Sortierungen.

   Die Spaltenköpfe nennen den Auftrag der Zahl. Zwei Zahlen ohne
   Auftrag sind schlechter als eine. */
function vgTafelHtml(v, fuerDruck){
  const A=vgTafel(v);
  if(!A.length) return `<div class="leer" style="margin-top:20px">Dieser Vorgang hat
    keine Mengen bewegt und nichts gezählt.</div>`;
  const h=fuerDruck?"h2":"h3";
  const stil=fuerDruck?"":' style="margin-top:24px"';
  const huelle=x=>fuerDruck?x:`<div class="tabhuelle zweisp">${x}</div>`;
  return A.map(a=>{
    const kopf=`<${h}${stil}>${esc(a.titel)}
      <span class="mini">${a.ids.length} Position${a.ids.length===1?"":"en"}</span></${h}>`;
    if(!a.zwei) return kopf+huelle(`<table><thead><tr><th>Position</th>
      <th class="r">${esc(a.titel.startsWith("Wareneingang")?"geliefert":"gezählt")}</th>
      </tr></thead><tbody>
      ${a.zeilen.map(z=>`<tr><td>${esc(vgName(z.id))}</td>
        <td class="r zahl"><b>${num(z.wert)}</b></td></tr>`).join("")}
      <tr class="zwt"><td>Summe</td><td class="r zahl">${num(a.summe)}</td></tr>
      </tbody></table>`)
      +(a.fuss?`<div class="mini" style="margin-top:6px">${esc(a.fuss)}</div>`:"");
    return kopf+huelle(`<table><thead><tr><th>Position</th>
      <th class="r">${SPALTE(SP_VERBRAUCHT[0],"gefehlt",SP_VERBRAUCHT[1])}</th>
      <th class="r">${SPALTE(SP_GEHOLT[0],"geholt",SP_GEHOLT[1])}</th>
      </tr></thead><tbody>
      ${a.zeilen.map(z=>{
        const ab = z.verbraucht!=null && z.geholt!=null && +z.verbraucht!==+z.geholt;
        return `<tr${ab?' class="weicht"':""}><td>${esc(vgName(z.id))}
          ${z.extra?`<div class="mini">davon ${num(z.extra)} zusätzlich entnommen</div>`:""}
          ${ab?`<div class="mini">im Lager lagen nur ${num(z.geholt)}</div>`:""}</td>
        <td class="r zahl">${z.verbraucht==null?'<span class="dim">—</span>':"<b>"+num(z.verbraucht)+"</b>"}</td>
        <td class="r zahl">${z.geholt==null?'<span class="dim">—</span>':"<b>"+num(z.geholt)+"</b>"}</td>
        </tr>`;}).join("")}
      <tr class="zwt"><td>Summe</td><td class="r zahl">${num(a.sVerbraucht)}</td>
        <td class="r zahl">${num(a.sGeholt)}</td></tr>
      </tbody></table>`);
  }).join("")
  + `<div class="mini" style="margin-top:10px">Links, was oben gefehlt hat — die Zahl,
      gegen die der Z-Bericht gerechnet wird. Rechts, was aus dem Keller kam — die geht
      vom Kellerstand ab. Sie unterscheiden sich nur, wenn im Lager weniger lag.</div>`;
}

/* Vorgänge, die NUR in diesem Browser liegen (qa-guardian, Runde 3):
   Antwortet der Server mit einer leeren Liste, gewinnt der Server — die
   alten Vorgänge dieses Geräts verschwanden damit vom Schirm, ohne dass
   irgendwo stand, dass es sie noch gibt. Sie werden nicht eingemischt
   (der Server bleibt die Wahrheit), aber sie werden benannt. */
function nurImBrowser(){
  const arch=lese(K_ARCHIV)||{}, akt=lese(K_STAND)||{}, roh=[];
  Object.values(arch).forEach(v=>roh.push(v));
  Object.values(akt).forEach(v=>{ if(v&&v.mode) roh.push(v); });
  const da=new Set(VORGAENGE.map(v=>v.mode+"_"+v.tag));
  return roh.map(normVorgang).filter(Boolean)
            .filter(v=>!da.has(v.mode+"_"+v.tag))
            .sort(nachZeit).reverse();
}

function vEingaenge(m){
  const alle=VORGAENGE.slice().reverse();
  const leute=Array.from(new Set(alle.map(v=>v.name).filter(Boolean))).sort();
  const fremd=QUELLE==="Server" ? nurImBrowser() : [];

  m.innerHTML=`<section><h2>Eingänge</h2>
    <div class="unter">Jede Fassung, jede Zählung, jede Lieferung — mit den Mengen dahinter.
    Ein Klick auf „Ansehen“ öffnet die Positionen samt Anzahl; „PDF“ macht daraus ein
    Blatt zum Sichern oder Verschicken.</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<input type="text" id="egQ" placeholder="Name, Notiz oder Datum" value="${esc(EGFILTER.q)}" style="width:250px">
    <select id="egM"><option value="">Alle Vorgänge</option>
      ${Object.keys(MODUSNAME).map(k=>`<option value="${k}"${EGFILTER.modus===k?" selected":""}>${MODUSNAME[k]}</option>`).join("")}</select>
    <select id="egW"><option value="">Alle Personen</option>
      ${leute.map(n=>`<option value="${esc(n)}"${EGFILTER.wer===n?" selected":""}>${esc(n)}</option>`).join("")}</select>
    <span class="rechts"></span><button class="b klein" id="egCsv">Alles als CSV</button>`;
  m.appendChild(w);
  $("#egQ").oninput=e=>{EGFILTER.q=e.target.value; malListe();};
  $("#egM").onchange=e=>{EGFILTER.modus=e.target.value; malListe();};
  $("#egW").onchange=e=>{EGFILTER.wer=e.target.value; malListe();};
  $("#egCsv").onclick=()=>csvSpeicher(gefiltert());

  const liste=document.createElement("section"); liste.id="egListe"; m.appendChild(liste);
  const detail=document.createElement("section"); detail.id="egDetail"; m.appendChild(detail);
  malListe();

  if(fremd.length){
    const s=document.createElement("section");
    s.innerHTML=`<h3 style="margin-top:32px">Nur auf diesem Gerät</h3>
      <div class="hinweis">Der Server kennt diese ${fremd.length} Vorgänge nicht.
        Sie liegen im Speicher dieses Browsers und sind an keinem anderen Gerät zu sehen.
        Sie zählen in keine Rechnung dieser Seite hinein — sie stehen hier, damit sie
        nicht unbemerkt verschwinden.</div>
      <div class="tabhuelle" style="margin-top:12px"><table><thead><tr>
        <th>Betriebstag</th><th>Vorgang</th><th>Wer</th><th>Mengen</th><th></th>
        </tr></thead><tbody>${fremd.map((v,i)=>`<tr>
          <td>${esc(deTag(v.tag))}</td><td>${esc(MODUSNAME[v.mode]||v.mode)}</td>
          <td>${esc(v.name||"—")}</td>
          <td>${vgMengen(v).map(esc).join(" · ")||'<span class="dim">keine</span>'}</td>
          <td class="r"><button class="b klein" data-fremd="${i}">Ansehen</button></td>
        </tr>`).join("")}</tbody></table></div>`;
    m.appendChild(s);
    /* NACHTRICHTIGUNG (zweite Jagd · B): Dieses Detail gehört zur Tabelle
       darüber, nicht zur Serverliste. Es lag trotzdem in `#egDetail` —
       und jeder Tastendruck im Suchfeld der SERVERLISTE löschte es, ohne
       ein Wort, während seine eigene Tabelle unverändert stehenblieb.
       Es bekommt deshalb eine eigene Fläche. */
    const fd=document.createElement("div"); fd.id="egFremdDetail"; s.appendChild(fd);
    const fSchl=v=>vgSchluessel(v);
    s.querySelectorAll("[data-fremd]").forEach(b=>b.onclick=()=>{
      const v=fremd[+b.dataset.fremd];
      EGFREMD=fSchl(v); malDetail(v, fd);
      fd.scrollIntoView({behavior:"smooth", block:"start"}); });
    /* Ein Filter der Serverliste zeichnet die ganze Ansicht neu. Ohne
       eigenen Merker wäre dieses Detail danach weg — dieselbe Ursache,
       nur eine Ebene tiefer (zweite Jagd · B). Die Tabelle hier steht
       unverändert, also steht ihr Detail auch unverändert. */
    const wieder=EGFREMD?fremd.find(v=>fSchl(v)===EGFREMD):null;
    if(wieder) malDetail(wieder, fd); else EGFREMD=null;
  }

  function gefiltert(){
    const q=EGFILTER.q.trim().toLowerCase();
    return alle.filter(v=>
      (!EGFILTER.modus || v.mode===EGFILTER.modus) &&
      (!EGFILTER.wer   || v.name===EGFILTER.wer) &&
      (!q || (v.name+" "+v.notiz+" "+v.tag+" "+deTag(v.tag)).toLowerCase().includes(q)));
  }
  function malListe(){
    const L=gefiltert(), gefiltertWird=!!(EGFILTER.q.trim()||EGFILTER.modus||EGFILTER.wer);
    /* Zwei leere Zustände, zwei Sätze: „es gibt nichts" schickt niemanden
       auf die Suche nach dem eigenen Filter, „nichts passt" schon. */
    const leerSatz = !alle.length
      ? "Es ist noch kein Vorgang eingegangen. Sobald im Keller eine Fassung abgeschlossen wird, steht sie hier."
      : "Kein Vorgang passt zu dieser Suche. Filter zurücksetzen, dann stehen wieder alle "+alle.length+" da.";
    $("#egListe").innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Betriebstag</th><th>Vorgang</th><th>Wer</th><th>Mengen</th>
      <th>Zustand</th><th>Notiz</th><th></th></tr></thead><tbody>
      ${L.length?L.map(v=>`<tr class="klickbar" data-egzeile="${esc(vgSchluessel(v))}">
        <td>${esc(deTag(v.tag))}</td><td>${esc(MODUSNAME[v.mode]||v.mode)}</td>
        <td>${esc(v.name||"—")}</td>
        <td>${vgMengen(v).map(esc).join("<br>")||'<span class="dim">keine Menge</span>'}</td>
        <td>${v.fertig?'<span class="pill p-ok">fertig</span>':'<span class="pill p-warn">läuft</span>'}
            ${v.zaehlung||v.gzaehlung?' <span class="pill p-neu">Zählung</span>':""}</td>
        <td class="deutung">${esc(v.notiz||"")}</td>
        <td class="r" style="white-space:nowrap">
          <button class="b klein" data-eg="${esc(vgSchluessel(v))}">Ansehen</button>
          <button class="b klein leise" data-egpdf="${esc(vgSchluessel(v))}">PDF</button></td></tr>`).join("")
        :`<tr><td colspan="7" class="leer">${esc(leerSatz)}</td></tr>`}
      </tbody></table></div>`
      + (L.length&&gefiltertWird?`<div class="mini" style="margin-top:8px">${L.length} von ${alle.length} Vorgängen</div>`:"");
    /* NACHTRICHTIGUNG (Jagd nach Runde 18 · B): `finde` suchte in `alle`
       statt in der gefilterten Liste. Ein Filter ohne Treffer meldete
       „Kein Vorgang passt zu dieser Suche" — und darunter stand
       unverändert die volle Karte des vorigen Vorgangs. Was nicht in der
       Liste steht, hat unter der Liste nichts zu suchen. */
    const finde=s=>L.find(v=>vgSchluessel(v)===s);
    const aufschlagen=s=>{ const v=finde(s); if(!v) return;
      EGOFFEN=s; malDetail(v);
      $("#egDetail").scrollIntoView({behavior:"smooth", block:"start"}); };
    $("#egListe").querySelectorAll("[data-eg]").forEach(b=>b.onclick=()=>aufschlagen(b.dataset.eg));
    /* Bei 390px steht die Tabelle in einer Rollfläche, und „Ansehen"
       liegt rechts ausserhalb. Die ganze Zeile öffnet deshalb dasselbe —
       der Knopf bleibt für die Maus und für die Tastatur (Jagd nach
       Runde 18 · B). */
    $("#egListe").querySelectorAll("[data-egzeile]").forEach(tr=>tr.onclick=e=>{
      if(e.target.closest("button")) return;
      /* Wer eine Notiz markiert hat, wollte sie markieren, nicht öffnen
         (zweite Jagd · C). */
      const w=window.getSelection && window.getSelection();
      if(w && !w.isCollapsed && String(w).length>1) return;
      aufschlagen(tr.dataset.egzeile); });
    $("#egListe").querySelectorAll("[data-egpdf]").forEach(b=>b.onclick=()=>{
      const v=finde(b.dataset.egpdf); if(v) druckVorgang(v);});
    const offen=EGOFFEN?finde(EGOFFEN):null;
    if(offen) malDetail(offen);
    else if($("#egDetail")) $("#egDetail").innerHTML="";
  }
  function malDetail(v, wohin){
    const ziel = wohin || $("#egDetail");
    if(!ziel) return;
    if(!v){ ziel.innerHTML=""; return; }
    ziel.innerHTML=`<div class="karte" style="margin-top:24px">
      <div class="reihe">
        <div><h3 style="margin:0">${esc(MODUSNAME[v.mode]||v.mode)} · ${esc(deTag(v.tag))}</h3>
          <div class="mini">${vgKopfZeile(v)}</div></div>
        <span class="rechts"></span>
        <button class="b" data-pdf>Als PDF</button>
        <button class="b klein" data-json>Rohdaten</button>
        <button class="b klein" data-zu>Schließen</button></div>
      ${vgFreigabeSatz(v)?`<div class="hinweis warn" style="margin-top:14px">
        ${esc(vgFreigabeSatz(v))}</div>`:""}
      ${v.notiz?`<div class="hinweis" style="margin-top:14px"><b>Notiz:</b> ${esc(v.notiz)}</div>`:""}
      ${vgTafelHtml(v)}
    </div>`;
    /* Die Knöpfe hängen an der Karte, die gerade gebaut wurde — nicht an
       einer Kennung, die es zweimal geben kann. */
    ziel.querySelector("[data-zu]").onclick=()=>{
      if(wohin) EGFREMD=null; else EGOFFEN=null;
      ziel.innerHTML=""; };
    ziel.querySelector("[data-pdf]").onclick=()=>druckVorgang(v);
    ziel.querySelector("[data-json]").onclick=()=>hol(`vorgang_${v.mode}_${v.tag}.json`,
      JSON.stringify(v.roh,null,2), "application/json");
  }
}

/* ════════════ 7f · Speicher ════════════
   Jede Fassung, die je durchgelaufen ist — vollständig, nicht als
   Zusammenfassung. Wer wissen will, warum vor drei Wochen zwölf Flaschen
   gebucht wurden, braucht die Zeilen, nicht die Summe. */
let SPFILTER={modus:"", wer:"", q:""}, SPOFFEN=null;
function vSpeicher(m){
  const alle=VORGAENGE.slice().reverse();
  const leute=Array.from(new Set(alle.map(v=>v.name).filter(Boolean))).sort();

  m.innerHTML=`<section><h2>Speicher</h2>
    <div class="unter">${alle.length} Vorgänge aus ${esc(QUELLE)}.
    ${QUELLE==="Lokal"?"Lokal hält die App die letzten 30 — am Server fällt dieser Deckel weg.":""}</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<input type="text" id="spQ" placeholder="Name, Notiz oder Datum" value="${esc(SPFILTER.q)}" style="width:250px">
    <select id="spM"><option value="">Alle Vorgänge</option>
      ${Object.keys(MODUSNAME).map(k=>`<option value="${k}"${SPFILTER.modus===k?" selected":""}>${MODUSNAME[k]}</option>`).join("")}</select>
    <select id="spW"><option value="">Alle Personen</option>
      ${leute.map(n=>`<option value="${esc(n)}"${SPFILTER.wer===n?" selected":""}>${esc(n)}</option>`).join("")}</select>
    <span class="rechts"></span><button class="b klein" id="spCsv">Alles als CSV</button>`;
  m.appendChild(w);
  $("#spQ").oninput=e=>{SPFILTER.q=e.target.value; malSpeicher();};
  $("#spM").onchange=e=>{SPFILTER.modus=e.target.value; malSpeicher();};
  $("#spW").onchange=e=>{SPFILTER.wer=e.target.value; malSpeicher();};
  $("#spCsv").onclick=()=>csvSpeicher(gefiltert());

  const liste=document.createElement("section"); liste.id="spListe"; m.appendChild(liste);
  const detail=document.createElement("section"); detail.id="spDetail"; m.appendChild(detail);
  malSpeicher();

  function gefiltert(){
    const q=SPFILTER.q.trim().toLowerCase();
    return alle.filter(v=>
      (!SPFILTER.modus || v.mode===SPFILTER.modus) &&
      (!SPFILTER.wer   || v.name===SPFILTER.wer) &&
      (!q || (v.name+" "+v.notiz+" "+v.tag+" "+deTag(v.tag)).toLowerCase().includes(q)));
  }
  function malSpeicher(){
    const L=gefiltert();
    $("#spListe").innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Betriebstag</th><th>Vorgang</th><th>Wer</th><th class="r">Wein</th><th class="r">Getränke</th>
      <th>Zustand</th><th></th></tr></thead><tbody>
      ${L.length?L.map((v,i)=>`<tr>
        <td>${esc(deTag(v.tag))}</td><td>${esc(MODUSNAME[v.mode]||v.mode)}</td>
        <td>${esc(v.name||"—")}</td>
        <td class="r">${v.flWein||'<span class="dim">—</span>'}</td>

      ${tab("Aus dem Getränkelager geholt", v.getr, "Flaschen")}

        ?`<div class="leer">Dieser Vorgang hat keine Mengen bewegt.</div>`:""}

  }
}
function csvSpeicher(L){
  const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  const R=[["Betriebstag","Vorgang","Wer","Position","Art","Menge","Notiz"].map(e).join(";")];
  L.forEach(v=>{
    const zeile=(o,art)=>Object.keys(o||{}).filter(k=>+o[k]).forEach(k=>{
      const w=byId(k);
      R.push([v.tag, MODUSNAME[v.mode]||v.mode, v.name,
        w?w.winzer+" "+w.wein:GN(k), art, o[k], v.notiz].map(e).join(";"));});
    zeile(v.wein,"Weinkeller"); zeile(v.getr,"Getränkelager");
    zeile(v.eingang,"Wareneingang"); if(v.zaehlung) zeile(v.zaehlung,"Zählung");
  });
  hol("speicher.csv","\uFEFF"+R.join("\r\n"),"text/csv");
}

      <div id="rzZut"></div>

/* Hinweis zum Formular weiter unten: Der Satz unter „Neuen Menschen

function vTeam(m){

    <div class="karte">

      <div class="reihe" style="margin-bottom:12px">

        <select id="nRolle">${Object.keys(ROLLNAME).map(k=>

        <span class="deutung" id="nHint">${esc(RECHTETEXT.service)}</span></div>
      <div class="reihe" style="margin-bottom:16px">
        <label style="width:140px">Code</label>
        <input type="text" id="nCode" placeholder="${PIN_LAENGE} Ziffern" maxlength="${PIN_LAENGE}"
          inputmode="numeric" style="width:180px">
        <button class="b klein" id="nWuerfel">Vorschlagen</button></div>
      <!-- Was der Server zurückweist, steht hier und BLEIBT stehen, bis
           der nächste Versuch läuft. Im Toast war es nach 2,2 s weg —
           gerade die Meldung „diesen Namen gibt es schon" braucht man
           länger als das (qa-guardian, zweite Schlusskontrolle).
           BERICHTIGT (qa-guardian, dritte Schlusskontrolle): Der Kasten
           stand UNTER dem Knopf — gemessen bei 1280 px auf y=735 gegen
           den Knopf bei y=687, während Log und Morgenbrief „über dem
           Formular" behaupteten. Er steht jetzt wirklich darüber. -->
      <div id="nFehler" hidden></div>
      <div class="reihe">
        <button class="b stark" id="nAdd">Speichern</button>
        <span class="mini rechts">Der Code erscheint danach nirgends mehr. Jetzt notieren.</span></div>
    </div>`;
  m.appendChild(s);

  $("#nRolle").onchange=e=>{ $("#nHint").textContent=RECHTETEXT[e.target.value]||""; };
  $("#nWuerfel").onclick=()=>{ $("#nCode").value=wuerfelPin(); };

  let LEUTE=[];
  /* Ob die Liste, die dasteht, wirklich vom Server kam. Nur dann ist ihr
     Fehlen ein Beweis: Steht der Mensch NICHT in einer frischen Liste,
     gibt es seine Zeile nicht, und ein Gedaechtniseintrag dazu ist Schrott
     (dreizehnte Jagd Runde 16 · C — vorher kam man da nur ueber
     „abmelden" wieder heraus). */
  let listeFrisch=false;
  /* Das Gedaechtnis `nKennung` liegt auf Modulebene (siehe dort) — die
     Kennung haengt am MENSCHEN, nicht am Formularinhalt, nicht am
     einzelnen Anlauf und nicht an dieser Ansicht. */
  const male=()=>{
    $("#teamL").innerHTML=LEUTE.length?`<div class="tabhuelle"><table><thead><tr>
      <th>Name</th><th style="width:200px">Rolle</th><th>Sieht</th><th style="width:120px">Zustand</th>
      <th style="width:150px">Code</th>
      </tr></thead><tbody>${LEUTE.map(p=>`<tr>
        <td><b>${esc(p.name)}</b></td>
        <td><select class="klein" data-rp="${esc(p.id)}">${Object.keys(ROLLNAME).map(k=>
          `<option value="${k}"${p.rolle===k?" selected":""}>${ROLLNAME[k]}</option>`).join("")}</select></td>
        <td class="deutung">${esc(RECHTETEXT[p.rolle]||"")}</td>
        <td><button class="b klein" data-ap="${esc(p.id)}">${p.aktiv?"Sperren":"Freigeben"}</button></td>
        <td><button class="b klein" data-pin="${esc(p.id)}">PIN zurücksetzen</button></td>

    $("#teamL").querySelectorAll("[data-rp]").forEach(sel=>sel.onchange=()=>{
      const p=LEUTE.find(x=>x.id===sel.dataset.rp);
      sende({id:p.id,name:p.name,rolle:sel.value,aktiv:p.aktiv});});
    /* Die Sperre trifft sonst auch die eigene Person — ein Klick, und die
       nächste Anfrage kommt als 401 zurück. Ist man die einzige Leitung im
       Haus, kommt danach NIEMAND mehr hinein: `ich()` im Worker findet nur
       `aktiv = 1`, und den Weg zurück gibt es nur über die D1-Konsole.
       BERICHTIGUNG (Jagd 15): Hier stand „Der Worker weist beides
       zusätzlich ab". Das ist falsch und war es immer — `personSchreiben()`
       bekommt gar nicht mit, WER schreibt, und kann es deshalb nicht
       prüfen. Der Riegel liegt allein in diesem Browser. Er gehört in den
       Worker; das steht als eigener Punkt in review/BACKLOG.md und ist
       nicht Sache dieser Runde. */
    $("#teamL").querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
      const p=LEUTE.find(x=>x.id===b.dataset.ap);
      if(p.aktiv && ICH && p.name===ICH.name)
        return toast("Dich selbst kannst du nicht sperren — sonst kommst du nicht mehr herein.");
      if(p.aktiv && p.rolle==="leitung"
         && LEUTE.filter(x=>x.aktiv && x.rolle==="leitung").length<2)
        return toast("Das ist die einzige freigegebene Leitung. Erst eine zweite anlegen.");
      sende({id:p.id,name:p.name,rolle:p.rolle,aktiv:p.aktiv?0:1});});
    /* Runde 15 · PIN zurücksetzen. Der neue Code wird vom Server gewürfelt
       und kommt GENAU EINMAL zurück — er steht nirgends sonst, auch nicht
       in der Datenbank (dort liegt nur die Prüfsumme). Deshalb bleibt er
       stehen, bis die Leitung ihn wegklickt, und wird nicht in einem Toast
       nach drei Sekunden weggewischt. */
    $("#teamL").querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{
      const p=LEUTE.find(x=>x.id===b.dataset.pin);
      if(!p)return;
      /* Den eigenen Code zurückzusetzen ist erlaubt — die offene Sitzung
         hängt am Keks, nicht am Code, man fliegt also nicht heraus. Wer
         den neuen aber wegklickt, ohne ihn zu notieren, kommt beim
         nächsten Anmelden nicht mehr herein. Deshalb steht das dabei. */
      const ichSelbst = ICH && p.name === ICH.name;
      if(!confirm("Neuen Code für "+p.name+" würfeln?\n\n"+
        "Der alte gilt danach nicht mehr. Der neue ist nur EINMAL zu sehen."+
        (ichSelbst ? "\n\nDas bist DU. Notiere ihn, sonst kommst du beim "+
          "nächsten Anmelden nicht mehr herein." : "")))return;
      b.disabled=true;
      /* B4 (Jagd 15) · Bis Runde 15 würfelte der Server. Brach die
         Verbindung NACH dem UPDATE ab, war der Code vergeben und niemand
         hatte ihn je gesehen: die Person ausgesperrt, auf dem Schirm nur
         „Keine Verbindung". Jetzt würfelt diese Seite ihn selbst
         (`wuerfelPin()`, dieselbe Gleichverteilung wie im Worker) und
         schickt ihn mit. Sie kennt ihn damit, bevor die Antwort unterwegs
         ist — bricht sie ab, steht er trotzdem da, samt dem einen Satz,
         der dann zählt. Geprüft wird er im Worker wie jeder vergebene
         Code: Form und Dopplung. */
      let vorschlag=null;
      try{ vorschlag=wuerfelPin(); }catch(e){ vorschlag=null; }
      try{
        const r=await kurz("/api/person/pin",{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify(vorschlag?{id:p.id,code:vorschlag}:{id:p.id})});
        const j=r.daten||{};
        if(!r.ok){ b.disabled=false; return toast(j.fehler||"Nicht zurückgesetzt"); }
        zeigePin(p.name, j.pin||vorschlag);
      }catch(e){
        if(vorschlag) zeigePin(p.name, vorschlag,
          "Die Verbindung brach ab. Ist der Code angekommen, ist es DIESER. "
         +"Geht er beim Anmelden nicht, einfach noch einmal zurücksetzen.");
        else toast("PIN wurde evtl. geändert – bitte erneut zurücksetzen");
      }
      b.disabled=false;
    });
  };
  /* Der neue Code, gross und genau einmal. Kein Speichern, kein zweites
     Anzeigen, kein Log — wer ihn hier nicht notiert, würfelt neu. */
  const zeigePin=(name,pin,unsicher)=>{
    const w=document.createElement("div");
    w.className="pinzeig";
    w.innerHTML=`<div class="pinzeig-karte" role="dialog" aria-modal="true"
        aria-label="Neuer Code für ${esc(name)}">
      <p class="pinzeig-wer">Neuer Code für <b>${esc(name)}</b></p>
      <p class="pinzeig-zahl">${esc(pin)}</p>
      <p class="pinzeig-warn">${unsicher ? esc(unsicher) : `Nur jetzt zu sehen. Notiere ihn und gib ihn
        weiter — er lässt sich nicht noch einmal anzeigen.`}</p>
      <button class="b stark">Notiert</button></div>`;
    w.querySelector("button").onclick=()=>w.remove();
    document.body.appendChild(w);
    w.querySelector("button").focus();
  };
  const hole=async()=>{
    try{
      const r=await kurz("/api/personen");
      if(r.status===403){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Nur die Leitung darf Mitarbeiter verwalten.</div>`; return; }
      /* 401 ist keine ausbleibende Antwort, sondern eine Antwort: die
         Sitzung ist abgelaufen. Beides in einen Satz zu werfen, schickt
         die Leitung auf die Suche nach einem Serverfehler, den es nicht
         gibt. */
      if(r.status===401){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Die Anmeldung gilt nicht mehr. Im Fassungstool
         neu anmelden, dann diese Seite neu laden.</div>`; return; }
      if(!r.ok){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Der Server antwortet nicht. Mitarbeiter lassen sich
         nur mit Verbindung pflegen.</div>`; return; }
      LEUTE=((r.daten||{}).personen)||[]; listeFrisch=true;
      kennungHeilen(LEUTE); male();
    }catch(e){
      /* Steht schon eine Liste, bleibt sie stehen: Nach einem geglueckten
         Speichern lief `hole()` in die Frist und ueberschrieb die Liste
         mit „Keine Verbindung zum Server." — waehrend der Toast daneben
         „Gespeichert" sagte (sechste Jagd Runde 16 · C). Zwei Saetze zur
         selben Lage, einer davon falsch. */
      if(LEUTE.length){ toast("Die Liste ist vielleicht nicht aktuell"); return; }
      $("#teamL").innerHTML=
      `<div class="hinweis warn">Keine Verbindung zum Server.</div>`; }
  };
  /* BERICHTIGUNG (vierte Jagd Runde 16 · B): Der dritte schreibende Weg
     des Backoffice hatte weder Frist noch Rueckmeldung — nacktes `fetch`
     und danach `await r.json()`. Schweigt der Server, passierte gar
     nichts Sichtbares: kein Toast, kein gesperrter Knopf, und die Felder
     waren beim Aufrufer schon geleert. Wer daraufhin noch einmal tippt,
     schickt OHNE `id`; der Worker blockt nur denselben Code (409) — mit
     einem anderen entsteht die Person ZWEIMAL. Jetzt mit Frist, und der
     Aufrufer erfaehrt, ob es geklappt hat. */
  /* Ein Satz, den man lesen und dem man folgen muss, gehört nicht in
     eine Sprechblase, die nach Sekunden verschwindet. Er steht über dem
     Formular, bis der nächste Versuch läuft. */
  const formFehler=(txt)=>{
    const f=$("#nFehler"); if(!f)return;
    if(!txt){ f.hidden=true; f.innerHTML=""; return; }
    f.hidden=false;
    f.innerHTML=`<div class="hinweis warn" style="margin:var(--space-3) 0">${esc(txt)}</div>`;
  };
  const sende=async(body)=>{
    formFehler("");
    try{
      const r=await kurz("/api/personen",{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      const j=r.daten||{};
      if(!r.ok){
        /* Der Grund gehoert in BEIDE: `#nFehler` steht am Formular, aber
           die Absagen der LISTE (Rolle, Sperren) haben nichts in der
           Naehe — bei 390 px liegt das Formular 1253 px weiter unten
           (zehnte Jagd Runde 16 · C). Der Toast traegt den Grund
           deshalb wieder; lesbar ist er jetzt, er bleibt nach
           Textlaenge stehen. */
        formFehler(j.fehler||"Nicht gespeichert"); toast(j.fehler||"Nicht gespeichert");
        /* Der Server hat GEANTWORTET — er ist also erreichbar, und die
           Liste darunter ist vermutlich veraltet. Genau daher kommt die
           häufigste Absage: „Diesen Namen gibt es schon", während die
           Zeile auf dem Schirm fehlt und der Satz zu einem Knopf schickt
           („PIN zurücksetzen"), den man dort nicht sieht (neunte Jagd
           Runde 16 · B). Also nachladen. */
        hole();
        return false; }
      toast("Gespeichert"); hole(); return true;
    }catch(e){
      formFehler("Keine Verbindung zum Server. Die Eingabe steht noch da — "
        +"mit Empfang noch einmal auf „Speichern“ drücken. Derselbe Mensch "
        +"bekommt dabei dieselbe Zeile, es entsteht kein zweiter Eintrag.");
      toast("Keine Verbindung — bitte noch einmal versuchen"); return false; }
  };
  $("#nAdd").onclick=async()=>{
    const nm=$("#nName").value.trim(), code=$("#nCode").value.trim();
    if(!nm) return toast("Ohne Namen geht es nicht");
    if(!PIN_MUSTER.test(code)) return toast("Der Code hat "+PIN_LAENGE+" Ziffern");
    const da=LEUTE.find(p=>p.name.toLowerCase()===nm.toLowerCase());
    const rolle=$("#nRolle").value;
    /* BERICHTIGUNG (fuenfte Jagd Runde 16 · B): Der zweite Griff nach
       einer abgelaufenen Frist legte die Person ein ZWEITES Mal an.
       Gemessen: Der erste Ruf kam beim Server an, die Antwort erreichte
       das Backoffice nicht; `hole()` lief nicht, `LEUTE` blieb alt, also
       fand `find()` nichts und `id` blieb `undefined` — und
       `personSchreiben()` bindet `id || crypto.randomUUID()`. Am echten
       Worker durchgespielt: zweimal „Asad Hussain", beide aktiv. Es gibt
       kein Loeschen, nur „aktiv" umschalten, und keine Sicherung
       (Projektanleitung Paragraf 8). Die 8-s-Frist aus der vierten Jagd
       machte das Fenster dafuer weiter auf, nicht schmaler.

       Der Client bringt jetzt seine eigene Kennung mit — derselbe
       Gedanke wie beim Vorgang (`<modus>_<tag>` in index.html): Zweimal
       dasselbe Paket schreibt dieselbe Zeile, weil
       `ON CONFLICT(id) DO UPDATE` greift. Die Kennung bleibt liegen,
       solange derselbe Mensch mit demselben Code gemeint ist, und faellt
       erst, wenn es angekommen ist. */
    /* BERICHTIGUNG (sechste Jagd Runde 16): Die Kennung hing am
       FORMULARINHALT — Name, Code und Rolle zusammen. Damit war die
       Dublette nur verschoben, nicht geschlossen, auf zwei Wegen, beide
       am echten Worker nachgestellt:

       · Erster Anlauf kommt an, die Antwort geht verloren. Die Leitung
         greift zum Knopf „Vorschlagen" daneben und probiert es mit einem
         NEUEN Code — `code` ist anders, also gab es eine neue Kennung.
         Ergebnis: zwei aktive Zeilen, gleicher Name, ZWEI gueltige
         Anmeldecodes. Danach wirkt „Sperren" nicht mehr: Die Leitung
         sperrt eine der beiden gleich aussehenden Zeilen, und der Mensch
         kommt mit dem anderen Code weiter herein. Der Worker schickt sie
         sogar dorthin — auf denselben Code antwortet er mit 409 und dem
         Rat, einen anderen zu waehlen.
       · Speichern glueckt, `hole()` laeuft danach in die Frist. `LEUTE`
         bleibt alt, die Kennung war auf `null` gesetzt — wer denselben
         Menschen noch einmal tippt, legt ihn ein zweites Mal an.

       Gemeinsame Wurzel: Sobald `LEUTE` veraltet ist — und genau dann
       braucht man die Kennung —, kann der Client nicht mehr wissen, ob
       er schon geschrieben hat. Sie haengt deshalb jetzt am NAMEN und
       ueberlebt den geglueckten Anlauf: In dieser Sitzung bekommt
       derselbe Mensch dieselbe Zeile, was immer dazwischen passiert. */
    /* BERICHTIGUNG (zehnte Jagd Runde 16 · A): Hier wurde bei einem
       Treffer in `LEUTE` dessen `id` gemerkt — die Kennung der GEFUNDENEN
       Person ging ins Paket. Damit war der Namenswächter im Worker
       stumm: `namensgleich.some(r => r.id === id)` ist wahr, also greift
       der 409 nicht, und `ON CONFLICT(id) DO UPDATE` schreibt die
       bestehende Zeile um. Am echten Worker gemessen, was dabei
       geschieht: der bisherige Code der Person ist danach tot (Anmeldung
       401, und niemand hat es ihr gesagt), die Rolle fällt auf den Wert
       des Auswahlfelds zurück — das steht immer auf „Service", weil es
       nie vorbelegt wird —, `aktiv:1` hebt nebenbei eine Sperre auf, und
       die einzige Leitung stuft sich damit selbst ab: `GET
       /api/personen` antwortet danach 403, auch mit dem alten Keks, und
       zurück geht es nur über die D1-Konsole. Es gibt kein Löschen und
       keine Sicherung (Projektanleitung §8).

       Dieses Formular legt AN. Steht der Mensch schon in der Liste, wird
       hier nichts geschrieben — Rolle ändern, sperren und „PIN
       zurücksetzen" stehen in seiner Zeile oben, mit den
       Selbstschutz-Abfragen, die es hier nicht gibt.

       Die Kennung bleibt, wofür sie gebaut wurde: Sie merkt sich, welche
       `id` DIESES Fenster einem Namen gegeben hat, als es ihn anlegte.
       Ist die Liste veraltet (der Fall der fünften Jagd), geht dieselbe
       `id` noch einmal hinaus und schreibt dieselbe Zeile — kein
       zweiter Eintrag. Ist die Liste frisch und der Mensch steht darin,
       fängt ihn diese Absage; ist sie veraltet und er steht doch schon
       am Server, fängt ihn der Wächter dort. */
    const schl=nm.toLowerCase();
    /* Zwei Gründe, hier gar nicht erst zu schreiben, und sie decken
       zusammen auch die Lage ab, in der die Liste schweigt (elfte Jagd
       Runde 16 · A): der Mensch steht in der Liste — ODER dieses Fenster
       hat ihn schon einmal angelegt und der Server hat das bestätigt. */
    let merk=kennungLesen(schl);
    /* Eine FRISCHE Liste ohne diesen Menschen ist der Gegenbeweis: Dann
       gibt es seine Zeile nicht, und was das Gedaechtnis dazu sagt, ist
       veraltet (dreizehnte Jagd Runde 16 · C). Der Eintrag geht weg, und
       das Anlegen laeuft wie bei einem neuen Menschen. */
    if(merk && listeFrisch && !da){ delete nKennung[schl]; kennungSchreiben(); merk=null; }
    if(da || (merk && merk.ok)){
      const wer=da?da.name:nm;
      /* Kein Satz, der mehr behauptet, als hier gewusst wird: Das
         Gedächtnis sagt nur, dass DIESES Fenster den Namen schon einmal
         mit Erfolg abgeschickt hat — ob die Zeile von hier stammt, weiss
         es nicht (dreizehnte Jagd Runde 16 · C). */
      formFehler("„"+wer+"“ ist schon angelegt"
        +". Dieses Formular legt nur NEUE Menschen an. Die Rolle änderst du in der "
        +"Zeile oben in der Liste, einen neuen Code gibt es dort über „PIN "
        +"zurücksetzen“. Wer wirklich so heißt wie jemand im Haus, braucht einen "
        +"unterscheidenden Namen."
        +(da?"":" Steht die Zeile oben nicht, kommt gerade die Liste nicht durch — "
            +"mit Verbindung neu laden."));
      toast("„"+wer+"“ ist schon angelegt");
      return;
    }
    const kennung=merk?merk.id:kennungMerken(schl,uuid(),false);
    const b=$("#nAdd"); b.disabled=true; const wort=b.textContent;
    b.textContent="speichert \u2026";
    const gut=await sende({id:kennung, name:nm, rolle, code, aktiv:1});
    b.disabled=false; b.textContent=wort;
    /* Erst die BESTAETIGUNG des Servers macht aus dem Anlauf eine Zeile.
       Ab hier darf dieselbe Kennung nichts mehr überschreiben. */
    if(gut){ kennungMerken(schl,kennung,true);
             $("#nName").value=""; $("#nCode").value=""; }
  };
  hole();
}

/* ════════════ 8 · Aufbau ════════════ */
const ANSICHT={heute:vHeute, abgleich:vAbgleich, import:vImport, bestand:vBestand,
  bestellen:vBestellen, getraenke:vGetraenke, zaehlliste:vZaehlliste,
  eingaenge:vEingaenge, speicher:vSpeicher,
  zuordnung:vZuordnung, rezepte:vRezepte, team:vTeam, einst:vEinst};

/* Die Erklärtexte sind gut geschrieben, stehen aber dauerhaft über jeder
   Tabelle und werden ab dem dritten Mal überlesen. Erste Zeile bleibt,
   der Rest geht hinter einen Textknopf — greift bei jeder Ansicht, deren
   Erklärung länger als ein Satz ist. */
function kuerzeUnter(){
  document.querySelectorAll(".unter").forEach(u=>{
    if(u.dataset.kurz)return;
    const t=u.innerHTML.trim(), i=t.indexOf(". ");
    if(i<0||t.length<150)return;
    u.dataset.kurz="1";
    u.innerHTML=t.slice(0,i+1)+
      ' <button class="b klein leise" data-mehr>Warum so gerechnet?</button>'+
      '<span class="mehr">'+t.slice(i+2)+'</span>';
    u.querySelector("[data-mehr]").onclick=()=>u.classList.toggle("offen");
  });
}

function zeichne(){
  zeichneNav();
  const m=$("#inhalt"); m.innerHTML="";
  (ANSICHT[SEITE]||vHeute)(m);
  quellBanner(m);
  kuerzeUnter();
  const qk=quellSchluessel(), ql=QUELLLAGE[qk];
  $("#tQuelle").textContent=qk==="Leer"?"Server · leer":QUELLE;
  /* Der Punkt sagt nur die Richtung. Was er bedeutet, steht in der
     Quellzeile über dem Inhalt — sie ist auch am Handy da, der Chip nicht. */
  $("#cQuelle").className="chip"+(!ql?"":ql[0]==="warn"?" warn":ql[0]==="bad"?" bad":" aus");
  $("#cQuelle").title=ql?ql[1]:"Die Zahlen kommen vom Server.";
  zeichneZeitwahl();
  /* Runde 19 · Der Chip zeigte den jüngsten BETRIEBSTAG mit Daten und
     stand dabei auf Grün. Eine seit morgens offene Seite sagte damit um
     vier Uhr nachmittags immer noch „Do., 17.09." mit grünem Punkt,
     obwohl die Zahlen darunter acht Stunden alt waren. Gefragt ist aber
     nicht, welcher Tag gemeint ist — das steht in jeder Überschrift —,
     sondern wie alt das ist, was man gerade ansieht. */
  $("#tStand").textContent=standSatz();
  $("#cStand").classList.toggle("aus", STAND_ZEIT && (Date.now()-STAND_ZEIT)>15*60000);
}

/* Wann die Daten zuletzt geholt wurden. */
let STAND_ZEIT=0;
function standSatz(){
  if(!STAND_ZEIT) return "noch nicht geholt";
  const min=Math.floor((Date.now()-STAND_ZEIT)/60000);
  if(min<1) return "gerade geholt";
  if(min<60) return "geholt vor "+min+" Min.";
  const st=Math.floor(min/60);
  return "geholt vor "+st+" Std.";
}
/* Die Anzeige altert von selbst, auch wenn niemand etwas anklickt —
   sonst steht „gerade geholt" noch um Mitternacht da. */
setInterval(()=>{ const e=$("#tStand"); if(!e) return;
  e.textContent=standSatz();
  $("#cStand").classList.toggle("aus", STAND_ZEIT && (Date.now()-STAND_ZEIT)>15*60000);
}, 30000);

/* ── Zeitraum ────────────────────────────────────────────────────────
   Vier feste Fenster, dieselben, die das Auswahlfeld unter
   „Verkauf ↔ Fassung" schon kannte. Sie stehen jetzt im Kopf, weil
   `SPANNE` global wirkt: auf die Übersicht, auf den Abgleich, auf die
   Zahl neben dem Menüpunkt und auf die Zählliste. Eine Einstellung, die
   vier Seiten verändert, gehört dorthin, wo man sie auf allen vier
   sieht. */
function zeichneZeitwahl(){
  const e=$("#zeitwahl"); if(!e) return;
  e.innerHTML=SPANNEN.map(x=>
    `<button type="button" class="${SPANNE===x.n?"on":""}" data-spanne="${x.n}"
       aria-pressed="${SPANNE===x.n}">${x.t}</button>`).join("");
  e.querySelectorAll("[data-spanne]").forEach(b=>b.onclick=()=>{
    SPANNE=+b.dataset.spanne; merkeSpanne(); zeichne(); });
}
/* Der gewählte Zeitraum überlebt das Neuladen. Bis Runde 19 stand nach
   jedem Neuladen wieder 7, egal was jemand eingestellt hatte. */
function merkeSpanne(){ try{ schreib(K_SPANNE, SPANNE); }catch(e){} }

$("#bNeu").onclick=async()=>{
  await ladeDaten(); await Promise.all([ladeBerichte(), ladeZuordnung(), ladeNotizen()]);
  STAND_ZEIT=Date.now();
  zeichne(); toast("Aktualisiert"); };
$("#bFass").onclick=()=>{ location.href="index.html"; };

/* Unter 900px liegt die Navigation als Blatt über dem Inhalt. Sie schließt
   sich nach der Wahl, bei einem Tipp daneben und mit Escape. */
$("#bNav").onclick=e=>{ e.stopPropagation(); document.body.classList.toggle("navoffen"); };
document.addEventListener("click",e=>{
  if(!document.body.classList.contains("navoffen"))return;
  if(e.target.closest("nav.seite")||e.target.closest("#bNav"))return;
  document.body.classList.remove("navoffen");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.body.classList.remove("navoffen");
});

/* ═══ B4 (Runde 18) · Wischen von links öffnet die Navigation ═══
   Am iPad las Safari denselben Wisch als „zurück" und sprang aus dem
   Backoffice heraus — meist ins Fassungstool, die Seite davor. Die Geste
   gehört aber dieser Seite: Unter 900px liegt die Navigation als Blatt
   links, genau dort, wo der Daumen ansetzt.

   Wie die Zurück-Geste genommen wird: Safari entscheidet früh, ob ein
   Randwisch ihm gehört. `preventDefault()` auf der ERSTEN waagrechten
   Bewegung nimmt sie ihm — deshalb muss der Horcher `passive:false`
   sein. Er greift nur in zwei Lagen, sonst nie:
     · Der Finger setzt in den linken 32px auf und die Navigation ist zu.
     · Die Navigation ist offen (dann schliesst ein Wisch nach links sie).
   Senkrechte Bewegungen fallen vorher heraus, damit Scrollen unberührt
   bleibt. `touch-action:manipulation` (Gestaltungsschicht) bleibt, wie
   es ist; `none` würde den Zwei-Finger-Zoom mitnehmen. */
(function randwisch(){
  /* NACHTRICHTIGUNG (Jagd nach Runde 18 · B): Die Randzone war 32px
     breit, der Inhalt beginnt aber bei 16px. Ein Wisch über dem Suchfeld
     oder über einer waagrecht rollenden Tabelle gehörte damit der
     Navigation statt dem Bedienteil darunter — und in den Eingängen
     stehen „Ansehen"/„PDF" bei 390px erst nach dem Rollen. Drei
     Berichtigungen: schmalere Zone, ein ausdrückliches Nein für alles,
     was die Geste selbst braucht, und `preventDefault` nur noch dort,
     wo auch wirklich etwas geschieht. */
  const RAND=20, SCHWELLE=48, TOTZONE=10;
  let x0=null, y0=0, aktiv=false, hin=0, amRand=false;
  const offen=()=>document.body.classList.contains("navoffen");
  /* Was die waagrechte Geste selbst braucht, behält sie. Dort bleibt es
     beim Verhalten des Browsers — auch beim Zurückblättern. */
  /* NACHTRICHTIGUNG (zweite Jagd · C): Der Inhalt beginnt bei 16px, die
     Randzone endet bei 20px — in diesem 4px-Streifen gewinnt die
     Randgeste, sonst gäbe es ein Loch, durch das Safari zurückblättert.
     Ein Eingabefeld behält die Geste auch dort: dort wird gezogen, um
     Text zu wählen, und das ist keine Navigation. */
  const eigenerBedarf=(el,amRand)=>{
    if(!el || !el.closest) return false;
    /* Am Rand gewinnt IMMER die Randgeste, auch über einem Eingabefeld:
       Sonst bliebe genau dort das Loch offen, das gerade geschlossen
       wurde (dritte Jagd · C). Vier Pixel Ziehweg weniger sind der
       kleinere Verlust als eine Seite, die sich verabschiedet. */
    if(amRand) return false;
    if(el.closest("input,textarea,select,[contenteditable]")) return true;
    const h=el.closest(".tabhuelle");
    return !!(h && h.scrollWidth > h.clientWidth+4);
  };

  addEventListener("touchstart", e=>{
    x0=null; aktiv=false; hin=0; amRand=false;
    if(e.touches.length!==1) return;
    const t=e.touches[0];
    amRand = t.clientX<=RAND;
    if(!(amRand || offen())) return;
    if(eigenerBedarf(t.target, amRand)) return;
    x0=t.clientX; y0=t.clientY;
  }, {passive:true});

  addEventListener("touchmove", e=>{
    if(x0===null || e.touches.length!==1) return;
    const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(!aktiv){
      if(Math.abs(dx)<TOTZONE && Math.abs(dy)<TOTZONE) return;
      /* Senkrecht: das ist Scrollen, und es bleibt Scrollen. */
      if(Math.abs(dy)>=Math.abs(dx)){ x0=null; return; }
      hin=dx>0?1:-1;
      /* Zwei Gründe, die Geste zu behalten: Sie bewirkt etwas
         (aufziehen, wenn zu ist; zuziehen, wenn offen ist) — ODER sie
         beginnt am linken Rand, wo Safari sonst zurückblättert.
         NACHTRICHTIGUNG (zweite Jagd · B): Die erste Fassung dieser
         Zeile liess bei OFFENER Leiste den Randwisch nach rechts los.
         Genau dort liegt der Daumen, wenn die Schublade offen ist, und
         „zurück" heisst hier: aus dem Backoffice heraus. */
      /* Safaris Zurück-Geste am linken Rand ist ein Wisch nach RECHTS.
         Nach links am Rand bewirkt nichts und ist nichts zu schützen —
         das gehört der Seite darunter (dritte Jagd · C). */
      /* NACHTRICHTIGUNG (vierte Jagd · B): Bei OFFENER Leiste liegt das
         Navigationsblatt über den ersten 280px — dort gibt es nichts
         darunter, das die Geste braucht, und der Grund für die schmale
         Zone (der Inhalt beginnt bei 16px) gilt gar nicht. Ab x = 21
         blätterte Safari wieder zurück. Bei offener Leiste zählt deshalb
         die Breite des Blattes als Rand. */
      /* `offsetWidth`, nicht die gerade gemessene Kante: Das Blatt
         fährt ein, und mitten in der Bewegung stünde seine rechte Kante
         noch bei 3 px. */
      const blatt=document.querySelector("nav.seite");
      const schutz = amRand ||
        (offen() && blatt && blatt.offsetWidth && x0<=blatt.offsetWidth);
      const wirkt = (hin>0 && !offen()) || (hin<0 && offen());
      if(!wirkt && !(schutz && hin>0)){ x0=null; return; }
      aktiv=true;
    }
    /* Ab hier gehört die Bewegung dieser Seite. */
    if(e.cancelable) e.preventDefault();
    if(hin>0 && dx>=SCHWELLE){
      document.body.classList.add("navoffen"); x0=null; }
    else if(hin<0 && dx<=-SCHWELLE){
      document.body.classList.remove("navoffen"); x0=null; }
  }, {passive:false});

  const ende=()=>{ x0=null; aktiv=false; };
  addEventListener("touchend", ende, {passive:true});
  addEventListener("touchcancel", ende, {passive:true});
})();

/* Zweite Ansicht im selben Browser: neue Stände kommen von selbst an */
window.addEventListener("storage", e=>{
  if([K_STAND,K_ARCHIV].includes(e.key)){ ladeDaten().then(zeichne); }
});

(async()=>{
  await werBinIch();
  await ladeDaten();
  /* Berichte und Zuordnungen kommen vom Server. Schlägt das fehl (kein
     Netz, keine Sitzung), bleibt die Abschrift im Browser stehen — die
     Seite zeigt dann alte Zahlen, aber keine falschen. */
  await Promise.all([ladeBerichte(), ladeZuordnung(), ladeNotizen()]);
  STAND_ZEIT=Date.now();
  /* Ohne Sitzung und ohne lokale Daten hat diese Seite nichts zu zeigen —
     dann besser eine klare Tür als eine leere Tabelle. */
  if(!ICH && QUELLE==="Nicht angemeldet") return verlangeAnmeldung();
  zeichne();
  if(ICH && ICH.rolle!=="leitung"){
    document.getElementById("cQuelle").insertAdjacentHTML("beforebegin",
      `<span class="chip aus"><span class="pkt"></span>${ICH.rolle}: nur lesen</span>`);
  }
})();
</script>
