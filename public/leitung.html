/* ════════════ 7d · Zählliste ════════════
   Zählen nach Bedarf statt nach Kalender. Wer weiß, welche zwölf
   Positionen auseinanderlaufen, zählt in fünf Minuten das Richtige —
   statt in einer Stunde alles, und das zu selten. */
function zaehlliste(){
  const B=bestand(), V=verbrauch(), t=letzterTag(), A=abgleich(t, SPANNE);
  const dif={}; A.zeilen.forEach(r=>dif[r.id]=r.diff);
  const out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id], d=dif[w.id]||0, pt=V.proTag[w.id]||0, u=unklarMenge(B,w.id);
    let grund=null, rang=9;
    /* Zählen ist hier genau die richtige Maßnahme — sie beendet die
       Ungewissheit über die Lieferung vom Zähltag. Der Grund muss sie aber
       beim Namen nennen: „rechnerisch unter null" allein liest sich wie
       Schwund, und Rang 0 (rot) stellte den Wein vor die echten Minusse.
       Die Zahl selbst bleibt unverändert (Entscheidung Nr. 10). */
    if(b!=null && b<0){
      const satz=u?" — am Zähltag "+num(u)+" Fl. geliefert, nicht mitgerechnet":"";
      /* Deckt die ausgewiesene Lieferung das Minus ganz, ist es keins;
         deckt sie es nur teilweise, bleibt Rang 0 — die Angabe reist
         trotzdem mit. */
      if(u && b+u>=0){ grund=satz.replace(" — ",""); rang=1; }
      else { grund="rechnerisch unter null"+satz; rang=0; }
    }
    else if(Math.abs(d)>=3){ grund="Verkauf und Entnahme "+num(Math.abs(d))+" Fl. auseinander"; rang=1; }
    else if(b!=null && b<6 && pt>0){ grund="unter einer Reihe"; rang=2; }
    if(!grund) return;
    out.push({w, bestand:b, diff:d, grund, rang, unklar:u});
  });
  return out.sort((a,b)=>a.rang-b.rang || Math.abs(b.diff)-Math.abs(a.diff));
}
function vZaehlliste(m){
  const L=zaehlliste();
  m.innerHTML=`<section><h2>Zählliste</h2>
    <div class="unter">Nicht alles, sondern das Auffällige. Positionen unter null, Positionen deren
    Verkauf und Entnahme über ${SPANNE} Tage auseinanderlaufen, und was unter eine Reihe gefallen ist.</div></section>`;
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Nichts zu prüfen — alles im Rahmen.</div></section>`);
    return;
  }
  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Kellerbereich</th><th class="r">Rechnerisch</th><th>Warum zählen</th>
    </tr></thead><tbody>${L.map(r=>`<tr>
      <td><b>${esc(r.w.winzer)}</b> · ${esc(r.w.wein)} <span class="mini">${esc(r.w.jg)}</span></td>
      <td class="deutung">${esc((PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"—")}</td>
      <td class="r">${r.bestand==null?'<span class="dim">—</span>'
        :r.bestand<0?`<b class="neg">${r.bestand}</b>`:`<b>${r.bestand}</b>`}</td>
      <td><span class="pill ${r.rang===0?"p-bad":r.rang===1?"p-warn":"p-grau"}">${esc(r.grund)}</span></td>
    </tr>`).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="zKop">Als Zettel kopieren</button>
      <button class="b" id="zCsv">Als CSV</button>
      <span class="mini rechts">${L.length} von ${WINES.length} Positionen</span></div>`;
  m.appendChild(s);
  $("#zKop").onclick=()=>{
    const txt="Zählliste "+new Date().toLocaleDateString("de-AT")+"\n\n"+
      L.map(r=>`☐  ${(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"?"} · ${r.w.winzer}, ${r.w.wein} ${r.w.jg}   ____ Reihen  ____ einzeln`).join("\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich"));
  };
  $("#zCsv").onclick=()=>{
    const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
    const R=[["Bereich","Winzer","Wein","Jahrgang","Rechnerisch","Grund","Reihen","Einzeln"].map(e).join(";")];
    L.forEach(r=>R.push([(PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"",r.w.winzer,r.w.wein,r.w.jg,
      r.bestand==null?"":r.bestand,r.grund,"",""].map(e).join(";")));
    hol("zaehlliste.csv","\uFEFF"+R.join("\r\n"),"text/csv");
  };
}

/* ════════════ 7e · Speicher ════════════
   Jede Fassung, die je durchgelaufen ist — vollständig, nicht als
   Zusammenfassung. Wer wissen will, warum vor drei Wochen zwölf Flaschen
   gebucht wurden, braucht die Zeilen, nicht die Summe. */
let SPFILTER={modus:"", wer:"", q:""}, SPOFFEN=null;
function vSpeicher(m){
  const alle=VORGAENGE.slice().reverse();
  const leute=Array.from(new Set(alle.map(v=>v.name).filter(Boolean))).sort();

  m.innerHTML=`<section><h2>Speicher</h2>
    <div class="unter">${alle.length} Vorgänge aus ${esc(QUELLE)}.
    ${QUELLE==="Lokal"?"Lokal hält die App die letzten 30 — am Server fällt dieser Deckel weg.":""}</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<input type="text" id="spQ" placeholder="Name, Notiz oder Datum" value="${esc(SPFILTER.q)}" style="width:250px">
    <select id="spM"><option value="">Alle Vorgänge</option>
      ${Object.keys(MODUSNAME).map(k=>`<option value="${k}"${SPFILTER.modus===k?" selected":""}>${MODUSNAME[k]}</option>`).join("")}</select>
    <select id="spW"><option value="">Alle Personen</option>
      ${leute.map(n=>`<option value="${esc(n)}"${SPFILTER.wer===n?" selected":""}>${esc(n)}</option>`).join("")}</select>
    <span class="rechts"></span><button class="b klein" id="spCsv">Alles als CSV</button>`;
  m.appendChild(w);
  $("#spQ").oninput=e=>{SPFILTER.q=e.target.value; malSpeicher();};
  $("#spM").onchange=e=>{SPFILTER.modus=e.target.value; malSpeicher();};
  $("#spW").onchange=e=>{SPFILTER.wer=e.target.value; malSpeicher();};
  $("#spCsv").onclick=()=>csvSpeicher(gefiltert());

  const liste=document.createElement("section"); liste.id="spListe"; m.appendChild(liste);
  const detail=document.createElement("section"); detail.id="spDetail"; m.appendChild(detail);
  malSpeicher();

  function gefiltert(){
    const q=SPFILTER.q.trim().toLowerCase();
    return alle.filter(v=>
      (!SPFILTER.modus || v.mode===SPFILTER.modus) &&
      (!SPFILTER.wer   || v.name===SPFILTER.wer) &&
      (!q || (v.name+" "+v.notiz+" "+v.tag+" "+deTag(v.tag)).toLowerCase().includes(q)));
  }
  function malSpeicher(){
    const L=gefiltert();
    $("#spListe").innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Betriebstag</th><th>Vorgang</th><th>Wer</th><th class="r">Wein</th><th class="r">Getränke</th>
      <th>Zustand</th><th></th></tr></thead><tbody>
      ${L.length?L.map((v,i)=>`<tr>
        <td>${esc(deTag(v.tag))}</td><td>${esc(MODUSNAME[v.mode]||v.mode)}</td>
        <td>${esc(v.name||"—")}</td>
        <td class="r">${v.flWein||'<span class="dim">—</span>'}</td>
        <td class="r">${v.flGetr||'<span class="dim">—</span>'}</td>
        <td>${v.fertig?'<span class="pill p-ok">fertig</span>':'<span class="pill p-warn">läuft</span>'}
            ${v.zaehlung?' <span class="pill p-neu">Zählung</span>':""}</td>
        <td class="r"><button class="b klein" data-oe="${alle.indexOf(v)}">Ansehen</button></td></tr>`).join("")
        :`<tr><td colspan="7" class="leer">Nichts gefunden.</td></tr>`}
      </tbody></table></div>`;
    $("#spListe").querySelectorAll("[data-oe]").forEach(b=>b.onclick=()=>{
      SPOFFEN=alle[+b.dataset.oe]; malDetail();
      $("#spDetail").scrollIntoView({behavior:"smooth", block:"start"});});
    if(SPOFFEN) malDetail();
  }
  function malDetail(){
    const v=SPOFFEN; if(!v) return;
    const nm=id=>{const w=byId(id); return w?w.winzer+" · "+w.wein+" "+w.jg:GN(id);};
    const tab=(titel,o,einheit)=>{
      const ks=Object.keys(o||{}).filter(k=>+o[k]); if(!ks.length) return "";
      return `<h3 style="margin-top:24px">${titel}</h3><div class="tabhuelle"><table><thead><tr>
        <th>Position</th><th class="r">${einheit}</th></tr></thead><tbody>
        ${ks.sort((a,b)=>o[b]-o[a]).map(k=>`<tr><td>${esc(nm(k))}</td><td class="r"><b>${num(o[k])}</b></td></tr>`).join("")}
        <tr class="zwt"><td>Summe</td><td class="r">${num(summe(o))}</td></tr></tbody></table></div>`;
    };
    $("#spDetail").innerHTML=`<div class="karte" style="margin-top:24px">
      <div class="reihe">
        <div><h3 style="margin:0">${esc(MODUSNAME[v.mode]||v.mode)} · ${esc(deTag(v.tag))}</h3>
          <div class="mini">${esc(v.name||"ohne Namen")}${v.ts?" · abgelegt "+esc(new Date(v.ts).toLocaleString("de-AT")):""}</div></div>
        <span class="rechts"></span>
        <button class="b klein" id="spJson">Rohdaten</button>
        <button class="b klein" id="spZu">Schließen</button></div>
      ${v.notiz?`<div class="hinweis" style="margin-top:14px">${esc(v.notiz)}</div>`:""}
      ${v.zaehlung?`<div class="hinweis" style="margin-top:14px">Diese Zählung ist die Basis aller
        Bestände danach. ${Object.keys(v.zaehlung).length} Positionen, ${summe(v.zaehlung)} Flaschen.</div>`:""}
      ${tab("Aus dem Weinkeller geholt", v.wein, "Flaschen")}
      ${tab("Aus dem Getränkelager geholt", v.getr, "Flaschen")}
      ${tab("Wareneingang", v.eingang, "Flaschen")}
      ${v.zaehlung?tab("Gezählter Bestand", v.zaehlung, "Flaschen"):""}
      ${(!summe(v.wein)&&!summe(v.getr)&&!summe(v.eingang)&&!v.zaehlung)
        ?`<div class="leer">Dieser Vorgang hat keine Mengen bewegt.</div>`:""}
    </div>`;
    $("#spZu").onclick=()=>{SPOFFEN=null; $("#spDetail").innerHTML="";};
    $("#spJson").onclick=()=>hol(`vorgang_${v.mode}_${v.tag}.json`,
      JSON.stringify(v.roh,null,2), "application/json");
  }
}
function csvSpeicher(L){
  const e=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  const R=[["Betriebstag","Vorgang","Wer","Position","Art","Menge","Notiz"].map(e).join(";")];
  L.forEach(v=>{
    const zeile=(o,art)=>Object.keys(o||{}).filter(k=>+o[k]).forEach(k=>{
      const w=byId(k);
      R.push([v.tag, MODUSNAME[v.mode]||v.mode, v.name,
        w?w.winzer+" "+w.wein:GN(k), art, o[k], v.notiz].map(e).join(";"));});
    zeile(v.wein,"Weinkeller"); zeile(v.getr,"Getränkelager");
    zeile(v.eingang,"Wareneingang"); if(v.zaehlung) zeile(v.zaehlung,"Zählung");
  });
  hol("speicher.csv","\uFEFF"+R.join("\r\n"),"text/csv");
}

/* ════════════ 7f · Rezepturen ════════════
   Ein Gin Tonic verbraucht ein Tonic, ein Aperol Spritz Prosecco und Soda.
   Ohne diese Zerlegung steht der Mixer für immer als Überhang da: geholt,
   nie verkauft. Es sind ein paar Rezepte, keine Kartei. */
function vRezepte(m){
  m.innerHTML=`<section><h2>Rezepturen</h2>
    <div class="unter">Für Mischgetränke, die einen Artikel aus dem Lager verbrauchen, ohne selbst
    einer zu sein. Was hier steht, wird im Abgleich statt der Position selbst gebucht.</div></section>`;

  const namen={};
  Object.values(ZBER).forEach(z=>z.positionen.forEach(p=>{
    if(!namen[p.name]) namen[p.name]={name:p.name, anzahl:0};
    namen[p.name].anzahl+=p.anzahl;}));
  const kandidaten=Object.values(namen)
    .filter(p=>!MAP[p.name] && !REZ[p.name])
    .sort((a,b)=>b.anzahl-a.anzahl);

  const s=document.createElement("section");
  const zutatOpt=GIDS.map(id=>`<option value="${id}">${esc(GN(id))}</option>`).join("");
  s.innerHTML=`<h3>Angelegt</h3>
    ${Object.keys(REZ).length?`<div class="tabhuelle"><table><thead><tr>
      <th>Kassenname</th><th>Verbraucht</th><th></th></tr></thead><tbody>
      ${Object.keys(REZ).map(k=>`<tr><td><b>${esc(k)}</b></td>
        <td>${REZ[k].map(t=>`${esc(GN(t.id))} <span class="mini">${t.ml} ml</span>`).join(" · ")}</td>
        <td class="r"><button class="b klein" data-rw="${esc(k)}">Löschen</button></td></tr>`).join("")}
      </tbody></table></div>`
    :`<div class="karte leer">Noch keine Rezeptur angelegt.</div>`}

    <h3 style="margin-top:32px">Neu anlegen</h3>
    <div class="karte">
      <div class="reihe" style="margin-bottom:14px">
        <label style="width:150px">Kassenposition</label>
        <select id="rzName" style="max-width:340px">
          <option value="">— wählen —</option>
          ${kandidaten.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} (${num(p.anzahl)}×)</option>`).join("")}
        </select></div>
      <div id="rzZut"></div>
      <div class="reihe" style="margin-top:14px">
        <button class="b" id="rzPlus">Zutat hinzufügen</button>
        <span class="rechts"></span>
        <button class="b stark" id="rzSave">Rezeptur speichern</button></div>
    </div>`;
  m.appendChild(s);

  const zut=[];
  const malZut=()=>{
    $("#rzZut").innerHTML = zut.length ? zut.map((t,i)=>`
      <div class="reihe" style="margin-bottom:8px">
        <select data-zi="${i}" style="max-width:300px">${zutatOpt}</select>
        <input type="number" data-zm="${i}" value="${t.ml}" min="10" max="1000" step="10" style="width:100px">
        <span class="mini">ml je Verkauf</span>
        <button class="b klein" data-zx="${i}">Weg</button></div>`).join("")
      : `<div class="mini">Noch keine Zutat.</div>`;
    $("#rzZut").querySelectorAll("[data-zi]").forEach(sel=>{
      sel.value=zut[+sel.dataset.zi].id;
      sel.onchange=()=>{zut[+sel.dataset.zi].id=sel.value;};});
    $("#rzZut").querySelectorAll("[data-zm]").forEach(inp=>
      inp.oninput=()=>{zut[+inp.dataset.zm].ml=Math.max(0,+inp.value||0);});
    $("#rzZut").querySelectorAll("[data-zx]").forEach(b=>
      b.onclick=()=>{zut.splice(+b.dataset.zx,1); malZut();});
  };
  malZut();
  $("#rzPlus").onclick=()=>{zut.push({id:GIDS[0], ml:200}); malZut();};
  $("#rzSave").onclick=()=>{
    const nm=$("#rzName").value;
    if(!nm) return toast("Erst eine Kassenposition wählen");
    if(!zut.length) return toast("Ohne Zutat ist es keine Rezeptur");
    REZ[nm]=zut.map(t=>({id:t.id, ml:t.ml})); schreib(K_REZ,REZ);
    zeichne(); toast("Rezeptur gespeichert");
  };
  s.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{
    delete REZ[b.dataset.rw]; schreib(K_REZ,REZ); zeichne(); toast("Gelöscht");});
}

/* ════════════ 7g · Mitarbeiter ════════════
   Codes und Rollen gehören der Leitung, nicht dem Quelltext. Solange
   alles im Browser läuft, ist ein Code eine Unterschrift und keine
   Sperre — das steht hier auch so, damit niemand mehr hineinliest. */
function vTeam(m){
  m.innerHTML=`<section><h2>Mitarbeiter</h2>
    <div class="unter">Wer sich anmelden darf und was ihm die App dann zeigt.
    Codes werden nur beim Anlegen eingegeben und nirgends gespeichert —
    am Server liegt eine PBKDF2-Prüfsumme, sonst nichts. Wer seinen Code
    vergisst, bekommt einen neuen; auslesen kann ihn niemand.</div></section>`;

  const s=document.createElement("section");
  s.innerHTML=`<div id="teamL"><div class="karte leer">Wird geladen \u2026</div></div>
    <h3 style="margin-top:32px">Aufnehmen oder Code neu setzen</h3>
    <div class="karte">
      <div class="reihe" style="margin-bottom:12px">
        <label style="width:140px">Name</label>
        <input type="text" id="nName" placeholder="Vor- und Nachname" style="width:280px"></div>
      <div class="reihe" style="margin-bottom:12px">
        <label style="width:140px">Rolle</label>
        <select id="nRolle">${Object.keys(ROLLNAME).map(k=>
          `<option value="${k}">${ROLLNAME[k]}</option>`).join("")}</select>
        <span class="deutung" id="nHint">${esc(RECHTETEXT.service)}</span></div>
      <div class="reihe" style="margin-bottom:16px">
        <label style="width:140px">Code</label>
        <input type="text" id="nCode" placeholder="vier Ziffern" maxlength="4"
          inputmode="numeric" style="width:180px">
        <button class="b klein" id="nWuerfel">Vorschlagen</button></div>
      <div class="reihe">
        <button class="b stark" id="nAdd">Speichern</button>
        <span class="mini rechts">Der Code erscheint danach nirgends mehr. Jetzt notieren.</span></div>
    </div>`;
  m.appendChild(s);

  $("#nRolle").onchange=e=>{ $("#nHint").textContent=RECHTETEXT[e.target.value]||""; };
  $("#nWuerfel").onclick=()=>{
    /* Runde 15: wieder vier Ziffern, 0000 bis 9999.
       Der Rest einer 32-Bit-Zahl geteilt durch 10000 bevorzugt die
       niedrigen Werte leicht; was über der letzten vollen Runde liegt,
       wird deshalb verworfen und neu gewürfelt. */
    const a=new Uint32Array(1), spanne=10000;
    const grenze=Math.floor(4294967296/spanne)*spanne;
    do{ crypto.getRandomValues(a); }while(a[0]>=grenze);
    $("#nCode").value=String(a[0]%spanne).padStart(4,"0");
  };

  let LEUTE=[];
  const male=()=>{
    $("#teamL").innerHTML=LEUTE.length?`<div class="tabhuelle"><table><thead><tr>
      <th>Name</th><th style="width:200px">Rolle</th><th>Sieht</th><th style="width:120px">Zustand</th>
      <th style="width:150px">Code</th>
      </tr></thead><tbody>${LEUTE.map(p=>`<tr>
        <td><b>${esc(p.name)}</b></td>
        <td><select class="klein" data-rp="${esc(p.id)}">${Object.keys(ROLLNAME).map(k=>
          `<option value="${k}"${p.rolle===k?" selected":""}>${ROLLNAME[k]}</option>`).join("")}</select></td>
        <td class="deutung">${esc(RECHTETEXT[p.rolle]||"")}</td>
        <td><button class="b klein" data-ap="${esc(p.id)}">${p.aktiv?"Sperren":"Freigeben"}</button></td>
        <td><button class="b klein" data-pin="${esc(p.id)}">PIN zurücksetzen</button></td>
      </tr>`).join("")}</tbody></table></div>`
      :`<div class="karte leer">Noch niemand angelegt.</div>`;
    $("#teamL").querySelectorAll("[data-rp]").forEach(sel=>sel.onchange=()=>{
      const p=LEUTE.find(x=>x.id===sel.dataset.rp);
      sende({id:p.id,name:p.name,rolle:sel.value,aktiv:p.aktiv});});
    /* Die Sperre trifft sonst auch die eigene Person — ein Klick, und die
       nächste Anfrage kommt als 401 zurück. Ist man die einzige Leitung im
       Haus, kommt danach NIEMAND mehr hinein: `ich()` im Worker findet nur
       `aktiv = 1`, und den Weg zurück gibt es nur über die D1-Konsole.
       Der Worker weist beides zusätzlich ab; hier steht es, damit die
       Leitung den Grund liest und nicht einen Fehler. */
    $("#teamL").querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{
      const p=LEUTE.find(x=>x.id===b.dataset.ap);
      if(p.aktiv && ICH && p.name===ICH.name)
        return toast("Dich selbst kannst du nicht sperren — sonst kommst du nicht mehr herein.");
      if(p.aktiv && p.rolle==="leitung"
         && LEUTE.filter(x=>x.aktiv && x.rolle==="leitung").length<2)
        return toast("Das ist die einzige freigegebene Leitung. Erst eine zweite anlegen.");
      sende({id:p.id,name:p.name,rolle:p.rolle,aktiv:p.aktiv?0:1});});
    /* Runde 15 · PIN zurücksetzen. Der neue Code wird vom Server gewürfelt
       und kommt GENAU EINMAL zurück — er steht nirgends sonst, auch nicht
       in der Datenbank (dort liegt nur die Prüfsumme). Deshalb bleibt er
       stehen, bis die Leitung ihn wegklickt, und wird nicht in einem Toast
       nach drei Sekunden weggewischt. */
    $("#teamL").querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{
      const p=LEUTE.find(x=>x.id===b.dataset.pin);
      if(!p)return;
      /* Den eigenen Code zurückzusetzen ist erlaubt — die offene Sitzung
         hängt am Keks, nicht am Code, man fliegt also nicht heraus. Wer
         den neuen aber wegklickt, ohne ihn zu notieren, kommt beim
         nächsten Anmelden nicht mehr herein. Deshalb steht das dabei. */
      const ichSelbst = ICH && p.name === ICH.name;
      if(!confirm("Neuen Code für "+p.name+" würfeln?\n\n"+
        "Der alte gilt danach nicht mehr. Der neue ist nur EINMAL zu sehen."+
        (ichSelbst ? "\n\nDas bist DU. Notiere ihn, sonst kommst du beim "+
          "nächsten Anmelden nicht mehr herein." : "")))return;
      b.disabled=true;
      try{
        const r=await fetch("/api/person/pin",{method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({id:p.id})});
        const j=await r.json();
        if(!r.ok){ b.disabled=false; return toast(j.fehler||"Nicht zurückgesetzt"); }
        zeigePin(p.name, j.pin);
      }catch(e){ toast("Keine Verbindung"); }
      b.disabled=false;
    });
  };
  /* Der neue Code, gross und genau einmal. Kein Speichern, kein zweites
     Anzeigen, kein Log — wer ihn hier nicht notiert, würfelt neu. */
  const zeigePin=(name,pin)=>{
    const w=document.createElement("div");
    w.className="pinzeig";
    w.innerHTML=`<div class="pinzeig-karte" role="dialog" aria-modal="true"
        aria-label="Neuer Code für ${esc(name)}">
      <p class="pinzeig-wer">Neuer Code für <b>${esc(name)}</b></p>
      <p class="pinzeig-zahl">${esc(pin)}</p>
      <p class="pinzeig-warn">Nur jetzt zu sehen. Notiere ihn und gib ihn
        weiter — er lässt sich nicht noch einmal anzeigen.</p>
      <button class="b stark">Notiert</button></div>`;
    w.querySelector("button").onclick=()=>w.remove();
    document.body.appendChild(w);
    w.querySelector("button").focus();
  };
  const hole=async()=>{
    try{
      const r=await fetch("/api/personen");
      if(r.status===403){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Nur die Leitung darf Mitarbeiter verwalten.</div>`; return; }
      /* 401 ist keine ausbleibende Antwort, sondern eine Antwort: die
         Sitzung ist abgelaufen. Beides in einen Satz zu werfen, schickt
         die Leitung auf die Suche nach einem Serverfehler, den es nicht
         gibt. */
      if(r.status===401){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Die Anmeldung gilt nicht mehr. Im Fassungstool
         neu anmelden, dann diese Seite neu laden.</div>`; return; }
      if(!r.ok){ $("#teamL").innerHTML=
        `<div class="hinweis warn">Der Server antwortet nicht. Mitarbeiter lassen sich
         nur mit Verbindung pflegen.</div>`; return; }
      LEUTE=(await r.json()).personen||[]; male();
    }catch(e){ $("#teamL").innerHTML=
      `<div class="hinweis warn">Keine Verbindung zum Server.</div>`; }
  };
  const sende=async(body)=>{
    try{
      const r=await fetch("/api/personen",{method:"POST",
        headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json();
      if(!r.ok)return toast(j.fehler||"Nicht gespeichert");
      toast("Gespeichert"); hole();
    }catch(e){ toast("Keine Verbindung"); }
  };
  $("#nAdd").onclick=()=>{
    const nm=$("#nName").value.trim(), code=$("#nCode").value.trim();
    if(!nm) return toast("Ohne Namen geht es nicht");
    if(!/^\d{4}$/.test(code)) return toast("Der Code hat vier Ziffern");
    const da=LEUTE.find(p=>p.name.toLowerCase()===nm.toLowerCase());
    sende({id:da?da.id:undefined, name:nm, rolle:$("#nRolle").value, code, aktiv:1});
    $("#nName").value=""; $("#nCode").value="";
  };
  hole();
}

/* ════════════ 8 · Aufbau ════════════ */
const ANSICHT={heute:vHeute, abgleich:vAbgleich, import:vImport, bestand:vBestand,
  bestellen:vBestellen, getraenke:vGetraenke, zaehlliste:vZaehlliste, speicher:vSpeicher,
  zuordnung:vZuordnung, rezepte:vRezepte, team:vTeam, einst:vEinst};

/* Die Erklärtexte sind gut geschrieben, stehen aber dauerhaft über jeder
   Tabelle und werden ab dem dritten Mal überlesen. Erste Zeile bleibt,
   der Rest geht hinter einen Textknopf — greift bei jeder Ansicht, deren
   Erklärung länger als ein Satz ist. */
function kuerzeUnter(){
  document.querySelectorAll(".unter").forEach(u=>{
    if(u.dataset.kurz)return;
    const t=u.innerHTML.trim(), i=t.indexOf(". ");
    if(i<0||t.length<150)return;
    u.dataset.kurz="1";
    u.innerHTML=t.slice(0,i+1)+
      ' <button class="b klein leise" data-mehr>Warum so gerechnet?</button>'+
      '<span class="mehr">'+t.slice(i+2)+'</span>';
    u.querySelector("[data-mehr]").onclick=()=>u.classList.toggle("offen");
  });
}

function zeichne(){
  zeichneNav();
  const m=$("#inhalt"); m.innerHTML="";
  (ANSICHT[SEITE]||vHeute)(m);
  quellBanner(m);
  kuerzeUnter();
  const qk=quellSchluessel(), ql=QUELLLAGE[qk];
  $("#tQuelle").textContent=qk==="Leer"?"Server · leer":QUELLE;
  /* Der Punkt sagt nur die Richtung. Was er bedeutet, steht in der
     Quellzeile über dem Inhalt — sie ist auch am Handy da, der Chip nicht. */
  $("#cQuelle").className="chip"+(!ql?"":ql[0]==="warn"?" warn":ql[0]==="bad"?" bad":" aus");
  $("#cQuelle").title=ql?ql[1]:"Die Zahlen kommen vom Server.";
  const t=letzterTag();
  $("#tStand").textContent=deTag(t);
  $("#cStand").classList.toggle("aus", !VORGAENGE.some(v=>v.tag===t));
}

$("#bNeu").onclick=async()=>{
  await ladeDaten(); await Promise.all([ladeBerichte(), ladeZuordnung()]);
  zeichne(); toast("Aktualisiert"); };
$("#bFass").onclick=()=>{ location.href="index.html"; };

/* Unter 900px liegt die Navigation als Blatt über dem Inhalt. Sie schließt
   sich nach der Wahl, bei einem Tipp daneben und mit Escape. */
$("#bNav").onclick=e=>{ e.stopPropagation(); document.body.classList.toggle("navoffen"); };
document.addEventListener("click",e=>{
  if(!document.body.classList.contains("navoffen"))return;
  if(e.target.closest("nav.seite")||e.target.closest("#bNav"))return;
  document.body.classList.remove("navoffen");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.body.classList.remove("navoffen");
});

/* Zweite Ansicht im selben Browser: neue Stände kommen von selbst an */
window.addEventListener("storage", e=>{
  if([K_STAND,K_ARCHIV].includes(e.key)){ ladeDaten().then(zeichne); }
});

(async()=>{
  await werBinIch();
  await ladeDaten();
  /* Berichte und Zuordnungen kommen vom Server. Schlägt das fehl (kein
     Netz, keine Sitzung), bleibt die Abschrift im Browser stehen — die
     Seite zeigt dann alte Zahlen, aber keine falschen. */
  await Promise.all([ladeBerichte(), ladeZuordnung()]);
  /* Ohne Sitzung und ohne lokale Daten hat diese Seite nichts zu zeigen —
     dann besser eine klare Tür als eine leere Tabelle. */
  if(!ICH && QUELLE==="Nicht angemeldet") return verlangeAnmeldung();
  zeichne();
  if(ICH && ICH.rolle!=="leitung"){
    document.getElementById("cQuelle").insertAdjacentHTML("beforebegin",
      `<span class="chip aus"><span class="pkt"></span>${ICH.rolle}: nur lesen</span>`);
  }
})();
</script>
