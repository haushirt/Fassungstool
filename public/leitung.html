          [["w001",3,"bar"],["w005",3,"bar"],["w009",3,"bar"],["w043",3,"bar"]]]}]}];
/* Wortgleich mit `wSlots` in public/index.html. Das dritte Feld eines
   Platzes nennt den Topf: steht dort etwas (`"bar"`), gehört der Platz
   NICHT zur Getränkezählung und zählt nicht ins Soll der Lade. */
function wSlots(L){const r=[];
  (L.fach||[]).forEach(F=>{
    if(F.kind==="raster")r.push([F.fid,F.n,null]);
    else (F.zeilen||[]).forEach(z=>z.forEach(c=>{
      if(c && c.stapel) c.stapel.forEach(t=>r.push([t[0],t[1],t[2]||null]));
      else r.push([c[0],c[1],c[2]||null]);}));});
  (L.cols||[]).forEach(c=>r.push([c[0],c[1],c[2]||null]));
  return r;}
/* Das alte Regal ist durch Lade 2 ersetzt — dieselbe Zeile wie in der App. */
GETR.laden = (GETR.laden||[]).filter(L=>L.id!=="regal");
const GSOLL = (()=>{ const s={};
  (GETR.laden||[]).forEach(L=>{
    (L.grid||[]).forEach(c=>c.forEach(id=>s[id]=(s[id]||0)+1));
    (L.spec||[]).forEach(g=>g.forEach(([id,n])=>s[id]=(s[id]||0)+n));
    (L.cols||[]).forEach(c=>colTeile(c).forEach(([id,n])=>s[id]=(s[id]||0)+n));
    if(L.rack) s[L.rack[0]] = (s[L.rack[0]]||0) + L.rack[1];
  });
  WLADEN.forEach(L=>wSlots(L).forEach(([id,n,b])=>{ if(!b) s[id]=(s[id]||0)+n; }));
  return s; })();
const GIDS = Object.keys(GSOLL);
const GN = id => (GETR.name||{})[id] || id;

/* Millilitermenge aus einem Text. In einem KASSENNAMEN ist das die
   Ausschankmenge je verkaufter Einheit („… 1/8 l"), in einem ARTIKELNAMEN
   die Gebindegröße („Gasteiner 1 l"). Zwei verschiedene Dinge — diese
   Funktion liest nur die Zahl und entscheidet nichts darüber. */
function mlAusText(t){
  if(!t) return null;
  const s = String(t).toLowerCase();
  let letzte=null, m;
  /* Der Bruch steht VOR der Einheit und schluckt sie mit. Der echte
     Z-Bericht schreibt den offenen Wein als „GV Leindl Langenlois 1/8 l";
     bis v22 griff die Einheitensuche zuerst, las „8 l" und gab 8000 ml
     zurück — Faktor 64 auf jedem offenen Wein. Wortgleich mit `ml()` in
     src/gnparse.js; wer eines ändert, ändert beide. */
  const rx=/(\d)\s*\/\s*(\d)\s*l?\b|(\d+(?:[.,]\d+)?)\s*(ml|cl|l)\b/g;
  while((m=rx.exec(s))) letzte=m;
  if(!letzte) return null;
  if(letzte[1]) return 1000*(+letzte[1]/+letzte[2]);      /* 1/8 l = 125 ml */
  const v=parseFloat(letzte[3].replace(",","."));
  return letzte[4]==="ml"?v : letzte[4]==="cl"?v*10 : v*1000;
}
/* ════════════ 1b · Gebindegrößen: EINE Quelle, drei Zustände ════════════
   Jede Mengenrechnung (Verkauf in Flaschen) braucht zwei Zahlen: die
   Ausschankmenge aus dem Kassennamen und die Gebindegröße des Artikels.
   Bis v24 stand die Gebindegröße an drei Stellen und war zweimal geraten:
   jeder Wein fix 750 ml (Magnum und 0,375 rechneten falsch), und ein
   Getränk ohne Größe im Namen zählte je verkaufter Einheit als ganze
   Flasche — ein 2-cl-Stamperl wurde so zur Flasche.

   Rangfolge, ab hier an genau einer Stelle:
     1  BESTÄTIGT   `mapping.gebinde_ml` vom Server, zum Kassennamen
     2  BESTÄTIGT   derselbe Artikel, an einem anderen Kassennamen bestätigt
                    (widersprechen sich zwei, gilt der Artikel als offen)
     3  VORSCHLAG   Größe im Artikelnamen („Gasteiner 1 l")
     4  VORSCHLAG   Standard der Warenart, siehe GEBINDE_STANDARD
     5  UNBEKANNT   nichts davon — dann wird NICHT gerechnet
   Rückgabe immer {ml, quelle, woher}; quelle ist
   "bestaetigt" | "vorschlag" | null.                                     */

/* Standard-Gebindegrößen je Warenart, in Millilitern. NUR ein Vorschlag:
   solange niemand bestätigt hat, rechnet damit keine Zeile.

   Warum hier nur „wein" steht: eine Warenart ist aus den Stammdaten sonst
   nicht ableitbar. `WINES` ist durchweg Flaschenwein (0,75 l ist die
   Regel, Magnum und 0,375 die Ausnahme — deshalb Vorschlag, nicht
   Wahrheit). `GETR` dagegen kennt keine Warenart, sondern nur die
   Ladengeometrie: In Lade 6 liegen 0,33-l- und 0,5-l-Flaschen
   nebeneinander (`st03` neben `hell`), die Lade sagt also nichts über die
   Größe. Spirituosen kommen in den Stammdaten überhaupt nicht vor — für
   „Amaro 2 cl" gibt es keinen Artikel und damit auch keinen Standard.
   Ein Standard „Spirituose 700" wäre hier geraten; er fehlt mit Absicht. */
const GEBINDE_STANDARD = { wein: 750 };

const artName = id => { const w=byId(id); return w ? w.winzer+" · "+w.wein : GN(id); };

/* Bestätigte Größen je Artikel, abgeleitet aus GEB_BEST über MAP.
   Klein genug, um bei jedem Aufruf neu gerechnet zu werden (< 100 Namen);
   ein Zwischenspeicher wäre eine zweite Wahrheit, die veralten kann. */
function gebArtikelBestaetigt(){
  const t={};
  Object.keys(GEB_BEST).forEach(nm=>{
    const id=MAP[nm], ml=+GEB_BEST[nm]||0;
    if(!id || id==="__ignoriert" || !ml) return;
    if(t[id]===undefined) t[id]=ml;
    else if(t[id]!==ml) t[id]=null;        /* Widerspruch → lieber keine Zahl */
  });
  return t;
}

function gebindeGroesse(artId, kassenname){
  if(!artId) return {ml:null, quelle:null, woher:"kein Artikel zugeordnet"};
  const direkt = kassenname ? +GEB_BEST[kassenname]||0 : 0;
  if(direkt>0) return {ml:direkt, quelle:"bestaetigt", woher:"bestätigt für diese Kassenposition"};
  const ueberArtikel = gebArtikelBestaetigt()[artId];
  if(ueberArtikel) return {ml:ueberArtikel, quelle:"bestaetigt", woher:"bestätigt für diesen Artikel"};
  const imNamen = mlAusText(artName(artId));
  if(imNamen) return {ml:imNamen, quelle:"vorschlag", woher:"Größe steht im Artikelnamen"};
  if(byId(artId)) return {ml:GEBINDE_STANDARD.wein, quelle:"vorschlag", woher:"Standard Weinflasche"};
  return {ml:null, quelle:null, woher:"für diesen Artikel ist keine Gebindegröße hinterlegt"};
}

/* ════════════ 2 · Vorgänge einlesen und vereinheitlichen ════════════
   Aus dem v11-Blob wird je Vorgang ein flaches Ergebnis:
     wein{id:n}     Flaschen aus dem Weinkeller geholt
     getr{id:n}     Flaschen aus dem Getränkelager geholt
     zaehlung{id:n} gezählter Kellerbestand (nur Kellerzählung)
     eingang{id:n}  Wareneingang in Flaschen                            */
const summe = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);

/* Flaschen je Kiste einer Wareneingangs-Position.
   Die Rangfolge ist WORTGLEICH mit der des Workers (`src/index.js`,
   `mode === "ware"`): `kistengr` schreibt die App (public/index.html:1350,
   :2881, :2910), `kg` kommt nur aus alten Paketen der Offline-Reihe, 6 ist
   der Standard (`KISTE_STD`).
   Bis v25 stand hier zuerst `p.kg` — ein Feld, das die App NIE geschrieben
   hat — und danach `PLAN.kiste`, das die App beim Rechnen ebenfalls nicht
   befragt. Eine Lieferung mit 2 Kisten a 20 Flaschen stand deshalb im
   Journal mit 40 und auf diesem Schirm mit 12. Wer eine der beiden
   Fassungen ändert, ändert beide; `tests/kisten.test.mjs` schickt dieselbe
   Lieferung durch den Worker UND durch `normVorgang` und wird rot, sobald
   sie auseinanderlaufen. */
function kistenGr(p){ return (p && (+p.kistengr || +p.kg)) || 6; }

function normVorgang(v){
  if(!v || !v.mode) return null;
  const o={mode:v.mode, tag:v.tag||"", name:v.name||"", notiz:v.notiz||"",
           fertig:!!v.finished, ts:v.archiviert||"", wein:{}, getr:{},
           /* ── Zwei Zahlen je Artikel, nicht eine (Runde 20) ────────
              `wein`/`getr`      = was aus dem KELLER heraus ist.
                                   Davon lebt der Bestand.
              `verbraucht`       = was OBEN gefehlt hat.
                                   Dagegen rechnet der Z-Bericht.

              Sie sind fast immer gleich und gehen genau dann
              auseinander, wenn im Lager weniger lag als gebraucht
              wurde: `holtN`/`gholtN` (die App nennt das „Abweichung",
              das Feld heisst „Tatsächliche Menge"). Oben fehlten dann
              sechs, geholt wurden vier — verkauft sind trotzdem sechs,
              abgezogen gehören vier.

              Bis Runde 20 behielt diese Seite nur die Entnahme und
              rechnete auch den Abgleich damit. Das widerspricht der
              eigenen Festlegung: `review/OFFENE-ENTSCHEIDUNGEN.md`
              („Soll − Ist … ist die Bezugsgröße, gegen die später der
              Z-Bericht geprüft wird"). Der Code folgte dem Glossar in
              `UEBERGABE-TECHNISCH.md`, das beide gleichsetzt.

              Beide Zahlen entstehen HIER aus denselben Rohfeldern. Die
              App schickt nichts Neues, das gespeicherte Format bleibt
              unberührt, und jeder längst abgelegte Vorgang bekommt die
              zweite Zahl rückwirkend. */
           verbraucht:{},
           /* Was ausserhalb der Fassungsmengen aus dem Keller ging.
              Die App führt es bewusst getrennt („Eigener Topf, eigene
              Rubrik im Protokoll — nie mit den Nachfuellmengen
              vermischt", public/index.html) — das Backoffice hat es
              bis Runde 20 eingemischt. Es zählt in BEIDE Zahlen und
              wird zusätzlich hier ausgewiesen. */
           extra:{},
           /* F4 (18.09.2026): `fotos` ist hier ersatzlos entfallen. Der
              Fotoschritt der Fassungsliste gibt es in der App nicht mehr,
              und eine Spalte, die ab heute immer 0 zaehlt, sagt der
              Leitung nur, dass niemand mehr fotografiert. */
           zaehlung:null, gzaehlung:null, eingang:{},
           roh:v};
  const zu=(t,id,n)=>{ n=+n||0; if(n) t[id]=(t[id]||0)+n; };

  if(v.mode==="tag" || v.mode==="fuellen"){
    /* `rest/bar/barrot/backup` halten die Fehlmenge je Ort: was oben
       gefehlt hat, also den VERBRAUCH. `holtN` sagt daneben, wie viele
       davon wirklich aus dem Keller kamen — es ersetzt die Zahl im
       Gerät, darf aber den Verbrauch nicht mitverändern. */
    const fehlte={};
    ["barrot","bar","backup","rest"].forEach(k=>
      Object.keys(v[k]||{}).forEach(id=>fehlte[id]=(fehlte[id]||0)+(+v[k][id]||0)));
    Object.keys(fehlte).forEach(id=>{
      zu(o.verbraucht,id,fehlte[id]);                     /* oben gefehlt */
      zu(o.wein,id,(v.holtN && v.holtN[id]!=null) ? +v.holtN[id] : fehlte[id]);
    });
    /* Zusätzlich Entnommenes ist beides: es ging aus dem Keller UND es
       ist verbraucht. Deshalb in beide Zahlen — und in `extra`, damit
       es die Anzeige getrennt nennen kann. */
    Object.keys(v.zusatz||{}).forEach(id=>{
      zu(o.wein,id,v.zusatz[id]); zu(o.verbraucht,id,v.zusatz[id]);
      zu(o.extra,id,v.zusatz[id]); });
    /* Getränke: der Verbrauch ist Soll minus gezählter Ist-Stand. Diese
       Herleitung ist dieselbe, die in Runde 19 aus `o.getr` entfernt
       werden musste, weil sie dort DOPPELT zählte (die App schickt aus
       genau dieser Rechnung schon `gent`). Sie kommt hier in einen
       EIGENEN Topf zurück und läuft nie wieder in `o.getr`. */
    Object.keys(v.getr||{}).forEach(id=>
      zu(o.verbraucht, id, Math.max(0, (GSOLL[id]||0) - (+v.getr[id]||0))));
    /* Geholt, aber die Lade nicht gezählt: die Lücke ist dann nicht
       berechenbar. Im Zweifel gilt die geholte Menge — eine 0 hiesse
       „nichts verbraucht" und machte aus dem Verkauf eine Fehlmenge.
       Wortgleich mit `verbrauchteMengen` in public/index.html. */
    Object.keys(v.gent||{}).forEach(id=>{
      if(!v.getr || v.getr[id]==null) zu(o.verbraucht,id,v.gent[id]); });
    /* Getränke: `v.getr` ist der GEZÄHLTE Ist-Stand in der Lade — eine
       Angabe, keine Bewegung. Was aus dem Getränkelager geholt wurde,
       steht in `gent` und wird weiter unten EINMAL addiert.

       NACHTRICHTIGUNG (Analyse Runde 19 · A): Hier stand bis v61 eine
       zweite Herleitung derselben Menge — `Soll − Ist`, wahlweise
       überschrieben von `gholtN`. Genau daraus baut aber schon die App
       ihr `gent` (`geholteGetraenke`, public/index.html:4751, mit
       demselben `gholtN`-Vorrang), und vierzig Zeilen weiter unten
       läuft `gent` in denselben Topf. JEDE geholte Flasche zählte damit
       doppelt.
       Gemessen (echter Worker, echte D1): Lade Soll 7, Ist 3, 4 geholt
       und abgehakt → Journal `entnahme 4 lager`, dieser Schirm `getr 8`,
       „Verkauf ↔ Fassung" verkauft 4 · entnahme 8 · Differenz +4 ·
       „prüfen". Für jedes Getränk, an jedem Tag, eine erfundene
       Abweichung in exakter Höhe der geholten Menge — bis hinaus auf das
       gedruckte Blatt.
       Die Gegenrichtung war ebenso falsch: ohne Haken „geholt" bleibt
       `gent` leer, die Herleitung hier zählte trotzdem, der Worker gar
       nicht. Deshalb keine zweite Herleitung mehr, sondern dieselbe
       Quelle wie im Journal (`src/index.js`, `zu("entnahme", …, d.gent)`).
       `tests/getraenke-doppelt.test.mjs` bestückt einen Vorgang mit
       `getr` UND `gent` — genau diese Kombination fehlte in jeder
       Prüfdatei und hat den Fehler 445 grüne Prüfungen lang verdeckt. */
    if(v.getr && Object.keys(v.getr).length) o.gzaehlung=Object.assign({},v.getr);
  }

  if(v.mode==="nach"){
    Object.keys(v.ent||{}).forEach(id=>zu(o.wein,id,v.ent[id]));
  }

  if(v.mode==="keller"){
    const z={}; let hat=false;
    WINES.forEach(w=>{
      if(!(v.zdone||{})[w.id]) return;
      z[w.id]=(+(v.reihen||{})[w.id]||0)*6 + (+(v.einzel||{})[w.id]||0); hat=true;
    });
    if(hat) o.zaehlung=z;
    if(v.getr && Object.keys(v.getr).length) o.gzaehlung=Object.assign({},v.getr);
  }

  if(v.mode==="ware"){
    (v.pos||[]).forEach(p=>{
      if(!p.id || p.id==="__neu" || !(+p.kisten>0)) return;
      zu(o.eingang, p.id, (+p.kisten)*kistenGr(p));
    });
  }

  /* `gent` heisst je nach Modus etwas ANDERES — dieselbe Unterscheidung
     trifft der Worker in `ereignisseAbleiten` (src/index.js, `if (d.mode
     === "ware") … else …`): im Wareneingang ist es die GELIEFERTE Anzahl
     Flaschen („Was wurde geliefert — pro Position die gelieferte Anzahl
     Flaschen", public/index.html), in jedem anderen Modus die zusätzlich
     entnommene.
     Bis v26 lief beides in `o.getr`. 24 gelieferte Cola standen damit in
     „Verkauf ↔ Fassung" als Entnahme 24, Differenz +24, Deutung „Vorrat
     aufgebaut oder Schwund", und in der Vorgangsliste unter „Getränke
     Fl." — genau der Vorzeichenfehler, den der Worker in v22 abgestellt
     hat, nur auf dem Schirm statt im Journal.
     `tests/lieferung-getraenke.test.mjs` schickt dieselbe Lieferung durch
     den Worker UND durch `normVorgang` und wird rot, sobald die beiden
     Fassungen wieder auseinanderlaufen. */
  const gentZiel = v.mode==="ware" ? o.eingang : o.getr;
  Object.keys(v.gent||{}).forEach(id=>zu(gentZiel,id,v.gent[id]));
  /* `gzusatz` ist in JEDEM Modus eine Entnahme — im Worker steht es
     ausserhalb des `ware`-Zweigs. Wie beim Wein: beides zugleich. */
  Object.keys(v.gzusatz||{}).forEach(id=>{
    zu(o.getr,id,v.gzusatz[id]); zu(o.verbraucht,id,v.gzusatz[id]);
    zu(o.extra,id,v.gzusatz[id]); });

  /* Eine Lücke „oben" gibt es nur, wo es ein Soll gibt: in der
     Tagesfassung und im Nachfüllen. In JEDEM anderen Modus ist der
     Verbrauch gleich der Entnahme — und das ist kein Notbehelf,
     sondern Absicht:

     · Die Sonderentnahme ist Entnahme UND Verbrauch. Bruch, Küche,
       Personal und Verkostung werden im Kassensystem verbucht (der
       Z-Bericht führt sie als eigene Positionen „… - Inner Haus" mit
       0,00 €) — sie müssen auf beiden Seiten stehen, sonst sähe jeder
       Bruch wie fehlender Verkauf aus. Entschieden von Casimir,
       20.09.2026.
     · Eine Kellerzählung kann `gent` tragen (jemand nimmt beim Zählen
       etwas mit). Setzte man den Verbrauch dort auf 0, fiele diese
       Entnahme beim Umstellen von `abgleich()` STILL aus dem Vergleich
       — eine Entscheidung, die niemand getroffen hat. Sie bleibt drin.
     · Der Wareneingang bewegt nichts nach oben: `o.wein`/`o.getr` sind
       dort leer, die Schleife findet nichts, der Topf bleibt leer. */
  if(v.mode!=="tag" && v.mode!=="fuellen"){
    Object.keys(o.wein).forEach(id=>{ if(o.verbraucht[id]==null) o.verbraucht[id]=o.wein[id]; });
    Object.keys(o.getr).forEach(id=>{ if(o.verbraucht[id]==null) o.verbraucht[id]=o.getr[id]; });
  }

  /* Zwei Angaben, die es im Vorgang gibt und die diese Seite bis
     Runde 20 nicht gelesen hat:
     · `zeit` — die Uhr des GERÄTS beim Absenden. `ts` ist dagegen die
       Ankunft beim Server; bei einem Gerät, das ohne Netz gearbeitet
       hat, liegen Stunden dazwischen (in den Live-Daten: bis zu 26).
     · `uebersteuert` — „trotzdem abschliessen" mit dem eigenen Code.
       Die App verspricht dem Menschen wörtlich „die Leitung sieht sie
       morgen früh"; gesehen hat sie es nie. In den Live-Daten steht es
       bereits einmal. */
  o.zeit = v.zeit || "";
  o.uebersteuert = v.uebersteuert || null;
  o.grund = v.grund || "";

  o.flWein=summe(o.wein); o.flGetr=summe(o.getr);
  o.flVerbraucht=summe(o.verbraucht);
  return o;
}

/* Reihenfolge: erst der Betriebstag, dann die Kellerzählung, dann alles
   andere. Das ist die Regel aus `review/ENTSCHIEDEN-NACHTS.md`, Punkt 8:
   Bei gleichem Betriebstag gilt die Kellerzählung IMMER als Erstes — sie
   ist der Anfangsbestand des Tages. Alle anderen Vorgänge desselben Tages
   (ware, tag, fuellen, nach) zählen danach, untereinander in beliebiger
   Reihenfolge, weil sie sich ohnehin summieren.

   Die Ankunftszeit entscheidet innerhalb eines Betriebstages NICHTS mehr.
   `ts` ist `archiviert`, also der Zeitpunkt, zu dem das Paket beim Server
   ankommt (`vorgaengeLesen` in src/index.js gibt `geaendert` heraus) —
   nicht der, zu dem im Keller gezählt wurde. Offline ist der Normalfall:
   Das iPad zählt vormittags im Keller und bleibt unten, die Tagesfassung
   geht abends vom iPhone hinaus, das iPad kommt am nächsten Morgen herauf.
   Nach Ankunft gerechnet war die Zählung dann JÜNGER als die Entnahme
   desselben Tages — 10 Flaschen statt 4, „Seither 0 Flaschen entnommen",
   und die Bestellliste rechnet auf derselben Zahl (Fund A/8-3). Dasselbe
   bei gleichem und bei fehlendem Zeitstempel.

   Bewusst in Kauf genommen: Wird die Lieferung eines Tages VOR der
   Zählung desselben Tages in den Keller gestellt, zählt sie trotzdem
   obendrauf. Ein Tag mit Zählung UND Lieferung ist selten; ein Tag mit
   Zählung, die spät hochkommt, ist der Normalfall.

   Der Zeitstempel bleibt nur als letzte, feste Sortierung stehen — damit
   die Liste bei zwei Vorgängen desselben Rangs nicht springt. Auf die
   Rechnung hat er keinen Einfluss mehr. Ein Stand, der noch läuft, hat
   keinen: MAX_SAFE_INTEGER statt Infinity, damit die Subtraktion im
   Vergleich nicht NaN wird. */
const tsZahl = v => { const t=Date.parse((v&&v.ts)||"");
  return Number.isFinite(t) ? t : Number.MAX_SAFE_INTEGER; };
/* Rang INNERHALB eines Betriebstages. Nicht der alte `MODUSRANG` mit fünf
   Stufen: unterschieden wird nur „Zählung" gegen „alles andere". Wer die
   Bewegungen untereinander ordnen wollte, müsste wissen, in welcher
   Reihenfolge sie im Keller geschahen — das weiß niemand, und für die
   Summe ist es gleichgültig. */
const tagRang = v => (v && v.mode==="keller") ? 0 : 1;
function nachZeit(a,b){
  return (a.tag||"").localeCompare(b.tag||"")
      || (tagRang(a)-tagRang(b))
      || (tsZahl(a)-tsZahl(b));
}

/* ════════════ 3 · Quelle ════════════ */
let QUELLE="—", VORGAENGE=[], STAND=null;
/* Die Notizzeilen des Ereignisjournals (Mailempfang, Wochenbrief,
   Rechtevermerke). Leer, solange niemand angemeldet ist oder die Rolle
   nicht Leitung ist — das ist kein Fehler, nur keine Auskunft. */
let NOTIZEN=[];

/* Wie viele Ziffern ein Code hat. Genau eine Stelle nennt die Zahl — im
   Worker (`PIN_LAENGE` in src/index.js) und in der App (`PIN_LAENGE` in
   public/index.html) heisst die Konstante genauso, und alle drei muessen
   dasselbe sagen. Runde 16: die vier harten Vieren in dieser Datei sind
   dadurch ersetzt. */
const PIN_LAENGE=4;
const PIN_MUSTER=new RegExp("^\\d{"+PIN_LAENGE+"}$");
/* Gleichverteilt ueber 0000…9999 (bzw. so viele Stellen, wie PIN_LAENGE
   sagt). Der Rest einer 32-Bit-Zahl geteilt durch die Spanne bevorzugt die
   niedrigen Werte leicht; was ueber der letzten vollen Runde liegt, wird
   deshalb verworfen und neu gewuerfelt. Dieselbe Rechnung wie
   `wuerfelPin()` im Worker. */
function wuerfelPin(){
  const a=new Uint32Array(1), spanne=Math.pow(10,PIN_LAENGE);
  const grenze=Math.floor(4294967296/spanne)*spanne;
  do{ crypto.getRandomValues(a); }while(a[0]>=grenze);
  return String(a[0]%spanne).padStart(PIN_LAENGE,"0");
}

/* Ein `fetch` mit Frist — fuer die beiden Wege, bei denen ein Haengen
   wehtut: Abmelden (am geteilten iPad) und „PIN zuruecksetzen". Das
   Backoffice laeuft sonst am MacBook mit stabiler Leitung; die uebrigen
   Aufrufe holen nur Zahlen und duerfen warten.

   BERICHTIGUNG (qa-guardian, dritte Gegenprobe): Die erste Fassung gab
   die `Response` zurueck und raeumte die Uhr im `finally` — also sobald
   der KOPF da war. Genau der Fehler, den `holeKurz()` in index.html eine
   Stunde vorher abgestellt hatte, und der Kommentar hier behauptete,
   es sei „dieselbe Rechnung". Gemessen: `kurz()` kam nach 3 ms zurueck,
   `await r.json()` beim Aufrufer hing danach unbegrenzt. Bei „PIN
   zuruecksetzen" heisst das: Der Knopf bleibt tot (`b.disabled=false`
   wird nie erreicht), es kommt weder Dialog noch Hinweis, und der
   Ersatzcode im `catch` greift nicht, weil nichts wirft — waehrend der
   neue Code am Server laengst stehen kann. Dann kommt die Person nicht
   mehr herein, und niemand kennt ihren Code.

   Diese Fassung liest den Leib INNERHALB der Frist, wie `holeKurz()`. */
/* Eine Kennung, die der Client vergibt. `crypto.randomUUID` gibt es
   erst ab Safari 15.4; der Rueckfall muss nicht kryptografisch sein, er
   muss nur eindeutig sein. Dieselbe Rueckfallebene wie `uuid()` in
   index.html. */
function uuid(){
  try{ if(crypto.randomUUID)return crypto.randomUUID(); }catch(e){}
  return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}

/* Wen dieses Fenster in dieser Sitzung schon angelegt hat: Name (klein
   geschrieben) -> Kennung.

   BERICHTIGUNG (Jaeger, siebte Jagd): Dieses Gedaechtnis stand bis eben
   INNERHALB von `vTeam()`. `zeichne()` leert `#inhalt` und ruft die
   Ansicht neu auf — bei „Aktualisieren" (`#bNeu`), bei jedem
   Seitenwechsel und bei einem `storage`-Ereignis aus einem zweiten Tab,
   also ganz ohne Klick. Damit war das Gedaechtnis genau dann weg, wenn
   man es braucht: Die Liste kam nicht, auf dem Schirm stand „Keine
   Verbindung zum Server.", die Leitung drueckte „Aktualisieren" und
   tippte denselben Menschen noch einmal — der bekam eine ZWEITE Kennung,
   also eine zweite aktive Zeile mit eigenem gueltigen Anmeldecode.
   Danach wirkt „Sperren" nicht mehr, und in der Live-D1 ist das nicht
   rueckholbar (kein Loeschen, keine Sicherung, Projektanleitung §8).

   Jetzt auf Modulebene und zusaetzlich gespiegelt, damit auch ein
   Neuladen es nicht loescht. Der Speicher kann verweigern (privates
   Fenster, volles Kontingent) — dann bleibt das Gedaechtnis im
   Arbeitsspeicher, und der Rest laeuft unveraendert.

   BERICHTIGUNG (achte Jagd Runde 16 · B): Der Spiegel lag in
   `sessionStorage` — und der ist je TAB eigen. Zwei offene
   `leitung.html` am MacBook sind der Normalfall, und gemessen ergaben
   sie fuer denselben Namen wieder zwei Kennungen. Jetzt `localStorage`,
   also ein Gedaechtnis fuer den ganzen Browser. Der Preis ist, dass es
   nicht mehr von selbst vergeht; dafuer raeumt `abmelden()` es weg.

   Was hier drinsteht: Name (klein geschrieben) → Kennung. KEINE Codes
   (harte Regel 9) — der Code geht direkt ins Paket und wird nirgends
   gemerkt. Und die Wache dahinter steht im Worker (`personSchreiben`,
   Namenspruefung): ein Gedaechtnis im Browser kann ein zweites GERAET
   nicht sehen. */
/* BERICHTIGUNG (elfte Jagd Runde 16 · A): Die Kennung war eine blosse
   Zeichenkette — und damit nicht zu unterscheiden, ob sie zu einem
   Anlauf gehoert, der noch NICHT am Server angekommen ist, oder zu einer
   Zeile, die dort laengst steht. Genau das entscheidet aber alles:

   · Noch nicht bestaetigt  → derselbe Anlauf darf wiederholt werden.
     Dieselbe `id` schreibt dieselbe Zeile, es entsteht kein zweiter
     Eintrag (der Fund der fuenften Jagd).
   · Schon bestaetigt      → den Menschen gibt es. Dann wird hier NICHT
     geschrieben, auch wenn die Liste gerade nicht geladen ist.

   Ohne diese Unterscheidung hing die Absage an `LEUTE` — und `LEUTE`
   ist leer, sobald `hole()` in die Frist laeuft, ohne Netz ist oder 401
   oder 403 bekommt, also genau dann, wenn man sie braucht. Gemessen:
   Person als Leitung angelegt, Seite neu geladen (das Auswahlfeld steht
   danach wieder auf „Service"), Liste schweigt, derselbe Name mit neuem
   Code → dieselbe Kennung ging mit dem NEUEN Inhalt hinaus, der Worker
   sah seine eigene `id` unter den namensgleichen und schwieg, und
   `ON CONFLICT(id) DO UPDATE` schrieb Rolle, Pruefsumme und `aktiv`
   neu: alter Code tot, Rolle „Service", Sperre aufgehoben, auf dem
   Schirm „Gespeichert".

   Alte Eintraege (blosse Zeichenketten) gelten als BESTAETIGT — die
   vorsichtige Seite: lieber eine Absage zu viel als ein stilles
   Ueberschreiben. */
const K_KENNUNG="hh_nkennung_v1";
const nKennung=(function(){
  try{
    const o=JSON.parse(localStorage.getItem(K_KENNUNG)||"{}");
    return (o && typeof o==="object" && !Array.isArray(o))?o:{};
  }catch(e){ return {}; }
})();
/* Ein unbestaetigter Anlauf ist eine Falle auf Zeit: Solange `ok` false
   bleibt, darf dieselbe Kennung wieder hinaus — mit dem INHALT, der
   gerade im Formular steht. Das ist richtig, solange es wirklich die
   Wiederholung desselben Anlaufs ist, und falsch, sobald Wochen
   vergangen sind. Zwei Dinge halten die Falle deshalb kurz:

   · `kennungHeilen()` setzt `ok`, sobald die Liste den Menschen zeigt —
     dann ist bewiesen, dass die Zeile am Server steht. Das war die
     Luecke der zwoelften Jagd: `ok:false` wurde NIE fortgeschrieben,
     auch nicht, nachdem die Liste den Menschen laengst fuehrte.
   · `FRIST_UNBESTAETIGT` laesst einen unbestaetigten Anlauf nach einer
     halben Stunde verfallen. Danach gilt er als unbekannt: Es geht eine
     NEUE Kennung hinaus, und der Namenswaechter im Worker antwortet 409,
     statt still zu ueberschreiben. Aus einer Falle wird eine Absage. */
const FRIST_UNBESTAETIGT=30*60*1000;
function kennungSchreiben(){
  try{ localStorage.setItem(K_KENNUNG,JSON.stringify(nKennung)); }catch(e){}
}
function kennungMerken(schl,id,bestaetigt){
  nKennung[schl]={id:id, ok:!!bestaetigt, t:Date.now()};
  kennungSchreiben();
  return id;
}
function kennungLesen(schl){
  const v=nKennung[schl];
  if(!v)return null;
  if(typeof v==="string")return {id:v, ok:true};   /* Altbestand */
  if(!v.ok && (!v.t || Date.now()-v.t>FRIST_UNBESTAETIGT))return null;
  return {id:v.id, ok:!!v.ok};
}
/* Die Liste ist der Beweis: Steht der Mensch darin, ist seine Zeile am
   Server — und dieses Fenster darf sie nicht mehr ueberschreiben. */
function kennungHeilen(leute){
  let wandel=false;
  (leute||[]).forEach(pp=>{
    const k=String(pp && pp.name || "").toLowerCase();
    const v=nKennung[k];
    if(v && typeof v==="object" && !v.ok){ v.ok=true; v.t=Date.now(); wandel=true; }
  });
  if(wandel)kennungSchreiben();
}
function kennungRaeumen(){
  Object.keys(nKennung).forEach(k=>{ delete nKennung[k]; });
  try{ localStorage.removeItem(K_KENNUNG); }catch(e){}
}

async function kurz(pfad,opt,ms){
  const frist=+ms>0?+ms:8000;
  const ab=(typeof AbortController!=="undefined")?new AbortController():null;
  const uhr=ab?setTimeout(()=>ab.abort(),frist):0;
  const lauf=(async()=>{
    const r=await fetch(pfad,Object.assign({credentials:"same-origin"},opt||{},
      ab?{signal:ab.signal}:{}));
    const typ=r.headers.get("content-type")||"";
    /* `text()` NICHT abfangen: Bricht die Frist mitten im Leib ab, wirft
       es — und genau das soll es. Die frueher hier stehende Falle machte
       aus einem halben Leib ohne JSON-Kopf eine geglueckte Antwort
       (vierte Jagd Runde 16 · C). Eine leere Antwort wirft nicht, die
       gibt "" zurueck. */
    const text=await r.text();
    let daten=null;
    if(typ.includes("json")){ try{ daten=JSON.parse(text); }catch(e){} }
    /* Eine halb gelesene Antwort ist keine Antwort. Bricht die Frist
       mitten im Leib ab, kam hier `{json:true, daten:null}` zurueck —
       der Aufrufer hielt das fuer einen geglueckten Ruf ohne Inhalt und
       zeigte eine leere Auskunft statt seiner Rueckfallebene. Jetzt
       wirft es, und der `catch` des Aufrufers greift, wie er soll. */
    if(typ.includes("json") && daten===null)
      throw new Error("unvollständige Antwort");
    return {ok:r.ok, status:r.status, json:typ.includes("json"), daten};
  })();
  /* Das Versprechen NUR anlegen, wenn es gebraucht wird. Unbedingt
     erzeugt wurde es 8 s nach JEDEM Aufruf abgelehnt — auch nach einem
     geglueckten — und stand als unbehandelte Ablehnung in der Konsole,
     samt Zeitgeber, der die Seite so lange wachhielt (vierte Jagd
     Runde 16 · C). `holeKurz()` in index.html macht es lazy; hier stand
     es eine Zeile zu frueh. */
  try{
    return ab ? await lauf : await Promise.race([lauf,
      new Promise((_,weg)=>setTimeout(()=>weg(new Error("Frist")),frist))]);
  } finally { if(uhr)clearTimeout(uhr); }
}

async function ladeDaten(){

  try{

      const j=await r.json();
      const roh=Array.isArray(j)?j:(j.vorgaenge||[]);
      VORGAENGE=roh.map(x=>normVorgang(x.daten||x)).filter(Boolean).sort(nachZeit);
      QUELLE="Server"; return;
    }
  }catch(e){}
  /* 2 · Lokal */
  const arch=lese(K_ARCHIV)||{}, akt=lese(K_STAND)||{};
  const alle=[];
  Object.values(arch).forEach(v=>alle.push(v));
  Object.values(akt).forEach(v=>{ if(v && v.mode) alle.push(Object.assign({},v,{laufend:!v.finished})); });
  if(alle.length){
    VORGAENGE=alle.map(normVorgang).filter(Boolean).sort(nachZeit);
    QUELLE="Lokal"; return;
  }
  VORGAENGE=[]; QUELLE="Keine Daten";
}

/* ── Z-Berichte und Zuordnungen: der Server ist die Quelle ────────────
   Bis v22 lagen beide im `localStorage` dieses Browsers. Das hiess: Der
   per Mail eingelieferte Bericht war im Backoffice unsichtbar, die halbe
   Stunde Zuordnungsarbeit hing an einem Gerät, und der Mail-Import lernte
   nie dazu — er las die Zuordnungstabelle der Datenbank, in die niemand
   schrieb. Beides kommt jetzt vom Worker; der `localStorage` bleibt als
   Abschrift, damit die Seite ohne Netz nicht leer dasteht. */
const vomServer = e => ({
  tag: e.tag, nr: e.z || "", block: "Positionen", sektionen: [],
  positionen: (e.positionen||[]).map(p=>({
    name: p.rohbez, anzahl: +p.anzahl||0, umsatz: +p.betrag||0,
    ml: p.ausschankMl!=null ? +p.ausschankMl : null, zeilen: 1 })),

});

async function ladeBerichte(){
  try{
    const r=await fetch("/api/fassungsliste",{headers:{Accept:"application/json"}});
    if(!r.ok) return false;
    const j=await r.json();
    /* Mehr als die letzten zwei Monate braucht keine Ansicht, und jede
       Liste kostet eine Anfrage. */
    const liste=(j.berichte||[]).slice(0,60);
    const neu={};
    for(const b of liste){
      if(!b.tag) continue;
      const a=await fetch("/api/fassungsliste?tag="+encodeURIComponent(b.tag),
        {headers:{Accept:"application/json"}});
      if(!a.ok) continue;
      const e=await a.json();
      if(e && e.tag) neu[e.tag]=vomServer(e);
    }
    ZBER=neu; schreib(K_ZBER,ZBER); return true;
  }catch(e){ return false; }
}

   Der Mailempfang legt jeden abgewiesenen Absender und jeden Bericht

   geschrieben hat. Bis es diesen Aufruf gab, war all das unsichtbar:

   Satz für „kommt noch" und für „wurde an der Tür abgewiesen".
   Nur Leitung; alles andere antwortet 403 und lässt die Liste leer. */
async function ladeNotizen(){
  try{

    if(!r.ok){ NOTIZEN=[]; return false; }
    const j=await r.json();
    NOTIZEN=(j.zeilen||[]).filter(z=>z && z.notiz);
    return true;
  }catch(e){ return false; }
}
/* Die jüngste Notiz je Quelle — mehr braucht der Mittagsblick nicht,

function letzteNotiz(quelle){

}
function notizZeit(z){
  if(!z || !z.ts) return "";
  const d=new Date(+z.ts);
