/* Vierzehn Betriebstage nebeneinander. Drei Reihen, weil genau drei
   Dinge je Tag entweder da sind oder fehlen — und eine fehlende Angabe
   muss anders aussehen als eine Null. Schraffiert heißt „keine Angabe". */
function verlauf(bisTag, n){
  const T=[];
  for(let i=n-1;i>=0;i--){
    const t=tagMinus(bisTag,i);
    const V=gebucht().filter(v=>v.tag===t);
    const hatF=V.some(v=>v.mode==="tag");
    const hatZ=!!ZBER[t];
    let ab="nix";
    if(hatZ){
      const a=abgleich(t,1);
      const grob=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=2).length;
      const klein=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1).length;
      ab = a.offen.length ? "nix" : grob ? "bad" : klein ? "warn" : "ok";
    }
    T.push({t, f:hatF?"ok":"nix", z:hatZ?"ok":"nix", a:ab});
  }
  return T;
}

function vHeute(m){
  const tag=letzterTag(), a=abgleich(tag, SPANNE), B=bestand(), V=verbrauch();
  const heutigeVorg=VORGAENGE.filter(v=>v.tag===tag);
  const fassung=heutigeVorg.find(v=>v.mode==="tag");
  const best=bestellliste();
  const tOG=teileOhneGroesse(a.ohneGroesse);
  const grob=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=2);
  const ohneUrteil=a.zeilen.filter(r=>r.unklar);
  /* Die Gründe kommen aus den Zeilen, nie aus dem Gedächtnis:
     `UNKLAR_GRUND` ist die eine Wahrheit. Wer daneben eine zweite Liste
     pflegt, pflegt sie irgendwann nicht mehr mit — beide fest getippten
     Aufzählungen, die hier bis Runde 16 standen, waren falsch. */
  const gruendeSatz=[...new Set(a.zeilen.filter(r=>r.unklar)
    .map(r=>UNKLAR_GRUND[r.unklar]||"Verkauf nicht bestimmbar"))].join(" · ");

  /* ── 1 · Urteil ───────────────────────────────────────────────────
     Ein Satz, der sagt, woran man ist. Vier Kacheln mit Zahlen sagen es
     nicht: Sie beantworten vier Fragen und keine davon ist „und nun?". */
  const urteil = !a.berichte
    ? {k:"bad", t:"Für diesen Zeitraum ist kein Verkauf bekannt.",
       u:"Ohne Z-Bericht ist jede Entnahme unten nur eine Entnahme — keine Differenz "
        +"und kein Schwund. Das ist noch kein Abgleich."}
    : a.offen.length
    ? {k:"bad", t:"Den Differenzen ist noch nicht zu trauen.",
       u:num(a.offen.length)+" Kassennamen sind keinem Artikel zugeordnet. Solange das so "
        +"ist, zählt ihr Verkauf als „nicht vorhanden“ — und jede Zeile darunter sieht "
        +"schlechter aus, als sie ist."}
    : grob.length
    ? {k:"warn", t:num(grob.length)+(grob.length===1?" Position geht":" Positionen gehen")+" nicht auf.",
       u:"Der Verkauf ist bekannt, die Entnahme auch — sie decken sich nicht. Unten stehen "
        +"sie nach Wert sortiert."}
    : {k:"ok", t:"Verkauf und Entnahme decken sich.",
       u:"Keine Abweichung über zwei Flaschen im Zeitraum"
        +(ohneUrteil.length?" — "+ohneUrteil.length+" Positionen bleiben ohne Urteil ("+gruendeSatz+").":".")};

  m.innerHTML=`<section>
    <h2>Übersicht · ${esc(deTag(a.von))} bis ${esc(deTag(a.bis))}</h2>
    <div class="urteil urteil--${urteil.k}">
      <b>${esc(urteil.t)}</b>${esc(urteil.u)}</div></section>`;

  /* ── 2 · Abdeckung ───────────────────────────────────────────────
     Die eine Zahl, die sagt, wie viel eine Differenz wert ist. Sie wird
     seit v27 gerechnet und stand bis Runde 19 ausschließlich auf dem
     Druckblatt — nicht auf dem Schirm, den die Leitung morgens öffnet. */
  if(a.berichte){
    const ges=a.stkGesamt||0, ger=a.stkGerechnet||0, ign=a.stkIgnoriert||0;
    const fehlt=Math.max(0, ges-ger-ign);
    const pz=x=>ges?Math.round(x/ges*1000)/10:0;
    /* Unter rund einem Sechstel der Breite passt keine Beschriftung mehr
       hinein — bei 393px stand dort „8…". Der Abschnitt bleibt farbig,
       die Zahl steht in der Zeile darunter, und beide zusammen stehen im
       `title`. Eine abgeschnittene Zahl ist schlechter als keine. */
    const abschnitt=(kl,wert,wort)=>{ if(!wert) return "";
      const p=pz(wert), text=num(wert)+" "+wort;
      return `<i class="${kl}" style="width:${p}%" title="${esc(text)} (${p} %)">`
        +(p>=16?`<span>${esc(text)}</span>`:"")+`</i>`; };
    const s=document.createElement("section");
    s.innerHTML=`<h3>Wie viel vom Verkauf steckt in der Rechnung</h3>
      <div class="vbalken" role="img" aria-label="${pz(ger)} Prozent gerechnet, ${pz(ign)} Prozent ausgenommen, ${pz(fehlt)} Prozent fehlen">
        ${abschnitt("v-ok", ger, "gerechnet")}
        ${abschnitt("v-aus", ign, "ausgenommen")}
        ${abschnitt("v-fehlt", fehlt, "fehlen")}
      </div>
      <div class="vlegende"><span><b>${num(ges)}</b> verkaufte Einheiten laut Kasse${
        a.umsatzFenster?" · <b>"+esc(eur(a.umsatzFenster))+"</b> Umsatz":""}
        <br>${num(ger)} gerechnet · ${num(ign)} ausgenommen${
          a.ignoriert&&a.ignoriert.length?" ("+a.ignoriert.length+" ignoriert)":""
        } · ${num(fehlt)} fehlen</span>
        <span class="rechts">${a.berichte} von ${a.spanne} Z-Berichten eingelesen</span></div>
      <div class="unter">„Ausgenommen“ sind Speisen, Kaffee und Fassbier — alles auf „Ignorieren“.
        „Fehlen“ heißt: der Verkauf ist da, aber die Rechnung kann ihn nicht rechnen.</div>`;

    /* Woraus die Lücke besteht. Drei Ursachen mit drei verschiedenen
       Maßnahmen — wer sie in einen Topf wirft, schickt einen Teil der
       Leitung vor eine leere Wand (achte Jagd Runde 16). „Größe fehlt"
       ist Arbeit im Backoffice, „ohne Vorschlag" ist Handarbeit am
       einzelnen Artikel, „keine Menge im Kassennamen" ist überhaupt
       keine Arbeit hier — das fehlt der KASSE.
       Die Sätze standen bis Runde 19 im Kasten „Was noch fehlt"; sie
       stehen jetzt dort, wo sie etwas erklären: unter dem Balken, dessen
       roten Abschnitt sie ausmachen. */
    const t=teileOhneGroesse(a.ohneGroesse);
    const nam=n=>n+(n===1?" zugeordneter Kassenname":" zugeordnete Kassennamen");
    const einh=x=>num(x)+(x===1?" Einheit":" Einheiten");
    const L=[];
    if(a.offen.length) L.push("Nicht zugeordnet: "+num(a.offen.length)
      +(a.offen.length===1?" Kassenname":" Kassennamen")
      +" ("+einh(a.offen.reduce((x,o)=>x+o.anzahl,0))+") haben keinen Artikel.");
    if(t.sammelbar.length) L.push("Größe fehlt: "+nam(t.sammelbar.length)
      +" ("+einh(t.stkSammelbar)+") haben keine bestätigte Größe."
      +" Unter „Verkauf ↔ Fassung“ lassen sie sich gesammelt bestätigen.");
    if(t.handisch.length) L.push("Größe fehlt ohne Vorschlag: "+nam(t.handisch.length)
      +" ("+einh(t.stkHandisch)+") haben weder bestätigte Größe noch Vorschlag."
      +" Die Gebindegröße muss von Hand eingetragen werden; bei Mischgetränken"
      +" an der eigenen Kassenposition des Bestandteils.");
    /* NACHTRICHTIGUNG (Jagd nach Runde 19 · Rückfall): Dieser Satz stand
       seit der dritten Jagd im Kasten „Was noch fehlt" und ist mit der
       neuen Übersicht zunächst verschwunden. Er gehört hierher, weil
       „Ignorieren" der einzige Weg ist, einen Cocktail ohne Menge im
       Namen aus dem roten Balken zu bekommen — und seine Flaschen
       kommen trotzdem aus dem Keller. */
    if(a.ignoriert && a.ignoriert.length) L.push(
      "Ausgenommen: "+a.ignoriert.length
      +(a.ignoriert.length===1?" Kassenname":" Kassennamen")
      +" ("+einh(a.stkIgnoriert)+") "+(a.ignoriert.length===1?"steht":"stehen")
      +" auf „Ignorieren“ und "+(a.ignoriert.length===1?"zählt":"zählen")
      +" nicht als Verkauf — richtig für Speisen, Kaffee und Fassbier. Steht dort "
      +"ein Getränk aus dem Keller, fehlt sein Verkauf, und seine Zeile unten "
      +"sieht aus, als stimme sie.");
    if(t.ausschank.length) L.push("Menge fehlt im Kassennamen: "+nam(t.ausschank.length)
      +" ("+einh(t.stkAusschank)+") sagen nicht, wie viel ausgeschenkt wurde."
      +" Bestätigen hilft hier nicht; es braucht einen Kassennamen mit Menge"
      +" oder eine Rezeptur.");
    if(L.length) s.insertAdjacentHTML("beforeend",
      `<ul class="luecke">${L.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>`);
    m.appendChild(s);
  }

  /* ── 3 · Die Kette ───────────────────────────────────────────────── */
  {
    const G=kette(a, B, fassung, tag);
    const s=document.createElement("section");
    s.innerHTML=`<h3>Der Weg der Zahlen</h3>
      <div class="unter">Von der Fassung im Keller bis zum fertigen Abgleich.
        Reißt ein Glied, ist alles dahinter grau — nicht grün und nicht rot.</div>
      <div class="kette">${G.map((g,i)=>
        (i?`<div class="gpfeil${G[i-1].k==="tot"||g.k==="tot"?" gpfeil--tot":""}" aria-hidden="true"></div>`:"")
        +`<button type="button" class="glied glied--${g.k}" data-ziel="${esc(g.ziel)}">
            <span class="gnr">${i+1}</span><span class="gt">${esc(g.t)}</span>
            <span class="gw">${esc(g.w)}</span><span class="gu">${esc(g.u)}</span>
          </button>`).join("")}</div>`;
    m.appendChild(s);
  }

  /* ── 4 · Jetzt zu tun ────────────────────────────────────────────── */
  {
    /* Drei Aufgaben stehen gross da, der Rest als eine Zeile. Der alte
       Kasten „Was noch fehlt" hatte bis zu acht Sätze Fließtext ohne
       einen einzigen Knopf und wurde ab dem dritten Mal überlesen; eine
       Liste, die nach drei Punkten aufhört, verliert dafür Dinge, die
       niemand verlieren darf (eine hängengebliebene Fassung, eine
       abgewiesene Mail). Beides zusammen: oben, was jetzt dran ist —
       darunter, vollständig und knapp, alles Übrige. */
    const A=aufgaben(a, B, tOG), OBEN=A.slice(0,3), REST=A.slice(3), MELD=meldungen();
    const s=document.createElement("section");
    s.innerHTML=`<h3>Jetzt zu tun</h3>`
      +(OBEN.length
        ? `<div class="tun">${OBEN.map(x=>`
            <div class="tunz">
              <span class="pill ${x.art==="blockiert"?"p-bad":x.art==="offen"?"p-grau":"p-warn"}">${esc(x.art)}</span>
              <div class="tunt"><b>${esc(x.t)}</b><div class="mini">${esc(x.u)}</div></div>
              <div class="tunr"><button class="b${x.stark?" stark":""}" data-ziel="${esc(x.ziel)}">${esc(x.knopf)}</button></div>
            </div>`).join("")}</div>`
        : `<div class="karte leer">Nichts offen. Berichte sind eingelesen, alles ist
            zugeordnet, der Bestand ist gezählt.</div>`)
      +((REST.length||MELD.length)
        ? `<div class="auch"><h4>Außerdem</h4><ul>
            ${REST.map(x=>`<li><button class="b klein leise" data-ziel="${esc(x.ziel)}">${esc(x.knopf)}</button>
              <span>${esc(x.t)} — ${esc(x.u)}</span></li>`).join("")}
            ${MELD.map(x=>`<li><span class="mini pill p-grau">Journal</span>
              <span>${esc(x)}</span></li>`).join("")}
          </ul></div>`
        : "");
    m.appendChild(s);
  }

  /* ── 5 · Heute ───────────────────────────────────────────────────
     Der laufende Tag, ausdrücklich getrennt vom Abgleichfenster oben.
     Er endet bei gestern (`letzterTag`) — was heute früh gefasst wurde,
     kam auf dieser Seite bis Runde 19 nirgends vor. */
  {
    const h=wienTag(), HV=VORGAENGE.filter(v=>v.tag===h);
    const hf=HV.find(v=>v.mode==="tag");
    const sonder=HV.filter(v=>v.mode==="nach");
    const laufend=offeneVorgaenge();
    const summeW=HV.reduce((x,v)=>x+summe(v.wein),0);
    const summeG=HV.reduce((x,v)=>x+summe(v.getr),0);
    const uhr=v=>{ const t=v.ts||v.roh&&v.roh.zeit; if(!t) return "";
      const d=new Date(t); return isNaN(d)?"":d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}); };
    const s=document.createElement("section");
    s.innerHTML=`<h3>Heute · ${esc(deTag(h))}
        <span class="mini">läuft noch — nicht im Abgleich oben</span></h3>
      <div class="heutzeile">
        <div class="ht"><span>Tagesfassung</span>
          <b class="${hf?(hf.fertig?"ok":""):"bad"}">${hf?(hf.fertig?esc(uhr(hf)||"da"):"läuft"):"fehlt"}</b>
          <small>${hf?esc(hf.name||"ohne Namen")+" · "+num(hf.flWein)+" Fl. Wein":"noch keine Fassung"}</small></div>
        <div class="ht"><span>Seit Mitternacht</span>
          <b>${num(HV.length)}</b>
          <small>${num(summeW)} Fl. Wein · ${num(summeG)} Fl. Getränke</small></div>
        <div class="ht"><span>Sonderentnahmen</span>
          <b>${num(sonder.length)}</b>
          <small>${sonder.length?esc(sonder.map(v=>v.name||"?").join(" · ")):"keine"}</small></div>
        <div class="ht"><span>Läuft noch offen</span>
          <b class="${laufend.length?"bad":""}">${laufend.length?num(laufend.length):"—"}</b>
          <small>${laufend.length
            ? esc(MODUSNAME[laufend[0].mode]||laufend[0].mode)+" · "+esc(laufend[0].name||"?")
            : "nichts offen"}</small></div>
      </div>`;
    m.appendChild(s);
  }

  /* ── 6 · Die Zahlen ──────────────────────────────────────────────
     Sechs Angaben, jede mit ihrem Zeitraum. Ein Strich, wo nichts
     berechenbar ist — der Preis dafür ist eine leere Kachel, der Preis
     für eine 0 wäre eine falsche Auskunft. */
  {
    const entGes=Object.keys(a.ent).reduce((x,id)=>x+a.ent[id],0);
    const gerechnet=a.zeilen.filter(r=>!r.unklar);
    const diffFl=gerechnet.reduce((x,r)=>x+Math.abs(r.diff),0);
    const diffEur=gerechnet.reduce((x,r)=>x+(r.wert||0),0);
    const bGes=Object.keys(B.b).reduce((x,id)=>x+(B.b[id]>0?B.b[id]:0),0);
    const alter=zaehlAlter(B);
    const traegt = a.berichte>0 && !a.offen.length;
    const kachel=(t,w,u,tot)=>`<div class="zw${tot?" zw--tot":""}">
      <span>${esc(t)}</span><b>${esc(w)}</b><small>${u}</small></div>`;
    const s=document.createElement("section");
    s.innerHTML=`<h3>Die Zahlen · ${esc(deTag(a.von))} bis ${esc(deTag(a.bis))}</h3>
      <div class="zahlwand">
        ${kachel("Umsatz Getränke", a.umsatzFenster?eur(a.umsatzFenster):"—",
          a.berichte?"aus "+a.berichte+" Z-Bericht"+(a.berichte===1?"":"en"):"kein Z-Bericht",
          !a.umsatzFenster)}
        ${kachel("Verkauft", a.stkGesamt?num(a.stkGesamt):"—",
          a.stkGesamt?num(a.stkGerechnet)+" davon gerechnet":"kein Z-Bericht", !a.stkGesamt)}
        ${kachel("Aus dem Keller", num(entGes),
          a.stkLaufend
            ? "Flaschen · "+num(a.stkLaufend)+" in laufenden Vorgängen nicht gerechnet"
            : "Flaschen entnommen", false)}
        ${kachel("Differenz", traegt&&gerechnet.length?num(diffFl):"—",
          traegt&&gerechnet.length
            ? "Flaschen, alle Abweichungen zusammen"+(diffEur?" · rund "+esc(eur(diffEur)):"")
            : (a.offen.length?"erst wenn alles zugeordnet ist":"kein Z-Bericht"),
          !(traegt&&gerechnet.length))}
        ${kachel("Bestand Keller", B.hat?num(bGes):"—",
          B.hat?"Flaschen · Zählung "+esc(deTag(B.basis.tag)):"keine Kellerzählung", !B.hat)}
        ${kachel("Zuletzt gezählt", alter==null?"—":alter===0?"heute":alter+" Tage",
          alter==null?"noch nie":"her", alter==null)}
      </div>`;
    m.appendChild(s);
  }

  /* ── 7 · Zwei Spalten ────────────────────────────────────────────── */
  {
    const auf=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1)
      .sort((x,y)=>(y.wert||0)-(x.wert||0) || Math.abs(y.diff)-Math.abs(x.diff));
    const zwei=document.createElement("div"); zwei.className="zwei";

    const s1=document.createElement("section");
    s1.innerHTML=`<h3>Weicht ab</h3>
      <div class="unter">Nur Zeilen, für die Verkauf UND Entnahme bekannt sind.
        Sortiert nach Wert; wo kein Durchschnittserlös berechenbar ist, nach Flaschen.</div>`
      +(auf.length
        ? `<div class="tabhuelle"><table><thead><tr><th>Artikel</th>
            <th class="r">Verk.</th><th class="r">Entn.</th><th class="r">Diff.</th>
            <th class="r">Wert</th></tr></thead><tbody>
            ${auf.slice(0,6).map(r=>`<tr>
              <td>${esc(r.name)} <span class="mini">${esc(r.art)}</span>
                <div class="mini deutung">${esc(DEUTUNG(r, a.offen.length))}</div>
                ${r.laufend?`<div class="mini">${num(r.laufend)} Fl. stehen in einem
                  Vorgang, der noch läuft — hier nicht als Entnahme gerechnet.</div>`:""}
                ${r.vorbehalt?`<div class="mini">${esc(vorbehaltSatz(r.vorbehalt))}</div>`:""}</td>
              <td class="r">${num(r.verkauf)}</td><td class="r">${num(r.entnahme)}</td>
              <td class="r ${r.diff>0?"diff-plus":"diff-minus"}">${r.diff>0?"+":"−"}${num(Math.abs(r.diff))}</td>
              <td class="r geld">${r.wert?"<b>"+esc(eur(r.wert))+"</b>"
                :`<span class="dim" title="${r.euroTeilweise?"Mischgetränk — der Betrag lässt sich nicht auf die Bestandteile aufteilen":"kein gerechneter Verkauf, also kein Durchschnittserlös"}">—</span>`}</td>
            </tr>`).join("")}
            ${(auf.length>6||ohneUrteil.length)?`<tr class="tot"><td colspan="5" class="mini">
              ${auf.length>6?num(auf.length-6)+" weitere Abweichungen. ":""}
              ${ohneUrteil.length?num(ohneUrteil.length)
                +(ohneUrteil.length===1?" Zeile ist":" Zeilen sind")
                +" nicht beurteilbar: "+esc(gruendeSatz)+".":""}
            </td></tr>`:""}
          </tbody></table></div>`
        : `<div class="karte leer">${!a.berichte
            ? "Kein Z-Bericht im Zeitraum — es gibt nichts zu vergleichen."
            : ohneUrteil.length
            ? "Für keine Position ist der Verkauf bestimmbar ("+esc(gruendeSatz)+")."
            : "Keine Abweichung über einer Flasche."}</div>`)
      +`<div class="reihe" style="margin-top:12px">
          <button class="b leise" data-ziel="diff">Zum vollständigen Abgleich</button></div>`;
    zwei.appendChild(s1);

    const s2=document.createElement("section");
    s2.innerHTML=`<h3>Geht aus</h3>
      <div class="unter">Reichweite unter ${EINST.reichweite} Tagen.</div>`
      +(best.length
        ? `<div class="tabhuelle"><table><thead><tr><th>Wein</th>
            <th class="r">Best.</th><th class="r">Reicht</th><th class="r">Kisten</th>
            </tr></thead><tbody>
            ${best.slice(0,6).map(r=>`<tr>
              <td>${esc(r.w.winzer)} · ${esc(r.w.wein)}
                ${r.unklar?`<div class="mini">${esc(unklarZeilenSatz(r.unklar))}</div>`:""}</td>
              <td class="r">${num(r.bestand)}</td>
              <td class="r">${r.bestand<=0?'<span class="pill p-bad">leer</span>'
                :`<span class="pill ${r.reichweite<7?"p-bad":"p-warn"}">${
                  r.reichweite===Infinity?"—":Math.floor(r.reichweite)+" T"}</span>`}</td>
              <td class="r"><b>${esc(bestellSpanne(r))}</b> × ${r.kg}</td></tr>`).join("")}
            ${best.length>6?`<tr class="tot"><td colspan="4" class="mini">
              ${num(best.length-6)} weitere unter der Schwelle</td></tr>`:""}
          </tbody></table></div>`
        : `<div class="karte leer">${B.hat
            ? "Nichts unter der Schwelle."
            : "Keine Kellerzählung — die Reichweite ist nicht berechenbar."}</div>`)
      +`<div class="reihe" style="margin-top:12px">
          <button class="b leise" data-ziel="bestellen">Zum Bestellvorschlag</button></div>`;
    zwei.appendChild(s2);
    m.appendChild(zwei);
  }

  /* ── 8 · Verlauf ─────────────────────────────────────────────────
     Vierzehn Tage nebeneinander. Erst hier wird ein Muster sichtbar,
     das keine Einzelzahl zeigt: dass montags nie ein Bericht kommt,
     oder dass die Abweichung seit Dienstag jeden Tag größer wird. */
  {
    const T=verlauf(tag,14);
    const kurz=t=>t.slice(8,10);
    const reihe=(lab,f)=>`<div class="kzeile"><div class="klab">${lab}</div>
      ${T.map(x=>`<i class="${f(x)}" title="${esc(deTag(x.t))}"></i>`).join("")}</div>`;
    const s=document.createElement("section");
    s.innerHTML=`<h3>Die letzten 14 Tage</h3>
      <div class="unter">Eine Spalte je Betriebstag. Schraffiert heißt: die Angabe fehlt —
        nicht „null“.</div>
      <div class="kalender">
        ${reihe("Fassung",  x=>x.f)}
        ${reihe("Z-Bericht",x=>x.z)}
        ${reihe("Abgleich", x=>x.a)}
        <div class="kzeile ktage"><div class="klab"></div>
          ${T.map(x=>`<i>${kurz(x.t)}</i>`).join("")}</div>
      </div>
      <div class="legende">
        <span><i class="ok"></i>stimmt</span><span><i class="warn"></i>Abweichung</span>
        <span><i class="bad"></i>grobe Abweichung</span><span><i class="nix"></i>keine Angabe</span>
      </div>`;
    m.appendChild(s);
  }

  /* Ein Weg je Ziel, an einer Stelle — Kette, Aufgaben und Fußknöpfe
     benutzen dasselbe `data-ziel`. Bis Runde 18 stand dieselbe
     Sprungtabelle dreimal in dieser Funktion. */
  m.querySelectorAll("[data-ziel]").forEach(b=>b.onclick=()=>{
    const z=b.dataset.ziel;
    if(z==="fassung"){
      EGFILTER={modus:fassung?"":"tag", wer:"", q:""};
      EGOFFEN=fassung?vgSchluessel(fassung):null;
      SEITE="eingaenge";
    }
    else if(z==="zbericht"){ vImport.zeig=(a.z&&a.z.tag)||tag; SEITE="import"; }
    else if(z==="diff"){ vAbgleich.tag=tag; SEITE="abgleich"; }
    else SEITE=z;
    document.body.classList.remove("navoffen");
    zeichne(); window.scrollTo(0,0);
    const d=$("#egDetail .karte");
    if(d) d.scrollIntoView({behavior:"smooth", block:"start"});
  });
}

/* ── Abgleich ───────────────────────────────────────────────────────── */
function vAbgleich(m){
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort().reverse();
  const tag=vAbgleich.tag && tage.includes(vAbgleich.tag) ? vAbgleich.tag : letzterTag();
  vAbgleich.tag=tag;
  const a=abgleich(tag, SPANNE);

  m.innerHTML=`<section><h2>Verkauf ↔ Fassung</h2>
    <div class="unter">Was die Kasse gebucht hat, gegen das, was aus dem Keller geholt wurde.
    Gerechnet wird in Flaschen: Anzahl × Ausschank in Millilitern, geteilt durch das Gebinde.<br>
    Was am Abend verkauft wird, holt oft erst der nächste Tag nach. Über einen einzelnen Tag
    verschiebt das jede Zeile — über eine Woche gleicht es sich aus.</div></section>`;

  const w=document.createElement("section"); w.className="reihe";
  w.innerHTML=`<label class="mini">Bis Betriebstag</label>
    <select id="selTag">${tage.map(t=>`<option value="${t}" ${t===tag?"selected":""}>${esc(deTag(t))}</option>`).join("")}</select>
    <label class="mini" style="margin-left:10px">Zeitraum</label>
    <select id="selSpanne">${[1,7,14,30].map(n=>`<option value="${n}" ${n===SPANNE?"selected":""}>${n===1?"nur dieser Tag":n+" Tage"}</option>`).join("")}</select>
    <span class="mini">${a.berichte} Z-Bericht${a.berichte===1?"":"e"} im Zeitraum</span>
    <span class="rechts"></span>
    <button class="b klein" id="bCsv">Als CSV</button>
    <button class="b klein" id="bPdf">Differenzen als PDF</button>`;
  m.appendChild(w);
  $("#selTag").onchange=e=>{ vAbgleich.tag=e.target.value; zeichne(); };
  $("#selSpanne").onchange=e=>{ SPANNE=+e.target.value; zeichne(); };
  $("#bCsv").onclick=()=>csvAbgleich(tag,a);
  /* B5 · Das Blatt für die Gruppe. Es druckt auch dann, wenn nichts
     abweicht — „es geht auf" ist eine Nachricht, die verschickt werden
     darf, und ein Knopf, der manchmal nichts tut, wird nicht benutzt. */
  $("#bPdf").onclick=()=>druckDifferenzen(tag,a);

  if(!a.berichte){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis warn">In diesem Zeitraum liegt kein Z-Bericht vor.
      Ohne ihn zeigt die Tabelle nur die Entnahme.</div>`;
    m.appendChild(s);
  }else if(a.berichte<a.spanne){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis">${a.berichte} von ${a.spanne} Tagen sind eingelesen.
      Für die übrigen fehlt der Verkauf — die Differenzen fallen entsprechend zu hoch aus.</div>`;
    m.appendChild(s);
  }
  if(a.offen.length){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis bad">${a.offen.length} Kassenname${a.offen.length===1?"":"n"} ohne Zuordnung
      im Zeitraum ${deTag(a.von)} bis ${deTag(a.bis)} —
      ${a.offen.length===1?"sein":"ihr"} Verkauf fehlt in dieser Rechnung.
      <button class="b klein" id="bZu" style="margin-left:8px">Jetzt zuordnen</button></div>`;
    m.appendChild(s); $("#bZu").onclick=()=>{ SEITE="zuordnung"; zeichne(); };
  }
  /* NACHTRICHTIGUNG (vierte Jagd · A): Der vierte Weg, auf dem Verkauf
     aus der Rechnung fällt, stand auf diesem Schirm nirgends. Er ist
     nicht rot: „Ignorieren" ist für Speisen, Kaffee und Fassbier genau
     richtig und der Alltag. Er steht hier, weil unter denselben Namen
     auch ein Getränk aus dem Keller liegen kann — und dann trägt seine
     Zeile eine grüne Plakette über einer halben Rechnung. */
  if(a.ignoriert && a.ignoriert.length){
    const s=document.createElement("section");
    s.innerHTML=`<div class="hinweis">${a.ignoriert.length} Kassenname${a.ignoriert.length===1?"":"n"}
      (${num(a.stkIgnoriert)} Einheiten) ${a.ignoriert.length===1?"steht":"stehen"} auf „Ignorieren“
      im Zeitraum ${esc(deTag(a.von))} bis ${esc(deTag(a.bis))} und
      ${a.ignoriert.length===1?"zählt":"zählen"} nicht als Verkauf — richtig für Speisen, Kaffee
      und Fassbier. Steht dort ein Getränk aus dem Keller, fehlt sein Verkauf hier, und seine
      Zeile sieht aus, als stimme sie.
      <button class="b klein" id="bIgn" style="margin-left:8px">Nachsehen</button></div>`;
    m.appendChild(s); $("#bIgn").onclick=()=>{ SEITE="zuordnung"; zeichne(); };
  }
  /* Der dritte Zustand: zugeordnet, aber die Größe ist nicht bestätigt.
     Bewusst NICHT rot und bewusst nicht in der Differenz — hier fehlt eine
     Angabe, es fehlt keine Flasche. */
  /* BERICHTIGUNG (neunte Jagd Runde 16 · C): Die Spalte „Vorschlag" in
     der Tabelle weiter unten prüfte mit einer EIGENEN Bedingung (nicht
     rezept, nicht ausschank, geb.ml da), während Kopf und Sammelknopf
     `sammelbar()` benutzen. Heute zahlengleich — aber ein dritter
     `fehlt`-Wert ergäbe dort einen Knopf, während der Kopf darüber „von
     Hand eintragen" ankündigt. Vierte Stelle mit eigener Bedingung, und
     genau das ist die Wurzel, an der diese Runde zweimal hängen blieb.
     Sie fragt jetzt `sammelbar(o)`. */
  if(a.ohneGroesse.length){
    const t=teileOhneGroesse(a.ohneGroesse);
    /* „1 Einheiten" stand hier bis zur achten Jagd (C). */
    const einh=x=>num(x)+(x===1?" Einheit":" Einheiten");
    const s=document.createElement("section");
    /* Ein eigener Abschnitt mit Überschrift, nicht ein Hinweiskasten ohne
       Kopf: Er steht zwischen der Filterzeile und der Abgleichtabelle, und
       ohne Überschrift war nicht zu sehen, wo er anfängt und wo er aufhört.
       Die Zahl gehört in die Überschrift — sie ist das Maß der Arbeit, die
       hier liegt. */
    s.innerHTML=`<div class="abschnitt"><div>
      <h3>Nicht gerechnet · ${a.ohneGroesse.length} Kassenname${a.ohneGroesse.length===1?"":"n"}</h3>
      <div class="unter">${[
        t.sammelbar.length ? t.sammelbar.length+" ohne bestätigte Größe ("+einh(t.stkSammelbar)+") — hier unten gesammelt bestätigen" : "",
        t.handisch.length ? t.handisch.length+" ohne Vorschlag ("+einh(t.stkHandisch)+") — die Gebindegröße von Hand eintragen, bei Mischgetränken am Bestandteil" : "",
        t.ausschank.length ? t.ausschank.length+" ohne Menge im Kassennamen ("+einh(t.stkAusschank)+") — hier ist nichts zu bestätigen, es braucht einen Kassennamen mit Menge oder eine Rezeptur" : ""
      ].filter(Boolean).join(" · ")}. Alle bleiben aus der Mengenrechnung heraus, als fehlende Angabe
      und nicht als Abweichung</div></div></div>
      <div class="tabhuelle"><table><thead><tr>
        <th>Kassenname</th><th class="r">Menge</th><th>Artikel</th><th>Was fehlt</th><th>Vorschlag</th>
      </tr></thead><tbody>${a.ohneGroesse.map(o=>`<tr>
        <td>${esc(o.name)}</td><td class="r">${num(o.anzahl)}</td>
        <td>${o.rezept ? "Mischgetränk · Bestandteil "+esc(artName(o.id)) : esc(artName(o.id))}</td>
        <td>${o.rezept
          ? "Für "+esc(artName(o.id))+" fehlt die Flaschengröße"
          : o.fehlt==="ausschank"
          ? "Die Ausschankmenge steht nicht im Kassennamen"
          : "Die Gebindegröße des Artikels ist nicht bestätigt"}</td>
        <td>${sammelbar(o)
          ? `<span class="vorschlag"><span>${o.geb.ml} ml <span class="mini">(${esc(o.geb.woher)})</span></span>
               <button class="b klein" data-geb="${esc(o.name)}" data-art="${esc(o.id)}"
                 data-ml="${o.geb.ml}">Übernehmen</button></span>`
          : o.rezept ? '<span class="dim">kein Knopf an dieser Zeile — die Größe gehört zum Bestandteil und wird an dessen eigener Kassenposition bestätigt</span>'
          : o.fehlt==="ausschank" ? '<span class="dim">kein Vorschlag — Kassenname oder Rezeptur nötig</span>'
          : '<span class="dim">kein Vorschlag — Gebindegröße von Hand eintragen</span>'}</td>
      </tr>`).join("")}</tbody></table></div>`;
    m.appendChild(s);
    s.querySelectorAll("button[data-geb]").forEach(b=>b.onclick=()=>
      bestaetigeGebinde(b.dataset.geb, b.dataset.art, +b.dataset.ml));

    /* Der Sammelweg. Er steht bewusst UNTER der Tabelle: erst die Liste
       lesen (Kassenname, Artikel, Vorschlag, Herkunft), dann bestätigen.
       Angefasst wird nur, was einen Vorschlag hat — Positionen, bei denen
       die Ausschankmenge im Kassennamen fehlt, kann niemand vorschlagen,
       und ein Sammelknopf darf sie nicht stillschweigend mitnehmen. */
    const vorschlaege=a.ohneGroesse.filter(sammelbar)
      .map(o=>({name:o.name, id:o.id, ml:+o.geb.ml}));
    const ohneVorschlag=a.ohneGroesse.length-vorschlaege.length;
    if(vorschlaege.length){
      const z=document.createElement("div");
      z.className="hinweis abschnitt";
      /* Der Grund für die übrigen muss der sein, der wirklich gilt — bis
         zur achten Jagd nannte der Satz nur zwei der drei Möglichkeiten
         und ließ „kein Vorschlag" aus, den häufigsten von allen. */
      const uebrigWarum=[
        t.handisch.filter(o=>!o.rezept).length ? "kein Vorschlag, die Zahl muss von Hand hinein" : "",
        t.handisch.filter(o=>o.rezept).length ? "Mischgetränk, die Größe gehört zum Bestandteil" : "",
        t.ausschank.length ? "keine Menge im Kassennamen" : ""
      ].filter(Boolean).join(" · ");
      z.innerHTML=`<div>Für ${vorschlaege.length} dieser Zeilen steht oben ein Vorschlag samt Herkunft.
        ${ohneVorschlag ? "Die übrigen "+ohneVorschlag+" bleiben unberührt ("+uebrigWarum+")." : ""}</div>
        <button class="b tat" id="bGebAlle">Alle ${vorschlaege.length} Vorschläge übernehmen</button>`;
      s.appendChild(z);
      const bAlle=z.querySelector("#bGebAlle");
      bAlle.onclick=async()=>{
        bAlle.disabled=true; bAlle.textContent="Wird bestätigt …";
        await bestaetigeAlleGebinde(vorschlaege);   /* zeichnet danach neu */
      };
    }
  }

  const s=document.createElement("section");
  const wein=a.zeilen.filter(r=>r.art==="Wein"), getr=a.zeilen.filter(r=>r.art!=="Wein");
  /* Eine Zeile ohne bestimmbaren Verkauf bekommt KEINE Differenz und
     keine Deutung. Die Entnahme bleibt stehen — sie ist bekannt —, in der
     Differenzspalte steht ein Strich, und der Befund sagt, woran es
     liegt. Seit v28 wieder als Plakette: `p-grau` hatte mit 4,43:1 keinen
     tragfähigen Farbwert und war deshalb keine Plakette wert — mit
     --fg-secondary sind es 5,83:1 auf demselben Grund. Die Plakette sagt
     „kein Abgleich", der Grund steht im Klartext daneben; so trägt die
     Spalte in jeder Zeile dieselbe Form, und die unklaren Zeilen
     verschwinden nicht mehr zwischen den Pillen der anderen. */
  const zeile=r=>`<tr>
    <td>${esc(r.name)}</td>
    <td class="r">${r.unklar?"—":num(r.verkauf)}</td>
    <td class="r">${num(r.entnahme)}</td>
    <td class="r ${r.unklar||Math.abs(r.diff)<0.5?"dim":(r.diff>0?"diff-plus":"diff-minus")}">${
      r.unklar?"—":(r.diff>0?"+":"")+num(r.diff)}</td>
    <td>${r.unklar?'<span class="befund"><span class="pill p-grau">kein Abgleich</span>'
        +'<span class="dim">'+esc(UNKLAR_GRUND[r.unklar]||"Verkauf nicht bestimmbar")+'</span></span>'
        /* Mit Vorbehalt: der Satz daneben sagt, dass ein Teil des Verkaufs
           fehlt. Die Differenz ist damit eine Untergrenze — verschwiegen
           wäre sie eine Behauptung. Welche Plakette dazugehört, entscheidet
           `BEFUND`: bei Differenz 0 die neutrale, nie die grüne. Die Hülle
           `.befund` bekommt nur diese Zeile; eine Zeile ohne Vorbehalt
           sieht aus wie bisher. */
        :(pill=>r.vorbehalt
          ? '<span class="befund">'+pill
            +'<span class="dim">'+esc(vorbehaltSatz(r.vorbehalt))+'</span></span>'
          : pill)(
           (b=>'<span class="pill '+b.k+'">'+esc(b.w)+'</span>')(BEFUND(r)))}</td></tr>`;
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauf Fl.</th><th class="r">Entnahme Fl.</th><th class="r">Differenz</th><th>Befund</th>
    </tr></thead><tbody>
      ${wein.length?`<tr class="zwt"><td colspan="5">Wein</td></tr>`+wein.map(zeile).join(""):""}
      ${getr.length?`<tr class="zwt"><td colspan="5">Getränke</td></tr>`+getr.map(zeile).join(""):""}
      ${a.zeilen.length?"":`<tr><td colspan="5" class="leer">Für diesen Tag gibt es nichts zu vergleichen.</td></tr>`}
    </tbody></table></div>`;
  m.appendChild(s);
}

function csvAbgleich(tag,a){
  const e=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  /* BERICHTIGUNG (zehnte Jagd Runde 16 · B): Im Kopf stand nur
     „Betriebstag <ein Tag>", während JEDE Zahl darunter über `SPANNE`
     Tage summiert ist — Verkauf, Entnahme, Differenz und seit der
     neunten Runde auch „Ohne Zuordnung". Mit sieben Berichten im Fenster
     standen dort 952 Einheiten, wo an diesem Betriebstag 136 verkauft
     wurden. Auf dem Schirm steht der Zeitraum über der Tabelle; in der
     Datei, die weitergereicht wird, stand er nirgends. Die Rechnung war
     richtig, die Skala unbenannt. Jetzt steht sie im Kopf UND im
     Dateinamen. */
  const L=[["Abgleich Verkauf gegen Fassung"].map(e).join(";"),
           ["Betriebstag",tag].map(e).join(";"),
           ["Zeitraum der Zahlen",a.von+" bis "+a.bis].map(e).join(";"),
           ["Spanne",a.spanne+(a.spanne===1?" Tag":" Tage")].map(e).join(";"),
           ["Z-Berichte im Zeitraum",a.berichte+" von "+a.spanne].map(e).join(";"),
           /* NACHTRICHTIGUNG (vierte Jagd · A): Diese Datei wird
              weitergereicht. Sie kannte zwei der vier Wege, auf denen
              Verkauf aus der Rechnung fällt, und trug deshalb Zeilen mit
              dem Befund „stimmt" über einer halben Rechnung. Jetzt steht
              die Bilanz im Kopf, in Einheiten, wie sie die Kasse zählt. */
           ["Verkaufte Einheiten im Zeitraum",num(a.stkGesamt||0)].map(e).join(";"),
           ["davon in dieser Rechnung gerechnet",num(a.stkGerechnet||0)].map(e).join(";"),
           ["davon auf Ignorieren",num(a.stkIgnoriert||0)].map(e).join(";"),
           ["davon ohne Zuordnung oder ohne Größe",
             num(Math.max(0,(a.stkGesamt||0)-(a.stkGerechnet||0)-(a.stkIgnoriert||0)))].map(e).join(";"),
           /* Der fünfte Weg, und der einzige auf der ENTNAHMESEITE
              (Jagd nach Runde 19 · A). Ohne diese Zeile trägt die Datei
              Differenzen, die nur deshalb negativ sind, weil im Keller
              noch gefasst wird. */
           ["Flaschen in noch nicht abgeschlossenen Vorgängen (nicht als Entnahme gerechnet)",
             num(a.stkLaufend||0)].map(e).join(";"),"",
           ["Artikel","Art","Verkauf Fl.","Entnahme Fl.","Differenz","Befund"].map(e).join(";")];
  /* Unklare Zeilen lassen Verkauf und Differenz LEER. Eine 0 in der
     Ausfuhr ist eine Zahl, mit der jemand weiterrechnet — und „0 verkauft,
     7 entnommen" ist genau die Behauptung, die hier niemand belegen kann. */
  a.zeilen.forEach(r=>L.push([r.name,r.art,
    r.unklar?"":num(r.verkauf), num(r.entnahme), r.unklar?"":num(r.diff),
    r.unklar?unklarSatz(r.unklar)
      :BEFUND(r).w                                  /* dasselbe Wort wie in der Tabelle */
       +(r.vorbehalt?" · "+vorbehaltSatz(r.vorbehalt):"")
       +(r.laufend?" · "+num(r.laufend)+" Fl. in einem laufenden Vorgang, nicht gerechnet":"")
    ].map(e).join(";")));
  if(a.offen.length){ L.push("",["Ohne Zuordnung"].map(e).join(";"),["Kassenname","Anzahl"].map(e).join(";"));
    a.offen.forEach(p=>L.push([p.name,p.anzahl].map(e).join(";"))); }
  if(a.ignoriert && a.ignoriert.length){
    L.push("",["Auf Ignorieren — zählt nicht als Verkauf"].map(e).join(";"),
           ["Kassenname","Anzahl"].map(e).join(";"));
    a.ignoriert.forEach(p=>L.push([p.name,p.anzahl].map(e).join(";"))); }
  /* Ohne diesen Block sähe die Ausfuhr vollständig aus, obwohl ein Teil
     des Verkaufs mangels bestätigter Größe gar nicht gerechnet wurde. */
  /* Drei Zustände wie auf dem Schirm, nicht zwei (neunte Jagd · C): Die
     Spalte sagte für „sammelbar" und für „ohne Vorschlag" dasselbe und
     ließ den Unterschied nur an der leeren Spalte daneben erraten. Eine
     eigene Spalte „Was zu tun ist" sagt es geradeheraus. */
  if(a.ohneGroesse.length){ L.push("",["Nicht gerechnet"].map(e).join(";"),
    ["Kassenname","Anzahl","Artikel","Was fehlt","Was zu tun ist","Vorschlag ml"].map(e).join(";"));
    a.ohneGroesse.forEach(o=>L.push([o.name,o.anzahl,
      (o.rezept?"Bestandteil ":"")+artName(o.id),
      o.rezept?"Gebindegröße des Bestandteils"
        :o.fehlt==="ausschank"?"Ausschankmenge im Kassennamen":"Gebindegröße des Artikels",
      sammelbar(o)?"im Backoffice bestätigen (Vorschlag steht bereit)"
        :o.fehlt==="ausschank"?"Kassenname mit Menge oder Rezeptur"
        :o.rezept?"Größe am Bestandteil bestätigen"
        :"Gebindegröße von Hand eintragen",
      sammelbar(o)?(o.geb.ml||""):""].map(e).join(";"))); }
  hol("abgleich_"+(a.spanne>1?a.von+"_bis_"+a.bis:tag)+".csv",
      "\uFEFF"+L.join("\r\n"), "text/csv");
}
function hol(name, inhalt, typ){
  const b=new Blob([inhalt],{type:typ+";charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ── Druckblatt statt PDF-Bibliothek ─────────────────────────────────
   B5 (Runde 18) · Verlangt war ein PDF je Vorgang und eines für die
   Differenzen, zum Sichern und zum Verschicken in die WhatsApp-Gruppe.

   Diese Seite baut KEIN PDF. Sie baut ein Blatt und übergibt es dem
   Browser; das PDF macht der Browser:
     · MacBook · Safari/Chrome: Drucken ▸ links unten „PDF" ▸ „Als PDF sichern"
     · iPad/iPhone: Teilen ▸ Drucken ▸ Vorschau mit zwei Fingern aufziehen ▸ Teilen
   Der Grund ist Regel 8: eine PDF-Bibliothek wäre eine neue Abhängigkeit
   und ein Bauschritt, und sie wöge mehr als alles andere in dieser Datei.
   Der Weg über den Druckdialog kostet nichts, funktioniert offline und
   hängt an keiner Version, die veraltet.

   `#druck` steht sonst auf `display:none` und ist leer; nur zwischen
   Klick und `afterprint` trägt es Inhalt. Aufgeräumt wird über
   `afterprint` — und zur Sicherheit über eine lange Frist, falls ein
   Browser das Ereignis nicht schickt. Die Frist ist bewusst LANG: räumt
   sie, während der Druckdialog noch offen steht, kommt ein leeres Blatt
   aus dem Drucker. */
let DRUCKLAUF=0;
function drucke(titel, inhaltHtml, unterzeile){
  let d=$("#druck");
  if(!d){ d=document.createElement("div"); d.id="druck"; document.body.appendChild(d); }
  d.innerHTML=`<div class="druckkopf">
      <div class="druckhaus">Haus Hirt · Bad Gastein · Fassungstool</div>
      <h1>${esc(titel)}</h1>
      ${unterzeile?`<div class="druckunter">${unterzeile}</div>`:""}
      <div class="druckzeit">Ausgedruckt ${esc(new Date().toLocaleString("de-AT"))}</div>
    </div>`+inhaltHtml;
  document.body.classList.add("drucken");
  const lauf=++DRUCKLAUF;
  const auf=()=>{
    /* Der Horcher geht IMMER ab, auch wenn dieser Lauf nichts mehr zu
       räumen hat — sonst sammelt sich bei jedem Druck einer mehr an. */
    window.removeEventListener("afterprint",auf);
    if(lauf!==DRUCKLAUF) return;           /* ein neuerer Druck läuft schon */
    document.body.classList.remove("drucken"); d.innerHTML="";
  };
  window.addEventListener("afterprint",auf);
  setTimeout(auf, 180000);
  /* Ein Atemzug, damit der Browser das neue Blatt gesetzt hat, bevor er
     es abbildet — Safari druckte sonst den Stand von davor. */
  setTimeout(()=>window.print(), 80);
}

/* Ein Vorgang als Blatt: Kopf, Notiz, jede Mengenliste mit Summe. */
/* Das Blatt und das Fenster zeigen DIESELBE Tafel — eine Quelle, zwei
   Ausgaben. Vorher baute jedes seine eigene Tabelle mit eigener
   Sortierung; dass sie dasselbe zeigten, war Fleiss, nicht Bauart. */
function druckVorgang(v){
  const A=vgTafel(v);
  drucke((MODUSNAME[v.mode]||v.mode)+" · "+deTag(v.tag),
    (vgFreigabeSatz(v)?`<div class="notiz"><b>Achtung:</b> ${esc(vgFreigabeSatz(v))}</div>`:"")
    + (v.notiz?`<div class="notiz"><b>Notiz aus dem Keller:</b> ${esc(v.notiz)}</div>`:"")
    + vgTafelHtml(v, true)
    + `<div class="fuss">Quelle der Zahlen: ${esc(QUELLE)}.${
         /* Der Satz stand auf JEDEM Blatt, auch auf einer Lieferung ohne
            eine einzige Zählung (Jagd nach Runde 18 · C). */
         A.some(x=>/Gezählter Bestand/.test(x.titel))
           ?" Gezählte Bestände sind Ist-Stände, keine Entnahme."
           :""} Dieses Blatt ist ein Auszug — die Wahrheit steht im Fassungstool.</div>`,
    vgKopfZeile(v));
}

/* Das Blatt für die Gruppe: was Verkauf und Fassung NICHT zur Deckung
   bringt. Bewusst ohne Preise und ohne Umsatz — es geht in eine
   WhatsApp-Gruppe, in der nicht alle alles sehen müssen. */
function druckDifferenzen(tag, a){
  const auf=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1)
                    .sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
  const ohne=a.zeilen.filter(r=>r.unklar);
  const plus=auf.filter(r=>r.diff>0), minus=auf.filter(r=>r.diff<0);

  /* NACHTRICHTIGUNG (Jagd nach Runde 18 · A): Dieses Blatt trug die
     Vorbehalte des Bildschirms nicht mit — und ist genau das Blatt, das
     aus dem Haus geht. Der Bildschirm sagt über derselben Tabelle drei
     Dinge, die das Papier verschwieg:
       · wie viele Z-Berichte im Zeitraum FEHLEN (`vAbgleich`, `:2315`),
       · wie viele Kassennamen keinem Artikel zugeordnet sind, deren
         Verkauf also gar nicht in der Rechnung steht (`:2321`),
       · wie viele zugeordnete Namen ohne bestätigte Größe dastehen.
     Mit dem Mapping, wie es live steht, ist das kein Randfall: In
     Bericht 37 sind 136 von 145 verkauften Stück nicht zugeordnet.
     „Verkauft 0 · Geholt 6 · +6 · Schwund" ist dann keine Messung,
     sondern eine Lücke mit einem Vorwurf daneben.
     Deshalb: Die Vorbehalte stehen im Kopf, und solange einer von ihnen
     gilt, fällt das Wort „Schwund" aus der Deutung. */
  const tOG=teileOhneGroesse(a.ohneGroesse);
  const stkOffen=a.offen.reduce((s,o)=>s+(+o.anzahl||0),0);
  const vorbehalte=[];
  /* NACHTRICHTIGUNG (zweite Jagd · A): Zuerst die eine Zahl, die jeden
     Weg mitnimmt — auch die stillen. Danach erst die Gründe. */
  /* NACHTRICHTIGUNG (dritte Jagd · B): `draussen` zählte auch Speisen
     und Kaffee mit. Im bestmöglich gepflegten Zustand blieben von 145
     Einheiten 99 „nicht in der Rechnung", davon 80 Rührei und Espresso —
     das Blatt hätte AB JETZT IMMER „unvollständig" gesagt, und ein
     Warnhinweis, der nie ausgeht, unterscheidet den Normalzustand nicht
     mehr vom Schaden.
     Deshalb zwei Zahlen: was ausdrücklich ausgenommen ist („Ignorieren"
     — eine Entscheidung) und was ungewollt fehlt (eine Lücke). Nur die
     Lücke macht die Rechnung unvollständig. Die Ausnahme steht trotzdem
     im Kasten, weil dort auch ein Getränk stehen kann. */
  const ausgenommen=+a.stkIgnoriert||0;
  const luecke=Math.max(0, (a.stkGesamt||0)-(a.stkGerechnet||0)-ausgenommen);
  if(luecke||ausgenommen) vorbehalte.push(
    "Von "+num(a.stkGesamt)+" verkauften Einheiten im Zeitraum sind "
    +num(a.stkGerechnet)+" in diese Rechnung eingegangen"
    +(ausgenommen?", "+num(ausgenommen)+" ausdrücklich ausgenommen":"")
    +(luecke?" — "+num(luecke)+" fehlen.":".")
    +" Die Gründe stehen darunter.");
  /* Der einzige Vorbehalt, bei dem die ENTNAHME fehlt und nicht der
     Verkauf. Er kehrt das Vorzeichen um: Die Differenz sieht aus, als
     wäre zu viel verkauft worden, während in Wahrheit nur noch nichts
     gebucht ist (Jagd nach Runde 19 · A). */
  if(a.laufendImFenster) vorbehalte.push(
    a.laufendImFenster+(a.laufendImFenster===1?" Vorgang im Zeitraum ist":" Vorgänge im Zeitraum sind")
    +" noch nicht abgeschlossen. "+num(a.stkLaufend)+" Flaschen sind darin erfasst und "
    +"in dieser Rechnung NICHT als Entnahme enthalten — betroffene Zeilen zeigen "
    +"deshalb eher zu wenig geholt als zu viel.");
  /* Ein Bericht ohne eine einzige Position ist keine leere Verkaufsseite,
     sondern eine fehlende (dritte Jagd · B). */
  if(a.berichte && !a.stkGesamt) vorbehalte.push(
    "Der Z-Bericht im Zeitraum enthält keine einzige Position. Die Verkaufsseite "
    +"ist damit nicht leer, sondern unbekannt.");
  if(a.berichte<a.spanne) vorbehalte.push(
    (a.spanne-a.berichte)+" von "+a.spanne+" Tagen sind nicht eingelesen — für sie fehlt "
    +"der Verkauf ganz. Die Differenzen fallen entsprechend zu hoch aus.");
  if(a.offen.length) vorbehalte.push(
    a.offen.length+" Kassenname"+(a.offen.length===1?"":"n")+" ("+num(stkOffen)+" Stück) "
    +(a.offen.length===1?"ist":"sind")+" keinem Artikel zugeordnet. "
    +(a.offen.length===1?"Sein":"Ihr")+" Verkauf fehlt in dieser Rechnung.");
  if(tOG.sammelbar.length+tOG.handisch.length) vorbehalte.push(
    (tOG.sammelbar.length+tOG.handisch.length)+" zugeordnete Kassennamen ("
    +num(tOG.stkSammelbar+tOG.stkHandisch)+" Einheiten) haben keine bestätigte Gebindegröße "
    +"und zählen nicht als Verkauf.");
  if(tOG.ausschank.length) vorbehalte.push(
    tOG.ausschank.length+" zugeordnete Kassennamen ("+num(tOG.stkAusschank)
    +" Einheiten) sagen nicht, wie viel ausgeschenkt wurde, und zählen nicht als Verkauf.");
  if(a.ignoriert && a.ignoriert.length) vorbehalte.push(
    a.ignoriert.length+(a.ignoriert.length===1?" Kassenname (":" Kassennamen (")
    +num(a.stkIgnoriert)+(a.ignoriert.length===1?" Einheiten) steht auf ":" Einheiten) stehen auf ")
    +"\u201eIgnorieren\u201c: Speisen, Kaffee, Fassbier — alles, was nicht aus dem Keller "
    +"kommt. Steht dort ein Getränk, fehlt sein Verkauf in dieser Rechnung.");
  /* Solange irgendein Verkauf fehlt, ist ein Plus kein Befund über den
     Keller. `draussen` deckt auch die Wege ab, für die es keinen eigenen
     Grund in der Liste gibt (zweite Jagd · A). */
  /* Unvollständig ist die Rechnung, wenn etwas UNGEWOLLT fehlt — nicht,
     wenn jemand Rührei ausgenommen hat (dritte Jagd · B). */
  const halbeRechnung = luecke>0 || !a.berichte || a.berichte<a.spanne
                        || (a.berichte>0 && !a.stkGesamt);

  const kopf=`<div class="notiz">
    ${a.berichte
      ? (auf.length
         ? `<b>${auf.length} Position${auf.length===1?"":"en"} gehen nicht auf.</b><br>
            Verglichen wurde, was die Kasse gebucht hat, gegen das, was aus dem Keller
            geholt wurde — über ${a.spanne} Tag${a.spanne===1?"":"e"}, ${a.berichte}
            Z-Bericht${a.berichte===1?"":"e"}. Ein Plus heisst: mehr geholt, als die Rechnung
            an Verkauf kennt. Ein Minus heisst: mehr verkauft als geholt.`
         : `<b>Verkauf und Entnahme decken sich.</b><br>
            Keine Position weicht über eine Flasche ab.`)
      : `<b>In diesem Zeitraum liegt kein Z-Bericht vor.</b><br>
         Ohne ihn ist der Verkauf unbekannt — verglichen ist damit nichts.`}
    </div>`
    + (vorbehalte.length?`<div class="notiz${halbeRechnung?" vorbehalt":""}">
        <b>${halbeRechnung
          ?"Diese Rechnung ist unvollständig — bitte vor dem Weiterleiten lesen:"
          :"Was nicht in dieser Rechnung steht:"}</b>
        <ul>${vorbehalte.map(s=>"<li>"+esc(s)+"</li>").join("")}</ul>
        ${halbeRechnung
          ?`Was fehlt, fehlt auf der VERKAUFSSEITE. Jede Zahl in der Spalte „Verkauft" ist
            deshalb eine Untergrenze, und jedes Plus ist höchstens so groß, wie es dasteht —
            meist kleiner. Ein Plus ist hier kein Nachweis von Schwund.`
          :`Was ausdrücklich ausgenommen ist, gehört nicht in diese Rechnung — solange kein
            Getränk darunter steht. Jedes Plus heisst: im Keller nachsehen.`}</div>`:"");

  const zeilen = auf.length ? `<h2>Nicht ausgeglichen</h2><table><thead><tr>
      <th>Artikel</th><th class="r">Verkauft</th><th class="r">Geholt</th>
      <th class="r">Differenz</th><th>Was das heisst</th></tr></thead><tbody>
      ${auf.map(r=>`<tr>
        <td>${esc(r.name)}<br><span class="mini">${esc(r.art)}</span></td>
        <td class="r">${num(r.verkauf)}</td><td class="r">${num(r.entnahme)}</td>
        <td class="r plus">${r.diff>0?"+":""}${num(r.diff)}</td>
        <td>${halbeRechnung && r.diff>0
              ?"mehr geholt als gerechneter Verkauf — es fehlt Verkauf in der Rechnung"
              :DEUTUNG(r, a.offen.length)}
          ${r.vorbehalt?`<br><span class="mini">${esc(vorbehaltSatz(r.vorbehalt))}</span>`:""}</td>
      </tr>`).join("")}
      <tr class="zwt"><td>Summe</td><td class="r">${num(auf.reduce((s,r)=>s+r.verkauf,0))}</td>
        <td class="r">${num(auf.reduce((s,r)=>s+r.entnahme,0))}</td>
        <td class="r">${(x=>(x>0?"+":"")+num(x))(auf.reduce((s,r)=>s+r.diff,0))}</td>
        <td>${plus.length} über dem Verkauf · ${minus.length} darunter${
          halbeRechnung?" · Verkaufsseite unvollständig, siehe oben":""}</td></tr>
      </tbody></table>` : "";

  const rest = ohne.length ? `<h2>Ohne Abgleich</h2>
    <p class="mini">Für diese Positionen ist der Verkauf nicht bestimmbar. Ihre Entnahme ist
      weder Abweichung noch Schwund — sie gehören nicht in die Rechnung oben.</p>
    <table><thead><tr><th>Artikel</th><th class="r">Geholt</th><th>Warum kein Abgleich</th>
      </tr></thead><tbody>${ohne.map(r=>`<tr>
        <td>${esc(r.name)}</td><td class="r">${num(r.entnahme)}</td>
        <td>${esc(UNKLAR_GRUND[r.unklar]||"Verkauf nicht bestimmbar")}</td></tr>`).join("")}
      </tbody></table>` : "";

  drucke("Verkauf ↔ Fassung · was nicht aufgeht",
    kopf + zeilen + rest
    + `<div class="fuss">Gerechnet in Flaschen: Anzahl × Ausschank in Millilitern, geteilt durch
       das Gebinde. Was am Abend verkauft wird, holt oft erst der nächste Tag nach — über einen
       einzelnen Tag verschiebt das jede Zeile, über eine Woche gleicht es sich aus.
       ${halbeRechnung?"Dieses Blatt zeigt eine unvollständige Rechnung — der Kasten oben sagt, was fehlt. ":""}
       Quelle der Zahlen: ${esc(QUELLE)}.</div>`,
    "Betriebstag "+esc(deTag(a.bis))+(a.spanne>1?" · Zeitraum "+esc(deTag(a.von))+" bis "+esc(deTag(a.bis)):"")
      +" · "+a.berichte+" von "+a.spanne+" Tagen eingelesen"
      +(halbeRechnung?" · <b>unvollständige Rechnung</b>":""));
}

/* ── Z-Bericht einlesen ─────────────────────────────────────────────── */
function vImport(m){
  m.innerHTML=`<section><h2>Z-Bericht</h2>
    <div class="unter">Der gastronovi-Bericht über den Vortag, morgens gezogen.
    Datei hierher ziehen oder den Text einfügen.</div></section>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="zone" id="zone">Bericht hierher ziehen<br><span class="mini">oder klicken, um eine Datei zu wählen</span></div>
    <div style="margin-top:16px"><textarea id="roh" placeholder="… oder den Inhalt hier einfügen"></textarea></div>
    <div class="reihe" style="margin-top:12px">
      <button class="b stark" id="bLies">Einlesen</button>
      <span class="mini" id="stat"></span></div>`;
  m.appendChild(s);

  const zone=$("#zone"), roh=$("#roh");
  const datei=f=>{ const fr=new FileReader(); fr.onload=()=>{ roh.value=fr.result; pruefe(); }; fr.readAsText(f,"utf-8"); };
  zone.onclick=()=>{ const i=document.createElement("input"); i.type="file";
    i.accept=".csv,.txt,text/*"; i.onchange=()=>i.files[0]&&datei(i.files[0]); i.click(); };
  zone.ondragover=e=>{ e.preventDefault(); zone.classList.add("ueber"); };
  zone.ondragleave=()=>zone.classList.remove("ueber");
  zone.ondrop=e=>{ e.preventDefault(); zone.classList.remove("ueber");
    if(e.dataTransfer.files[0]) datei(e.dataTransfer.files[0]); };

  const vor=document.createElement("section"); vor.id="vor"; m.appendChild(vor);

  /* Die Vorschau zeigt, was der SERVER gelesen hat — nicht, was diese
     Seite vermutet. Vor dem Einlesen gibt es deshalb keine Zahlen,
     sondern nur den Hinweis, dass der Bericht bereitliegt. */
  function pruefe(){
    const t=roh.value.trim();
    $("#stat").textContent = t ? "Bereit zum Einlesen" : "";
  }

  function zeigeVorschau(tag){
    const z=ZBER[tag]; if(!z){ vor.innerHTML=""; return; }
    let auto=0, offen=0, ign=0;
    z.positionen.forEach(p=>{ const zu=zuordnung(p);
      if(zu.status==="offen") offen++; else if(zu.status==="ignoriert") ign++; else auto++; });
    /* Die Tabellenhülle bringt ihre Scrollfläche jetzt selbst mit —
       das frühere Inline-Styling würde die neue Regel überschreiben. */
    vor.innerHTML=`<h3>Eingelesen</h3>
      <div class="gitter g4" style="margin-bottom:16px">
        <div class="kpi kpi--status"><span>Betriebstag</span><b>${z.tag?esc(deTag(z.tag)):"nicht erkannt"}</b><small>${esc(z.nr||"")}</small></div>
        <div class="kpi"><span>Positionen</span><b>${z.positionen.length}</b><small>${eur(z.umsatz)}</small></div>
        <div class="kpi"><span>Zugeordnet</span><b>${auto}</b><small>${ign} ignoriert</small></div>
        <div class="kpi ${offen?"warn":"ok"}"><span>Offen</span><b>${offen}</b><small>brauchen eine Zuordnung</small></div>
      </div>
      <div class="tabhuelle"><table><thead><tr>
        <th>Kassenname</th><th class="r">Anzahl</th><th class="r">Umsatz</th><th>Zuordnung</th><th class="r">Flaschen</th>
      </tr></thead><tbody>${z.positionen.map(p=>{
        const zu=zuordnung(p); const w=zu.id?byId(zu.id):null;
        const nm=zu.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
          :zu.status==="offen"?'<span class="pill p-bad">offen</span>'
          :`${esc(w?w.winzer+" · "+w.wein:GN(zu.id))} <span class="pill ${zu.status==="auto"?"p-neu":"p-ok"}">${zu.status==="auto"?"automatisch":"bestätigt"}</span>`;
        return `<tr><td>${esc(p.name)}</td>
          <td class="r">${num(p.anzahl)}</td><td class="r">${p.umsatz?eur(p.umsatz):"—"}</td>
          <td>${nm}</td><td class="r">${(f=>!zu.id?"—":f.ok?num(f.fl)
            /* BERICHTIGUNG (achte Jagd Runde 16 · B): Hier stand pauschal
               „Größe fehlt" — für BEIDE Ursachen, und das ist die
               Ansicht, in der die Leitung den Bericht ZUERST sieht. Bei
               Bericht 37 haben 26 von 48 Positionen keine Menge im
               Kassennamen; für die ist „Größe fehlt" die Falschauskunft,
               die Mittagsblick, Überschrift und CSV in dieser Runde
               losgeworden sind. `flaschen()` trennt sauber, also wird hier
               gefragt statt geraten. */
            :`<span class="dim">${esc(UNKLAR_GRUND[f.fehlt==="ausschank"?"menge":"groesse"])}</span>`)(zu.id?flaschen(p,zu.id):null)}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  }
  roh.oninput=pruefe;

  $("#bLies").onclick=async()=>{
    const text=roh.value.trim();
    if(!text) return toast("Erst einen Bericht einfügen");
    const b=$("#bLies"); b.disabled=true; $("#stat").textContent="Wird eingelesen …";
    try{
      const r=await fetch("/api/fassungsliste",{method:"POST",
        headers:{"content-type":"text/plain;charset=utf-8"}, body:text});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        $("#stat").textContent="";
        return toast(r.status===403 ? "Nur die Leitung darf Berichte einlesen"
          : j.fehler || "Der Bericht wurde nicht angenommen");
      }
      await ladeBerichte();
      $("#stat").textContent="";
      toast("Z-Bericht für "+deTag(j.tag)+" eingelesen"
        + (j.storno ? " · "+j.storno+" storniert, ohne Artikel" : ""));
      zeigeVorschau(j.tag);
      vAbgleich.tag=j.tag;
      SEITE=(function(){const a=abgleich(j.tag); return a.offen.length?"zuordnung":"abgleich";})();
      zeichne();
    }catch(e){
      $("#stat").textContent="";
      toast("Keine Verbindung — ohne Server kann der Bericht nicht eingelesen werden");
    }finally{ b.disabled=false; }
  };

  const alt=Object.keys(ZBER).sort().reverse();
  const s2=document.createElement("section");
  s2.innerHTML=`<h3>Auf dem Server</h3>` + (alt.length
    ? `<div class="tabhuelle"><table><thead><tr>
        <th>Betriebstag</th><th>Bericht</th><th class="r">Positionen</th><th class="r">Umsatz</th><th></th>
        </tr></thead><tbody>${alt.map(t=>`<tr>
          <td>${esc(deTag(t))}</td><td class="dim">${esc(ZBER[t].nr||"—")}</td>
          <td class="r">${ZBER[t].positionen.length}</td><td class="r">${eur(ZBER[t].umsatz)}</td>
          <td class="r"><button class="b klein" data-auf="${t}">Ansehen</button></td></tr>`).join("")}
        </tbody></table></div>
       <div class="mini" style="margin-top:8px">Auch die Berichte, die per Mail hereingekommen sind.
         Derselbe Betriebstag zweimal eingelesen ersetzt den alten — löschen muss niemand.</div>`
    : `<div class="karte leer">Auf dem Server liegt noch kein Z-Bericht.</div>`);
  m.appendChild(s2);
  s2.querySelectorAll("[data-auf]").forEach(b=>b.onclick=()=>zeigeVorschau(b.dataset.auf));

  /* B2 · Die Kachel „Z-Berichte" im Mittagsblick hinterlässt hier den
     Tag, den sie meint, und die Vorschau öffnet sich von selbst. Die
     Notiz wird beim Lesen verbraucht, damit sie beim nächsten Besuch
     dieser Seite nicht ein zweites Mal aufspringt. */
  const zeig=vImport.zeig; vImport.zeig=null;
  if(zeig && ZBER[zeig]) zeigeVorschau(zeig);
}

/* ── Kellerbestand ──────────────────────────────────────────────────── */
function vBestand(m){
  const B=bestand(), V=verbrauch();
  m.innerHTML=`<section><h2>Kellerbestand</h2>
    <div class="unter">Jüngste Zählung, fortgeschrieben mit allem, was seither ein- und ausgegangen ist.</div></section>`;

  if(!B.hat){
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis warn">Es liegt keine Kellerzählung vor.
       Ohne Zählung gibt es keinen Bestand — nur die Bewegung der letzten Vorgänge.</div></section>`);
  }else{
    m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis">Basis ist die Zählung vom ${esc(deTag(B.basis.tag))}${B.basis.name?" durch "+esc(B.basis.name):""}.
       Seither ${summe(B.seit.ein)} Flaschen eingegangen, ${summe(B.seit.raus)} entnommen.</div></section>`);
    /* Lieferung am Zähltag selbst: weder Fehler noch Warnung, sondern eine
       Angabe — deshalb `hinweis` ohne `warn`/`bad`. Ein Artikel wird beim
       Namen genannt, mehrere nur gezählt (der Satz bliebe sonst unlesbar);
       die Einzelmenge steht ohnehin in der Zeile des Artikels. */
    const uIds=Object.keys(B.unklar||{}).filter(id=>B.unklar[id]>0);
    if(uIds.length){
      const w0=byId(uIds[0]);
      const wer=uIds.length===1
        ?`${num(B.unklar[uIds[0]])} Flaschen ${w0?w0.winzer+" · "+w0.wein:uIds[0]}`
        :`${num(summe(B.unklar))} Flaschen zu ${uIds.length} Artikeln`;
      m.insertAdjacentHTML("beforeend",
        `<section><div class="hinweis">Am Zähltag wurden ${esc(wer)} geliefert — ob die Zählung
         sie schon enthält, ist nicht feststellbar. Sie sind im Bestand nicht mitgerechnet;
         der Bestand ist insoweit eher zu niedrig als zu hoch.</div></section>`);
    }
    /* Zwei verschiedene Lagen, zwei verschiedene Maßnahmen — siehe
       `minusGeteilt`. Die erklärte Lage ist eine Angabe, keine Warnung. */
    const M=minusGeteilt(B);
    if(M.echt.length) m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis bad">${M.echt.length} Positionen stehen rechnerisch unter null.
       Entweder wurde ohne Vorgang aus dem Keller geholt, oder die Zählung ist zu alt.
       Beides löst dieselbe Maßnahme aus: neu zählen.</div></section>`);
    if(M.erklaert.length) m.insertAdjacentHTML("beforeend",
      `<section><div class="hinweis">${M.erklaert.length} weitere Position${M.erklaert.length===1?"":"en"}
       ${M.erklaert.length===1?"steht":"stehen"} nur deshalb unter null, weil die Lieferung vom Zähltag
       nicht mitgerechnet ist. Das ist kein Zählfehler — im Keller nachsehen genügt.</div></section>`);
  }

  const zonen={};
  WINES.forEach(w=>{ const z=PLAN.zone[w.id]||7; (zonen[z]=zonen[z]||[]).push(w); });
  const reihen=[];
  Object.keys(zonen).map(Number).sort((a,b)=>a-b).forEach(z=>{
    reihen.push(`<tr class="zwt"><td colspan="7">${esc((PLAN.zonen[z]||{}).t||("Zone "+z))} · ${esc((PLAN.zonen[z]||{}).s||"")}</td></tr>`);
    zonen[z].sort((a,b)=>(PLAN.restorder[a.id]??999)-(PLAN.restorder[b.id]??999)).forEach(w=>{
      const b=B.b[w.id], pt=V.proTag[w.id]||0;
      const u=unklarMenge(B,w.id);               /* am Zähltag geliefert, nicht mitgerechnet */
      const rw = b==null||!pt ? Infinity : (b<=0 ? 0 : b/pt);
      const soll=PLAN.soll[w.id]||0;
      const anteil=b!=null&&soll?Math.min(100,Math.round(b/(soll*4)*100)):0;
      reihen.push(`<tr>
        <td><b>${esc(w.winzer)}</b> · ${esc(w.wein)} <span class="mini">${esc(w.jg)}</span>
          ${u?`<div class="mini">${esc(unklarZeilenSatz(u))}</div>`:""}</td>
        <td class="mini">${esc(w.reb)}</td>
        <td class="r">${b==null?'<span class="dim">—</span>'
          :b<0?`<b class="neg">${num(b)}</b>`:`<b>${num(b)}</b>`}</td>
        <td class="r dim">${soll||"—"}</td>
        <td class="r">${pt?num(pt):'<span class="dim">—</span>'}</td>
        <td class="r">${rw===Infinity?'<span class="dim">—</span>':
          b<=0?'<span class="pill p-bad">leer</span>':
          `<span class="pill ${rw<7?"p-bad":rw<EINST.reichweite?"p-warn":"p-ok"}">${Math.floor(rw)} T</span>`}</td>
        <td><div class="balken"><i class="${b!=null&&b<6?"knapp":anteil>60?"satt":""}" style="width:${anteil}%"></i></div></td>
      </tr>`);
    });
  });

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Rebsorte</th><th class="r">Bestand Fl.</th><th class="r">Soll Schrank</th>
    <th class="r">Pro Tag</th><th class="r">Reicht</th><th>&nbsp;</th>
    </tr></thead><tbody>${reihen.join("")}</tbody></table></div>
    <div class="mini" style="margin-top:10px">Verbrauch je Tag über die letzten ${V.tage} erfassten Tage.</div>`;
  m.appendChild(s);
}

/* ── Nachbestellen ──────────────────────────────────────────────────── */
function bestellliste(){
  const B=bestand(), V=verbrauch(), out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id]; if(b==null) return;
    const pt=V.proTag[w.id]||0; if(!pt) return;
    const rw = b<=0 ? 0 : b/pt; if(rw>=EINST.reichweite) return;
    const kg=(PLAN.kiste||{})[w.id]||6;
    const ziel=Math.ceil(pt*EINST.reichweite*1.5);        /* auf anderthalb Fenster auffüllen */
    const kisten=Math.max(1, Math.ceil(Math.max(0,ziel-Math.max(0,b))/kg));
    /* Am Zähltag geliefert und deshalb nicht im Bestand (Entscheidung
       Nr. 10): dieselbe Formel ein zweites Mal, mit der oberen statt der
       unteren Zahl. Keine neue Regel — dieselbe Regel auf beide Enden
       angewandt. Ergibt sie weniger Kisten, ist der Vorschlag eine Spanne
       statt einer Zahl, und die Zeile sagt warum. Ohne das schlug die
       Liste für einen Wein 11 × 12 Flaschen vor, während 16 im Keller
       standen (Zählung 10, Lieferung 24 am selben Tag, dreimal 6 gefasst). */
    const u=unklarMenge(B,w.id);
    const kistenMin = u ? Math.ceil(Math.max(0,ziel-Math.max(0,b+u))/kg) : kisten;
    out.push({w, bestand:b, proTag:pt, reichweite:rw, kg, kisten, unklar:u,
              kistenMin:Math.min(kistenMin,kisten)});
  });
  return out.sort((a,b)=>a.reichweite-b.reichweite);
}
/* „5–11" statt „11", sobald die beiden Enden auseinanderfallen. */
const bestellSpanne = (r,fl) => (x=>r.kistenMin===r.kisten
  ? String(x(r.kisten)) : x(r.kistenMin)+"–"+x(r.kisten))(k=>fl?k*r.kg:k);
function vBestellen(m){
  const L=bestellliste();
  m.innerHTML=`<section><h2>Nachbestellen</h2>
    <div class="unter">Alles, dessen Bestand bei gleichbleibendem Verbrauch keine ${EINST.reichweite} Tage mehr trägt.
    Der Vorschlag füllt auf das Anderthalbfache dieses Fensters auf, aufgerundet auf ganze Kisten.</div></section>`;
  if(!L.length){

     (elfte Jagd Runde 16 · B) — vorher baute jede ihre eigene Liste. */
  const L=alleKassennamen().sort((a,b)=>{
    const za=zuordnung(a), zb=zuordnung(b);

    `<optgroup label="Getränke">${GIDS.map(id=>`<option value="${id}">${esc(GN(id))}</option>`).join("")}</optgroup>`;

  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Kassenname</th><th class="r">Menge gesamt</th><th>Zuordnung</th><th>Zustand</th></tr></thead><tbody>
    ${L.map(p=>{ const z=zuordnung(p);
      return `<tr><td>${esc(p.name)}</td><td class="r">${num(p.anzahl)}</td>
        <td><select class="klein" data-name="${esc(p.name)}">${optionen}</select></td>
        <td>${z.status==="offen"?'<span class="pill p-bad">offen</span>'
            :z.status==="auto"?'<span class="pill p-neu">automatisch — bestätigen</span>'
            :z.status==="ignoriert"?'<span class="pill p-grau">ignoriert</span>'
            :'<span class="pill p-ok">festgelegt</span>'}</td></tr>`;
    }).join("")}</tbody></table></div>
    <div class="reihe" style="margin-top:16px">
      <button class="b stark" id="bAuto">Alle automatischen Weinvorschläge übernehmen</button></div>`;
  m.appendChild(s);

  s.querySelectorAll("select[data-name]").forEach(sel=>{
    const nm=sel.dataset.name, z=zuordnung({name:nm});
    sel.value = MAP[nm] ? MAP[nm] : (z.status==="auto" ? z.id : "");
    sel.onchange=async()=>{
      const wert=sel.value, vorher=MAP[nm];
      if(wert) MAP[nm]=wert; else delete MAP[nm];
      schreib(K_MAP,MAP);
      /* Die bestätigte Gebindegröße gehörte zum bisherigen Artikel. Nach
         einem Wechsel ist sie nicht mehr bestätigt — sonst rechnet die
         neue Zuordnung mit der Flasche der alten. */
      if(GEB_BEST[nm]!=null && wert!==vorher){ delete GEB_BEST[nm]; schreib(K_GEB,GEB_BEST); }
      const ok=await sendeZuordnung(nm, wert);
      zeichne();
      if(ok) toast("Zuordnung gespeichert");
    };
  });
  $("#bAuto").onclick=async()=>{
    const neu=[];
    L.forEach(p=>{ if(MAP[p.name]) return; const a=autoWein(p.name); if(a) neu.push([p.name,a.id]); });
    if(!neu.length) return toast("Kein Vorschlag offen");

    schreib(K_MAP,MAP); $("#bAuto").disabled=false; zeichne();

/* ════════════ 7d · Zählliste ════════════
   Zählen nach Bedarf statt nach Kalender. Wer weiß, welche zwölf
   Positionen auseinanderlaufen, zählt in fünf Minuten das Richtige —
   statt in einer Stunde alles, und das zu selten. */
function zaehlliste(){
  const B=bestand(), V=verbrauch(), t=letzterTag(), A=abgleich(t, SPANNE);
  const dif={}; A.zeilen.forEach(r=>dif[r.id]=r.diff);
  const out=[];
  WINES.forEach(w=>{
    const b=B.b[w.id], d=dif[w.id]||0, pt=V.proTag[w.id]||0, u=unklarMenge(B,w.id);
    let grund=null, rang=9;
    /* Zählen ist hier genau die richtige Maßnahme — sie beendet die
       Ungewissheit über die Lieferung vom Zähltag. Der Grund muss sie aber
       beim Namen nennen: „rechnerisch unter null" allein liest sich wie
       Schwund, und Rang 0 (rot) stellte den Wein vor die echten Minusse.
       Die Zahl selbst bleibt unverändert (Entscheidung Nr. 10). */
    if(b!=null && b<0){
      const satz=u?" — am Zähltag "+num(u)+" Fl. geliefert, nicht mitgerechnet":"";
      /* Deckt die ausgewiesene Lieferung das Minus ganz, ist es keins;
         deckt sie es nur teilweise, bleibt Rang 0 — die Angabe reist
         trotzdem mit. */
      if(u && b+u>=0){ grund=satz.replace(" — ",""); rang=1; }
      else { grund="rechnerisch unter null"+satz; rang=0; }
    }
    else if(Math.abs(d)>=3){ grund="Verkauf und Entnahme "+num(Math.abs(d))+" Fl. auseinander"; rang=1; }
    else if(b!=null && b<6 && pt>0){ grund="unter einer Reihe"; rang=2; }
    if(!grund) return;
    out.push({w, bestand:b, diff:d, grund, rang, unklar:u});
  });
  return out.sort((a,b)=>a.rang-b.rang || Math.abs(b.diff)-Math.abs(a.diff));
}
function vZaehlliste(m){
  const L=zaehlliste();
  m.innerHTML=`<section><h2>Zählliste</h2>
    <div class="unter">Nicht alles, sondern das Auffällige. Positionen unter null, Positionen deren
    Verkauf und Entnahme über ${SPANNE} Tage auseinanderlaufen, und was unter eine Reihe gefallen ist.</div></section>`;
  if(!L.length){
    m.insertAdjacentHTML("beforeend",`<section><div class="karte leer">Nichts zu prüfen — alles im Rahmen.</div></section>`);
    return;
  }
  const s=document.createElement("section");
  s.innerHTML=`<div class="tabhuelle"><table><thead><tr>
    <th>Wein</th><th>Kellerbereich</th><th class="r">Rechnerisch</th><th>Warum zählen</th>
    </tr></thead><tbody>${L.map(r=>`<tr>
      <td><b>${esc(r.w.winzer)}</b> · ${esc(r.w.wein)} <span class="mini">${esc(r.w.jg)}</span></td>
      <td class="deutung">${esc((PLAN.zonen[PLAN.zone[r.w.id]]||{}).t||"—")}</td>
