    +" "+d.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
}

async function ladeZuordnung(){
  try{
    const r=await fetch("/api/mapping",{headers:{Accept:"application/json"}});
    if(!r.ok) return false;
    const j=await r.json(), neu={}, gb={};
    (j.mapping||[]).forEach(m=>{
      if(m.ignoriert) neu[m.kassenname]="__ignoriert";
      else if(m.artikel) neu[m.kassenname]=m.artikel;
      /* Die bestätigte Gebindegröße liefert der Server seit je mit; bis v24
         hat diese Seite sie weggeworfen und statt dessen geraten. */
      if(+m.gebinde_ml>0) gb[m.kassenname]=+m.gebinde_ml;
    });
    MAP=neu; GEB_BEST=gb; schreib(K_MAP,MAP); schreib(K_GEB,GEB_BEST); return true;
  }catch(e){ return false; }
}

/* Eine Zuordnung geht sofort hinaus. Der Worker zieht die schon
   eingelesenen Zeilen nach, die Zuordnung gilt also auch rückwirkend.

   ACHTUNG: `POST /api/mapping` schreibt die Zeile als GANZES
   (`ON CONFLICT … SET artikel=excluded.artikel, gebinde_ml=excluded.…`,
   src/index.js). Wer nur ein Feld schickt, löscht die anderen. Artikel und
   Gebindegröße gehen deshalb immer gemeinsam hinaus; `gebindeMl` ist
   optional und heisst „unverändert lassen". */
async function sendeZuordnung(name, wert, gebindeMl){
  const ml = gebindeMl!==undefined ? gebindeMl : (+GEB_BEST[name]||null);
  const koerper={ kassenname:name,
    artikel: wert && wert!=="__ignoriert" ? wert : null,
    ignoriert: wert==="__ignoriert" ? 1 : 0,
    gebinde_ml: ml || null };
  try{
    const r=await fetch("/api/mapping",{method:"POST",
      headers:{"content-type":"application/json"}, body:JSON.stringify(koerper)});
    if(r.ok) return true;
    toast(r.status===403 ? "Nur die Leitung darf zuordnen" : "Nicht gespeichert");
  }catch(e){ toast("Keine Verbindung — die Zuordnung ist nur auf diesem Gerät"); }
  return false;
}

/* Einen Vorschlag zur Gebindegröße annehmen. Nur von Hand, nur je Position:
   der Vorschlag ist aus dem Namen gelesen, bestätigen kann ihn nur jemand,
   der die Flasche kennt. Der Artikel geht mit hinaus (siehe oben) — damit
   wird ein automatischer Weinvorschlag mit demselben Klick festgeschrieben,
   deshalb steht er in der Zeile daneben. */
async function bestaetigeGebinde(name, artId, ml){
  ml=+ml||0; if(!name || !artId || !ml) return;
  /* Zweiter Riegel neben der Ansicht: Für eine Kassenposition mit
     Rezeptur ist `artId` ein BESTANDTEIL. `MAP[name]=artId` hiesse „Aperol
     Spritz ist Prosecco", und der Worker schreibt das rückwirkend in jede
     gespeicherte Berichtszeile. Es gibt keinen Papierkorb. */
  if(REZ[name] && REZ[name].length)
    return toast("Mischgetränk — die Größe wird beim Bestandteil bestätigt, nicht hier");
  GEB_BEST[name]=ml; if(MAP[name]!==artId){ MAP[name]=artId; schreib(K_MAP,MAP); }
  schreib(K_GEB,GEB_BEST);
  const ok=await sendeZuordnung(name, artId, ml);
  zeichne();
  toast(ok ? "Gebinde bestätigt: "+ml+" ml"
           : "Nur auf diesem Gerät gemerkt — der Server hat es nicht angenommen");
}

/* Dieselbe Bestätigung für eine ganze Liste. Der Anlass steht in der
   Datenbank: alle Zuordnungen haben `gebinde_ml = NULL`. Seit v25 rechnet
   keine Position ohne bestätigte Größe mehr mit — ohne einen Sammelweg
   müsste die Leitung am ersten Morgen dreizehnmal einzeln klicken, nur um
   überhaupt eine Zahl zu sehen.

   Drei Eigenschaften, die hier wichtig sind:
   1. Jede Zeile geht EINZELN über `POST /api/mapping` hinaus — es gibt
      keinen Sammelendpunkt, und es soll auch keiner erfunden werden.
   2. Gemerkt wird erst, was der Server angenommen hat. Anders als beim
      einzelnen Klick (dort sieht der Mensch die Rückmeldung sofort und
      kann es wiederholen) wäre eine halb übernommene Liste im Gerät sonst
      eine zweite Wahrheit neben der Datenbank.
   3. Scheitert eine Anfrage, wird ABGEBROCHEN, nicht weitergemacht: der
      wahrscheinliche Grund ist kein Zufall, sondern fehlendes Netz oder
      ein fehlendes Recht (403), und beides gilt für alle folgenden Zeilen
      genauso. Was durchkam, steht; der Rest bleibt unangetastet in der
      Liste stehen und kann später noch einmal. */
async function bestaetigeAlleGebinde(liste){
  const gueltig=(liste||[]).filter(o=>o && o.id && +o.ml>0
    && !(REZ[o.name] && REZ[o.name].length));    /* nie eine Rezeptzeile, siehe oben */
  if(!gueltig.length) return {bestaetigt:0, gesamt:0};
  let n=0, abbruch=false;
  for(const o of gueltig){
    const ok=await sendeZuordnung(o.name, o.id, +o.ml);
    if(!ok){ abbruch=true; break; }
    GEB_BEST[o.name]=+o.ml; MAP[o.name]=o.id; n++;
  }
  schreib(K_GEB,GEB_BEST); schreib(K_MAP,MAP);
  zeichne();
  toast(abbruch
    ? n+" von "+gueltig.length+" Größen bestätigt — der Rest steht noch da"
    : n+" Größen bestätigt");
  return {bestaetigt:n, gesamt:gueltig.length};
}

function dateiLaden(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const j=JSON.parse(fr.result);
        const alle=[];
        const sammle=o=>Object.values(o||{}).forEach(v=>{ if(v&&v.mode) alle.push(v); });
        if(Array.isArray(j)) j.forEach(v=>{ if(v&&v.mode) alle.push(v); });
        else { sammle(j[K_ARCHIV]); sammle(j[K_STAND]); sammle(j.archiv); sammle(j.stand); sammle(j); }
        if(!alle.length) return toast("Keine Vorgänge in der Datei gefunden");
        VORGAENGE=alle.map(normVorgang).filter(Boolean).sort(nachZeit);
        QUELLE="Datei · "+f.name; zeichne(); toast(alle.length+" Vorgänge eingelesen");
      }catch(e){ toast("Datei nicht lesbar"); }
    };
    fr.readAsText(f);
  };
  i.click();
}

/* ── Was die Quelle für die Zahlen bedeutet ──────────────────────────────
   Bis Runde 3 hat der Server nie einen Vorgang geliefert (er schrieb gegen
   Spalten, die es in der Live-D1 nicht gibt) — die Leitung lief IMMER im
   Rückfall und der Chip stand auf „Lokal", mit grünem Punkt. Jetzt kommen
   echte Serverdaten, und der Unterschied muss lesbar sein: ein leerer
   Server ist etwas anderes als ein stummer Server.
   Vier Felder: Dringlichkeit · Überschrift · Erklärung · Knopf.           */
const QUELLLAGE={
  "Server":      null,
  "Lokal":       ["warn","Der Server antwortet nicht.",
    "Gezeigt wird der Stand aus dem Speicher dieses Browsers. Er kann alt sein, "+
    "und was auf anderen Geräten seither gefasst wurde, fehlt darin.","neu"],
  "Keine Daten": ["bad","Der Server antwortet nicht, und dieser Browser hat keinen Stand.",
    "Jede Zahl auf dieser Seite ist leer. Das ist kein Befund über den Keller — "+
    "es ist gar keine Auskunft.","neu"],
  "Nicht angemeldet":["bad","Die Sitzung ist abgelaufen.",
    "Ohne Anmeldung gibt der Server nichts heraus. Im Fassungstool neu anmelden, "+
    "dann hierher zurück.","tuer"],
  "Datei":       ["info","Gezeigt wird eine eingelesene Datei.",
    "Das ist ein Auszug von einem Gerät, nicht der laufende Betrieb. "+
    "Der Knopf daneben holt wieder den Server.","neu","Aktualisieren"],
  /* Diesen Satz liest die Leitung am ersten Morgen nach dem Livegang. Er darf
     nicht nach Störung klingen: Es ist nichts kaputt, es war nur noch kein
     Abendservice. Drei Sätze, jeder mit einer Aufgabe — was ist der Fall,
     wann ändert es sich, und woran erkenne ich, dass doch etwas hängt. */
  "Leer":        ["info","Der Server antwortet — angekommen ist noch keine Fassung.",
    "Das ist am Anfang normal: Die erste Tagesfassung kommt nach dem Abendservice. "+
    "Bis dahin ist jede Null auf dieser Seite eine Leerstelle, kein Ergebnis. "+
    "Bleibt es leer, obwohl im Keller gefasst wurde, hängt der Vorgang noch auf dem "+
    "Gerät — die Zeile unter dem Kopf sagt dort, wie viele warten.","neu","Nochmal nachsehen"]
};
function quellSchluessel(){
  if(String(QUELLE).startsWith("Datei")) return "Datei";
  if(QUELLE==="Server" && !VORGAENGE.length) return "Leer";
  return QUELLE;
}
/* Ein Satz statt eines Wortes — „Stand aus Keine Daten" stand wirklich so da. */
function quelleSatz(){
  const k=quellSchluessel();
  if(k==="Server") return "Stand vom Server";
  if(k==="Leer") return "Server ohne Vorgänge";
  if(k==="Lokal") return "Stand aus dem Browserspeicher";
  if(k==="Datei") return "Stand aus "+QUELLE.replace(/^Datei · /,"Datei ");
  if(k==="Nicht angemeldet") return "nicht angemeldet";
  return "kein Stand";
}
function quellBanner(m){
  const l=QUELLLAGE[quellSchluessel()]; if(!l) return;
  const [stufe,titel,text,knopf,knopfText]=l;
  const d=document.createElement("div");
  d.className="quellzeile "+(stufe==="warn"?"":stufe);
  d.setAttribute("role","status");
  d.innerHTML=`<div class="txt"><b>${esc(titel)}</b>${esc(text)}</div>`+
    (knopf==="tuer"
      ? `<a class="b stark" href="index.html">Zum Fassungstool</a>`
      : `<button class="b" data-quellneu>${esc(knopfText||"Erneut versuchen")}</button>`);
  const k=d.querySelector("[data-quellneu]");
  if(k) k.onclick=async()=>{ await ladeDaten(); zeichne(); };
  const erste=m.querySelector("section");
  if(erste) erste.insertAdjacentElement("afterend", d); else m.prepend(d);
}

/* ════════════ 4 · Bestand fortschreiben ════════════
   Bestand = jüngste Zählung + alles danach Eingegangene − alles danach Entnommene.
   Ohne Zählung gibt es keinen Bestand, nur Bewegung — das wird auch so gesagt. */
/* ── Was gebucht ist, und was erst läuft ──────────────────────────────
   NACHTRICHTIGUNG (Analyse Runde 19 · A): Der Worker leitet Journalzeilen
   ERST beim Abschluss ab (`src/index.js`, `ereignisseAbleiten` läuft nur
   bei `fertig`). Die App schickt aber alle 45 Sekunden ihren
   Zwischenstand hinaus (`public/index.html`, `zwischenstand`), der Server
   legt ihn mit `status='offen'` ab, und `/api/vorgaenge` gibt ihn
   ungefiltert wieder heraus.

   `bestand()`, `verbrauch()`, `abgleich()` und die Getränkeansicht haben
   `fertig` an keiner Stelle geprüft und damit gerechnet, was noch gar
   nicht gebucht ist. Gemessen: Kellerzählung 12 Flaschen abgeschlossen,
   darauf eine LAUFENDE Tagesfassung mit 5 entnommenen — Worker 12,
   dieser Schirm 7. Solange im Keller gefasst wird (Stunden), zeigte die
   Leitung die Entnahme schon als Tatsache; blieb ein Gerät hängen (Akku
   leer), dauerhaft.

   Die Rechnungen sehen ab hier dasselbe wie das Journal. Wer den
   laufenden Vorgang SEHEN will, ist richtig in „Eingänge" und im
   Mittagsblick — beide lesen weiter `VORGAENGE` und sagen „läuft". */
const gebucht = () => VORGAENGE.filter(v=>v.fertig);

function bestand(){
  /* Je Artikel die JÜNGSTE Zählung, nicht eine Zählung für alle.

     Bis v22 suchte diese Rechnung einen einzigen Basis-Vorgang und
     übernahm nur die darin gezählten Weine. Wer die Zählliste dieser
     Seite benutzt — drei auffällige Positionen nachzählen —, setzte damit
     die anderen vierundfünfzig auf „—": Der Bestand verschwand vom
     Schirm, und der Banner meldete seelenruhig „Seither 0 Flaschen
     eingegangen". Der Worker rechnet es seit jeher richtig
     (`bestand()` in src/index.js führt `letzteZaehlung` je Artikel);
     die Leitung sah den falschen der beiden Wege. */
  const zuletzt={};                 /* Artikel → der Vorgang, dessen Zählung gilt */
  let basis=null;
  const GEB=gebucht();
  GEB.forEach(v=>{
    if(!v.zaehlung) return;
    basis=v;                        /* die jüngste Zählung trägt die Zeile im Banner */
    Object.keys(v.zaehlung).forEach(id=>{ if(v.zaehlung[id]!=null) zuletzt[id]=v; });
  });
  const b={}, seit={ein:{}, raus:{}}, unklar={};
  GEB.forEach(v=>{
    if(v.zaehlung) Object.keys(v.zaehlung).forEach(id=>{
      if(v.zaehlung[id]!=null && zuletzt[id]===v) b[id]=v.zaehlung[id];
    });
    /* ENTNAHMEN: „danach" heisst `tag > Zähltag` ODER (`tag = Zähltag` UND
       es ist keine Zählung). `tag > Zähltag` allein wäre falsch — am
       Morgen gezählt, am Abend desselben Tages gefasst: diese Entnahme
       fiele sonst unter den Tisch. Der Zeitstempel stand hier bis v28 und
       ist fort: er sagt, wann das Paket ANKAM, nicht wann gezählt wurde
       (siehe `nachZeit`). Dieselbe Regel rechnet der Worker
       (`bestand()` in src/index.js, `ORDER BY tag, Zählung zuerst`). */
    const nach=id=>{ const z=zuletzt[id]; if(!z) return false;
      return (v.tag||"")>(z.tag||"") ||
             ((v.tag||"")===(z.tag||"") && tagRang(v)>tagRang(z)); };
    /* WARENEINGANG am Zähltag SELBST ist der eine Fall, den keine
       Reihenfolge entscheiden kann: stand die Lieferung schon im Keller,
       als gezählt wurde, oder kam sie danach? `ts` sagt es nicht — er ist
       die Ankunftszeit des Pakets beim Server (deshalb rechnet seit v29
       niemand mehr mit ihm). Bis v29 wurde sie addiert und damit doppelt
       gezählt (10 gezählte + 24 gelieferte = 34, obwohl die 24 in den 10
       schon drin sein können).

       Seit v30: NICHT addieren, sondern ausweisen (`unklar`). Die Zählung
       ist die härtere Tatsache — sie hat die Flaschen gesehen. Die Zahl
       ist damit im Zweifel zu niedrig statt zu hoch: jemand geht nachsehen,
       statt dass eine Bestellung ausbleibt. Derselbe Schnitt im Worker. */
    /* Dieselben drei Wächter in derselben Reihenfolge wie im Worker. */
    Object.keys(v.eingang).forEach(id=>{
      const z=zuletzt[id];
      if(!z) return;                                   /* ohne Zählung kein Bestand */
      if((v.tag||"")<(z.tag||"")) return;              /* vor dem Zähltag zählt nicht */
      if((v.tag||"")===(z.tag||"")){                   /* am Zähltag: ausweisen */
        unklar[id]=(unklar[id]||0)+v.eingang[id]; return; }
      b[id]=(b[id]||0)+v.eingang[id]; seit.ein[id]=(seit.ein[id]||0)+v.eingang[id]; });
    Object.keys(v.wein).forEach(id=>{ if(!nach(id)) return;
      b[id]=(b[id]||0)-v.wein[id]; seit.raus[id]=(seit.raus[id]||0)+v.wein[id]; });
  });
  return {basis, b, seit, unklar, hat:!!basis};
}

/* Die am Zähltag gelieferte, NICHT mitgerechnete Menge ist keine Fußnote
   der Bestandsansicht: JEDE Zahl, die auf `bestand()` aufsetzt, ist um sie
   zu niedrig — die Bestellliste, der Minus-Alarm, die Zählliste. Bis v30
   stand der erklärende Satz nur unter „Kellerbestand", gerechnet wurde
   überall. Damit die Angabe mitreist, stehen die drei Fragen hier an EINER
   Stelle. Die Zahlen selbst bleiben, wie sie sind (Entscheidung Nr. 10). */
const unklarMenge = (B,id) => (B.unklar||{})[id]||0;
const unklarZeilenSatz = u =>
  "Am Zähltag "+num(u)+" Flaschen geliefert — ob die Zählung sie schon "+
  "enthält, ist nicht feststellbar. Nicht mitgerechnet.";
/* Ein Bestand unter null, der sich vollständig aus dieser Menge erklärt,
   ist KEIN überholter Zählstand: dieselbe Zählung plus die ausgewiesene
   Lieferung ergäbe eine Zahl ≥ 0. „Neu zählen" wäre dort die falsche
   Maßnahme — nachsehen, ob die Lieferung schon in der Zählung steckte,
   ist die richtige. Getrennt wird deshalb, nicht zusammengezählt. */
function minusGeteilt(B){
  const minus=WINES.filter(w=>B.b[w.id]!=null && B.b[w.id]<0);
  const erklaert=minus.filter(w=>B.b[w.id]+unklarMenge(B,w.id)>=0);
  return {minus, erklaert, echt:minus.filter(w=>erklaert.indexOf(w)<0)};
}

/* ── Betriebstag ──────────────────────────────────────────────────────
   F1 (18.09.2026): Das Backoffice bildete „heute" und „gestern" mit
   `toISOString()`, also in UTC — zwischen Mitternacht und 02:00 Ortszeit
   war das der Vortag, und die Leitung rechnete gegen einen anderen Tag als
   die App im Keller. Wortgleich mit `wienTag()` in index.html: wer eine
   aendert, aendert beide. */
function wienTag(d){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Vienna",
    year:"numeric",month:"2-digit",day:"2-digit"}).format(d||new Date());
}
function tagMinus(iso,n){
  const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-n);
  return d.toISOString().slice(0,10);
}
/* Verbrauch je Tag über das Fenster in EINST.tage */
function verbrauch(){
  const g=tagMinus(wienTag(),EINST.tage);
  const w={}, gt={}; const tage=new Set();
  gebucht().forEach(v=>{
    if((v.tag||"") < g) return;
    if(v.mode==="ware"||v.mode==="keller") return;
    tage.add(v.tag);
    Object.keys(v.wein).forEach(id=>w[id]=(w[id]||0)+v.wein[id]);
    Object.keys(v.getr).forEach(id=>gt[id]=(gt[id]||0)+v.getr[id]);
  });
  const n=Math.max(1, tage.size);
  const proTag={}; Object.keys(w).forEach(id=>proTag[id]=w[id]/n);
  const gProTag={}; Object.keys(gt).forEach(id=>gProTag[id]=gt[id]/n);
  return {proTag, gProTag, tage:n, wein:w, getr:gt};
}

/* ════════════ 5 · Z-Bericht ════════════
   Hier stand bis v22 ein ZWEITER Leser für den gastronovi-Bericht —
   `zahl`, `felder`, `istStrich`, `zParse`, eine Abschrift von
   `src/gnparse.js`. Am ersten echten Bericht (Nr. 37) hat sich gezeigt,
   was eine Abschrift wert ist: Der Worker las 48 Positionen mit 145 Stück
   und 602,50 €, dieselbe Datei im Backoffice 106 Positionen mit 1345,75
   Stück und 5166,70 € — Steuersätze, Kellner und Warengruppen als
   Getränke, und das auf dem Schirm, den die Leitung morgens zuerst
   aufmacht. Ein Fehler war behoben, der andere nicht, weil niemand wusste,
   dass es ihn zweimal gibt.

   Deshalb liest diese Seite den Bericht nicht mehr selbst. Sie schickt ihn
   zum Worker (`POST /api/fassungsliste`) und holt ihn von dort zurück
   (`GET /api/fassungsliste`). Es gibt einen Leser, eine Zahl, und beides
   steht in der Datenbank statt im Browser dieses MacBooks — auch der
   Bericht, der per Mail hereinkommt. */

/* ── Zuordnung. Weine über das Rebsorten-Kürzel automatisch, Getränke nie ── */
const KUERZEL={GV:"Grüner Veltliner", RI:"Riesling", RIE:"Riesling", SB:"Sauvignon Blanc",
  WB:"Weißburgunder", CH:"Chardonnay", GB:"Grauburgunder", RV:"Roter Veltliner",
  MU:"Muskateller", MUS:"Muskateller", GS:"Gemischter Satz", GEM:"Gemischter Satz",
  ZW:"Zweigelt", BF:"Blaufränkisch", PN:"Pinot Noir", ME:"Merlot", MER:"Merlot",
  SA:"Sangiovese", BA:"Barbera", TR:"Traminer", CU:"Cuvée", CUV:"Cuvée"};
const flach = s => String(s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function autoWein(name){
  const m=/^([A-ZÄÖÜ]{2,3})\s+(.+)$/.exec(String(name).trim());
  if(!m) return null;
  const kz=m[1].toUpperCase(), rest=m[2];
  const reb=KUERZEL[kz]; if(!reb) return null;
  const teil=rest.split(",");
  const winzer=flach(teil[0]);
  if(!winzer) return null;
  let kand=WINES.filter(w=>{
    const wf=flach(w.winzer);
    return wf===winzer || wf.startsWith(winzer) || winzer.startsWith(wf) || wf.includes(winzer);
  });
  /* Das Kürzel bestätigt gegen — es entscheidet nicht allein */
  kand=kand.filter(w=>flach(w.reb).includes(flach(reb)) || flach(w.r).includes(flach(reb)));
  if(kand.length===1) return {id:kand[0].id, sicher:true};
  if(kand.length>1 && teil[1]){
    const wein=flach(teil[1].replace(/\d+\s*[\/,.]?\d*\s*l?$/,""));
    const eng=kand.filter(w=>flach(w.wein) && (flach(w.wein).includes(wein.split(" ")[0]) || wein.includes(flach(w.wein))));
    if(eng.length===1) return {id:eng[0].id, sicher:true};
  }
  return null;
}

/* Verkauf in Flaschen: (anzahl × ausschank_ml) / gebinde_ml.
   Fehlt eine der beiden Zahlen, wird KEINE erfunden — die Position bleibt
   aus der Rechnung heraus und wird als „Größe fehlt" ausgewiesen.
   Rückgabe: {ok:true, fl} oder {ok:false, fehlt:"ausschank"|"gebinde"}. */
function flaschen(p, artId){
  const aus = mlAusText(p.name);          /* Ausschank je verkaufter Einheit */
  const geb = gebindeGroesse(artId, p.name);
  if(!aus)                    return {ok:false, fehlt:"ausschank", aus:null, geb};
  if(geb.quelle!=="bestaetigt") return {ok:false, fehlt:"gebinde", aus, geb};
  return {ok:true, fl:(+p.anzahl||0)*aus/geb.ml, aus, geb};
}

function zuordnung(pos){
  if(REZ[pos.name] && REZ[pos.name].length) return {status:"rezept"};
  const z=MAP[pos.name];
  if(z==="__ignoriert") return {status:"ignoriert"};
  if(z) return {status:"fest", id:z};
  const a=autoWein(pos.name);
  if(a) return {status:"auto", id:a.id};
  return {status:"offen"};
}

/* ════════════ 6 · Abgleich Verkauf ↔ Fassung ════════════ */
/* Warum eine Zeile keinen Befund bekommt — an einer Stelle, damit
   Tabelle, Mittagsblick und CSV denselben Satz sagen. */
/* „menge" ist neu (sechste Jagd Runde 16): Im Kassennamen steht keine
   Menge („Aperol Spritz 1 Glas"). Das fehlt der KASSE, nicht dem
   Backoffice — „Größe fehlt" schickte die Leitung dort vergeblich
   suchen. */
const UNKLAR_GRUND={
  groesse:     "Größe fehlt",
  menge:       "keine Menge im Kassennamen",
  keinbericht: "kein Z-Bericht im Zeitraum"
};
const unklarSatz = g => "kein Abgleich möglich — " + (UNKLAR_GRUND[g] || "Verkauf nicht bestimmbar");
/* Der Grund „offen" stand hier bis v28 und ist seit v29 fort
   (`review/ENTSCHIEDEN-NACHTS.md`, Punkt 9): eine nicht zugeordnete
   Kassenposition betrifft per Definition KEINEN bestimmten Artikel und
   darf deshalb auch keinem Artikel den Befund nehmen. In Bericht 37 sind
   dreißig der offenen Namen Speisen (Schnittlauch, Käse, HP Omelett) —
   eine einzige davon schaltete den Schwund für ALLE Artikel ohne
   gerechneten Verkauf ab: 12 Flaschen aus dem Keller, 0 verkauft,
   „kein Abgleich möglich". Was offen ist, sagt der Hinweis über der
   Tabelle („n Kassenpositionen ohne Zuordnung"). */

/* Ein Teil der Positionen eines Artikels konnte nicht gerechnet werden,
   ein anderer schon: dann bleibt die Differenz stehen — mit Vorbehalt.
   Eine halbe Wahrheit, die sich als ganze ausgibt, ist der teuerste Fall;
   eine Differenz MIT Vorbehalt ist besser als gar keine. */
/* BERICHTIGUNG (sechste Jagd Runde 16 · B): Hier stand für BEIDE
   Ursachen „ohne Größe". `flaschen()` unterscheidet sie sauber
   (`fehlt:"ausschank"` — keine Menge im Kassennamen; `fehlt:"gebinde"` —
   keine bestätigte Gebindegröße), `merkeOhneGroesse()` warf sie wieder
   in einen Topf. In Bericht 37 haben 26 von 48 Positionen keine Menge im
   Namen — der häufigere der beiden Fälle. Die Leitung las „ohne Größe",
   ging nach „Verkauf ↔ Fassung" und fand dort nichts zu bestätigen: Was
   fehlt, fehlt der KASSE, nicht dem Backoffice. Dieselbe Falschzuweisung
   hat die dritte Jagd in der App beseitigt (`ohneMenge` gegen
   `ohneGebinde` in `abgleichZeilen`); auf dieser Seite desselben
   Duplikats stand sie unverändert. */
const vorbehaltSatz = v => {
  const teile=[];
  if(v.gebinde)teile.push(v.gebinde+" ohne bestätigte Größe");
  if(v.menge)teile.push(v.menge+" ohne Menge im Kassennamen");
  return (v.ohne+" von "+v.gesamt+" Positionen nicht gerechnet"
    + (teile.length?" ("+teile.join(", ")+")":"")
    + " — die Differenz ist unvollständig");
};

/* Der Befund einer GERECHNETEN Zeile — an einer Stelle für Tabelle und CSV.
   Warum die Fallunterscheidung: Eine Zeile mit Vorbehalt sagte bis v30 bei
   `diff 0` „stimmt" in Grün. Sie stimmt aber nicht — ein Teil des Verkaufs
   steckt gar nicht in der Rechnung (2 gerechnete + 3 ohne Größe, 2
   entnommen → diff 0 bei einem Drittel fehlender Rechnung). Die Null ist
   dort keine geprüfte Null, sondern eine halbe Rechnung. Deshalb dieselbe
   neutrale Plakette wie bei „kein Abgleich"; der Satz daneben
   (`vorbehaltSatz`) sagt, wie viel fehlt.
   Ab einer Differenz von 0,5 Flaschen bleibt der Befund, wie er war:
   „kleine Abweichung"/„prüfen" behauptet nichts über Vollständigkeit.

   BERICHTIGUNG (fünfte Jagd Runde 16): Hier stand „sondern nennt eine
   Untergrenze — und die gilt mit Vorbehalt erst recht." Das ist für die
   Schwund-Richtung verdreht. `diff = entnommen − verkauft`; eine nicht
   gerechnete Position ist ein VERKAUF. Käme sie dazu, stiege `verkauft`
   und SÄNKE `diff`. Bei positiver Differenz ist die gezeigte Zahl damit
   eine OBER-, keine Untergrenze — die echte Lücke ist kleiner. Das
   Backoffice druckt hier kein Wort dazu, also blieb der Fehler folgenlos;
   die App hat ihn übernommen und als „mind." ausgegeben, und dort tat er
   weh. Der Satz steht berichtigt, damit ihn niemand ein zweites Mal
   abschreibt. */
/* NACHTRICHTIGUNG (dritte Jagd · A): Diese Seite hatte ZWEI
   Deutungsspalten mit zwei Texten — `vHeute` (`.deutung`) und das
   Druckblatt. Behoben wurde nur das Blatt; der Mittagsblick, den der
   Kommentar daneben selbst „der Schirm, den die Leitung morgens zuerst
   sieht" nennt, druckte weiter „Vorrat aufgebaut oder Schwund".

   Und zwar für genau die Zeile, um die es geht: Ein Kassenname auf
   „Ignorieren" ruft `zaehlePos()` nie auf, der Artikel bekommt also
   weder `unklar` noch `vorbehalt` und steht als volle, unkommentierte
   Abweichung da.

   Das Wort fällt deshalb ÜBERALL weg, nicht nur auf Papier. Ob eine
   Flasche fehlt oder im Vorrat steht, entscheidet ein Mensch im Keller;
   die Rechnung kann es nicht wissen, solange „Ignorieren" ein
   vollwertiger Zustand ist. Ein Satz, eine Stelle. */
/* NACHTRICHTIGUNG (Analyse Runde 19 · A): Eine Zeile mit Verkauf GENAU
   NULL, während im Fenster noch Kassennamen ohne Zuordnung stehen, bekam
   denselben Satz wie eine echte Abweichung — „mehr geholt als verkauft —
   Vorrat aufgebaut oder im Keller nachsehen". Gemessen an der Live-Lage
   (44 von 48 Namen offen) stand dieser Satz zehnmal untereinander, und
   kein einziges Mal war er eine Auskunft: Der Verkauf steckte in den
   offenen Namen.

   Entscheidung Nr. 9 bleibt unangetastet — die ZAHL bleibt stehen, die
   Zeile zählt weiter in die rote Kachel, und eine offene Speise schaltet
   keinem Wein den Befund ab. Was fällt, ist allein die BEHAUPTUNG einer
   Ursache dort, wo die Rechnung keine kennt. Eine Null, die auch eine
   Lücke sein kann, darf nicht als Messung gedeutet werden.

   Sobald alles zugeordnet ist, ist eine Null wieder eine Messung und der
   alte Satz steht wieder da. */
const DEUTUNG = (r, offen) => (r.diff>0 && !(r.verkauf>0) && offen>0)
  ? "0 verkauft laut Kasse — aber "+offen+(offen===1?" Kassenname ist":" Kassennamen sind")
    +" noch nicht zugeordnet; der Verkauf kann dort stecken"
  : r.diff>0
  ? "mehr geholt als verkauft — Vorrat aufgebaut oder im Keller nachsehen"
  : "mehr verkauft als geholt — Vorrat wird abgebaut";

const BEFUND = r => Math.abs(r.diff)<0.5
  ? (r.vorbehalt ? {w:"unvollständig", k:"p-grau"} : {w:"stimmt", k:"p-ok"})
  : Math.abs(r.diff)<2 ? {w:"kleine Abweichung", k:"p-warn"}
  : {w:"prüfen", k:"p-bad"};

function abgleich(tag, spanne){
  spanne = spanne || 1;
  const bis=tag, von=tagMinus(tag,spanne-1);
  const imFenster = t => t>=von && t<=bis;

  const verk={}, offen=[], ohneGroesse=[], berichte=[];
  /* NACHTRICHTIGUNG (zweite Jagd nach Runde 18 · A): Bis hierher zählte
     nur, was sich selbst meldet — fehlende Berichte, offene Namen,
     fehlende Gebindegrössen. Zwei Wege nehmen den Verkauf aber STILL aus
     der Rechnung, und beide sind Alltag:
       · „Ignorieren" ist ein vollwertiger Zustand (`vZuordnung` bewirbt
         ihn ausdrücklich) und der einzige Weg, einen Cocktail ohne Menge
         im Kassennamen aus dem roten Balken zu bekommen. Seine Flaschen
         kommen trotzdem aus dem Keller.
       · Eine Rezeptzutat mit 0 ml rechnet 6 Gläser zu 0 Flaschen und
         meldet „gerechnet".
     In beiden Fällen stand auf dem Blatt für die Gruppe „Verkauft 0 ·
     Geholt 3 · +3 · Vorrat aufgebaut oder Schwund". Deshalb wird jetzt
     schlicht gezählt, wie viele der verkauften EINHEITEN es überhaupt in
     die Rechnung geschafft haben — unabhängig vom Grund. Diese eine Zahl
     ist gegen jeden künftigen stillen Weg dicht. */
  let stkGesamt=0, stkGerechnet=0, stkIgnoriert=0;
  /* Was eine Position an der Kasse eingebracht hat, je Artikel.
     Runde 19: Der Umsatz liegt seit je in jeder Berichtszeile
     (`vomServer`), gezeigt wurde er an zwei Randstellen. Damit war jede
     Abweichung mengengleich — „4 Flaschen Cola" und „4 Flaschen Moric
     Reserve" standen als dieselbe Zeile da, obwohl die eine 12 € und die
     andere 280 € ist. Die neue Übersicht sortiert danach.
     NUR bei der direkten Zuordnung: Eine Rezeptur teilt eine Position
     auf mehrere Bestandteile auf; denselben Umsatz jedem Bestandteil
     zuzuschreiben, hiesse ihn zu vervielfachen. Solche Artikel bekommen
     deshalb keinen Betrag, und die Zeile sagt das (`euroTeilweise`). */
  const umsatzJe={}; const euroTeilweise={};
  const ignoriert=[];
  /* Artikel, deren VERKAUF in diesem Zeitraum nicht bestimmbar ist.
     Für sie gibt es keine Differenz und keine Deutung — die Entnahme
     steht da, weil sie bekannt ist, aber ohne Urteil.
     Bis v26 fehlte diese Karte, und das war der teuerste Fehler des
     Schirms: `ids` entsteht aus `keys(verk) ∪ keys(ent)`. Eine Position
     ohne bestätigte Größe fällt aus `verk` heraus, steht aber über die
     Tagesfassung in `ent` — sie wurde damit zur VOLLEN Abweichung mit
     der Deutung „mehr geholt als verkauft — Vorrat aufgebaut oder
     Schwund", während der Hinweis darüber wörtlich sagte, sie zähle
     „weder als Verkauf noch als Abweichung". Mit dem Mapping, wie es in
     der Live-D1 steht (keine einzige bestätigte Gebindegröße), war `verk`
     leer und JEDE Zeile stand als „prüfen" da. */
  const unklar={};
  const nichtRechenbar=(id,grund)=>{ if(id && !unklar[id]) unklar[id]=grund; };
  /* Je Artikel: wie viele Kassenpositionen ihn betreffen und wie viele
     davon mangels Größe draußen blieben. Gezählt wird WÄHREND des Laufs,
     entschieden erst DANACH — im Lauf selbst weiß niemand, ob derselbe
     Artikel an einer späteren Position noch eine gerechnete Zahl bekommt.
     Genau daran scheiterte v28: `nichtRechenbar(id,"groesse")` wurde
     sofort gesetzt und löschte rückwirkend einen schon gerechneten
     Verkauf (Spritzerwein: 1,80 Fl. gerechnet, Entnahme 9 → die Zeile
     sagte „kein Abgleich möglich" statt +7,2). */
  /* `grund` ist neu (sechste Jagd Runde 16): "ausschank" heisst, im
     Kassennamen steht keine Menge — das kann die Leitung nicht beheben.
     "gebinde" heisst, die Groesse ist nicht bestaetigt — das kann sie.
     Zwei verschiedene Saetze, deshalb zwei Zaehler. */
  const posZahl={}, posOhne={}, posMenge={}, posGebinde={};
  const zaehlePos=(id,gerechnet,grund)=>{ if(!id) return;
    posZahl[id]=(posZahl[id]||0)+1;
    if(gerechnet) return;
    posOhne[id]=(posOhne[id]||0)+1;
    if(grund==="ausschank") posMenge[id]=(posMenge[id]||0)+1;
    else posGebinde[id]=(posGebinde[id]||0)+1; };
  /* Dritter Zustand neben „zugeordnet" und „offen": zugeordnet, aber die
     Größe ist nicht bestätigt. Solche Positionen gehen weder in `verk`
     noch in die Differenz ein — sonst sähe eine fehlende Zahl aus wie
     Schwund. Mehrere Kassenzeilen desselben Namens (Bar/Restaurant,
     Regel 7) werden hier zusammengezählt. */
  const merkeOhneGroesse=(p, artId, r, rezept)=>{
    const da=ohneGroesse.find(o=>o.name===p.name);
    if(da){ da.anzahl+=(+p.anzahl||0); return; }
    /* `rezept` ist wichtiger, als es aussieht: bei einem zerlegten
       Mischgetränk ist `id` NICHT der Artikel der Kassenposition, sondern
       der BESTANDTEIL, dem die Größe fehlt. Wer daraus eine Zuordnung
       macht, schreibt „Aperol Spritz = Prosecco" — und der Worker zieht
       damit rückwirkend alle gespeicherten Berichtszeilen nach
       (src/index.js, `UPDATE fassungszeile SET artikel …`). Diese Zeilen
       bekommen deshalb keinen Bestätigungsknopf. */
    ohneGroesse.push({name:p.name, anzahl:(+p.anzahl||0), id:artId,
      fehlt:r.fehlt, aus:r.aus, geb:r.geb, rezept:!!rezept});
  };
  Object.keys(ZBER).filter(imFenster).sort().forEach(t=>{
    const z=ZBER[t]; berichte.push(z);
    z.positionen.forEach(p=>{
      stkGesamt+=(+p.anzahl||0);
      const r=REZ[p.name];
      if(r && r.length){                       /* zerlegtes Mischgetränk */
        /* Auch hier gilt: ohne bestätigtes Gebinde keine Flaschenzahl.
           Fehlt sie bei einem Bestandteil, bleibt die ganze Position
           draußen — ein halb gerechnetes Rezept wäre die schlimmere Zahl. */
        const gebs=r.map(x=>gebindeGroesse(x.id, null));
        const luecke=gebs.findIndex(g=>g.quelle!=="bestaetigt");
        if(luecke>=0){
          merkeOhneGroesse(p, r[luecke].id, {fehlt:"gebinde", aus:r[luecke].ml, geb:gebs[luecke]}, true);
          /* Die ganze Position bleibt draußen — also fehlt der Verkauf
             JEDES Bestandteils, nicht nur der des einen mit der Lücke. */
          r.forEach(x=>zaehlePos(x.id,false,"gebinde"));
          return;
        }
        /* Eine Zutat ohne Menge ist keine Menge. `Math.max(0, …)` im
           Formular lässt die 0 zu, und 6 × 0 / 350 = 0 sähe wie ein
           gerechneter Verkauf von null aus (zweite Jagd · A). */
        if(r.some(x=>!(+x.ml>0))){
          const l=r.find(x=>!(+x.ml>0));
          merkeOhneGroesse(p, l.id, {fehlt:"ausschank"}, true);
          /* NACHTRICHTIGUNG (dritte Jagd · B): Hier stand `"menge"`.
             `zaehlePos` kennt genau einen Grundwert, `"ausschank"`, und
             wirft alles andere in den Topf „ohne bestätigte Größe" —
             die Zeile hätte zu einer bestätigten Größe behauptet, sie
             fehle. Dieselbe Falschzuweisung hat die sechste Jagd in
             Runde 16 abgestellt. */
          r.forEach(x=>zaehlePos(x.id,false,"ausschank"));
          return;
        }
        r.forEach((x,i)=>{ verk[x.id]=(verk[x.id]||0)+(+p.anzahl||0)*x.ml/gebs[i].ml;
          euroTeilweise[x.id]=true;          /* Mischgetränk: Betrag nicht teilbar */
          zaehlePos(x.id,true); });
        stkGerechnet+=(+p.anzahl||0);
        return;
      }
      const zu=zuordnung(p);
      if(zu.status==="offen"){
        /* BERICHTIGUNG (neunte Jagd Runde 16 · A): Hier stand
           `if(!offen.some(...)) offen.push(p)` — der ERSTE Tag gewann,
           und sein `anzahl` ging unverändert in die CSV-Ausfuhr
           (`csvAbgleich`, Abschnitt „Ohne Zuordnung"), während die
           Ausfuhr über das ganze Fenster geht. Mit sieben Berichten im
           Fenster (SPANNE steht auf 7) wies sie 136 Einheiten aus, wo
           952 verkauft wurden — Faktor sieben auf jeder der 44 Zeilen.
           Die Zuordnungsansicht daneben summiert richtig; dieselbe Zahl
           stand an zwei Stellen mit zwei Werten. Solange nur EIN Bericht
           im Fenster liegt, fallen beide zusammen — deshalb ist es so
           lange niemandem aufgefallen.

           `p` ist das Positionsobjekt aus `ZBER` und darf nicht
           verändert werden (es liegt im Speicher des Geräts); es wird
           deshalb eine eigene Zeile geführt. Dieselbe Summierung wie in
           `merkeOhneGroesse()` gleich darunter. */
        const da=offen.find(o=>o.name===p.name);
        if(da){ da.anzahl+=(+p.anzahl||0); da.umsatz+=(+p.umsatz||0); }
        else offen.push({name:p.name, anzahl:(+p.anzahl||0), umsatz:(+p.umsatz||0)});
        return;
      }
      if(zu.status==="ignoriert"){
        stkIgnoriert+=(+p.anzahl||0);
        const i=ignoriert.find(o=>o.name===p.name);
        if(i) i.anzahl+=(+p.anzahl||0);
        else ignoriert.push({name:p.name, anzahl:(+p.anzahl||0)});
        return;
      }
      const f=flaschen(p, zu.id);
      if(!f.ok){ merkeOhneGroesse(p, zu.id, f); zaehlePos(zu.id,false,f.fehlt); return; }
      verk[zu.id]=(verk[zu.id]||0)+f.fl; zaehlePos(zu.id,true);
      umsatzJe[zu.id]=(umsatzJe[zu.id]||0)+(+p.umsatz||0);
      stkGerechnet+=(+p.anzahl||0);
    });
  });
  const z=berichte.length?berichte[berichte.length-1]:null;
  /* Der Umsatz des ganzen Fensters, nicht nur des letzten Tages: Die
     Übersicht nennt eine Zahl neben einem Zeitraum, und `z.umsatz` ist
     die Zahl EINES Tages. Beides nebeneinander las sich wie ein
     Widerspruch. */
  const umsatzFenster=berichte.reduce((x,b)=>x+(+b.umsatz||0),0);

  /* Alles, was im Fenster VERBRAUCHT wurde — nicht, was aus dem Keller
     ging. Das sind zwei verschiedene Zahlen (siehe `normVorgang`), und
     diese Rechnung vergleicht mit der KASSE: gegen den Verkauf gehört
     das, was oben gefehlt hat.

     NACHTRICHTIGUNG (Runde 20 · A): Hier stand `v.wein`/`v.getr`, also
     die Entnahme. Solange niemand eine abweichende Holmenge eingetragen
     hat, ist das dieselbe Zahl — in allen bisherigen Live-Vorgängen ist
     sie es. Sobald im Lager einmal weniger liegt als gebraucht wird,
     meldet die alte Rechnung „mehr verkauft als geholt — Vorrat wird
     abgebaut" über einem Keller, in dem nichts Besonderes passiert ist.
     Der Bestand rechnet weiter mit der Entnahme; das ist `bestand()`,
     und das bleibt unangetastet. */
  const ent={};
  gebucht().filter(v=>imFenster(v.tag)).forEach(v=>{
    Object.keys(v.verbraucht||{}).forEach(id=>ent[id]=(ent[id]||0)+v.verbraucht[id]);
  });
  /* NACHTRICHTIGUNG (Jagd nach Runde 19 · A): `gebucht()` lässt einen
     laufenden Vorgang weg — richtig, denn das Journal kennt ihn auch
     nicht. Damit fällt aber zum ersten Mal die ENTNAHME aus der
     Rechnung, und alle vorhandenen Vorbehalte (Druckblatt, CSV,
     Mittagsblick) decken nur die Wege ab, auf denen der VERKAUF
     herausfällt. Gerechnet: 8 Fl. verkauft, 6 geholt, Vorgang noch
     nicht abgeschlossen → Entnahme 0, Differenz −8, Deutung „mehr
     verkauft als geholt — Vorrat wird abgebaut". Eine Deutung über
     einen Keller, in dem nichts passiert ist.
     Die ausgelassene Menge wird deshalb mitgeführt und überall dort
     genannt, wo die anderen Vorbehalte stehen. */
  const entLaufend={}; let laufendImFenster=0;
  VORGAENGE.filter(v=>!v.fertig && imFenster(v.tag)).forEach(v=>{
    let hat=false;
    /* Dieselbe Grösse wie `ent` oben — sonst meinte der Vorbehalt etwas
       anderes als die Zeile, die er erklärt. */
    Object.keys(v.verbraucht||{}).forEach(id=>{
      entLaufend[id]=(entLaufend[id]||0)+v.verbraucht[id]; hat=true; });
    if(hat) laufendImFenster++;
  });
  const stkLaufend=Object.keys(entLaufend).reduce((x,id)=>x+entLaufend[id],0);

  /* Jetzt erst, mit dem vollständigen Lauf im Rücken: keine einzige
     Position gerechnet → kein Befund; wenigstens eine gerechnet → Befund
     mit Vorbehalt. */
  const vorbehalt={};
  Object.keys(posOhne).forEach(id=>{
    if((posZahl[id]||0)>posOhne[id])
      vorbehalt[id]={ohne:posOhne[id], gesamt:posZahl[id],
                     menge:posMenge[id]||0, gebinde:posGebinde[id]||0};
    /* Auch der Grund, aus dem GAR NICHTS rechenbar war, gehoert benannt:
       „Groesse fehlt" schickt die Leitung ins Backoffice, „Menge fehlt"
       waere dort vergebliche Arbeit. */
    else nichtRechenbar(id, (posMenge[id]||0)>=(posOhne[id]||0) ? "menge" : "groesse");
  });
  /* Ohne Z-Bericht ist die Verkaufsseite nicht leer, sondern unbekannt —
     der einzige verbliebene Grund, der einen Artikel ganz stumm stellt.
     Er betrifft nur Artikel ohne gerechneten Verkauf; wer eine gerechnete
     Zahl hat, behält seine Differenz. */
  if(!berichte.length) Object.keys(ent).forEach(id=>{
    if(!(verk[id]>0)) nichtRechenbar(id,"keinbericht");
  });

  const ids=Array.from(new Set([...Object.keys(verk), ...Object.keys(ent),
                               ...Object.keys(entLaufend)]));
  const zeilen=ids.map(id=>{
    const w=byId(id);
    const v=verk[id]||0, e=ent[id]||0, u=unklar[id]||null;
    /* `diff` ist bei einer unklaren Zeile ausdrücklich `null`, nicht 0:
       eine 0 hieße „stimmt". Alle Leser filtern über `Math.abs(r.diff)`,
       und `Math.abs(null)` ist 0 — die Zeile fällt damit aus jeder
       Auffälligkeitsliste heraus, auch wenn eine Stelle die Prüfung auf
       `r.unklar` vergessen sollte. */
    /* Der Wert einer Abweichung: der Durchschnittserlös je verkaufter
       Flasche mal den Flaschen, die nicht aufgehen. Kein Einkaufspreis —
       den kennt das Tool nicht (es gibt keine Preisliste in den
       Stammdaten). Ohne gerechneten Verkauf gibt es auch keinen
       Durchschnitt, dann bleibt das Feld leer statt zu raten. */
    const wertEur = (v>0 && umsatzJe[id]>0 && !u && !euroTeilweise[id])
      ? Math.abs(e-v)*(umsatzJe[id]/v) : null;
    return {id, name: w ? (w.winzer+" · "+w.wein) : GN(id), art: w?"Wein":"Getränk",
            verkauf:v, entnahme:e, diff: u?null:e-v, unklar:u,
            umsatz: umsatzJe[id]||0, wert:wertEur, euroTeilweise:!!euroTeilweise[id],
            laufend: entLaufend[id]||0,
            vorbehalt: u?null:(vorbehalt[id]||null)};
  }).sort((a,b)=>(a.unklar?1:0)-(b.unklar?1:0)
                 || Math.abs(b.diff)-Math.abs(a.diff) || b.verkauf-a.verkauf);

  return {z, zeilen, offen, ohneGroesse, unklar, vorbehalt, verk, ent, umsatzJe,
          entLaufend, stkLaufend, laufendImFenster,
          umsatzFenster, von, bis, spanne,
          berichte:berichte.length,
          /* Die eine Zahl, an der ablesbar ist, wie viel von der
             Verkaufsseite überhaupt in der Rechnung steht. */
          ignoriert, stkGesamt, stkGerechnet, stkIgnoriert};
}

/* `ohneGroesse` führt an drei verschiedene Orte, und wer sie in einen
   Topf wirft, schickt einen Teil der Leitung vor eine leere Wand.

   · `fehlt==="gebinde"` MIT Vorschlag und ohne Rezept: unter
     „Verkauf ↔ Fassung“ steht die Zahl samt Herkunft, der Sammelknopf
     nimmt sie mit. Das ist der einzige Fall, den ein Klick erledigt.
   · `fehlt==="gebinde"` OHNE Vorschlag, oder Rezeptbestandteil: die
     Gebindegröße muss von Hand hinein (beim Mischgetränk an der eigenen
     Kassenposition des Bestandteils).
   · `fehlt==="ausschank"`: im Kassennamen steht keine Menge („Aperol
     Spritz“) — dort ist mit Bestätigen gar nichts zu holen, es braucht
     einen anderen Kassennamen oder eine Rezeptur.

   Zweimal ist derselbe Fehler gefunden worden, jedes Mal eine Ebene
   tiefer: die siebte Jagd, weil Überschrift, Mittagsblick und CSV-Kopf
   für alle „Größe fehlt“ sagten (10 von 17 Positionen bei Bericht 37);
   die achte, weil die Behebung danach in ZWEI Töpfe teilte, während der
   Bildschirm DREI Zustände kennt (angekündigt 23, sammelbar 12). Die
   Wurzel war beide Male dieselbe: zwei Stellen, die über dieselbe Menge
   reden, mit je eigener Bedingung. */
/* BERICHTIGUNG (achte Jagd Runde 16 · B): Die erste Fassung teilte in
   ZWEI Töpfe, der Bildschirm darunter kennt aber DREI Zustände. Alles,
   was nicht `fehlt==="ausschank"` war, bekam den Satz „hier unten
   bestätigen" — auch die Rezeptbestandteile (die bewusst keinen Knopf
   haben, die Größe gehört an die eigene Kassenposition des Bestandteils)
   und die Artikel ohne ml-Vorschlag (da muss die Zahl von Hand hinein).
   Gemessen: angekündigt 23, tatsächlich sammelbar 12. Und das ist der
   Regelfall, nicht die Ausnahme — 35 von 37 Artikeln in `STAMM.GETR`
   liefern ohne Bestätigung gar keinen Vorschlag.

   Geteilt wird deshalb nicht nach der Ursache, sondern nach dem, was zu
   TUN ist. `sammelbar()` ist dieselbe Bedingung, die der Sammelknopf
   anwendet (`vorschlaege` weiter unten) — eine Bedingung, zwei Leser. */
const sammelbar = o => !!(o && o.fehlt==="gebinde" && !o.rezept && o.id
                          && o.geb && +o.geb.ml>0);
function teileOhneGroesse(liste){
  const sam=[], hand=[], au=[];
  (liste||[]).forEach(o=>{
    /* Ausdruecklich auf die bekannten Ursachen gepruefte Zuordnung: Eine
       dritte, spaeter dazukommende Ursache landet dann bei „von Hand",
       nicht bei „hier unten sammelt bestaetigen" — das ist die Seite,
       auf der ein Irrtum niemanden vor eine leere Wand schickt. */
    if(o.fehlt==="ausschank")au.push(o);
    else if(o.fehlt==="gebinde" && sammelbar(o))sam.push(o);
    else hand.push(o);
  });
  const stk=l=>l.reduce((x,o)=>x+(+o.anzahl||0),0);
  return {sammelbar:sam, handisch:hand, ausschank:au,
          stkSammelbar:stk(sam), stkHandisch:stk(hand), stkAusschank:stk(au)};
}

/* Die Kassennamen, die keinem Artikel zugeordnet sind — über ALLE
   geladenen Berichte, ohne Fenster. Das ist die Menge, die `vZuordnung`
   zeigt; die Zahl neben dem Menüpunkt liest sie hier, damit beide
   dasselbe sagen (elfte Jagd Runde 16 · B). */
function alleKassennamen(){
  const namen={};
  /* `(z.positionen||[])`: Diese Schleife laeuft seit der elften Runde
     bei JEDEM Neuzeichnen ueber alle bis zu 60 Tage — vorher lag sie
     nur in den Ansichten. Ein Eintrag ohne `positionen` wuerde damit
     mitten in `zeichneNav()` werfen und die halbe Navigation stehen
     lassen. `vomServer()` legt so etwas zwar nicht an; eine Schleife,
     die alles traegt, darf trotzdem nicht an einem fehlenden Feld
     zerbrechen (zwoelfte Jagd Runde 16 · C). */
  Object.values(ZBER).forEach(z=>(z&&z.positionen||[]).forEach(p=>{
    if(!namen[p.name]) namen[p.name]={name:p.name, anzahl:0, tage:0};
    namen[p.name].anzahl+=p.anzahl; namen[p.name].tage++;
  }));
  return Object.values(namen);
}
function offeneKassennamen(){
  return alleKassennamen().filter(x=>zuordnung(x).status==="offen");
}

/* ════════════ 7 · Ansichten ════════════ */
const SEITEN=[
  {id:"heute",     t:"Übersicht",        grp:"Täglich"},
  {id:"abgleich",  t:"Verkauf ↔ Fassung"},
  {id:"import",    t:"Z-Bericht"},
  {id:"bestand",   t:"Kellerbestand",    grp:"Bestand"},
  {id:"bestellen", t:"Nachbestellen"},
  {id:"getraenke", t:"Getränke"},
  {id:"zaehlliste",t:"Zählliste"},
  {id:"eingaenge", t:"Eingänge",         grp:"Nachschlagen"},
  {id:"speicher",  t:"Speicher"},
  {id:"zuordnung", t:"Zuordnung"},
  {id:"rezepte",   t:"Rezepturen"},
  {id:"team",      t:"Mitarbeiter",       grp:"Verwaltung"},
  {id:"einst",     t:"Einstellungen"}
];
let SEITE="heute";
/* Die vier angebotenen Fenster. Sie stehen hier oben und nicht bei der
   Zeichenfunktion, weil `SPANNE` sie gleich in der nächsten Zeile
   braucht — beim Laden der Seite, nicht erst beim ersten Zeichnen. */
const SPANNEN=[{n:1,t:"1 Tag"},{n:7,t:"7 Tage"},{n:14,t:"14 Tage"},{n:30,t:"30 Tage"}];
/* Runde 19: Der Zeitraum kommt aus dem Speicher dieses Geräts. Nur die
   vier angebotenen Werte sind gültig — ein krummer Wert aus einer alten
   Fassung fiele sonst durch jede Anzeige. */
let SPANNE=(x=>SPANNEN.some(s=>s.n===x)?x:7)(+lese(K_SPANNE)||0);

function zaehler(id){
  const t=letzterTag();
  /* BERICHTIGUNG (zehnte Jagd · B, berichtigt von der elften): Hier
     stand erst `abgleich(t)` ohne Spanne (ein Tag), dann `SPANNE` —
     beides falsch, denn die Zahl steht neben einem Menüpunkt, und die
     SEITE dahinter kennt gar kein Fenster: `vZuordnung` geht über ALLE
     geladenen Berichte. Gemessen an zehn Tagen mit einem Kassennamen nur
     in den drei ältesten: Navigation 44, Seite daneben 45 — und ist im
     Fenster alles zugeordnet, stand die Zahl auf nichts, während die
     Seite offene Namen führte. Eine Zahl neben einem Menüpunkt muss
     zählen, was hinter dem Menüpunkt liegt; sie zählt deshalb jetzt
     dieselbe Menge wie `vZuordnung`. */
  if(id==="zuordnung") return offeneKassennamen().length||null;
  if(id==="bestellen"){ return bestellliste().length||null; }
  if(id==="zaehlliste"){ return zaehlliste().length||null; }
  if(id==="speicher"){ return VORGAENGE.length||null; }
  if(id==="eingaenge"){ return VORGAENGE.length||null; }
  if(id==="abgleich"){ const a=abgleich(t, SPANNE);
    /* Ohne Z-Bericht im Fenster ist jede „Differenz" die reine Entnahme.
       Eine rote Zahl in der Navigation behauptete dann einen Befund, den
       die Ansicht daneben selbst als „noch kein Abgleich" bezeichnet. */
    if(!a.berichte) return null;
    /* Eine Zeile ohne bestimmbaren Verkauf ist kein Befund. Sie zählt
       deshalb nicht in die rote Zahl — sonst stünde dort die Menge der
       fehlenden ANGABEN und läse sich wie die Menge fehlender Flaschen. */
    return a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=1).length||null; }
  return null;
}

function zeichneNav(){
  const n=$("#nav"); n.innerHTML="";
  SEITEN.forEach(s=>{
    if(s.grp){ const g=document.createElement("div"); g.className="grp"; g.textContent=s.grp; n.appendChild(g); }
    const b=document.createElement("button");
    b.className=(SEITE===s.id?"on":"");
    const z=zaehler(s.id);
    b.innerHTML=`<span>${esc(s.t)}</span>`+
      (z?`<span class="zahl ${s.id==="zuordnung"||s.id==="abgleich"?"rot":""}">${z}</span>`:"");
    /* Auf schmalen Schirmen liegt die Navigation über dem Inhalt und
       schließt sich nach der Wahl von selbst. */
    b.onclick=()=>{ SEITE=s.id; document.body.classList.remove("navoffen");
      zeichne(); window.scrollTo(0,0); };
    n.appendChild(b);
  });
  /* A1 · Der Ausgang steht am Fuss der Navigation, nicht in der Leiste:
     Unter 900 px ist die Leiste mit Marke, „Aktualisieren" und
     „Fassungstool" schon voll — ein vierter Knopf schob sie 24 px aus dem
     Fenster (gemessen mit tests/ui-mass.cjs). In der Navigation ist Platz,

  const ab=document.createElement("button");
  ab.id="bAb"; ab.className="ausgang";
  ab.innerHTML='<span>abmelden</span>';
  ab.onclick=abmelden;

/* A1 (Jagd 15) · Diese Seite hatte keinen Ausgang. Wer sie am geteilten
   iPad offen liess, liess die naechste Person als Leitung hier stehen —
   der Sitzungskeks gilt zwoelf Stunden, und „PIN zuruecksetzen" haengt an

async function abmelden(){

  try{ sessionStorage.removeItem("hh_user"); sessionStorage.removeItem("hh_rolle"); }catch(e){}
  /* Die Namen der Mitarbeiter gehen mit der Anmeldung. Sie sind kein

function letzterTag(){
  /* Der Betriebstag, um den es geht: gestern, sofern es dazu etwas gibt */
  const gestern=tagMinus(wienTag(),1);
  if(ZBER[gestern] || VORGAENGE.some(v=>v.tag===gestern)) return gestern;
  const tage=Array.from(new Set([...Object.keys(ZBER), ...VORGAENGE.map(v=>v.tag)])).filter(Boolean).sort();
  return tage[tage.length-1] || gestern;
}
function deTag(iso){
  if(!iso) return "—";
  const d=new Date(iso+"T12:00");
  return d.toLocaleDateString("de-AT",{weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"});
}

/* ── Übersicht ───────────────────────────────────────────────────────
   Runde 19. Die Seite hieß „Mittagsblick" und war ein Kachelraster mit
   vier Zahlen, einem Kasten Fließtext und zwei Tabellen. Was sie nie
   beantwortet hat, ist die erste Frage, die sich morgens stellt: Kann
   ich diesen Zahlen überhaupt trauen? Sie fing bei der zweiten an
   („Was stimmt nicht?") und gab auf eine Lücke dieselbe Antwort wie auf
   einen Befund.

   Die Seite beantwortet jetzt drei Fragen in dieser Reihenfolge:
     1 · Kann ich den Zahlen trauen?   → Urteil und Abdeckungsbalken
     2 · Wo reißt es?                  → die Kette
     3 · Was muss ich tun?             → höchstens drei Aufgaben
   Danach erst die Zahlen, die Zeilen und der Verlauf.

   Zwei Grundsätze, die überall gelten:
   · Eine Lücke ist keine Null. Wo nichts gerechnet werden kann, steht
     ein Strich und der Grund, nie eine 0 und nie ein Haken.
   · Der laufende Tag steht getrennt. Das Abgleichfenster endet bei
     gestern (`letzterTag`); was seit Mitternacht gefasst wurde, kam auf
     dieser Seite bis Runde 19 überhaupt nicht vor.                    */

/* Wie alt ist die Zählung, auf der der Bestand steht? */
function zaehlAlter(B){
  if(!B.hat || !B.basis || !B.basis.tag) return null;
  const a=new Date(B.basis.tag+"T12:00:00Z"), b=new Date(wienTag()+"T12:00:00Z");
  return Math.max(0, Math.round((b-a)/86400000));
}

/* Die fünf Glieder der Kette, in der Reihenfolge, in der die Zahlen
   entstehen. `tot` heißt: Dieses Glied kann nichts sagen, weil ein
   Glied davor gerissen ist — nicht grün und nicht rot, sondern grau.
   Genau das fehlte: Der alte Schirm zeigte eine rote 12 neben
   „Auffällige Differenzen", während zwei Zentimeter darüber stand, dass
   44 Kassennamen keinem Artikel zugeordnet sind. */
function kette(a, B, fassung, tag){
  const alter=zaehlAlter(B), M=minusGeteilt(B);
  const g=[];
  g.push(fassung
    ? (fassung.fertig
        ? {k:"ok",   t:"Fassung", w:"da",
           u:(fassung.name||"ohne Namen")+" · "+num(fassung.flWein)+" Fl. Wein", ziel:"fassung"}
        : {k:"warn", t:"Fassung", w:"läuft noch",
           u:"geht in keine Zahl ein", ziel:"fassung"})
    : {k:"bad", t:"Fassung", w:"fehlt", u:"für "+deTag(tag), ziel:"fassung"});
  g.push(a.berichte>=a.spanne
    ? {k:"ok",   t:"Z-Bericht", w:"vollständig", u:a.spanne+" von "+a.spanne+" Tagen", ziel:"zbericht"}
    : a.berichte
    ? {k:"warn", t:"Z-Bericht", w:a.berichte+" von "+a.spanne,
       u:(a.spanne-a.berichte)+" Tage fehlen", ziel:"zbericht"}
    : {k:"bad",  t:"Z-Bericht", w:"fehlt", u:"kein Bericht im Zeitraum", ziel:"zbericht"});
  /* NACHTRICHTIGUNG (Jagd nach Runde 19 · B): Ohne Z-Bericht gibt es
     überhaupt keine Kassennamen — „vollständig · jeder Name hat einen
     Artikel" stand dann in Grün neben einem roten „Z-Bericht fehlt".
     Eine Aussage über eine leere Menge ist keine Auskunft. */
  g.push(!a.berichte
    ? {k:"tot", t:"Zuordnung", w:"wartet", u:"braucht Schritt 2", ziel:"zuordnung"}
    : a.offen.length
    ? {k:"bad", t:"Zuordnung", w:num(a.offen.length)+" offen",
       u:"ihr Verkauf fehlt in der Rechnung", ziel:"zuordnung"}
    : {k:"ok",  t:"Zuordnung", w:"vollständig", u:"jeder Name hat einen Artikel", ziel:"zuordnung"});
  /* Das vierte Glied urteilt nur, wenn die drei davor tragen. */
  const traegt = a.berichte>0 && !a.offen.length;
  const grob=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=2);
  g.push(!traegt
    ? {k:"tot", t:"Abgleich", w:"wartet",
       u:a.berichte?"braucht Schritt 3":"braucht Schritt 2", ziel:"diff"}
    : grob.length
    ? {k:grob.length>4?"bad":"warn", t:"Abgleich", w:num(grob.length)+" gehen nicht auf",
       u:"über "+a.spanne+" Tage nicht ausgeglichen", ziel:"diff"}
    : {k:"ok", t:"Abgleich", w:"geht auf", u:"keine Abweichung über zwei Flaschen", ziel:"diff"});
  g.push(!B.hat
    ? {k:"bad", t:"Bestand", w:"keine Zählung", u:"ohne Zählung kein Bestand", ziel:"bestand"}
    : M.echt.length
    ? {k:"bad", t:"Bestand", w:num(M.echt.length)+" unter null",
       u:"Zählung vom "+deTag(B.basis.tag)+" überholt", ziel:"zaehlliste"}
    : alter>7
    ? {k:"warn", t:"Bestand", w:alter+" Tage alt", u:"zuletzt "+deTag(B.basis.tag), ziel:"bestand"}
    : {k:"ok", t:"Bestand", w:"aktuell", u:"gezählt am "+deTag(B.basis.tag), ziel:"bestand"});
  return g;
}

/* Die Aufgaben, sortiert nach dem, was sie freischalten — nicht nach der
   Reihenfolge im Quelltext. Was den Abgleich blockiert, steht oben; was
   nur eine Zahl verbessert, unten. Höchstens drei: Eine Liste mit neun
   Punkten liest im Dienst niemand, und der alte Kasten „Was noch fehlt"
   hatte bis zu acht Sätze Fließtext ohne einen einzigen Knopf. */
function aufgaben(a, B, tOG){
  const L=[], M=minusGeteilt(B);
  /* Eine Abweichung, die man nachsehen kann, IST eine Aufgabe. Ohne
     diese Zeile sagte die Übersicht oben „14 Positionen gehen nicht
     auf" und unten „Nichts offen" — zwei Sätze auf einem Schirm, die
     sich widersprechen. Sie steht bewusst hinter der Zuordnung und den
     Berichten: Solange die fehlen, ist die Zahl nicht belastbar, und
     dann ist Nachsehen die falsche Arbeit. */
  const grob=a.zeilen.filter(r=>!r.unklar && Math.abs(r.diff)>=2);
  const traegt = a.berichte>0 && !a.offen.length;
  if(traegt && grob.length){
    const wert=grob.reduce((x,r)=>x+(r.wert||0),0);
    L.push({rang:2, art:"nachsehen",
      t:num(grob.length)+(grob.length===1?" Position geht":" Positionen gehen")+" nicht auf",
      u:"Verkauf und Entnahme decken sich nicht"
        +(wert?", zusammen rund "+eur(wert):"")
        +". Grösste zuerst unter „Verkauf ↔ Fassung“.",
      knopf:"Ansehen", ziel:"diff", stark:grob.length>4});
  }
  if(a.offen.length) L.push({rang:0, art:"blockiert",
    t:num(a.offen.length)+" Kassennamen zuordnen",
    u:"Betrifft "+num(a.offen.reduce((x,o)=>x+o.anzahl,0))+" Einheiten"
      +(a.offen.some(o=>o.umsatz) ? " und "+eur(a.offen.reduce((x,o)=>x+(+o.umsatz||0),0)) : "")
      +". Gilt rückwirkend für alle Tage.",
    knopf:"Zuordnen", ziel:"zuordnung", stark:true});
  if(a.berichte<a.spanne) L.push({rang:1, art:"fehlt",
    t:num(a.spanne-a.berichte)+" Z-Berichte nachreichen",
    u:"Für diese Tage ist nur die Entnahme bekannt — die Differenzen fallen zu hoch aus.",
    knopf:"Einlesen", ziel:"zbericht", stark:!a.berichte});
  if(tOG.sammelbar.length) L.push({rang:3, art:"bestätigen",
    t:num(tOG.sammelbar.length)+" Gebindegrößen bestätigen",
    u:num(tOG.stkSammelbar)+" Einheiten zählen weder als Verkauf noch als Abweichung. "
      +"Unter „Verkauf ↔ Fassung“ gesammelt in einem Klick.",
    knopf:"Bestätigen", ziel:"diff"});
  if(tOG.handisch.length) L.push({rang:4, art:"eintragen",
    t:num(tOG.handisch.length)+" Gebindegrößen von Hand eintragen",
    u:num(tOG.stkHandisch)+" Einheiten haben weder bestätigte Größe noch Vorschlag. "
      +"Der Sammelknopf fasst sie nicht an — die Zahl muss je Artikel hinein.",
    knopf:"Öffnen", ziel:"zuordnung"});
  if(M.echt.length) L.push({rang:5, art:"prüfen",
    t:num(M.echt.length)+" Positionen stehen unter null",
    u:"Die Zählung vom "+deTag(B.basis.tag)+" ist überholt. Die Zählliste nennt genau diese.",
    knopf:"Zählliste", ziel:"zaehlliste"});
  const laufend=offeneVorgaenge();
  if(laufend.length) L.push({rang:6, art:"offen",
    t:num(laufend.length)+(laufend.length===1?" Vorgang läuft noch":" Vorgänge laufen noch"),
    u:"Ältester vom "+deTag(laufend.map(v=>v.tag).filter(Boolean).sort()[0])
      +". Sie gehen in keine Zahl ein, bis sie im Keller abgeschlossen sind.",
    knopf:"Ansehen", ziel:"eingaenge"});
  if(!B.hat) L.push({rang:7, art:"fehlt", t:"Kellerzählung fehlt",
    u:"Ohne Zählung gibt es keinen Bestand, nur Bewegung.",
    knopf:"Zählliste", ziel:"zaehlliste"});
  return L.sort((x,y)=>x.rang-y.rang);
}

/* Was das Journal meldet — kein Arbeitsvorrat, aber auch nichts, das
   verschwinden darf. Beides war bis Runde 19 überhaupt nicht sichtbar:
   Der Mailempfang legt jeden abgewiesenen Absender und jeden Bericht
   ohne lesbaren Anhang im Journal ab, und dort kam niemand hin. Im
   Mittagsblick stand dann „Z-Bericht noch nicht eingelesen" — derselbe
   Satz für „kommt noch" und für „wurde an der Tür abgewiesen". */
/* Ein Vorgang, der noch läuft UND Inhalt hat. Die App schickt beim
   Verwerfen ausdrücklich einen LEEREN, nicht abgeschlossenen Stand
   hinaus, damit andere Geräte „läuft nicht mehr" sehen
   (`vorgangVerwerfen`, public/index.html) — und filtert ihn danach
   selbst mit `fernHatInhalt` wieder heraus. Das Backoffice hatte diese
   Schwelle nicht und zählte jeden verworfenen Vorgang für immer als
   „läuft noch offen", mit dem Satz „bis er im Keller abgeschlossen ist"
   an etwas, das niemand mehr abschliessen kann (Jagd nach Runde 19 · B). */
function offeneVorgaenge(){
  return VORGAENGE.filter(v=>!v.fertig && (
    summe(v.wein)>0 || summe(v.getr)>0 || summe(v.eingang)>0
    || (v.zaehlung && Object.keys(v.zaehlung).length)
    || (v.gzaehlung && Object.keys(v.gzaehlung).length)));
}

function meldungen(){
  const M=[];
  const mail=letzteNotiz("email");
  if(mail) M.push("Mailempfang "+notizZeit(mail)+": "+mail.notiz
    +" — solange das so bleibt, kommt kein Z-Bericht mehr von selbst herein.");
  const rechte=NOTIZEN.filter(z=>z.quelle==="rechte");

    +(rechte.length===1?" Vorgang wurde":" Vorgänge wurden")
