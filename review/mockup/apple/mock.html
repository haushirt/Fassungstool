<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fassungstool · Entwurf Apple-Stil</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   NUR ENTWURF · nicht Teil der App.
   Zeigt, wie die Gestaltungsschicht in Richtung iOS 26 / Liquid Glass
   gehen könnte. Aufruf: mock.html?s=start&t=hell|nacht
   Inter steht hier für SF Pro (auf dem iPhone kommt die echte
   Systemschrift, ohne Datei).
   ═══════════════════════════════════════════════════════════════════ */
@font-face{font-family:"Inter";src:url("fonts/inter-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url("fonts/inter-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Inter";src:url("fonts/inter-600.woff2") format("woff2");font-weight:600}
@font-face{font-family:"Inter";src:url("fonts/inter-700.woff2") format("woff2");font-weight:700}

:root{
  --font:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
  --font-marke:"Cormorant Garamond",Georgia,serif;

  /* Hell · Haus-Hirt-Cream bleibt der Grund */
  --grund:#EEEBE4;
  --karte:#FFFFFF;
  --karte-2:#F6F4EF;
  --linie:rgba(60,60,67,.14);
  --text:#1C2220;
  --text-2:rgba(28,34,32,.62);
  --text-3:rgba(28,34,32,.40);
  --akzent:#00625E;         /* Haus-Hirt-Teal, eine Spur heller für Glas */
  --akzent-fl:#004947;
  --akzent-tint:rgba(0,98,94,.12);
  --gut:#2F8A4A; --warn:#C98A00; --rot:#B4471F; --wein:#8E1F2F;
  --glas:rgba(250,249,246,.72);
  --glas-rand:rgba(255,255,255,.75);
  --glas-schatten:0 10px 30px rgba(20,30,28,.14),0 1px 2px rgba(20,30,28,.08);
  --glas-glanz:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.04);
  --statusleiste:#1C2220;
}
[data-t="nacht"]{
  --grund:#000000;
  --karte:#1C1C1E;
  --karte-2:#2C2C2E;
  --linie:rgba(84,84,88,.55);
  --text:#FFFFFF;
  --text-2:rgba(235,235,245,.62);
  --text-3:rgba(235,235,245,.34);
  --akzent:#4FC3B8;         /* Teal fürs Dunkle aufgehellt, sonst unlesbar */
  --akzent-fl:#1F8F87;
  --akzent-tint:rgba(79,195,184,.16);
  --gut:#4CC46E; --warn:#F2B530; --rot:#FF7A50; --wein:#FF6B7F;
  --glas:rgba(38,38,42,.70);
  --glas-rand:rgba(255,255,255,.14);
  --glas-schatten:0 10px 30px rgba(0,0,0,.55);
  --glas-glanz:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.3);
  --statusleiste:#FFFFFF;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--grund);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-size:17px;letter-spacing:-.01em}
.handy{position:relative;width:393px;height:852px;overflow:hidden;background:var(--grund)}
.scroll{position:absolute;inset:0;overflow:hidden;padding:0 16px 140px}

/* ── Glas ─────────────────────────────────────────────────────────── */
.glas{background:var(--glas);-webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glas-rand);
  box-shadow:var(--glas-schatten),var(--glas-glanz)}

/* Statusleiste (nur Attrappe für das Bild) */
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:6px 34px 0 44px;font-weight:600;font-size:17px;
  color:var(--statusleiste);z-index:30}
.sb i{display:inline-block;width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;
  position:relative;opacity:.9}
.sb i:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}

/* Kopf: runde Glasknöpfe wie tricount/iOS 26 */
.nav{position:absolute;top:54px;left:16px;right:16px;height:48px;display:flex;
  justify-content:space-between;align-items:center;z-index:20}
.rund{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.pille{height:48px;border-radius:24px;display:flex;align-items:center;gap:22px;padding:0 18px;color:var(--text)}
.nav .mitte{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:16px}
svg{display:block}

.gross{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.ueber{font-size:15px;color:var(--text-2);font-weight:500;margin-bottom:4px}
.kopf{padding-top:116px;margin-bottom:18px}

/* Abschnitte wie iOS „inset grouped" */
.abschnitt{font-size:20px;font-weight:700;margin:26px 4px 10px;letter-spacing:-.015em}
.abschnitt small{font-size:15px;color:var(--text-2);font-weight:500;float:right;margin-top:4px}
.gruppe{background:var(--karte);border-radius:24px;overflow:hidden}
.zeile{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:64px;position:relative}
.zeile + .zeile:before{content:"";position:absolute;top:0;right:0;left:66px;height:.5px;background:var(--linie)}
.gruppe.ohne-ikon .zeile + .zeile:before{left:16px}
.ikon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.zeile .t{flex:1;min-width:0}
.zeile .t b{display:block;font-weight:600;font-size:17px}
.zeile .t span{display:block;color:var(--text-2);font-size:15px;margin-top:2px}
.chev{color:var(--text-3)}
.wert{font-weight:600;font-size:17px;text-align:right}
.wert small{display:block;font-weight:500;font-size:13px;color:var(--text-2)}

/* Große Statuskarte oben */
.held{background:var(--karte);border-radius:26px;padding:18px 18px 16px}
.held .zeit{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-2);font-weight:500}
.punkt{width:9px;height:9px;border-radius:50%;background:var(--gut);box-shadow:0 0 0 4px color-mix(in srgb,var(--gut) 22%,transparent)}
.held h2{font-size:22px;font-weight:700;margin:10px 0 4px;letter-spacing:-.02em}
.held p{color:var(--text-2);font-size:15px}
.knopf{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:17px;background:var(--akzent-fl);color:#fff;margin-top:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px color-mix(in srgb,var(--akzent-fl) 35%,transparent)}
.zahlen{display:flex;margin-top:16px;border-top:.5px solid var(--linie);padding-top:14px}
.zahlen div{flex:1;text-align:center}
.zahlen span{display:block;font-size:13px;color:var(--text-2);font-weight:500}
.zahlen b{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.02em}

/* Schwebende Tableiste + Aktionskreis (iOS 26) */
.tabs{position:absolute;left:16px;bottom:26px;height:66px;border-radius:33px;display:flex;
  align-items:center;padding:0 6px;z-index:25;width:293px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;
  color:var(--text);height:56px;justify-content:center;border-radius:28px}
.tab.an{color:var(--akzent);background:var(--akzent-tint)}
.aktion{position:absolute;right:16px;bottom:26px;width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;z-index:25;color:var(--akzent)}
.aktion-schild{position:absolute;right:6px;bottom:98px;font-size:13px;font-weight:600;padding:6px 10px;
  border-radius:12px;color:var(--akzent);z-index:25}

/* Segmente (Glas) */
.seg{display:flex;border-radius:22px;padding:4px;height:44px;margin:14px 0 4px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:18px;
  font-weight:600;font-size:15px;color:var(--text-2)}
.seg div.an{background:var(--karte);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-t="nacht"] .seg div.an{background:#636366}
.seg .ok{color:var(--gut)}

/* Zählzeile Tagesfassung */
.wz{display:grid;grid-template-columns:1fr 136px 46px;align-items:center;gap:10px;padding:12px 14px 12px 16px;min-height:78px;position:relative;background:var(--karte)}
.wz + .wz:before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--linie)}
.wz .w{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.wz .n{font-size:17px;font-weight:600;margin:1px 0}
.wz .s{font-size:15px;color:var(--text-2)}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--akzent);display:grid;place-items:center}
.dot.voll{background:var(--akzent);color:#fff}
[data-t="nacht"] .dot.voll{color:#003B38}
.dot.leer{border-color:var(--linie);border-style:dashed}
.haken{width:40px;height:40px;border-radius:50%;background:var(--gut);color:#fff;display:grid;place-items:center}
.fehlt{font-size:13px;font-weight:700;color:var(--rot);background:color-mix(in srgb,var(--rot) 14%,transparent);padding:3px 8px;border-radius:9px}
.sorte{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--wein);margin:22px 6px 8px;text-transform:none}
.sorte:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--wein)}

/* Wischaktion */
.wisch{position:relative;overflow:hidden;background:var(--karte)}
.wisch .wz{transform:translateX(-148px)}
.wisch .hinter{position:absolute;top:0;bottom:0;right:0;display:flex}
.wisch .hinter div{width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:13px;font-weight:600}

/* Unterleiste mit Hauptknopf */
.unten{position:absolute;left:16px;right:16px;bottom:26px;height:66px;border-radius:33px;display:flex;
  align-items:center;padding:0 7px 0 20px;gap:12px;z-index:25}
.unten .info{flex:1;font-size:15px;color:var(--text-2);font-weight:500;line-height:1.2}
.unten .info b{color:var(--text);display:block;font-size:17px}
.unten .los{height:52px;border-radius:26px;padding:0 22px;display:flex;align-items:center;gap:6px;
  background:var(--akzent-fl);color:#fff;font-weight:600;font-size:17px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* Suche und Filterchips */
.suche{height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 14px;
  color:var(--text-2);font-size:17px;background:var(--karte-2)}
[data-t="nacht"] .suche{background:#1C1C1E}
.chips{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px;overflow:hidden}
.chip{height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;
  background:var(--karte);color:var(--text);white-space:nowrap}
.chip.an{background:var(--text);color:var(--grund)}
.chip em{font-style:normal;color:var(--text-2);font-weight:500}
.chip.an em{color:var(--grund);opacity:.7}

/* Kellerzeile mit Steppern */
.kz{background:var(--karte);border-radius:22px;padding:14px 16px;margin-bottom:10px}
.kz .oben{display:flex;justify-content:space-between;align-items:flex-start}
.kz .sum{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:right;line-height:1}
.kz .sum small{display:block;font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:0}
.stepper{display:flex;gap:10px;margin-top:12px}
.st{flex:1;display:flex;align-items:center;justify-content:space-between;height:48px;border-radius:24px;background:var(--karte-2);padding:0 4px}
[data-t="nacht"] .st{background:#2C2C2E}
.st button{all:unset;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--akzent);font-size:24px;font-weight:500}
.st .m{text-align:center;line-height:1.05}
.st .m b{font-size:19px;display:block}
.st .m span{font-size:12px;color:var(--text-2);font-weight:600}

/* Toast mit Rückgängig */
.toast{white-space:nowrap;position:absolute;left:16px;right:16px;bottom:108px;height:54px;border-radius:27px;display:flex;align-items:center;
  gap:10px;padding:0 8px 0 16px;z-index:26;font-size:15px;font-weight:500}
.toast b{flex:1}
.toast .rk{color:var(--akzent);font-weight:700;padding:0 12px}

/* Blatt (Sheet) */
.dimm{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:28}
[data-t="nacht"] .dimm{background:rgba(0,0,0,.55)}
.blatt{position:absolute;left:8px;right:8px;bottom:8px;top:250px;border-radius:38px;z-index:29;padding:10px 18px 20px}
.griff{width:40px;height:5px;border-radius:3px;background:var(--text-3);margin:0 auto 10px}
.blatt .kb{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.blatt h3{font-size:20px;font-weight:700}

/* Verlauf */
.zeile .t span.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;display:inline-block;margin-top:4px}
.status.wart{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.status.ok{color:var(--gut);background:color-mix(in srgb,var(--gut) 16%,transparent)}
.leer{text-align:center;padding:70px 20px 10px;color:var(--text-2)}
.leer .kreis{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;background:var(--akzent-tint);display:grid;place-items:center;color:var(--akzent)}
.leer b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}

/* ── Backoffice (MacBook) ─────────────────────────────────────────── */
.mac{position:relative;width:1440px;height:900px;overflow:hidden;background:var(--grund);font-size:14px}
[data-t="hell"] .mac{background:linear-gradient(180deg,#EEEBE4,#E7E3DA)}
.seite{position:absolute;left:12px;top:12px;bottom:12px;width:250px;border-radius:22px;padding:18px 12px;z-index:5}
.ampel{display:flex;gap:8px;margin:0 6px 22px}
.ampel i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.ampel i+i{background:#FEBC2E}.ampel i+i+i{background:#28C840}
.seite h6{font-size:11px;font-weight:700;color:var(--text-3);margin:16px 10px 6px;letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;font-weight:500;color:var(--text)}
.nv.an{background:var(--akzent-tint);color:var(--akzent);font-weight:600}
.nv em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-2);background:var(--karte-2);padding:1px 7px;border-radius:9px}
.nv svg{color:var(--akzent)}
.leiste{position:absolute;left:280px;right:16px;top:12px;height:52px;display:flex;align-items:center;gap:12px;z-index:5}
.leiste .titel{font-size:20px;font-weight:700;margin-right:auto;padding-left:8px;letter-spacing:-.02em}
.mseg{display:flex;border-radius:18px;padding:3px;height:36px}
.mseg div{padding:0 14px;display:flex;align-items:center;border-radius:15px;font-weight:600;font-size:13px;color:var(--text-2)}
.mseg div.an{background:var(--karte);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
[data-t="nacht"] .mseg div.an{background:#636366}
.mrund{height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.inhalt{position:absolute;left:280px;right:16px;top:80px;bottom:0;padding:8px 8px 40px}
.hinweis{border-radius:18px;padding:14px 18px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--rot) 12%,var(--karte));margin-bottom:22px}
.hinweis b{display:block;font-size:15px}
.hinweis span{color:var(--text-2)}
.hinweis .mk{margin-left:auto;height:34px;border-radius:17px;padding:0 16px;display:flex;align-items:center;background:var(--akzent-fl);color:#fff;font-weight:600}
.reihe{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.kette{background:var(--karte);border-radius:20px;padding:16px;position:relative}
.kette .nr{font-size:12px;font-weight:700;color:var(--text-3)}
.kette .lb{font-size:13px;color:var(--text-2);font-weight:600;margin-top:4px}
.kette .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kette .u{font-size:13px;color:var(--text-2);margin-top:4px}
.kette .bal{height:4px;border-radius:2px;margin-top:12px;background:var(--karte-2)}
.kette .bal i{display:block;height:100%;border-radius:2px}
.zwei{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.box{background:var(--karte);border-radius:22px;padding:6px 0}
.box h4{font-size:16px;font-weight:700;padding:12px 18px 8px;display:flex;justify-content:space-between}
.box h4 small{color:var(--text-2);font-weight:500;font-size:13px}
.tz{display:flex;align-items:center;gap:14px;padding:12px 18px;position:relative}
.tz + .tz:before{content:"";position:absolute;top:0;left:18px;right:18px;height:.5px;background:var(--linie)}
.tz .t{flex:1}
.tz .t b{display:block;font-size:15px;font-weight:600}
.tz .t span{color:var(--text-2);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px}
.mk2{height:32px;border-radius:16px;padding:0 14px;display:flex;align-items:center;font-weight:600;font-size:13px;background:var(--karte-2);color:var(--akzent)}
.mk2.voll{background:var(--akzent-fl);color:#fff}
.balken{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 18px 0}
.balken div{flex:1;border-radius:8px 8px 3px 3px;background:var(--akzent);opacity:.85}
.balken div.lo{background:var(--karte-2);opacity:1}
.achse{display:flex;gap:10px;padding:6px 18px 12px;font-size:12px;color:var(--text-2)}
.achse span{flex:1;text-align:center}
</style>

<script>
const q = new URLSearchParams(location.search);
const S = q.get("s") || "start", T = q.get("t") || "hell";
document.documentElement.dataset.t = T;

/* Symbole im Stil von SF Symbols (vereinfacht) */
const I = {
  zurueck:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

  chev:'<svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6.5L2 15"/></svg>',
  liste:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  flasche:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M10 2.5h4v4.2c2.2 1 3 2.8 3 5V20a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20v-8.3c0-2.2.8-4 3-5z"/><path d="M7 13h10"/></svg>',
